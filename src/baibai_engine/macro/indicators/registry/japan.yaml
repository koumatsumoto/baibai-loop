  - series_id: jp.hourly_earnings
    name: 日本製造業時間当たり賃金
    category: labor
    geography: japan
    frequency: monthly
    unit: index
    provider: fred_csv
    provider_series_id: LCEAMN01JPM661S
    source_id: fred-lceamn01jpm661s
    source_url: https://fred.stlouisfed.org/graph/fredgraph.csv?id=LCEAMN01JPM661S
    notes: OECD Main Economic Indicators の製造業時間当たり賃金指数(2015=100、季節調整済)。家計所得と企業の人件費圧力を同じ系列で継続監視する。
