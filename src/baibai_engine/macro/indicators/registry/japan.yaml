    provider_series_id: jp_pmi_manufacturing
    source_id: spglobal-jp-pmi-mfg
    source_url: https://www.pmi.spglobal.com/
    notes: au Jibun Bank / S&P Global 日本製造業PMI(50=拡大縮小の境界)。公式リリースPDFから機械抽出した値をmanual seedで管理
    aliases: [製造業PMI, 日本PMI, JP manufacturing PMI, au Jibun PMI]
  - series_id: jp.monetary_base
    name: 日本マネタリーベース
    category: monetary
    geography: japan
    frequency: monthly
    unit: jpy-100m
    provider: boj
    provider_series_id: "3"
    source_id: boj-mblong
    source_url: https://www.boj.or.jp/statistics/boj/other/mb/mblong.xlsx
    notes: BOJ長期時系列xlsx(平残シート)のC列=マネタリーベース(月次・億円)。provider_series_idは1始まりの値列番号。live確認済
    aliases: [マネタリーベース, monetary base, BOJ monetary base, マネタリーベース平均残高]
  - series_id: jp.cpi.headline
    name: 日本CPI総合
    category: inflation
    geography: japan
    frequency: monthly
    unit: index
    provider: estat
    provider_series_id: "0003427113?cdCat01=0001&cdArea=00000&cdTab=1"
    source_id: estat-cpi
    source_url: https://api.e-stat.go.jp/rest/3.0/app/json/getStatsData
    notes: e-Stat CPI表 0003427113 を cdCat01=0001(総合)・cdArea=00000(全国) で総合・全国に絞る。FRED日本CPI系列が廃止のためe-Statを使用。live確認済
    aliases: [日本CPI, JP CPI, CPI総合, 全国CPI]
  - series_id: jp.cpi.services
    name: 日本CPIサービス
    category: inflation
    geography: japan
    frequency: monthly
    unit: index
    provider: estat
    provider_series_id: "0003427113?cdCat01=0220&cdArea=00000&cdTab=1"
    source_id: estat-cpi-services
    source_url: https://api.e-stat.go.jp/rest/3.0/app/json/getStatsData
    notes: e-Stat CPI表 0003427113 を cdCat01=0220(サービス)・cdArea=00000(全国)・cdTab=1(指数)に絞る。国内サービス価格の粘着性を読む。
    aliases: [日本サービスCPI, サービス物価, JP services CPI, 全国サービスCPI]
  - series_id: jp.foreign_flows
