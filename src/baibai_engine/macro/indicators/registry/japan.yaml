  - series_id: jp.10y
    name: 日本10Y国債利回り
    category: rates
    geography: japan
    frequency: daily
    unit: percent
    provider: mof_jgb
    provider_series_id: 10年
    source_id: mof-jgbcm-all
    source_url: https://www.mof.go.jp/jgbs/reference/interest_rate/data/jgbcm_all.csv
    tradingview_symbol: TVC:JP10Y
    notes: 財務省「国債金利情報」の全履歴CSV。流通市場の固定利付国債実勢価格から算出した主要年限別の半年複利最終利回り。
