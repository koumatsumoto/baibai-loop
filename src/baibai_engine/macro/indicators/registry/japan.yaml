  - series_id: jp.bankruptcies
    name: 日本企業倒産件数
    category: credit
    geography: japan
    frequency: monthly
    unit: count
    provider: tsr_bankruptcies
    provider_series_id: jp_bankruptcies_tsr
    source_id: tsr-bankruptcies
    source_url: https://www.tsr-net.co.jp/news/status/json/search.json
    notes: 東京商工リサーチ 全国企業倒産状況(負債1000万円以上)。公式掲載ページが参照するJSON APIから月次全履歴を取得
    aliases: [倒産件数, 企業倒産, 東商リサーチ倒産, bankruptcies]
  - series_id: jp.pmi_manufacturing
