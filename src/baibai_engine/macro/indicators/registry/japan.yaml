    provider_series_id: FM01:STRDCLUCON
    source_id: boj-timeseries-strdclucon
    source_url: https://www.stat-search.boj.or.jp/api/v1/getDataCode
    notes: 日本銀行時系列統計データ検索APIの無担保コールO/N物レート平均(日次)。金融政策の実効短期金利として読む。
    aliases: [日銀政策金利, BOJ policy rate, コールレート, 無担保コール, boj_policy_rate]
