    category: fx
    geography: japan
    frequency: monthly
    unit: index
    provider: fred_csv
    provider_series_id: RBJPBIS
    source_id: fred-rbjpbis
    source_url: https://fred.stlouisfed.org/graph/fredgraph.csv?id=RBJPBIS
    notes: BIS broad real effective exchange rate index(2020=100)。貿易相手国との相対物価を含む円の実質的な購買力と競争力を読む。
    aliases: [日本実質実効為替, 円実質実効為替, JP REER, RBJPBIS]
