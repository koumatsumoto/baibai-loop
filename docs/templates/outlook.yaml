summary: >-
  PART A-E の multi-paragraph long-form で記述する。PART A では米マクロ、地政学・エネルギー、
  為替・金融政策、日本マクロ、リスク資産、セクター固有テーマを構造分析し、AI capex / AI demand /
  cloud / data center / automation / disruption risk が long-hold fallback の質に影響する場合は
  brief 経由の fact を使って扱う。PART B は Base / Upside / Downside / Tail の 4 シナリオ、
  PART C は 10+ リスク因子、PART D は 1-6m 投資方向性、PART E は次回 trigger を記述する。
