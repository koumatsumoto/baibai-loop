schema_version: 1
kind: world-weekly
type: periodic
scope: world
ai_draft: true
published_at: "YYYY-MM-DDTHH:MM:SS+09:00"
observation_date: "YYYY-MM-DD"
period:
  start: "YYYY-MM-DD"
  end: "YYYY-MM-DD"
  market_basis_date: "YYYY-MM-DD"
references:
  prev_period: records/01-brief/YYYY/MM/YYYY-MM-DD-world-weekly-{slug}.yaml
  latest_monthly: records/01-brief/YYYY/MM/YYYY-MM-macro-monthly-{slug}.yaml
sources:
  - id: fed-h15
    name: Federal Reserve H.15 Selected Interest Rates
    url: https://www.federalreserve.gov/releases/h15/
    accessed_at: "YYYY-MM-DD"
    status: ok
  # 必要なソースを追加（id は brief 内で一意）
layers:
  world:
    market_indicators:
      - name: 米10Y利回り
        value: "X.XX%"
        as_of: "YYYY-MM-DD"
        wow_comment: "前週比 +X bp"
        source_ids: [fed-h15]
      - name: 米2Y利回り
        value: "X.XX%"
        as_of: "YYYY-MM-DD"
        wow_comment: "前週比 +X bp"
        source_ids: [fed-h15]
      - name: VIX
        value: "XX.XX"
        wow_comment: "..."
        source_ids: []
    events:
      - date: "YYYY-MM-DD"
        text: "..."
        source_ids: []
  japan:
    fx:
      - name: USD/JPY
        value: "XXX.XX"
        wow_comment: "..."
        source_ids: []
    events: []
  japan_equity:
    market_indicators:
      - name: 日経平均
        value: "XX,XXX"
        as_of: "YYYY-MM-DD"
        wow_comment: "..."
        source_ids: []
      - name: TOPIX
        value: null
        wow_comment: "データ取得失敗"
        fetch_status: failed
        source_ids: []
    sector_movements: null      # 取得できる場合は top/bottom 各 3 件を配列で
    events: []
deltas:
  threshold_breaches:
    # 閾値は docs/components/brief.md の brief contract を参照
    - severity: notable
      indicator: USD/JPY
      from: "XXX.XX"
      to: "XXX.XX"
      change: "+X.X%"
  unjudgeable: []
  direction_history:
    - indicator: 米10Y利回り
      history: "↑↑↓↑"
  direction_reversals: []
fact_memos: []
next_events:
  - date: "YYYY-MM-DD"
    text: "FOMC 会合 / BoJ MPM / 主要指標発表"
    source_ids: []
