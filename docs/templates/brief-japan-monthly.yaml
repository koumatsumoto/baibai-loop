schema_version: 1
kind: macro-monthly
type: periodic
scope: japan
ai_draft: true
published_at: "YYYY-MM-DDTHH:MM:SS+09:00"
observation_date: "YYYY-MM-DD"
month: "YYYY-MM"
references:
  prev_period: records/01-brief/YYYY/MM/YYYY-MM-macro-monthly-{slug}.yaml
  prev_year_same_period: null
sources:
  - id: bls-cpi
    name: BLS CPI News Release
    url: https://www.bls.gov/news.release/cpi.nr0.htm
    accessed_at: "YYYY-MM-DD"
    status: ok
  - id: stat-jp-cpi
    name: 総務省 CPI 全国
    url: https://www.stat.go.jp/data/cpi/sokuhou/tsuki/index-z.html
    accessed_at: "YYYY-MM-DD"
    status: ok
layers:
  world:
    monthly_statistics:
      - name: 米 CPI (YoY, 総合, NSA)
        value: "X.X%"
        previous: "X.X%"
        release_date: "YYYY-MM-DD"
        source_ids: [bls-cpi]
    policy_rates:
      - name: FF 目標レンジ上限
        value: "X.XX%"
        previous: "X.XX%"
        release_date: "YYYY-MM-DD"
        source_ids: []
  japan:
    monthly_statistics:
      - name: コア CPI (YoY, 全国, 除生鮮)
        value: "X.X%"
        previous: "X.X%"
        release_date: "YYYY-MM-DD"
        source_ids: [stat-jp-cpi]
  japan_equity: {}
deltas:
  threshold_breaches:
    # 閾値は docs/workflow.md の「差分データの閾値（月次、macro-monthly 用）」を参照
    - severity: major
      indicator: 米 CPI YoY
      from: "+2.4%"
      to: "+3.3%"
      change: "+0.9pt"
  direction_history:
    - indicator: 米 CPI YoY
      history: "→↑"
fact_memos:
  - "数値的に顕著な点のみを箇条書き。因果・予測・解釈は書かない"
next_events: []
