version: "2026-06-15"
notes: >-
  AI / 構造衰退の selection-layer annotation taxonomy。screen gate でも ranking
  sort-key でも validator rule でもない。research が long-hold quality を AI 構造性で
  評価し、構造的に縮小する需要を避けるための補助。sector_defaults は東証 33 業種の
  既定 tilt、ticker_overrides は個別判断（最優先）。AI 期待を採用・sizing・ranking・
  validator の単独根拠にはしない（docs/portfolio-policy.md）。
sector_defaults:
  # AI / 自動化の構造的需要に広く晒される業種を既定で ai_tailwind にする
