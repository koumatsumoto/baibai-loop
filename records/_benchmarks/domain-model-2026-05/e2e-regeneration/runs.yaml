as_of_requested: '2026-05-06'
effective_asof: '2026-05-01'
selected_queue_semantics:
  screening_selected: ticker list emitted by `baibai-loop-screening select`; this is
    a research triage queue, not a raw candidates row flag.
  baseline_core: stable tickers selected by the baseline run and repeated across
    most parameter sweeps.
  liquidity_complement: tickers selected only when liquidity thresholds are raised;
    these improve execution feasibility but do not displace baseline core without
    research confirmation.
  exploration: sales-first or single-evidence names used to probe growth-discount
    opportunity; they remain small until disconfirming evidence and payoff are
    confirmed in research.
  research_memo: an investment memo exists under records/05-research.
  order_ready: approved research plus a valid order intent. The current queue has no
    order-ready ticker before fresh research confirmation.
