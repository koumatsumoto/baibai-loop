research_questions:
  - 指数は最高値圏だが、対象銘柄は銘柄固有の de-rating で本当に割安か（予想 PER/PBR/EV-EBITDA・過去レンジ・同業比で検算）。
  - その下落は業績崩壊か、それとも multiple 圧縮（de-rating）か。減配・減益ガイド・規制 overhang・のれん減損という「割安に理由がある」value trap ではないか。
  - 下値保護はどこか（net cash / 営業 CF / 自己資本比率 / 株主還元）。BOJ 利上げ・円反転・米テック調整の最悪シナリオでの毀損幅を定量化できるか。
  - AI/DX の構造追い風は本物か（具体的な製品/セグメントで課金できるか、AI ラベルが最弱事業に偏在していないか）。
  - FX 感応度（輸出半導体＝円安メリットだが反転リスク / 内需ソフト＝中立〜円高メリット）と、Section 232・中国装置規制のエクスポージャはどうか。
  - 6/16 BOJ・6/17 FOMC・6/19 イラン署名の連続バイナリと 日経 VI ~35 を踏まえ、フルサイズか starter + 分割か。近接の決算 catalyst はいつか。
  - 50 万円・単元 100 株で買え、tactical budget 200 万円内で分散と policy cap（8% ticker 等）を満たすか。
refresh_triggers:
  - 2026-06-16 BOJ 会合結果（1.0% 利上げの是非・追加利上げパス・植田不在下の coms）
  - 2026-06-17 FOMC 結果・SEP/ドット（Warsh 新議長下初、据置観測の確認）
  - 2026-06-19 米イラン和平の正式署名（成立/失敗で原油・リリーフラリーが反転しうる最大バイナリ）
  - 2026-07-01 Section 232 データセンター半導体の市場見直し、2026-07-24 Section 122 失効期限の通商不確実性
  - 2026 年 7 月下旬〜8 月の Q1 決算（関税影響の実額、内需ソフトの受注・ガイダンス据置の確認）
  - 円が 160 を明確に突破し為替介入が実施された場合、または米 CPI/雇用がホットで米テック第 2 波下落の兆候
changes_since_previous:
  - 2026-06-08 の「post-crash・sector rotation」context から、暴落が米イラン和平→原油急落で完全 V 字回復し 6/15 に史上最高値を更新した事後 context へ更新。
  - 相場前提を「暴落で割安を拾う」から「最高値圏のリリーフラリー後」へ修正。指数の押し目は消失し、割安は銘柄固有の de-rating（取り残された内需 AI/DX ソフト）に偏在すると再設定。
  - 電気機器を headwind(high) から mixed(high) へ（暴落の震源から 6/15 ラリーの主役へ転じたが record 圏で過熱）。情報・通信業を新軸の中心（mixed・left-behind value）に設定。輸送用機器（Section 232 関税）を headwind に追加。
  - 最良 risk-reward を「FX 中立・割安・net cash の取り残された内需 AI/DX ソフト」に置き、6/16 BOJ・6/17 FOMC・6/19 イラン署名の連続イベントを理由に starter + 分割エントリーを sizing 方針に追加。
