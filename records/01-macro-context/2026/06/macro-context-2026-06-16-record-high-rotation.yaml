        参加せず取り残された割安 de-rated 名（予想 PER ~11、net cash/高営業 CF）の存在が tailwind 側。
        一方 BOJ 利上げ（discount rate 上昇）は高 PER グロース/SaaS への headwind。両者が拮抗するため
        sector は mixed とし、本選定の機会は「割安×下値保護×取り残され」の cross-section に絞る。
