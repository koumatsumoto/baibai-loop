summary: >
  2026-06-08 の暴落（-3.84% / 64,024 円）は、6/14-15 の米イラン和平合意（6/19 スイス署名予定・
  ホルムズ再開見通し）→ 原油急落（Brent $105-110 → $83、-25%/月）を起点に完全 V 字回復し、
  日経平均は 6/15 に史上最高値 69,317.50 円（+4.99%、YTD 約 +33%）を更新した。つまり「今（6/16）」は
  押し目ではなく、リリーフラリー後の最高値圏である。指数水準では「下落で割安」という前提は既に
  巻き戻されている点を正直に置く。
  ただしラリーは半導体・電機・輸出（原油剥落 + AI capex + 円安 160）主導で、内需 AI/DX ソフト
  （情報・通信業の SaaS/SIer）はこれに参加せず、銘柄固有の de-rating（multiple 圧縮）のまま
  取り残されている。本選定の対象（ウイングアーク 4432 -42%、アバント 3836 -46%、TIS 3626 -40%、
  デジタルアーツ 2326 -33% 等、いずれも予想 PER 約 11 前後）は「最高値の指数の中で置いてけぼりに
  なった割安バリュー」であり、指数の押し目ではなく銘柄固有の de-rating が割安の源泉である。
  AI capex サイクルは長期は拡大継続（hyperscaler 2026 capex ~$700-725B で上方修正、メモリ/先端
  ファウンドリは sold out、Oracle RPO $638B 等の record backlog）で構造追い風は本物。一方で短期は
  過熱・精査局面（SOX 12 カ月 +139.6%・record 圏、NVIDIA/Oracle は好材料でも売られる「good-not-good-
  enough」反応）。半導体は短期 overheated、内需ソフトは相対的に未過熱でローテーションの受け皿に
  なり得る。
  金利環境は逆風含み: 米は CPI 再加速（5 月 +4.2%、エネルギー +23.5%）で higher-for-longer・年内
  利下げ消滅（Warsh 新議長下の分裂 FOMC、米景気後退確率 30-49%、Mag7 集中 35-40% の極端な narrow
  相場）。日本は本日 6/16 の BOJ 会合で 0.75% → 1.0%（1995 年以来の水準）への利上げが ~80% 織り込み
  （植田総裁は入院・Himino 副総裁代行）、JGB10 年 2.58%・超長期に財政懸念、円 159-160 の介入ゾーン。
  含意: 最良 risk-reward は、FX 中立で BOJ 利上げの discount-rate 逆風を受けにくい「割安（予想 PER ~11）×
  net cash / 高営業 CF の下値保護 × 取り残された内需 AI/DX ソフト」。過熱した輸出半導体は円反転・
  Section 232 関税・record 圏の overshoot という非対称下方を抱える。ただし本日 BOJ・明日 FOMC・6/19
  イラン署名という連続バイナリ + 日経 VI ~35 の高止まりのため、フルサイズの新規追随は不利で、
  starter size + 分割エントリーが妥当。Macro は hard gate ではなく、各銘柄の個別 valuation・下値・
  イベント感応を research で確認する入力とする。
