summary: >
  スクリーニング前の環境読み（6/28 日曜夜・6/29 寄り前時点）。論点は「2026 Iran war の停戦が崩壊しかけ、
  6/29 月曜に再エスカレーションを織り込むか」。事実関係: 当戦争は 2025年の単発空爆ではなく 2026/2/28 開戦の
  本格戦争で、ホルムズ封鎖が約4ヶ月継続。6/17 イスラマバード覚書で60日停戦延長したが、6/26 に CENTCOM が
  イラン10標的へ報復攻撃、6/27 タンカー Kiku 被弾、6/28 未明にイラン IRGC がクウェート（Ali Al Salem 空軍基地）・
  バーレーン（米第5艦隊司令部）へミサイル・ドローンで報復しクウェートで死者1・負傷63・空港閉鎖、IRGC は
  「停戦違反は全外交プロセスを停止させる」と威嚇（web 出典）。
  現在地（基盤 series・2024-01〜2026-06-26 窓の percentile で水準を定量化）: 市場はまだパニックしていない。
  VIX 18.89（73%ile＝絶対では低いが相対では無警戒でもない）、MOVE 66.79（8%ile＝債券市場は極端に平穏）、
  IG OAS 0.76%（9%ile＝超 tight）の一方で CCC OAS 9.68%（93%ile）＝最弱信用だけにストレスという二極化
  （CCC−IG=8.92%）。USD/JPY 161.65（99%ile＝歴史的円安の極み）、Gold 4078（75%ile）・Silver 59（78%ile）は
  地政学を一部織込、BTC 59,996（11%ile＝リスク選好は冷却）、Copper 6.14（95%ile＝景気底堅い）。原油は relief で
  WTI 78.94/Brent 76.49（6/22, FRED）・先物 ~$69/$72（6/26, web）と開戦前水準まで戦争プレミアムが剥落
  （3/30-31 ピーク WTI$105/Brent$127 から）。米株はバリュエーション極限で ERP=益回り3.18%−米10y4.4%=−1.22%（負）、
  CAPE 40.7。流動性は net liq≈5.81T で RRP がピーク2.5T超から$64億へ事実上枯渇＝QT のクッション消尽。
  Fed 3.75%据置だがドット タカ派（7月利上げ in play）、BOJ 1.0%（6月利上げ、web。月次 series は5月0.727%で未反映）、
  ECB 2.25%＝緩和方向の主要中銀は無い。
  含意（6/29 と「過剰下落の押し目」）: いまは「高値圏×割高(ERP負)×狭い breadth×地政学テール」が、債券・優良信用の
  無警戒に支えられた脆い均衡。支配ドライバーは「slow-burn だが、ホルムズ完全封鎖 or 円キャリー巻戻しが一つ着火すれば
  急変する非対称性」。市場はこの4ヶ月エスカレーション→デエスカレーションのたび V字回復した「慣れ」が無警戒に表れ、
  これは押し目好機にも油断にもなる。6/29 ベースは限定的ギャップダウン（米株 −0.5〜−1.5%/日経 −1.5〜−3%・68,000 割れトライ）、
  下方30%でホルムズ封鎖懸念＋原油急騰＋キャリー巻戻しの二重苦（日経 −4〜−6%）、上方15%で外交再開の半導体 V字。
  日本はホルムズ依存74%・中東95%で世界最脆弱、円99%ile と原油再 spike の輸入インフレ二重苦。「過剰下落を拾う」好機は
  下方シナリオでこそ訪れ、現時点（VIX 低・原油 relief・信用 tight）はまだ過剰下落ではない。最良 risk-reward は
  地政学ショック（中東・原油・円・リスクオフ・キャリー巻戻し）で過剰反応的に叩かれるが、下値保護（net-cash/営業CF/還元）で
  清算価値近辺まで耐え反発する割安日本株を、テール時の過剰反応価格に指値で仕込むこと。Macro は hard gate ではなく
  各銘柄の個別 valuation・下値・FX/原油/信用感応・catalyst を一次 IR で確認する入力。
