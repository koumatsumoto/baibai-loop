  - 6/28 報復後のエスカレーション継続（米再報復・イラン追撃）or スイス技術交渉再開＝外交デエスカレーション
  - USD/JPY が 162 超で為替介入 or 158→155 を高速で割る（キャリー巻戻し・日経単日 -10% の 2024/8 型）
  - VIX のバックワーデーション入り・MOVE 8%ile からの急騰、CCC−IG dispersion 拡大 or BDC NAV 切下げ（プライベートクレジット公開伝播）
  - 7/28-29 FOMC（7月利上げ有無）・7/30-31 BOJ・7月中下旬 Q1 決算（銀行 NII・内需ガイダンス・半導体 capex）
  - Nikkei breadth の一段の崩れ（少数半導体依存の剥落）/ 原油 spike による日本の追加備蓄放出・スタグフレーション織込み
changes_since_previous:
  - 2026-06-25 の「ai-supercycle-oil-relief」context の前提（米イラン60日停戦・ホルムズ再開・原油開戦来安値・内需ディスインフレ追い風）が、6/26-28 の再エスカレーション（CENTCOM 報復→タンカー Kiku→イランのクウェート/バーレーン攻撃・死者発生）で逆回転リスク。前 context の refresh_trigger「停戦の崩壊・ホルムズ再閉鎖＝原油再spike」がまさに発火。
  - 6/26 日経 −4.2%（−3,005、今年最大の下げ）で、前 context が警告した「ATH 追いの give-back リスク」が半導体主導で実現。直近株安の主因は地政学でなく AI・半導体調整で、地政学はそこへ上乗せされる構図。
  - 現在地を percentile で再定量化（市場はまだパニックしていない＝「過剰下落」は未到来）。VIX 73%ile・MOVE 8%ile の乖離（ショックの株式偏在）、IG 9%ile vs CCC 93%ile の二極化、USD/JPY 99%ile、BTC 11%ile、原油 relief。
  - セクター tilt を「AI 確認・リスクオン melt-up」から「地政学テール・リスクオフ準備」へ再設定。銀行/保険/食品/医薬（地政学耐性・net-cash・金利受益）=tailwind、機械（FA/自動化、半導体β押し目）=tailwind、電気機器（半導体）=mixed（二重調整で深い押し目のみ）、鉱業/商社=有事ヘッジの加点、不動産/電力/自動車=headwind/mixed。
  - 最良 risk-reward を「現時点の追随ではなく、下方シナリオ（30%）で過剰反応的に叩かれた割安×下値保護銘柄を、テール時の過剰反応価格に指値で仕込む」設計に置いた。
