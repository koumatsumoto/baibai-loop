research_questions:
  - 候補は地政学ショック（原油再spike・リスクオフ・円キャリー巻戻し）で過剰反応的に叩かれるが、下値保護（net cash/営業CF/自己資本比率/還元）で清算価値近辺まで耐え反発するか。業績崩壊でない de-rating か、value trap（減配・減益ガイド・規制/のれん減損）か。
  - 中東・原油・FX への感応度は低いか。Brent $120超・USD/JPY 158割れ（キャリー巻戻し）・米半導体(SOX)調整の最悪同時発生での毀損幅を定量化できるか。
  - 「ここまで下がれば買い」の指値はどこか。直近安値・PBR1倍・net-cash 清算価値・過去 stress 安値から、テール時の過剰反応価格を具体値で。
  - AI/DX 構造性は加点要素として本物か（具体的製品・受注で。後付け AI ラベルを懐疑的に見抜く）。無くても下値保護×割安×地政学耐性で選好可。
  - 近接 catalyst（決算・配当・自己株買い・TSE 改革開示・受注）はいつか。7月中下旬 Q1 決算・7/28-29 FOMC・7/30-31 BOJ との時間的整合は。
  - 50万円・単元100株で買え、tactical budget 内で分散と policy cap（8% ticker 等）を満たすか。
