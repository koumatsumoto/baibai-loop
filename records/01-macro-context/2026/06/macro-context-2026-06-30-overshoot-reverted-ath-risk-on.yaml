changes_since_previous:
  - 2026-06-28 の「iran-ceasefire-collapse-risk」context が備えた「6/29 の下方ギャップダウン・30% 下方オーバーシュートを拾う」局面は到来しなかった。米株は 6/29 強反発（S&P +1.18%/Nasdaq +2.07%/Dow 初の 52,000 超）、日経は 6/30 +0.86% で 70,062 へ 70,000 を奪回、地政学は 6/30 Doha 協議再開へデエスカレーション、原油は続落（WTI ~$70/Brent ~$73）。前 context が指摘した「4ヶ月のエスカレーション→デエスカレーション V字回復の慣れ」が再演し、押し目は 2 営業日で買い戻された。
  - regime を「地政学テール・リスクオフ準備（下方オーバーシュートを拾う）」から「オーバーシュート反転＝高値圏のリスクオン回帰（VIX 18.4・IG 9%ile・MOVE 8%ile の無警戒）」へ再設定。支配的非対称性が「買い場が来る」から「上方限定・低確率 vs 下方左テールが厚い」へ反転。全体安由来の広いお買い得は乏しくなり、買えるのは個別の de-rating（idiosyncratic bargain）に限られる。
  - 最高裁が Fed 独立性を維持（6/29-30）＝政策テールを 1 つ除去。リスクオン回帰の一因。
  - カレンダー追加 — 米市場は 7/3（金）独立記念日で休場 → 6月 NFP が 7/2（木）へ前倒し。7/1 エントリー直後の最大マクロ catalyst。
  - 執行設計を「下方テールの過剰反応価格に指値」から「高値圏ゆえ約定する小幅押し目（6/30 終値近傍）に段階的指値＋ dry powder 厚め」へ更新。ATH の AI/半導体 melt-up 本体は追わず、BOJ 正常化/TSE 改革の金融・低PBR、net-cash 内需ディフェンシブ、de-rating した AI/DX・FA laggard を選好。RR は regime 調整・ギャップ込み・ファンダ床で正直に評価する。
