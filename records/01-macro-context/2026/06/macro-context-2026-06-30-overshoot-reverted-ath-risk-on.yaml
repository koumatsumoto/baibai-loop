        Goldman は autos 回復を見るが FX/原油中立の割安テーマからは外し、個別の de-rating・還元で選別。
research_questions:
  - 候補は個別の de-rating（業績は崩壊していないのに需給・全体安・中計未達で株価だけ崩れた）か、value trap（来期 FY+1 の減益ガイド/ガイド非開示・FCF≈0・EV/EBITDA 割高・減配/規制/のれん減損）か。買うのは前者。下値保護（net cash/営業CF/自己資本比率/還元）で清算価値近辺まで耐え反発するか。
  - 高値圏リスクオンの上昇基調で「7/1 に約定する」指値はどこか。6/30 終値からの小幅押し目ゾーン（終値±数%の日中レンジ内）に置けば刺さるか。強さを laggard で追わない指値規律と、約定しない場合（押し目待ち/段階建て）のルール。
  - ここからの RR はどれだけ非対称か。上方（バリュエーション過熱・mean-reversion で限定・低確率）vs 下方の左テール（USD/JPY 162→158→155 の高速キャリー巻戻し=2024/8 型 単日 −10%、NFP 7/2 サプライズ、AI半導体 melt-up 調整、Doha 決裂の原油再spike）。net-cash/ファンダ床で下値境界を定量化し、確率加重期待と左テールの歪みを出せるか。
  - AI/DX 構造性は加点として本物か（具体的製品・受注・契約で。後付け AI ラベルを懐疑的に見抜く）。無くても下値保護×割安×金利/TSE 改革 catalyst で選好可。AI 期待を単独の採用/sizing 根拠にしない。
  - 近接 catalyst の時間整合 — 6月 NFP 7/2（木・前倒し）、7/28-29 FOMC、7/30-31 BOJ、7月中下旬 Q1 決算（銀行 NII・内需ガイダンス・半導体 capex）、TSE 改革開示。7/1 エントリーは 7/2 NFP の event risk を負う。
  - ¥700,000 の tranche-1 を 8 銘柄・単元100株で買い、ticker cap（8%=¥400,000）・order cap（¥500,000）・分散を満たし、NFP/決算 window 用の dry powder を厚く残せるか。
