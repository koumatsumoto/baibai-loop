summary: >
  スクリーニング前の環境読み（6/30 火・大引け後／7/1 寄り前時点）。論点は「6/26 の半導体主導 −4.2% 押し目は
  2 営業日で完全に買い戻され、相場は高値圏のリスクオンへ回帰した。ここから新規にお買い得日本株を 7/1 に指値で
  仕込む RR はどう非対称か」。事実関係（一次・準一次、直近大引けまで）: 米株は 6/29（月）に強反発し S&P 7,440.43（+1.18%）・
  Nasdaq 25,820.14（+2.07%）・Dow 初の 52,000 超（Alphabet が Dow 採用）。6/30（火・場中）は小動き高（S&P +0.03%/
  Nasdaq +0.29%/QQQ +1.1%）でメガテック主導、最高裁が Fed 独立性を維持（政策テール除去）。日経は 6/26 69,360.88
  （−4.2%）→ 6/29 ≈69,468 → 6/30 70,062.32（+594/+0.86%、Tokyo Electron/Disco/Advantest/任天堂/Sony 主導）で
  70,000 を奪回したが 6/22 ATH 72,831 から なお −3.8%。地政学は 6/30 Doha で米イラン協議再開へ向かいデエスカレーション
  方向（ただし mixed signal、Hormuz 通航は鈍化）。原油は協議再開を織り込み続落（6/30 WTI ~$70/Brent ~$73、FRED は
  6/22 $78.94/$76.49 でラグ。3/30-31 ピーク WTI$105/Brent$127 から戦争プレミアム剥落継続）。
  現在地（基盤 series の percentile で水準を定量化）: VIX 18.41（6/29、低位・無警戒）、MOVE 66.79（8%ile＝債券極端に平穏）、
  IG OAS 0.76%（9%ile＝超 tight）一方で CCC OAS 9.68%（93%ile）の二極化（CCC−IG=8.92%）が唯一の亀裂。USD/JPY 161.9
  （99%ile＝1986 来の円安・介入ゾーン、6/29 に介入疑い・MoF 未確認）。Gold 4078（75%ile）、BTC 59,996（11%ile＝リスク選好は
  内部で冷却）、Copper 95%ile（景気底堅い）。米株はバリュエーション極限で ERP=益回り3.18%−米10y4.4%=−1.22%（負）、CAPE 約40、
  SOX は H1 2026 で +108%（S&P の12倍）の melt-up＝構造（hyperscaler capex $750B/2026 は intact）だが過熱。
  Fed 3.50-3.75% 据置・ドット タカ派（7月利上げ in play）、BOJ 1.0%（6月利上げ・コア CPI 2.8%、7/30-31 で追加観測）、
  ECB 2.25%＝緩和方向の主要中銀は不在。流動性は net liq≈5.81T で RRP 枯渇（QT クッション消尽）。
  含意（7/1 と「お買い得の所在」）: 6/28 が備えた「下方オーバーシュートを拾う」局面は到来せず 2 営業日で反転し、いまは
  「高値圏×割高(ERP負)×狭い breadth×無警戒(VIX 18/IG 9%ile)×極端円安(162)」のリスクオン回帰。支配的な非対称性は
  「上方は限定的・低確率（バリュエーション過熱・mean-reversion）／下方は左テールが厚い（円キャリー巻戻し・NFP 7/2 サプライズ・
  AI半導体 melt-up 調整・Doha 決裂時の原油再spike）」へ反転した。よって全体安由来の「広いお買い得」は乏しく、買えるのは
  個別の de-rating（業績は崩壊していないのに需給・全体安・中計未達で株価だけ崩れた銘柄）＝idiosyncratic bargain に限られる。
  最良 RR は「ATH を追わず、BOJ 正常化/TSE 改革の金融・低PBRバリュー、net-cash の内需ディフェンシブ、melt-up に乗らなかった
  AI/DX・FA の laggard を、約定する小幅押し目（6/30 終値近傍）に指値で段階的に仕込み、NFP(7/2)・決算 window 用に dry powder を
  厚く残す」こと。Macro は hard gate ではなく、各銘柄の個別 valuation・下値（net-cash/営業CF/還元）・FX/原油/半導体β感応・
  近接 catalyst を一次 IR で確認する入力。最高値圏では「待つ／小さく段階建て」が最良 RR になりやすい点を結果に必ず反映する。
