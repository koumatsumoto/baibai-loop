summary: >
  2026-06-08（月）に予想された暴落が現実化し、日経平均は -2,563 円（-3.85%）の 64,024 円で
  2026 年 2 番目の下げ。ただし中身は「無差別 liquidation」ではなく明確な sector rotation だった。
  暴落は指数寄与の大きい AI/半導体に集中（東エレク -7.5%、レーザテック -7.3%、SoftBankG -6.1%、
  アドバンテスト -5.7%）し、全市場 median は -1.07%・銘柄の 72% が下落にとどまる。内需ディフェンシブは
  逆行高（食料品・医薬品・公益・小売の多くが +1〜+3%）= 資金が半導体から安全資産へ回転した。
  引き金は (1) 米 5 月雇用統計の強さ→米利上げ観測、(2) 日本 Q1 GDP 上振れ（+0.5% QoQ / +1.8% YoY）
  →BOJ 利上げ観測、(3) US-Iran 緊張で Brent +3.4%（$96）。すなわち日米ダブルの金利ショック + 原油高。
  含意: 高 PER グロース・半導体・bond-proxy（公益/REIT/高負債）は金利逆風、銀行・保険は追い風。
  前回の「月曜のドラッグダウンでディフェンシブを安く拾う」timing 仮説は外れた（ディフェンシブは
  下がらず買われた）。今の最良 risk-reward は「金利・半導体と無関係で、net cash・低負債・割安・
  内需」の value が、暴落の余波 or 個別要因で売られて overshoot したところ。Macro は hard gate ではなく、
  個別の下値（資産/現金）対上値（mean-reversion/触媒）と財務健全性を research で確認する入力。
