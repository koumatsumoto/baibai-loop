sector_tilts:
  items:
    - id: banks-rate-beneficiary-tailwind
      scope: sector_33
      key: 銀行業
      stance: tailwind
      strength: medium
      confidence: medium
      rationale: >
        Fed + BOJ のダブル利上げ観測で利鞘改善期待。6/8 も相対耐性（三菱UFJ -1.6%）。
        ただし暴落局面では beta もあるため、PBR 1 倍割れの資本効率改善銘柄を個別に見る。
    - id: insurance-rate-beneficiary-tailwind
      scope: sector_33
      key: 保険業
      stance: tailwind
      strength: medium
      confidence: low
      rationale: 金利上昇は保険の運用利回り・含み益に追い風。個別の資本政策・還元を確認。
    - id: food-defensive-now-richer-neutral
      scope: sector_33
      key: 食料品
      stance: neutral
      strength: medium
      confidence: medium
      rationale: >
        6/8 は安全資産として逆行高し、割安度はむしろ低下。財務健全だが「暴落で安く拾う」妙味は薄れた。
        net cash・低株価で単元が予算内に収まり、まだ売られた個別があれば例外的に検討。
    - id: pharma-defensive-selective-neutral
      scope: sector_33
      key: 医薬品
      stance: neutral
      strength: medium
      confidence: low
      rationale: >
        ディフェンシブだが 6/8 は逆行高で割安度低下。減配・一過性益剥落の個別毀損（杏林型）を除外し、
        クリーンに成長する銘柄のみ選別。
    - id: utilities-rate-and-oil-headwind
      scope: sector_33
      key: 電気・ガス業
      stance: headwind
      strength: medium
      confidence: medium
      rationale: BOJ 利上げ観測（bond-proxy 逆風）と原油高（燃料コスト）の二重逆風。net cash の厚い個別のみ。
    - id: real-estate-rate-headwind
      scope: sector_33
      key: 不動産業
      stance: headwind
      strength: medium
      confidence: medium
      rationale: 金利上昇は不動産・REIT のバリュエーションと資金調達に逆風。高負債・高 cap-rate 依存は回避。
    - id: electric-machinery-semis-overshoot-headwind
      scope: sector_33
      key: 電気機器
      stance: headwind
      strength: high
      confidence: medium
      rationale: >
        6/8 暴落の震源（東エレク -7.5%、レーザテック -7.3%）。overshoot による反発はあり得るが、
        高 PER × 金利上昇 × AI capex 不安の三重逆風で、ディフェンシブ/低リスク枠では中心にしない。
        なお最良 risk-reward は sector ではなく「金利・半導体非感応の domestic net-cash value の
        overshoot」という cross-sector テーマで、下値（現金/資産）を確認して拾う（research_questions 参照）。
research_questions:
  - 6/8 で売られた銘柄は、半導体/金利起因の構造逆風か、無関係なのに連れ安した overshoot か。
  - 下値はどこか（net cash / 純資産 / 過去レンジ）。最悪シナリオでの毀損幅を定量化できるか。
  - 上値（fair value への mean-reversion、触媒、株主還元）はどれだけあり、下値対比で非対称か。
  - 50万円・単元100株で買えるか（株価 × 100 が予算と分散を許すか）。
  - BOJ 利上げ・原油高の感応度（高負債/bond-proxy/エネルギー輸入か）。
  - 次回決算・配当・自己株買いが近く、資産ロック中の収益が見込めるか。
refresh_triggers:
  - 6/9 以降の反発 or 続落（半導体の overshoot 修正、ディフェンシブの利益確定）
  - BOJ 会合・JGB 利回り・FOMC で利上げ観測がさらに動いた場合
  - 原油・US-Iran が screening 判断を変える程度に動いた場合
  - 円が 160 を突破し為替介入が実施された場合
changes_since_previous:
  - 2026-06-05 の「暴落前・ディフェンシブ tilt」から、6/8 暴落が現実化した事後 context へ更新。
  - 暴落は sector rotation 型で半導体に集中、内需ディフェンシブは逆行高。前回の「ドラッグダウンで安く拾う」timing 仮説は不成立。
  - 新軸として BOJ 利上げ観測（Q1 GDP 上振れ）と原油高（$96）を追加。銀行/保険=tailwind、公益/不動産/半導体=headwind に再設定。
  - 最良 risk-reward を「金利・半導体非感応の domestic net-cash value の overshoot」に置き、50万円・単元制約での affordability を選定軸に追加。
