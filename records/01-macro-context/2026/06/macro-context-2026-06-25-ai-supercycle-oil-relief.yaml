research_questions:
  - 候補は PBR/PER 割安かつ「業績崩壊でない de-rating」か、それとも value trap（減配・減益ガイド・規制/のれん減損 overhang）か。
  - AI/DX 構造性は本物か（具体的製品・受注で。後付け AI ラベルを懐疑的に見抜く）。最弱セグメントに AI が偏在していないか。
  - 米半導体（SOX）・AI バブル調整・円キャリー（USD/JPY 158 割れ）への感応度は。melt-up 反転・キャリー巻戻しの最悪での毀損幅を定量化できるか。
  - 下値保護（net cash / 営業CF / 自己資本比率 / 還元）は、原油再 spike・Fed 7月利上げ・HY OAS 3% 超の信用 early-warning に耐えるか。清算価値で下支えされるか。
  - BOJ 追加利上げ・原油安の円高への感応（内需/金利受益か、輸出/bond-proxy の逆風か）。
  - 近接 catalyst（決算・配当・自己株買い・TSE 改革対応開示・受注）はいつか。26日寄りで割安に指せる現実的価格はどこか。
  - 50万円・単元100株で買え、tactical budget 内で分散と policy cap（8% ticker 等）を満たすか。
refresh_triggers:
  - 半導体 supercycle の continuation か reversal（SOX 続伸 or 反落、メモリ価格・受注、ハイパースケーラー capex 修正）
  - HY OAS が 3.0% 上抜け加速 / CCC-HY デコンプレッション拡大 / BDC 新規償還ゲート・NAV 切下げ（プライベートクレジット公開伝播）
  - USD/JPY が 158→155 を高速で割る or 162 超で為替介入（キャリー巻戻し）
  - 米イラン停戦（60日）の崩壊・ホルムズ再閉鎖＝原油再 spike、または最終合意署名＝原油一段安
  - 7/28-29 FOMC（7月利上げ有無）・7/30-31 BOJ、2026-07-01 Section 232 半導体/自動車関税の見直し
  - 7 月中下旬の Q1 決算（銀行 NII・内需ガイダンス・半導体 capex・自動化受注）
  - VIX のバックワーデーション入り、Nikkei breadth の崩れ（少数半導体依存の剥落）
