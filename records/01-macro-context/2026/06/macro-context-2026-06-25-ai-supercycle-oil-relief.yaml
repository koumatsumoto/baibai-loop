summary: >
  スクリーニング前の環境読み（6/25 大引け時点）。直近1週間で相場の物語が2度反転した。6/23 は
  「AI capex の ROI 懐疑」で米半導体・メモリが急落し（S&P -1.44% 7,365、Nasdaq -2.21% 25,587、
  Micron は決算前に -10%）、日経も 6/23-24 に最高値 72,831(6/22) から 69,175 へ続落、信用スプレッドも
  微拡大して「AI バブル終盤・バリュー退避」観測が強まった。だが 6/24 引け後の Micron 決算がこれを覆した:
  Q3 売上 $41.5B（前年比4倍）、Q4 ガイダンス $50B（コンセンサス $43-44B を $6-7B 上振れ）、take-or-pay
  16 社で最低契約 $100B・前受 $22B、CEO は「供給が需要に追いつく目処は立たず、新 fab の本格寄与は FY2028」と
  供給制約を明言。AI メモリは「ROI 懐疑」ではなく「supply-constrained supercycle」だと再確認され、株は時間外
  +14%。これと、米イラン停戦枠組（6/14-15 の60日停戦・ホルムズ再開合意、原油が開戦前の $76 割れ＝開戦来安値）が
  重なり、6/25 の東京市場は日経 +4.61%（+3,185、72,366）と歴史的急反発し最高値圏に復帰。アドバンテスト
  +11〜15%（単独で日経を約 +1,100 円押上げ）、東京エレク +8%、キオクシア +8〜13%、SK Hynix +12% と
  半導体が牽引した。
  ただし上昇の質は「最高値圏・極端な集中・割高」での risk-on melt-up であり、お買い得とは対極にある。
  米株は上位5社で S&P の3割超（過去50年最大の集中・dot-com 以来の割高）、Dalio/Burry はバブル終盤を警告、
  ハイパースケーラー capex は 2026 $725B（Moody's $785B）→2027 $1T へ膨張。Fed は 6/17 に 4 会合連続据置
  （3.50-3.75%）だがドットは利上げ方向へタカ派化（18人中9人が2026年の追加利上げ、BofA は 9/10/12 月で計75bp・
  7月利上げも "in play"）。インフレ見通しは headline 3.6%・core 3.3% へ上方修正（エネルギー shock 起因）。
  BOJ は 6 月に 1.0% へ利上げ（7-1、1995年来最高、イランエネルギー shock 対応）、追加利上げ継続姿勢、春闘は
  base +3.5%・総合 +5.1〜5.3%、35年来の労働逼迫で実質賃金改善＝内需主導の成長。円は 160.3 の介入ゾーンで、
  原油安＋BOJ 利上げの円高方向と、キャリー $500bn 巻戻し（160→145・日経単日 -10% の 2024/8 型）の非対称下方を併存。
  含意（お買い得×下値保護×macro fit×AI/DX 構造価値）: 最高値圏・AI バブル警戒・狭い breadth の中で euphoric な
  大型半導体を ATH で追うのは「お買い得」ではなく give-back リスクが高い（6/23 が実例）。最良 risk-reward は
  (1) 割安（半導体 melt-up に乗り遅れ de-rate）×(2) 下値保護（net cash / 営業CF / 自己資本比率／還元で tail と
  キャリー巻戻し・原油再 spike を生き残る）×(3) 本物の AI/DX 構造価値（労働逼迫×自動化/DX、域内 capex 受益で
  長期 compound＋キャッチアップ余地）×(4) macro fit（米半導体 β・円キャリー感応が低い内需 or 金利受益、原油安・
  賃金上昇の内需リフレ受益）を満たす銘柄。具体的には域内 DX・FA/自動化・金利受益バリュー・内需ディフェンシブの
  中で、本物の構造性を持ちつつ足元 de-rate した net-cash 銘柄。Macro は hard gate ではなく、各銘柄の個別 valuation・
  下値・FX/信用・AI 構造性・catalyst を一次 IR で確認する入力。
