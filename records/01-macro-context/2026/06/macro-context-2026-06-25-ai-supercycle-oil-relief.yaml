  - 一方で Fed はタカ派化（ドット利上げ方向、7月利上げ "in play"、インフレ 3.6%/3.3% へ上方修正）。BOJ は 1.0% へ利上げ済みで継続姿勢。最高値圏・S&P 上位5社で3割超の極端集中・割高という AI バブル警戒を併記。
  - セクター tilt を「AI 確認・リスクオン melt-up・最高値圏」へ再設定。半導体/電気機器=mixed（構造強気だが ATH で割高・give-back リスク）、機械（自動化/省力化）=tailwind、銀行/保険=tailwind（金利受益・PBR<1）、内需ディフェンシブ=tailwind（原油安・賃金）。
