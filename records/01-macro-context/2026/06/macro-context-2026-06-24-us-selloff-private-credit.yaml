summary: >
  「米国株が大きく下がっている」という市場認識を一次情報で検証すると、実態は暴落ではなく
  最高値圏からの浅い調整である。真の天井（S&P500 7,609.78・Nasdaq 27,093.90、いずれも6/2）
  から S&P -3.2%・Nasdaq -5.6%・Dow -1% で 10% 調整に未達。下落は半導体個別（Nvidia -14.5%、
  Broadcom -20%）に集中し、Russell2000 は 6/23 も逆行高で最高値圏、equal-weight が cap-weight を
  逆転。6月の3波（6/5 Broadcom AI失望＋強雇用で SOX -10%、6/17 FOMC 利上げバイアス、6/23 韓国
  半導体株発のテック売り）はいずれも「半導体・AIグロース → バリュー・小型」の健全なセクター
  ローテーションで、無差別なデレバレッジではない。VIX 19・米HY OAS 2.65%/IG 0.74% とパニックも
  信用ストレスも価格に出ていない。したがって現時点の判定は「弱気入りではない調整」（確信度 ~70%）。
  ただし真のリスクは「下がっていること」でなく「下がっていないのに火薬が過去最大」という非対称性に
  ある。表面の平穏の裏で、CTA/systematic の最大 $800B 売り余地（GS 警告）、CAPE 42.8（ドットコム
  射程）、Mag7 が S&P の 33.8% という史上最悪の集中、そして Fed プット不在（CPI +4.2%、ドット年末
  3.8%）が積み上がる。最重要の構造要因はプライベートクレジット問題で、これは AI ディスラプションが
  株式（半導体・SaaS）と信用（ダイレクトレンディングの 19%＝$500B超が SaaS 借り手、$600-750B が
  「AI 破壊テーゼ」で引受）を同根で貫く点にある。BDC 償還ゲートは業界全体（Apollo 請求 16.8%、
  Blue Owl は run-off 清算、上場 BDC は NAV -25〜-34%）に広がる一方、公開クレジットはタイトで未伝播。
  ただし今回 registry に追加した CCC OAS で測ると CCC 9.47% vs HY 2.65%（デコンプレッション 6.82%pt）
  と、最低格付層（プライベートクレジット借り手に最も近い公開信用層）には既にストレスの萌芽がある。
  プライベートクレジットは「一時的 vs 構造的」の二者択一ではなく「構造的トレンドだが伝播は slow-burn」
  ── 急性システミック危機（LTCM 型）は 1 ヶ月では低確率だが、数四半期かけて公開市場・銀行（NDFI 与信
  ~$262B）へ波及する慢性リスク。最類似の歴史は 2007 年8月クオンツ・クエイク（信用が水面下で割れ・
  ファンドがデレバレッジ・株は最高値圏で横ばい）で、それが 2008 本格危機の前震だった史実が尾部 30% を
  正当化する（ただしサブプライムとは規模が一桁違うため割引）。日本株への含意は「円が master variable」:
  円キャリー $500bn が 2024/8 暴落水準 161 に滞留し、BOJ 7月追加利上げ観測と重なる。リスクオフ局面では
  日本の半導体は米 SOX の 2.5-3 倍感応、日経は S&P の 1.3-1.8 倍（円高が重なれば 2 倍超）で増幅される。
  本 context は hard gate ではなく、各銘柄の個別 valuation・下値・FX/信用感応を research で確認する入力。
