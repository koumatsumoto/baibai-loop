sector_tilts:
  items:
    - id: electric-machinery-semis-soxbeta-mixed
      scope: sector_33
      key: 電気機器
      stance: mixed
      strength: high
      confidence: medium
      rationale: >
        日本の半導体は米SOX日次の2.5-3倍感応(Broadcom発SOX-2%日に東エレク-6.6%/アドバンテスト-5%)。
        円安161が外貨建て収益を膨らませ①回復シナリオでは牽引役だが、SOX高感応・Section232半導体関税
        (7/1見直し)・円反転で③④リスクオフでは-15〜-25%と最も脆弱。長期はAI capex実需(TSMC FY26+30%)が
        下支え。強さで一部利確、starter+分割が妥当。
    - id: banks-boj-hike-tailwind
      scope: sector_33
      key: 銀行業
      stance: tailwind
      strength: medium
      confidence: medium
      rationale: >
        BOJ 6/16の1%利上げ＋JGBカーブスティープ化でNII追い風。①②では相対アウトパフォーム(「高め長め」の
        オフェンシブ表現)。ただし信用イベント(③④)では世界金融株と共に下落(下げ幅は半導体より浅い)。
        PBR改革の資本効率改善銘柄を個別に見る。
    - id: insurance-rate-beneficiary-tailwind
      scope: sector_33
      key: 保険業
      stance: tailwind
      strength: medium
      confidence: low
      rationale: 金利上昇は運用利回り・含み益に追い風。資本政策・還元を個別確認する。
    - id: real-estate-jgb-headwind
      scope: sector_33
      key: 不動産業
      stance: headwind
      strength: medium
      confidence: medium
      rationale: BOJ利上げ・JGB超長期金利上昇は不動産/REITのバリュエーションと資金調達に逆風。高負債は回避。
    - id: autos-section232-yen-headwind
