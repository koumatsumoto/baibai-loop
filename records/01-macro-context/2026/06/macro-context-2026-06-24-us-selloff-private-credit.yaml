research_questions:
  - 候補銘柄の米SOX/AI感応度はどれか。半導体調整・CTA $800B systematic売りが着火した場合の毀損幅を定量化できるか。
  - 円161からのキャリー巻戻し(2024/8型)の最悪シナリオで、輸出株と内需株のどちらが下値保護を持つか。
  - BOJ 7月追加利上げの感応度(高負債/bond-proxy/グロースか、銀行/保険の受益か)。
  - プライベートクレジット/SaaS のAIディスラプション連想が国内情報・通信業の個別銘柄に及ぶか(recurring収益の質)。
  - 下値保護(net cash/営業CF/自己資本比率/株主還元)と、HY OAS 3%超・VIXバックワーデーション・BDC NAV切下げの早期警戒に対する耐性。
  - 50万円・単元100株で買え、tactical budget 200万円内で分散とpolicy cap(8% ticker等)を満たすか。
refresh_triggers:
  - 2026-07-01 Section 232 半導体関税の市場見直し（SOX・東エレク・アドバンテストに直撃）
  - 2026-07-14 米6月CPI ＋ 大手銀行決算(NDFI/private-credit エクスポージャー開示)。CPI>4.4%なら③へ
  - 2026-07-16 TSMC/ASML 決算(AI capexベルウェザー)、7/28 ARCC(BDC健全性)、7/29-30 MSFT/Meta(AI capex命題)
  - 2026-07-28〜29 FOMC・7/30-31 BOJ会合(追加利上げ=円/キャリー分水嶺)
  - HY OAS が 3.0% を上抜け加速、CCC-HY デコンプレッション拡大、または BDC 新規償還ゲート/NAV切下げ
  - USD/JPY が 158→155 を高速で割る、VIX がバックワーデーション入り、GS警告の$800B systematic売りが着火
changes_since_previous:
  - 2026-06-16 の「record-high-rotation（最高値圏のリリーフラリー後）」context から、6/22 に日経72,354・米株も最高値圏をつけた後の 6/23 半導体主導の調整局面へ更新。
  - 分析軸に「プライベートクレジット/信用システミックリスク」を新規追加。AIディスラプションが株式(半導体・SaaS)と信用(ダイレクトレンディングのSaaS借り手)を同根で貫く構造を中心に据えた。
  - 基盤に米株指数(us.sp500/us.nasdaq/us.dow)とCCC OAS(credit.us_ccc_oas)を追加し、米株の真の天井検証とCCC-HYデコンプレッション(6.82pt)による信用伝播の早期警戒を初めて計測可能にした。
  - 相場判定を「最高値圏のリリーフラリー後」から「最高値圏の浅い調整＋健全ローテーション、ただし火薬は過去最大の非対称性」へ精緻化。1ヶ月後はベース68%調整・尾部32%リスクオフ。
  - 円を master variable に格上げ(キャリー$500bn・161滞留・BOJ7月利上げ観測)。半導体=mixed(SOX 2.5-3倍感応)、銀行/保険=tailwind(BOJ利上げ受益)、内需ディフェンシブ=tailwind(リスクオフ避難先)に再設定。
