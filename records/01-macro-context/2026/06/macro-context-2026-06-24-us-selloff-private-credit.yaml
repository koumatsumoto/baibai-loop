      key: 輸送用機器
      stance: headwind
      strength: medium
      confidence: medium
      rationale: >
        Section 232自動車関税が継続し業績に打撃。円161からのリスクオフ反転リスクも重なり、
        FX中立の機会からは外す。
    - id: it-services-saas-ai-disruption-mixed
      scope: sector_33
      key: 情報・通信業
      stance: mixed
      strength: medium
      confidence: low
      rationale: >
        国内DX需要は構造追い風だが、米プライベートクレジットで顕在化したSaaSのAIディスラプション
        懸念が連想で波及しうる(リカーリング収益モデルへの疑念)。BOJ利上げの高PERグロース逆風も。
        recurring収益かつvaluation dislocationかを個別判定する。
    - id: food-defensive-low-beta-tailwind
