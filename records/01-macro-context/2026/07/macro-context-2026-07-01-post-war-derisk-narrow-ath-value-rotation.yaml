summary: >-
  イラン戦争の原油ショック（4月 Brent 日中高値 $120.88）は、ホルムズ実質再開と Doha 間接協議の進行で
  プレミアムがほぼ剥落し（Brent $71-74、Q2 -30%）、外部環境は 4 月の最悪期から顕著に de-risk した。
  一方で米国は「原油ショックの残響インフレ（5月 CPI 総合 +4.2% / コア PCE +3.4%）× 利上げバイアスの
  Fed（FF 3.50-3.75% 据え置き・年末 dot 3.8%・Warsh 議長）」という異例のタカ局面にあり、米 10 年 4.44%・
  実質 2.2% の高止まりの下で S&P500 は CAPE 41.7・益回り 3.11%（ERP = 3.11 - 4.44 = -1.33% とマイナス、
  計算: multpl 益回り - FRB H.15 10 年）の歴史的割高。信用は IG 76bp / HY 275bp の極タイトに対し
  CCC 970bp（CCC/HY = 9.70/2.75 = 3.53 倍）と低格付・プライベートクレジットへストレスが偏在する二極化。
  流動性は M2 増勢継続（May $23.05T、直近 11 か月 +5.1%）・QT 終了（FRB 総資産 6.70T で底打ち微増）・
  RRP 枯渇（$1.0B）と追い風で、金融環境（NFCI -0.504）も緩和的。日本は日経が 6/18 に 7 万円乗せの
  ATH 圏（07-01 終値 70,475）だが中身は極端に狭く、半導体指数 +56% に対し東証スタンダード -1.9%・
  グロース -6.8% と、割安バリュー cohort は取り残されている。BOJ は 6/16 に 1.00% へ利上げ（7/30-31
  会合の追加利上げ織り込みは約 2 割・年内 9 割超）、CPI 1.5% と割引率ショックは軽い。USD/JPY 162.7 は
  1986 年以来の円安で、投機筋の円ショートは 9 年ぶり高水準（約 14.6 万枚）＝円高スナップバックが
  日本株最大の reflexive リスク。自社株買いは 1-5 月 16.2 兆円と過去最高ペース、TSE 資本コスト改革の
  低 PBR 是正圧力、海外勢の買い（YTD 大幅ネット買い越し）が割安 cohort の構造的な re-rating 追い風。
  AI capex は実弾で加速（big4 CY2026 合算 $625-720B・ほぼ倍増、TSMC 月次 +30%、NVDA DC +92%）だが、
  半導体本体は SOX が Q2 に四半期として史上最大の上昇（+74-88% レンジ報道）で先食い済み。割安 × AI
  受益の交点は電力・送配電・電線・DC 建設・冷却などのインフラ裾野と、AI/DX 二次受益の内需割安株へ
  シフトした。姿勢: 平時の月次積立レンジ（¥20-30 万）は継続しつつ高値追いはせず、取り残された割安
  バリュー（低 PBR・ネットキャッシュ・還元）に限定して買い、余力はテール（円急伸・信用イベント・
  ホルムズ再燃）の押し目増額用に温存する。シナリオ（主観、1-3 か月）: Base 50%（タカ据え置き×原油
  ディスインフレの grind higher）/ Bull 18%（ディスインフレ加速・利下げ再提示）/ Bear 24%（コア再加速で
  実利上げ・AI ディレート）/ Tail 8%（円キャリー巻き戻し・プライベートクレジット事故・ホルムズ再封鎖）。
  本日 7/2 21:30 JST の米 6 月雇用統計（コンセンサス +100-115K・失業率 4.3%、前月 +172K）が直近最大の
  分岐で、時給の上振れは利上げ織り込みを直接強める。
