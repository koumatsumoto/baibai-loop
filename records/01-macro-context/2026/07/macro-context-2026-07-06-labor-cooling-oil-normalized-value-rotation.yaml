summary: >-
  原油の戦争プレミアム剥落が完了した外部環境の下で、米国は「残響インフレ × 冷える労働市場」、
  日本は「BOJ 継続利上げ × 円安・円キャリー積み上がり」という局面にある。原油は WTI が
  5/14 高値 $104.66 から 6/29 $71.87 へ -31.3%（計算 (71.87-104.66)/104.66 = -31.3%）と
  正常化し、イラン戦争プレミアムはほぼ剥落。日本の交易条件への強い追い風で、ホルムズ再燃は
  テールに残置する。米国は 5 月 CPI 総合 +4.2% / コア PCE +3.4% の残響インフレに対し、6 月
  雇用は NFP +57K（予想 ~115K・4-5 月合計 -74K 下方改定・失業率 4.2% は参加率 61.5% への
  低下由来・時給 YoY +3.5% 沈静）と明確に冷え、7/2 の print で利上げテールが後退し「据え置き
  長期化」へ傾いた。FF は 3.50-3.75%（6/17 FOMC 12-0 全会一致据え置き・Warsh 議長・forward
  guidance 文を削除し data-dependent へ）、次回 FOMC は 7/28-29。米株は S&P 7,483（7/2）・
  CAPE 41.6・益回り 3.11% に対し 10Y 4.48%（7/1）で ERP = 3.11 - 4.48 = -1.37% の歴史的割高
  かつ AI 集中利益。信用は IG/HY 極タイト（HY 2.75%）と CCC 9.71%（CCC/HY = 3.53 倍）の
  二極化で、NFCI -0.504・VIX 15.8・MOVE 65 と表面は平穏、流動性は M2 増勢・QT 終了・RRP 枯渇で
  追い風。AI capex は実弾で継続し、TSMC は 2026 capex $52-56B（前年比 +25% 超・高レンジ寄り）・
  2026 売上ガイド +30% 超・CoWoS 先端実装を 2027 まで増強、NVDA DC +92%、hyperscaler 増額で
  digestion 未入り（ただし SOX 13,076 は高値圏で先食い注意）。日本は BOJ が 6/16 に 1.00% へ
  利上げ（7-1 可決・植田総裁欠席で氷見野副総裁が議長）、声明に the Bank will continue to raise
  the policy interest rate の継続バイアスを明記。5 月全国 CPI は補助金で +1.5% と 2% 割れだが、
  B2B パススルーの速さと期待インフレ上昇から「2% への上振れリスク」を BOJ 自身が声明で認めた。
  次回会合は 7/30-31。円は 161.1（7/3、5 月の ¥11.7 兆介入後も安値圏）で投機的な円ショートが
  歴史的水準に積み上がり、円高スナップバックが日本株最大の reflexive リスク。日経 69,744（7/3）は
  6/19 ピーク 71,250 から -2.1% の高値もみ合いで中身は半導体集中、割安バリュー cohort は
  取り残されている。自社株買いの過去最高ペース（1-5 月 16.2 兆円）・TSE 資本コスト改革・海外勢の
  買い基調が value re-rating の構造追い風。姿勢は選別的リスクオン — index は追わず、機械 E[r]
  上位の割安 × 塩漬け耐性に月次積立レンジ（¥20-30 万）で淡々と積み、余力は円急伸・信用イベント・
  ホルムズ再燃のテール用に温存する。シナリオ（主観・1-3 か月）: Base 52%（据え置き長期化 ×
  原油ディスインフレの grind・value re-rating 継続）/ Bull 18%（労働軟化継続で利下げ観測復活）/
  Bear 22%（残響インフレ再加速 or 関税でタカ回帰・AI ディレート）/ Tail 8%（円キャリー巻き戻し・
  私募クレジット事故・ホルムズ再封鎖）。
