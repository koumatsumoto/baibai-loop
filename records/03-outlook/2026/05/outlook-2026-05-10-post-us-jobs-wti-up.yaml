summary: |
  PART A. 現状の構造分析

  2026-05-10 JST 時点の更新は、5/4 outlook の「高油価 + 米物価粘着 + 日銀様子見 + AI/半導体外需」の骨格を維持しつつ、米 4 月雇用統計と WTI 追加上昇で downside 側の確度をやや上げる。BLS 4 月雇用統計は非農業部門雇用者数 +115,000、失業率 4.3%、平均時給 +3.6% YoY で、雇用は崩れていないが増勢は鈍化した。Fed H.15 では 10Y 4.41%、2Y 3.92% と前週から小幅上昇し、VIX は 17.19 で通常レンジに残る。WTI は 2026-05-04 に $109.76 と前週 $99.89 から +9.9% で、燃料 sensitive sector の逆風を確認する。

  米国はコア PCE +3.2%、CPI +3.3%、一戸建て住宅着工 -14.2% MoM、4 月雇用 +115,000 の組み合わせで、物価粘着と実体減速が同時に残る。米株・クレジット環境は VIX だけでは悪化していないが、金利と原油が同時に上がる局面では valuation re-rating 余地を取りにくい。日本は春闘 5.09%、短観大企業製造業 +17、設備投資 +7.9% が下支えする一方、景気ウォッチャー DI 42.2 と東京コア CPI +1.5% が内需と日銀判断を鈍らせる。外需は USD/JPY 156.76 と円安水準が残り、TSMC / NVIDIA の公式 release で確認できる AI 需要と財務省貿易統計の半導体製造装置・IC 寄与を根拠に supportive を維持する。

  PART B. シナリオ分析

  Base 50%: WTI $100-115、米 CPI / PCE の再鈍化は限定的、Fed / BOJ とも hold を継続し、USD/JPY は 152-160。AI/半導体外需とエネルギー上流を拾い、燃料費・建設コスト sensitive sector を避ける。

  Upside 15%: ホルムズ正常化または油価低下で WTI が $90 台へ戻り、米 CPI が 5/12 に明確に鈍化する。化学、空運、陸運、電気・ガス、不動産の adverse を再評価するが、現時点ではまだ採用しない。

  Downside 30%: 米 CPI / PCE が高止まりし、雇用 +115,000 からさらに減速、WTI $110 超が続く。US bucket adverse、燃料 sensitive sector adverse、外需は AI 関連を除き neutral へ落とす可能性がある。

  Tail 5%: ホルムズ / OPEC+ / 米クレジットの複合ショックで VIX 25 超、HY OAS 拡大、日経平均急落。long-only 新規採用を最小化し、既存候補は research で liquidity と event risk を優先確認する。

  PART C. リスク因子

  1. 米 CPI 5/12 の上振れ: Fed hold 長期化、growth valuation 圧縮。観測: BLS CPI。
  2. WTI $110 超の定着: 化学、陸運、空運、電気・ガスの margin 圧迫。観測: EIA WTI / Brent。
  3. 米雇用の追加減速: +115,000 から下振れすると US adverse を強める。観測: 6/5 BLS。
  4. 日銀 5/12 主な意見の利上げ色: 銀行 supportive / 不動産 adverse を再評価。観測: BOJ。
  5. USD/JPY 150 割れ: 外需 supportive の一部を neutral 化。観測: ECB / H.10 FX。
  6. 中国輸出 / PMI 悪化: emerging adverse と日本中間財需要の下押し。観測: NBS / 海関総署系。
  7. AI capex の失速: 機械 / 電気機器 / 情報・通信の supportive を削る。観測: TSMC / NVIDIA IR。
  8. クレジット OAS 拡大: valuation discount の trap risk 増加。観測: FRED IG / HY OAS。
  9. OPEC+ 6/7 の supply 変更: 鉱業 / 石油・石炭と燃料 sensitive の両側を更新。観測: OPEC statement。
  10. 国内消費の追加悪化: 小売 / サービスを neutral から adverse 側へ。観測: 景気ウォッチャー、CPI。

  PART D. 投資方向性

  主軸は「supportive/neutral の中で、5/8 candidates に valuation / cashflow / sales growth の機械的 hit があり、かつ adverse sector ではない銘柄」。エネルギー上流と AI/半導体外需は macro が支えるが、すでに株価が上がった大型銘柄は research で entry risk を落とす。避ける軸は化学、電気・ガス、陸運、空運、不動産の fuel / rate sensitive。小売、食料品、サービスは neutral だが、米雇用鈍化と国内 DI 悪化を踏まえて、売上成長や CF yield が明確な銘柄だけを拾う。

  PART E. 次回 trigger

  5/12 米 CPI と日銀「主な意見」で Base / Downside の比率を更新する。5/28 BEA PCE と 6/5 米雇用統計で米 stagflation lite 判定を再確認し、6/7 OPEC+ statement と 6/16-17 FOMC で油価・金利の方向を更新する。
