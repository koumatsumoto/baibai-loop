summary: '2026-05-10 incremental outlook (1-6m horizon)。正本根拠は updated_from の brief 7 件であり、今回追加した fact layer は records/02-brief/2026/05/2026-05-10-world-weekly-us-jobs-nikkei-wti.yaml。outlook 本文では screening output や外部調査メモを macro fact source にしない。


  追加 fact: BLS 2026-04 雇用統計は非農業部門雇用者数 +115,000、失業率 4.3%、労働参加率 61.8%、平均時給 +0.2% MoM / +3.6% YoY。米 10Y は 4.41%、2Y は 3.92%、10Y-2Y は +49bp。VIX は 17.19。Brent は $118.26、WTI は $109.76。ECB クロスからの USD/JPY は 156.76。日経平均は 62,713.65、前週 59,513.12 から +5.4%。


  分析更新: 4 月雇用は失業率の急悪化ではないが、雇用者数 +115k と労働参加率 61.8% は、前回 outlook の stagflation-lite / 米成長鈍化リスクを弱める材料ではない。Brent / WTI の上振れは、鉱業・石油石炭の relative support と、化学・電気ガス・陸運・空運の cost pressure を補強する。日経平均 +5.4% と Nikkei 225 の technology weight 55.34% は、AI / 半導体・電気機器・機械・情報通信の相対優位という前回判断を補強するが、指数主導の上昇であり、個別候補では valuation と決算鮮度を必ず確認する。


  結論: sector status は大枠維持。screening select では、adverse sector を除外しつつ、supportive sector の機械・電気機器・情報通信・鉱業・石油石炭を優先候補に置く。ただし油価連動セクターは Upside case の油価反落で adverse に反転し得るため、割安指標だけでなく cash flow quality と次決算日を確認する。'
