permanent_loss_risks:
- axis: funding_liquidity
  assessment: acceptable
  evidence_status: verified
  summary: 2026年5月末cashは15.321十億円、借入控除後net cashは8.202十億円、Q1営業CFは4.085十億円で短期資金枯渇を示さない。buyback上限3十億円とM&A方針を合わせたcash消費は継続監視する。
  as_of: '2026-05-31'
  source_ids:
  - fy2027_q1_results
  - treasury_share_resolution
- axis: debt_repayment
  assessment: acceptable
  evidence_status: verified
  summary: 借入平均利率は1.30%、2027年から2031年まで各年度1.429十億円返済、最終返済は2031年2月。純資産75%以上・2期連続営業損失なしのcovenantに報告日現在抵触せず、2026年5月末cash15.321十億円が借入7.119十億円を上回る。
  as_of: '2026-05-31'
  source_ids:
  - fy2026_annual_report
  - fy2027_q1_results
- axis: cash_flow
  assessment: acceptable
  evidence_status: verified
  summary: FY2026の契約負債・残存履行義務は8.092十億円（1年以内6.419十億円、1年超1.673十億円）。Q1営業CF4.085十億円と単純cash capex0.216十億円は資金創出を示すが、売掛債権減少1.431十億円と契約負債増加1.965十億円への依存が大きく、年率換算しない。
  as_of: '2026-05-31'
  source_ids:
  - fy2026_annual_report
  - fy2027_q1_results
- axis: dilution
  assessment: acceptable
  evidence_status: partially_verified
  summary: 2026-06-30のEPS用net sharesは発行済35,035,470株から直接自己株228,712株とBIP信託47,398株を控除した34,759,360株。最大1.2百万株・3.45%の自己株式取得枠は潜在stock option204,400株・0.6%を上回るが、取得は未実行で将来の株式報酬付与を含むnet減少を確定事実にしない。
  as_of: '2026-07-14'
  source_ids:
  - fy2026_annual_report
  - fy2027_q1_results
  - treasury_share_resolution
- axis: customer_concentration
  assessment: acceptable
  evidence_status: partially_verified
  summary: FY2026に売上10%以上の顧客はなく、最大記載先NECは2.061十億円・売上の6.66%で、単一顧客集中は観測されない。一方、会計上の顧客は販売partner中心で、業界・公共案件・channel/platform別の集中は未開示である。
  as_of: '2026-02-28'
  source_ids:
  - fy2026_annual_report
- axis: structural_decline
  assessment: acceptable
  evidence_status: partially_verified
  summary: FY2026契約継続率は93.4%。Q1 recurring売上は17.8%増、比率70.6%、cloudは37.9%増で全社の構造衰退は観測されない。ただし期間・分母の異なるQ1保守継続率は90.2%、license/serviceは12.9%減、cloud増分の約66%は子会社等でorganic成長は未解決である。
  as_of: '2026-05-31'
  source_ids:
  - fy2026_annual_report
  - fy2027_q1_results
  - fy2027_q1_presentation
- axis: governance_accounting
  assessment: acceptable
  evidence_status: verified
  summary: DE事業CGUの減損testは割引率7.6%、永久成長率1.5%、回収可能価額headroom89.666十億円で、break-even感応度は割引率+13.5ptまたは将来CF-65.9%。Q1時点goodwill・無形資産44.196十億円は資本の96.9%と大きいが、開示感応度では直ちに減損へ至る余力不足を示さない。
  as_of: '2026-02-28'
  source_ids:
  - fy2026_annual_report
judgment:
  recommendation: defer
  proposed_at: '2026-07-15T23:15:26+09:00'
  confidence: medium
  permanent_loss_conclusion: acceptable
  strongest_countercase: FY2026は契約継続率93.4%、Q1 recurring売上17.8%増、減損headroom89.666十億円、売上10%以上の顧客なしと長期耐性を支える一次情報がある。一方、Q1 cloud増分の約66%は子会社等、SVF license/serviceは26.0%減、期間・分母の異なる保守継続率は90.2%、人件費と外注費の伸びも売上を上回った。会社予想達成にはQ2売上8.824十億円、EBITDA3.025十億円が必要で、NEX除外organic成長、contract別margin、NRR・churn、CAC/paybackは未開示である。したがって保有thesisは維持できるが、追加購入では8%利益成長と14倍terminalを同時に置くbaseをQ2前に強く確信しない。
  sizing_action: none
  ai_value_capture:
    assessment_status: not_material
    roles: []
    competitive_advantage: neutral
    pricing_power: unknown
    capex_burden: neutral
    customer_bargaining_power: unknown
    value_capture_conclusion: uncertain
    decision_weight: none
    rationale: 会社はAIを製品機能と開発効率化へ使い、Claudeを400名超へ付与したと説明するが、AI起点の売上、gross margin、retention、価格改定は分離開示しない。5年baseはrecurring contractとcash conversionで組み、AI寄与を採用理由にしない。
    source_ids:
    - fy2027_q1_presentation
