- <<: *risk
  axis: debt_repayment
  summary: The balance sheet is net-cash and disclosed liabilities are small relative to liquid assets and operating profit.
- <<: *risk
  axis: cash_flow
  summary: Operating cash generation is strong, though title timing makes annual conversion volatile and capital returns consume cash.
- <<: *risk
  axis: dilution
  summary: The company cancelled 30 million shares in February 2026 and no material equity-financing plan is disclosed.
- <<: *risk
  axis: customer_concentration
  assessment: acceptable
  evidence_status: verified
  summary: The annual report does not disclose a customer meeting the material major-customer threshold; distributor and hall-market dependence remains an industry risk.
- <<: *risk
  axis: structural_decline
  assessment: acceptable
  evidence_status: verified
  summary: A mature regulated market is a material risk, but leading share, hit products, and the net-cash balance keep permanent loss acceptable.
- <<: *risk
  axis: governance_accounting
  evidence_status: verified
  summary: The unqualified audit and KAM procedures cover the 12.95 billion yen headquarters purchase from a director-related company; the transaction remains a capital-allocation monitoring item.
