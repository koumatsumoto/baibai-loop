permanent_loss_risks:
- axis: funding_liquidity
  assessment: acceptable
  evidence_status: verified
  summary: 2026年3月末cash equivalentsは11.335十億円で、3.5十億円のcommitment lineもある。採用・IT・製品投資を続けても短期資金枯渇を示す一次情報はない。
  as_of: '2026-03-31'
  source_ids:
  - fy26_q3_financial_results
  - fy25_securities_report
- axis: debt_repayment
  assessment: acceptable
  evidence_status: verified
  summary: FY2025末の借入残高はゼロで、2026年3月末も有利子負債はlease liabilities約31百万円に限られるため、返済wallは確認されない。
  as_of: '2026-03-31'
  source_ids:
  - fy26_q3_financial_results
  - fy25_securities_report
- axis: cash_flow
  assessment: acceptable
  evidence_status: verified
  summary: FY2025 operating cash flowは4.470十億円と純利益を上回る。一方FY2026第3四半期累計は1.149十億円へ低下し、DX外注費の前払いで成長時に運転資本が増えるためconversionを継続監視する。
  as_of: '2026-03-31'
  source_ids:
  - fy26_q3_financial_results
  - fy25_securities_report
- axis: dilution
  assessment: acceptable
  evidence_status: verified
  summary: 2026年3月末のnet sharesは発行済36,009,551株から自己株式1,387,599株を控除した34,621,952株で、自己株式取得は一株価値に寄与する。株式報酬による再希薄化は監視対象に残る。
  as_of: '2026-03-31'
  source_ids:
  - fy26_q3_financial_results
- axis: customer_concentration
  assessment: acceptable
  evidence_status: verified
  summary: FY2025有価証券報告書では売上高10%以上の主要顧客はない。上位顧客合計やsegment別集中は非開示だが、単一顧客喪失で直ちに存続が揺らぐ証拠はない。
  as_of: '2025-06-30'
  source_ids:
  - fy25_securities_report
- axis: structural_decline
  assessment: acceptable
  evidence_status: verified
  summary: 連結売上はFY2025に増加しFY2026第3四半期累計も9.0%増で、DX需要の縮小は観測されない。ただし会社自身がAIによるprogram開発consulting収入縮小をriskとして開示しており、software・BPOへのmix転換が必要である。
  as_of: '2026-03-31'
  source_ids:
  - fy26_q3_results_presentation
  - fy25_securities_report
- axis: governance_accounting
  assessment: acceptable
  evidence_status: verified
  summary: FY2025監査済み開示とFY2026第3四半期開示に重大な会計・継続企業warningはない。進行基準売上にはsystem developmentも含まれるため、これをrecurring revenueと誤読しない。
  as_of: '2026-03-31'
  source_ids:
  - fy26_q3_financial_results
  - fy25_securities_report
judgment:
  recommendation: buy
  proposed_at: '2026-07-14T21:51:00+09:00'
  confidence: medium
  permanent_loss_conclusion: acceptable
  strongest_countercase: FY2026第3四半期のsoftware gross profitは単四半期2.1%増に留まり、Management Solutions営業利益は累計28.1%減である。FY2025からFY2028目標にはsoftware gross profit年率24.9%から28.6%、純利益年率20.4%から26.8%が必要で、recurring sales ratio 41.2%もARR・NRR・churnを示さないため、DX市場の成長が一株利益へ届かない可能性が最も強い反証である。
  sizing_action: normal
  ai_value_capture:
    assessment_status: material
    roles:
    - adopter
    - complement
    competitive_advantage: neutral
    pricing_power: unknown
    capex_burden: neutral
    customer_bargaining_power: unknown
    value_capture_conclusion: uncertain
    decision_weight: none
    rationale: AI/RAGはdata platform案件の大型化と開発生産性の向上余地を持つ一方、会社はprogram開発consultingの収入縮小riskも開示する。Cynch投資の金額・持分・収益寄与とAI起点の単価・粗利改善は非開示で、株主価値への純寄与をまだ確認できない。
    source_ids:
    - fy25_securities_report
    - integrated_report_2025
    - cynch_investment
