kind: macro-analysis
analysis_id: macro-analysis-2026-06-22-jp-equities-1m
as_of: "2026-06-22"
published_at: "2026-06-22T09:00:00+09:00"
question: 日本株の直近1か月（2026-05-20〜06-22）の動きをどう読むか、トレード上の含意は何か
summary: >-
  日経225は約1か月で +19%（59,804→71,250）のメルトアップで最高値圏。米クレジット
  スプレッドのタイト化（HY OAS 2.80→2.63%）と円安（USD/JPY 159→161）が大型・輸出
  株を後押しした一方、VIX上昇（17.4→18.4）とBTC急落（-17%）が risk-appetite の
  翳りを先行示唆。指数は overstretched で、追随より出遅れ・割安・内需への循環物色に
  妙味。frothシグナルを踏まえ starter サイズは抑制。
horizon: 1m
data_inputs:
  - series_id: jp.nikkei225
    window: 2026-05-20..2026-06-19
    observation: 59804→71250（+19.1%、最高値圏のメルトアップ）
    used_for: 指数のトレンドと過熱度の判定
  - series_id: usd_jpy
    window: 2026-05-20..2026-06-19
    observation: 159.0→161.2（円安 約+1.4%）
    used_for: 輸出株の追い風 / 内需株の逆風の判定
  - series_id: credit.us_hy_oas
    window: 2026-05-20..2026-06-17
    observation: 2.80→2.63%（-17bp、タイト化）
    used_for: グローバル risk-appetite（risk-on/off）の確認
  - series_id: vix
    window: 2026-05-20..2026-06-17
    observation: 17.44→18.44（+5.7%、小幅上昇）
    used_for: 株式ボラ・警戒度の確認
  - series_id: btc_usd
    window: 2026-05-20..2026-06-20
    observation: 77494→64180（-17.2%）
    used_for: 投機的 risk-appetite の divergence（過熱の翳り）の確認
  - series_id: us.10y
    window: 2026-05-20..2026-06-17
    observation: 4.57→4.49%（-8bp）
    used_for: 割引率・高PERグロースへの金利逆風の確認
sources:
  - source: FRED
    title: Nikkei 225 Stock Average (NIKKEI225)
    url: https://fred.stlouisfed.org/series/NIKKEI225
    published_at: "2026-06-22"
    used_for: 指数水準・1か月騰落の一次データ
  - source: FRED
    title: ICE BofA US High Yield Index Option-Adjusted Spread (BAMLH0A0HYM2)
    url: https://fred.stlouisfed.org/series/BAMLH0A0HYM2
    published_at: "2026-06-22"
    used_for: クレジット risk-appetite の一次データ
scenarios:
  - name: メルトアップ継続
    probability: 0.35
    narrative: >-
      円安とタイトなクレジットが大型・輸出株を支え、最高値追いが続く。半導体・AI/DX
      主導の上昇が dominant のまま、出遅れは置き去り。
  - name: 高値警戒の反落
    probability: 0.4
    narrative: >-
      月次+19%は overstretched。VIX上昇とBTC急落が risk-appetite の翳りを先行示唆し、
      利益確定・イベント（BOJ/FOMC・決算）起点で指数が反落する。
  - name: 循環物色（内需・割安へ）
    probability: 0.25
    narrative: >-
      指数高値で物色が出遅れ割安・内需へ循環。screening の mean-reversion / 割安
      lane に追い風となり、ラリー非参加の割安銘柄が見直される。
risks:
  - 月次+19%の過熱（mean-reversion で反落しやすい水準）
  - VIX上昇とBTC急落が示す risk-appetite の divergence
  - BOJ追加利上げ観測（高PERグロースへの逆風、円高反転リスク）
  - 円安反転で輸出株の追い風が剥落するリスク
  - 米長期金利の再上昇（割引率上昇でグロース調整）
  - 決算シーズンでの期待未達
  - 上昇の breadth が狭い（大型主導、中小型は出遅れ）
  - 海外投資家フローの反転リスク（指数の限界的買い手）
  - イベント密集（BOJ会合・FOMC・決算）でのまたぎリスク
  - クレジットの過度なタイト化（リスクの過小評価＝反動リスク）
forward_view: >-
  指数は extended。最高値追いをフルサイズで追うのではなく、ラリー非参加の出遅れ
  割安・内需へ循環する mean-reversion を優先。frothシグナル（VIX上昇・BTC急落）を
  踏まえ新規 starter は抑制し、輸送用機器など円安受益はリスク管理下で選好。
risk_posture:
  stance: neutral
  gross_guidance: 新規 starter を抑制。最高値圏の指数リーダーを高値追いしない
  cash_floor_pct: 15
  rationale: >-
    クレジットと円安は risk-on を支持するが、月次+19%の過熱・VIX上昇・BTC急落が
    froth を示すため full risk_on には傾けず neutral。
trade_levers:
  - lever: theme
    target: mean-reversion-laggards
    direction: favor
    rationale: 指数最高値圏で出遅れ割安・内需へ循環物色の妙味（screening 割安 lane に追い風）
  - lever: sector_tilt
    target: 輸送用機器
    direction: favor
    rationale: USD/JPY 159→161 の円安が輸出株収益の追い風
  - lever: sector_tilt
    target: 情報・通信業
    direction: neutral
    rationale: ラリーを主導し overstretched。高値追いはせず中立（既保有はリスク管理）
  - lever: risk_posture
    target: new-starters
    direction: decrease
    rationale: VIX上昇・BTC急落の froth シグナルを踏まえ新規建ては小さく開始
  - lever: timing
    target: chasing-index-highs
    direction: avoid
    rationale: 月次+19%は overstretched、最高値追いの新規エントリーは見送り
confidence: medium
