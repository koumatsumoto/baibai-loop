fact_memos:
  - "米コア PCE 3 月 +3.2% YoY (BEA 4/30 公表)。Fed 目標 +2% を大幅上回り基調インフレ粘着 → FOMC タカ派ホールドの正当化材料"
  - "米一戸建て住宅着工 -14.2% MoM (3 月) はコロナ初期以来の大幅減 → 需要側冷却の early signal"
  - "ホルムズ海峡 2026-02-28 以降閉鎖継続、中東 6 ヶ国 2026-04 9.1mb/d シャットイン → 油価高値圏粘着の構造要因"
  - "EIA STEO Brent 2026 年通年 $96 / Q2 ピーク $115 / Q4 $88 想定、IEA 需要 -80kb/d 下方修正 (Q2 -1.5mb/d はコロナ以来) → 油価高値圏 + 需要破壊の dual"
  - "OPEC+ JMMC 5 月から 206kb/d 増産路線 (8 ヶ国の自主削減 1.65mb/d のうち)"
  - "Section 122 関税 (Proclamation 11012) は Federal Register 本文上 10% ad valorem (2026-02-24 〜 7-24)、外部分析の trade-weighted estimate で 13%"
  - "日銀 4/27-28 6-3 hold (6 名据置 / 3 名は据置に反対し利上げを主張)、展望レポートで 2026 年度コア CPI +2.8% に +0.9pt 上方修正"
  - "ECB 4/30 据置、HICP +3.0%、upside risks to inflation 強調。BOE 4 月 8-1 据置、Pill が 4.00% 利上げ票"
  - "米 IG OAS 80bp / HY OAS 283bp は historically タイト = 中東ショック未織込み、調整余地大"
  - "CBO 米財政赤字 FY26 1.9 兆 (5.8% GDP)、利払い 1 兆 (3.3% GDP)、2036 年公的債務 GDP 比 120%"
  - "連合春闘 5.09%、3 年連続 5% 超、賃金 + 物価の正の循環は 3 年目"
  - "日銀短観 大企業製造業 +17、設備投資 +7.9% で製造業マインドは底堅い"
  - "景気ウォッチャー 現状判断 DI 42.2 (-6.7pt 急冷)、製造業との温度差拡大"
  - "東京都区部 4 月 CPI +1.5% (3 ヶ月連続 2% 割れ) = 日銀利上げハードル上昇要因"
  - "TSMC 1Q26 売上 359 億 USD / GM 66.2%、NVIDIA FY26 通年 2,159 億 USD (+65%) / Q1 FY27 ガイ 780 億 USD で AI capex 構造需要は持続"
  - "中国 4 月 PMI 50.3 (-0.1pt) ぎりぎり拡張、3 月輸出 +2.5% (対米 -26%) で 122 条効果顕在化、Q1 不動産投資 -11.2% で底入れ未達"
  - "BDI 4/29 2,670 (Capesize 主導 4 ヶ月ぶり高水準) = 鉄鉱石・石炭海上輸送需要堅調"
