  ============================================================
  PART A. 現状の構造分析 (6 axes)
  ============================================================

  【A-1. 米マクロ: stagflation lite が現実化】

  事実 (deep research で確認):
  - 米 2026-03 コア PCE +3.2% YoY (BEA 4/30 公表)、PCE +3.5%。Fed 目標 +2% を大幅
    上回り、コアでも粘着インフレが顕在化
  - 米 3 月 CPI +3.3% (BLS、Major +0.9pt)、コア +2.6%、CPI MoM +0.9% (大きく上振れ)
  - 米 3 月小売売上高 +1.7% MoM、+4.0% YoY だが、ガソリン +15.5% MoM の影響を相当
    含み、実質消費の強さは見かけ倒し
  - 米 3 月雇用 +178k、失業率 4.3% (前月 4.4% 改善)、4 月分は 5/8 発表予定
  - 米 3 月一戸建て住宅着工 SAAR 94 万戸、-14.2% MoM (コロナ初期以来の大幅減)、
    許可も 4 ヶ月ぶり低水準

  構造解釈: 「失速 + 物価高」型の stagflation 様相が現実化しつつある。住宅 -14.2%
  は明確な需要側冷却の signal で、雇用・小売の強さと矛盾し始めた。コア PCE +3.2% は
  エネルギー除いても基調インフレが粘着しており、油価が反落しても物価が下がりにくい
  構造。米 1974 年通商法 122 条関税 (Proclamation 11012、Federal Register 2026-02-25、
  10% ad valorem temporary import surcharge、2026-02-24 12:01 EST 適用、150 日間
  = 2026-07-24 期限、USMCA goods・critical minerals・energy・pharma・vehicles・
  aerospace 等を除外。trade-weighted 実効税率は外部分析で 13% 程度との estimate
  あり) と 301 条 (適用除外 11/10 まで延長) の二段構えが、輸入物価の構造的押し上げ
  要因として残存。

  FOMC 4/29: 3.50-3.75% 据置、賛成 8 / 反対 4 (Miran 利下げ希望 / Hammack, Kashkari,
  Logan は hold だが easing bias 削除)。タカ派 3 名 + 利下げ派 1 名で内部 4 分裂は
  パウエル時代最大級。声明文の「inflation is elevated, in part reflecting the recent
  increase in global energy prices」は油価が reaction function に直接組み込まれた
  構造変化。米 4 月 CPI (5/12)、4 月コア PCE (5/28) でこの構造を確認できる。

  【A-2. 地政学・エネルギー: ホルムズ海峡実質閉鎖継続が核心】

  事実 (deep research で確認):
  - ホルムズ海峡が 2026-02-28 以降実質閉鎖。中東 6 ヶ国 (イラク / サウジ / クウェート
    / UAE / カタール / バーレーン) が 3 月 7.5mb/d、4 月 9.1mb/d の生産シャットイン
    (EIA Press Release 4/7)。世界石油在庫は 3 月 -85m bbl
  - 4/19 brief の「US-Iran de-escalation」は外交上のもので、物理的な石油フローは
    閉鎖継続。両者は別レイヤーで認識する必要
  - Brent $113.89 / WTI $99.89 (2026-04-30)、4 週前比 Brent +14.1% / WTI +5.4% Major
  - EIA STEO 4 月: Brent 2026 年通年 $96 (前月 $79 から +22% 上方修正)、Q2 ピーク
    $115、Q4 $88 へ減衰想定。米シェール 13.5mb/d (2026 年)
  - IEA Oil Market Report 4 月: 2026 年通年需要 -80kb/d (前回 +730kb/d から下方修正)、
    Q2 -1.5mb/d はコロナ以来の急減。アジアの石油化学・LPG・ジェット燃料が中心に減退
  - OPEC JMMC 4/5: 8 ヶ国の自主削減 1.65mb/d のうち 206kb/d 分の調整を 5 月から
    実施 (段階的増産)
  - OPEC+ 5/3 statement: 7 ヶ国 (サウジ / ロシア / イラク / クウェート / カザフ /
    アルジェリア / オマーン) が 2026-06 に 188kb/d adjustment を実施。flexibility
    to increase / pause / reverse phase-out、2024-01 以降の overproduced volumes の
    full compensation、JMMC monthly monitoring。次回会合 2026-06-07

  構造解釈: ホルムズ海峡が世界石油消費の 20% / 海上原油の 30% を担うチョークポイント
  であり、代替パイプライン余力は限定的。物理的な供給ショックが続く限り risk premium
  は剥がれにくい。EIA は Q2 ピーク → Q4 $88 への減衰を base case とするが、これは
  ホルムズ正常化を前提としており、長期化すればずれる。一方、IEA 需要破壊 -80kb/d は
  価格高騰による demand-side reset がアジア石化・LPG・ジェット燃料で進行中である
  ことを示す。OPEC+ は段階的増産路線で、supply discipline は緩和方向。

  【A-3. 為替・金融政策: G4 中銀 揃って「ホールド + データ次第」】

  事実 (deep research で確認):
  - USD/JPY 159.35 → 156.56 (-1.75% notable)、EUR/JPY 186.71 → 183.21 (-1.87%)、
    AUD/JPY 113.90 → 111.91 (-1.75%)
  - 日銀 4 月展望レポート: 2026 年度コア CPI 見通しを +2.8% に上方修正 (1 月 +1.9%
    から +0.9pt)。2027 年度 +2% 台前半、2028 年度 +2% 程度
  - 日銀 4/27-28 会合: 6-3 でホールド (6 名据置 / 3 名は据置に反対し利上げを主張)。総裁会見で「中東情勢の
    不確実性」を強調、利上げ条件は揃いつつあるが「中東を見極める」姿勢
  - ECB 4/30: 預金金利 2.00% / MRO 2.15% / 限界貸付 2.40% で据置。HICP +3.0%、
    「upside risks to inflation and downside risks to growth have intensified」
  - BOE 4 月: Bank Rate 3.75% を 8-1 で据置。チーフエコノミスト Pill が 4.00% 利上げ
    票。英国 3 月 CPI +3.3%
  - 米 10Y 4.40% (+9bp)、米 2Y 3.88% (+10bp)、2-10s +50bp、yield curve 緩慢正常化

  構造解釈: 中東 × ホルムズ閉鎖がコモディティ・物価・需要を同時に揺さぶり、Fed・
  ECB・BOE・日銀全員が「ホールド + データ次第」で身動き取れない。日銀は展望で +2.8%
  上方修正で利上げ正当化材料を温存しつつ、景気下振れリスクを理由に実行を引き伸ばす
  含み。USD/JPY 円独歩高の主因は **日銀利上げ織り込み (中位 30-40%)** + **米長期
  金利先高一服感**の合成。AUD/JPY 円高は資源国通貨経由のリスクオフ反映。

  【A-4. 日本マクロ: 製造業底堅さ vs 内需冷却の温度差】

  事実 (deep research で確認):
  - 日本 3 月コア CPI +1.8%、コアコア +2.4% (総務省)
  - 東京都区部 4 月中旬 CPI +1.5% (生鮮除き、3 ヶ月連続 2% 割れ)。諸雑費 -7.1% YoY
    が押し下げ要因
  - 連合春闘第 3 回 (4/3): 賃上げ率 5.09% (前年同期比 -0.33pt)、中小組合 5.00%、
    有期・短時間労働者 +6.89%。3 年連続 5% 超
  - 日銀短観 3 月: 大企業製造業 DI +17 (前回比 +1pt)、大企業非製造業 +36 (横ばい)。
    2025 年度設備投資計画 全規模全産業 +7.9%、大企業製造業 +12.3%。2026 年度初回
    計画 +1.3%
  - 経産省鉱工業生産 3 月速報: 前月比 -0.5%、出荷 -1.1%。製造工業生産予測指数は
    4 月 +2.1%、5 月 +2.2%。電子部品・デバイス、生産用機械が底堅い
  - 財務省貿易統計 3 月: 輸出 +11.7% YoY (7 ヶ月連続増)、貿易収支 +6,670 億円。
    半導体製造装置・IC が増加に寄与、対中東向けはホルムズ封鎖で減少、自動車減少
  - 内閣府景気ウォッチャー 3 月: 現状判断 DI 42.2 (前月比 -6.7pt 急冷)、先行きも
    大幅悪化

  構造解釈: 製造業 (短観 +17、設備投資 +7.9%) と内需 (景気ウォッチャー -6.7pt 急冷)
  の温度差が拡大。AI/半導体投資は底堅く、生産予測指数の 4-5 月 +2.1/+2.2% も先行き
  製造業堅調を示す。一方、東京 CPI +1.5% (3 ヶ月連続 2% 割れ) は日銀の利上げハードル
  を意外に上げており、政策金利据置長期化の可能性。春闘 5.09% で賃金 + 物価の正の
  循環は 3 年目も健在で、構造的なインフレ tailwind は維持。

  【A-5. リスク資産・債券: クレジット historically tight、株式は調整余地】

  事実 (deep research で確認):
  - 米 IG OAS 80bp (FRED BAMLC0A0CM、25 年来タイト)、BBB 100bp、AA 51bp、AAA 40bp。
    長期平均 ~150bp を大きく下回る
  - 米 HY OAS 283bp (FRED BAMLH0A0HYM2、歴史的タイト)
  - VIX 16.89 (4 月平均、FRED VIXCLS、3/9 ピーク 35.30 から急低下)、5/3 時点 16.99
  - 米 10Y 4.40% (+9bp)、米財政赤字 FY26 1.9 兆 USD (GDP 比 5.8%)、利払い 1.0 兆
    (GDP 比 3.3%)。CBO 試算で 2036 年公的債務 GDP 比 120%
  - 日経平均 59,513.12 (-0.3% WoW)

  構造解釈: クレジットは中東ショックを全くテイクオフしておらず、IG 80bp / HY 283bp
  は歴史的タイト。VIX は中東ショック直後のスパイクを既に消化、足元は通常レンジ。
  但し、マクロ stagflation 様相 + 米財政構造悪化を考慮すると、楽観の裏返しで調整
  余地が大きい状態。CBO の長期赤字パスは米長期金利のプレミアム要因として恒常化。

  【A-6. AI / 半導体: 構造的下支え、株式 outlook の柱】

  Q1 release / press release で確認済みの fact:
  - TSMC 1Q26 Earnings (公式 release): 売上 359 億 USD、グロスマージン 66.2%、
    オペマージン 58.1%
  - NVIDIA FY26 (公式 press release): 通年売上 2,159 億 USD (+65% YoY)、データ
    センター 1,973 億 USD、Q4 売上 681 億 USD (+73%)、データセンター 623 億 USD、
    Q1 FY27 ガイダンス 780 億 USD (±2%)

  cross-check 待ちの参考値 (本 outlook の高確度根拠としては未採用):
  - TSMC 2026 年通年 Capex $52-56B レンジ・先端プロセス 70-80% 配分・通年売上
    +30% は Q1 release では確認できず、Q4 (2025) earnings transcript / IR archive
    由来の参考値
  - NVIDIA Sovereign AI 売上 300 億 USD 超・Q3-Q4 commitment 倍増 (503 億 → 952 億
    USD) は press release 本文には記載なく、earnings call transcript / 10-K /
    10-Q で確認が必要

  構造解釈: AI / HPC 需要は中東ショック / FOMC タカ派 / 円高反転とは独立に拡大継続
  と仮定する根拠は、TSMC Q1 売上 359 億 USD / GM 66.2% (公式 release) と NVIDIA
  FY26 通年 +65% / Q1 FY27 ガイ 780 億 USD (公式 press release) のみ。Capex
  $52-56B / Sovereign AI 300 億は cross-check 後に補強する。日本の半導体製造装置
  (Tokyo Electron / SCREEN / 大日本印刷など)、電子部品 (Sony / Murata / Tokyo
  Ohka など)、電力関連 (関西電力 / J-Power など) に構造的追い風という解釈は、
  確認済み fact の範囲だけでも財務省貿易統計の半導体製造装置・IC 輸出寄与で支え
  られる。Capex / Sovereign AI 補強情報は次回 outlook で transcript 確認後に
  反映予定。

  ============================================================
  PART B. シナリオ分析 (1-6m horizon、確度合計 100%)
  ============================================================

  【B-1. Base case (確度 50%): hawkish hold + ホルムズ高止まり + AI 需要持続】

  triggering path: ①米 4 月 CPI が +3.0-3.4%、コア +2.6-2.7%、コア PCE +3.0-3.3% で
  推移、②FOMC 6/16-17 hold 継続 + hawkish bias 強調、③Brent $100-115、ホルムズ
  閉鎖継続、④日銀 6/16-17 hold (利上げ見送り、東京 CPI +1.5% 鈍化が背景)、
  ⑤USD/JPY 152-160 推移、⑥VIX 15-22 推移、⑦TSMC / NVIDIA AI 需要堅調維持

  sector 帰結:
  - tailwind: 鉱業 / 石油・石炭製品 (油価高値圏)、機械 / 電気機器 (AI 設備投資 +
    AI 部品需要)、鉄鋼 (BDI 高値、鉄鉱石需要)、情報・通信業 (AI/データセンター)
  - headwind: 化学 (ナフサ + IEA 需要破壊)、電気・ガス業 (LNG 高値)、陸運業 (燃料
    費)、空運業 (ジェット燃料)、不動産業 (米住宅 -14.2% spillover + BOJ 利上げ警戒)
  - neutral: 海運業 (BDI 高値 = ドライバルク plus、コンテナ = 中国対米輸出 -26% で
    minus、相殺)、輸送用機器 (短観底堅さ + 米需要堅調 vs 円高反転 + 中東向け輸出
    減少)、銀行業 (BOJ 利上げハードル上昇 = 利ザヤ拡大 front-run 弱)

  投資方向: AI 軸 + エネルギー上流軸の dual barbell を中心に、燃料 sensitive sector
  は long-only で避ける。BDI 高値 は鉄鋼にも spillover。

  【B-2. Upside (確度 15%): ホルムズ正常化 + 油価 reset + 利下げ織り込み復活】

  triggering path: ①ホルムズ封鎖解除 / 中東 6 ヶ国生産再開、②Brent $80-95 へ低下、
  ③米 CPI 急減速 (+2.5-2.8%)、④FOMC 7 月利下げ示唆、⑤USD/JPY 152-156 (円高
  limited)、⑥AI 需要は引き続き堅調、⑦VIX 12-16

  sector 帰結:
  - tailwind に転換: 化学 / 電気・ガス業 / 陸運業 / 海運業全般 / 空運業 (燃料費低下)、
    不動産業 (金利低下期待)、グロース系 (情報・通信業 / 電気機器 AI 関連は更に強化)
  - headwind に転換: 鉱業 / 石油・石炭製品 (油価反落)、銀行業 (利上げ織り込み剥落)
  - 不変: 機械 / 電気機器 AI 関連 tailwind 維持
  - 商社 (卸売業) は資源 vs 非資源で mix、neutral 寄り tailwind

  投資方向: エネルギー上流 → 下流 + ディフェンシブへ rotation、グロース・テック add、
  金融セクター unwind。

  【B-3. Downside (確度 30%): スタグフレーション正面化 + クレジット調整】

  triggering path: ①米 4 月 CPI さらに加速 (+3.5%+)、コア PCE +3.4%+、②FOMC 利上げ
  復活示唆 (3.75-4.00% 検討)、③Brent $115-125 維持、④米一戸建て住宅着工さらに
  悪化 (-15%+)、⑤IG OAS 80 → 130bp、HY OAS 283 → 450bp の調整、⑥VIX 25-35、
  ⑦USD/JPY 145 割れ or 一時 165 over (二極シナリオ)、⑧日経平均 -10-15%

  sector 帰結:
  - 全般 risk-off、ディフェンシブ (食料品 / 医薬品 / サービス業) selective relative
    tailwind
  - 外需 (機械 / 電気機器 / 輸送用機器) は AI tailwind と為替 / 米需要逆風の dual
    で複雑化、AI 関連は耐性、純輸出依存は headwind
  - 鉱業 / 石油・石炭製品は油価支えで relative tailwind だが β リスクで size 縮小
  - 銀行業 tailwind (利上げ織り込み)、不動産業 強 headwind
  - クレジット調整局面では証券・保険も headwind

  投資方向: cash + ディフェンシブ insurance 比重上げ、外需 selective unwind (純
  輸出依存銘柄縮小)、AI 関連は維持、エネルギー上流は relative tailwind だが β
  リスクで size 縮小。

  【B-4. Tail risk (確度 5%): 中東再激化 + 油価 $130-150 spike】

  triggering path: ①ホルムズ事態の軍事的激化 / サウジ・イラン直接対立 / ロシア・
  ウクライナ大規模再燃のいずれか、②油価 $130-150 spike、③米 CPI 急加速 (+4.0%+)、
  ④FOMC 緊急利上げ、⑤USD/JPY 急変 (両方向ボラティリティ)、⑥VIX 35+、⑦日経平均
  -15-25%、⑧IG OAS 200bp、HY OAS 700bp の急変

  sector 帰結: ほぼ全業種 risk-off、ディフェンシブも一時 headwind、鉱業 / 石油・
  石炭製品は油価で支えられるが市場全体 sell-off で時間差 sell-off、現金 / 米債券 /
  金 (海外) flight。AI 関連も β リスクで一時調整。

  投資方向: cash 比率上昇、long-only 範囲ではディフェンシブ最低限維持、新規 entry は
  停止、execution の kill switch を厳格に運用。

