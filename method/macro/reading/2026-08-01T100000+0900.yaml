# macro reading（L2 機械読み値）の計算規則。
#
# 全登録 series に規則が解決することが要件であり、系列追加が本ファイルの編集を
# 要求しない。したがって frequency 別の defaults を正とし、override は「default が
# 事実に反する系列」だけに書く。網羅性は tests/engine/market_context/test_reading.py が保証する。
#
# 用語と限界:
# - percentile_window_years は統計窓。statistic は percentile / z-score の比較対象を
#   level（水準）または yoy（前年比%）から選ぶ。latest_value・trend・flags は元系列の
#   単位を使い、trend は元系列の差である。yoy 指定でも trend を前年比差へ変えない。
# - sampling_cadence は統計標本間隔、publication_cadence は次の観測日の推定間隔。
# - publication_lag_days は観測日から公表までの暦日近似、staleness_margin_days は猶予。
#   次回目安は最終観測日＋推定間隔＋lagで、該当周期の土日は翌平日へ送る。
#   stale はその目安＋marginを越えた状態であり、print_due の負値だけでは決まらない。
# - 下記の公表周期・履歴窓・測定値は設定時の運用上の根拠。公式公表日、将来の最大ラグ、
#   公表済みであること、現契約の取得可能範囲を保証しない。祝日別の公式暦は再現しない。
# - flags は元系列の水準に対する注記で、売買signalや L3 判断の代替ではない。
schema_version: 2

defaults:
  daily:
    percentile_window_years: 10
    short_trend_months: 3
    long_trend_months: 12
    publication_lag_days: 0
    # 日次系列の通常の非更新日を考慮した運用上の猶予。最長連休の保証ではない。
    staleness_margin_days: 6
  weekly:
    percentile_window_years: 10
    short_trend_months: 3
    long_trend_months: 12
    publication_lag_days: 7
    staleness_margin_days: 7
  monthly:
    percentile_window_years: 10
    short_trend_months: 3
    long_trend_months: 12
    # 月初を観測日とする系列の公表遅延を近似する。系列固有の差は override で表す。
    publication_lag_days: 45
    staleness_margin_days: 7
  quarterly:
    percentile_window_years: 10
    short_trend_months: 6
    long_trend_months: 12
    # 四半期初日を観測日とする系列の公表遅延の近似。欠測検知には長い待ちが生じる。
    publication_lag_days: 118
    staleness_margin_days: 7

overrides:
  # FRED が暦日ごとの観測を配信する系列。live store の直近3か月でも土日点が連続
  # しており、business-day defaultでは実在する次の観測を飛ばす。
  btc_usd:
    publication_cadence: calendar_daily
  ecb.policy_rate:
    publication_cadence: calendar_daily
  us.fed_funds.lower:
    publication_cadence: calendar_daily
  us.fed_funds.upper:
    publication_cadence: calendar_daily
  # FRB H.10 は前週の日次値を月曜にまとめて公表する。観測 grid は日次のまま、
  # publication は金曜相当の最終観測から次の月曜までの weekly + 3 日で表す。
  # https://www.federalreserve.gov/releases/h10/
  usd_cny:
    publication_cadence: weekly
    publication_lag_days: 3
    staleness_margin_days: 2
  usd_index.broad:
    publication_cadence: weekly
    publication_lag_days: 3
    staleness_margin_days: 2
  # FRED の EIA 由来の日次価格も週次でまとめて公表される（実測: 07-13 までの週が
  # 07-20、07-20 までの週が 07-23 に初出）。標準公表は水曜で、holiday週は木曜へ
  # 遅れるため、weekly + 3 日で近似する。
  # https://www.eia.gov/petroleum/supply/weekly/schedule.php
  wti:
    publication_cadence: weekly
    publication_lag_days: 3
    staleness_margin_days: 2
  brent:
    publication_cadence: weekly
    publication_lag_days: 3
    staleness_margin_days: 2
  natgas:
    publication_cadence: weekly
    publication_lag_days: 3
    staleness_margin_days: 2
  # 30日を挟む限月がない期間は30日IVとskewが構造的に欠測する。
  # 30日を挟む条件による空きは、当初の2093取引日・105限月の照合で最大19暦日。
  # skewは基準検査でも欠測し得る。この観測を踏まえてmargin23を選んだ。
  # 日付・週末により実際の閾値は変わる。別系列iv_termの鮮度と取得状態も確認するが、
  # いずれかの系列が必ず全ての取得障害を検知する保証はない。
  jp.n225_iv_30d:
    staleness_margin_days: 23
  jp.n225_iv_skew:
    staleness_margin_days: 23
  # 当月確報を月末に取得する当初の観測に合わせたlag28・margin6。
  us.consumer_sentiment:
    statistic: level
    publication_lag_days: 28
    staleness_margin_days: 6
  # multpl は月次履歴表に含まれる日付付きの現在行と月次行を読む。取得・鮮度は
  # daily のまま、統計標本だけを月1点にそろえて直近月の過重を防ぐ。
  us.sp500_cape:
    sampling_cadence: monthly
  us.sp500_pe:
    sampling_cadence: monthly
  us.sp500_earnings_yield:
    sampling_cadence: monthly
  # JOLTS は M の求人を M+2 の第 1 週に公表する（他の月次より 1 か月遅い）。平常時の
  # 齢は 97 日に達する。
  us.jolts_openings:
    publication_lag_days: 66
  # 労働力調査は月 M を M+1 末に公表する（e-Stat 掲載日の実測は観測日 + 58〜61 日）。
  # 統計ダッシュボードの転載差を margin ではなく lag 側に含める。
  jp.unemployment:
    publication_lag_days: 63
  # 設定時に利用できた履歴を踏まえた5年統計窓。現契約の提供期間とは別。
  jp.topix:
    percentile_window_years: 5
    statistic: yoy
  # 設定時の実配信起点が2022-04だったことを踏まえた3年窓。
  jp.foreign_flows:
    percentile_window_years: 3
  # yahoo が配信する東証グロース 250 の履歴が 2018-01 起点。
  jp.growth250:
    percentile_window_years: 5
    statistic: yoy
  # spglobal_pmi は manifest に載っている月だけを持ち、stream ごとに起点と欠落が
  # 異なる（PDF を 1 月ずつ人手で追記する運用のため）。窓は 4 stream で揃えて置き、
  # 窓を満たさない stream は insufficient_history として percentile を出さない。
  jp.pmi_manufacturing:
    percentile_window_years: 3
    statistic: level
    publication_lag_days: 31
    flags:
      - id: contraction
        comparison: below
        value: 50.0
  jp.pmi_services:
    percentile_window_years: 3
    statistic: level
    publication_lag_days: 31
    flags:
      - id: contraction
        comparison: below
        value: 50.0
  us.pmi_manufacturing:
    percentile_window_years: 3
    statistic: level
    publication_lag_days: 31
    flags:
      - id: contraction
        comparison: below
        value: 50.0
  us.pmi_services:
    percentile_window_years: 3
    statistic: level
    publication_lag_days: 31
    flags:
      - id: contraction
        comparison: below
        value: 50.0
  # ICE BofA OAS の FRED 配信範囲が直近 3 年。HY−IG spread は両者から導出するため
  # 同じ制約を受ける。
  credit.us_ig_oas:
    percentile_window_years: 3
  credit.us_hy_oas:
    percentile_window_years: 3
  credit.us_ccc_oas:
    percentile_window_years: 3
  credit.hy_ig_spread:
    percentile_window_years: 3
  # 教科書的な閾値の注記（水準の解釈は L3 の判断に委ねる）。
  us.10y_2y_spread:
    flags:
      - id: inverted
        comparison: below
        value: 0.0
  us.10y_3m_spread:
    flags:
      - id: inverted
        comparison: below
        value: 0.0
  us.erp:
    # 月次標本だが当月点は daily market input の最終日へ置換されるため、次回更新は
    # 翌営業日。外部 publisher の公表待ちは持たない。
    publication_cadence: business_daily
    publication_lag_days: 0
    staleness_margin_days: 6
    flags:
      - id: non_positive
        comparison: at_or_below
        value: 0.0
  jp.erp:
    flags:
      - id: non_positive
        comparison: at_or_below
        value: 0.0
  vix:
    flags:
      - id: stress
        comparison: at_or_above
        value: 30.0
  jp.real_10y_proxy:
    # 月次グリッドは CPI の公表で開くので、鮮度も CPI の暦で読む。
    publication_lag_days: 61
    flags:
      - id: negative
        comparison: below
        value: 0.0
  us.real_10y:
    flags:
      - id: negative
        comparison: below
        value: 0.0
  # 物価指数は基準年の水準でなく前年比の分布を比較する。水準が常に上がる前提ではない。
  jp.cgpi:
    statistic: yoy
  # 設定時のe-Stat掲載日測定（2025-01〜2026-07、issue #594）は観測月＋53〜61日。
  # press releaseでなく転載経路の掲載遅延を考慮した値で、将来の上限ではない。
  jp.cpi.core:
    statistic: yoy
    publication_lag_days: 61
  jp.cpi.core_yoy:
    publication_lag_days: 61
  jp.cpi.headline:
    statistic: yoy
    publication_lag_days: 61
  jp.cpi.services:
    statistic: yoy
    publication_lag_days: 61
  jp.export_price_index:
    statistic: yoy
  jp.import_price_index:
    statistic: yoy
  us.cpi.core:
    statistic: yoy
  us.cpi.headline:
    statistic: yoy
  us.pce.core:
    statistic: yoy
    # 月 M の値が M+1 末に届く。
    publication_lag_days: 57
  us.ppi:
    statistic: yoy
  # 数量指数と名目集計は、水準ではなく伸び率を比較する方針。
  # 景気動向指数「個別系列の数値」表から読む 3 系列。e-Stat 掲載は月 M の速報が
  # M+2 上旬（2025-12〜2026-07 の掲載日実測で観測月 + 65〜73 日）。統計そのものの
  # 公表元（METI・厚労省・内閣府 消費動向調査）より 1 か月遅い経路であることを
  # 込みで上端を置く。
  jp.industrial_production:
    statistic: yoy
    publication_lag_days: 73
  jp.job_openings_ratio:
    publication_lag_days: 73
  jp.consumer_confidence:
    publication_lag_days: 73
  # 内閣府 機械受注の e-Stat 掲載は月 M が M+2 中旬（2026-05 分は 2026-07-15）。
  jp.machinery_orders:
    statistic: yoy
    publication_lag_days: 76
  # 景気ウォッチャーは公表元が M+1 上旬だが、e-Stat 掲載はその 2 週間ほど後
  # （2026-06 分は 2026-07-23）。
  jp.watcher_current_di:
    publication_lag_days: 55
  jp.real_consumption:
    statistic: yoy
    # 日銀消費活動指数は M の値を M+2 の中旬に公表するため、平常時の齢は 106 日に達する。
    publication_lag_days: 75
  jp.real_exports:
    statistic: yoy
  us.core_capex_orders:
    statistic: yoy
    # 月末近くに公表されるため、月次 default より約 10 日遅い。
    publication_lag_days: 55
  us.industrial_production:
    statistic: yoy
  us.retail_sales:
    statistic: yoy
  # 雇用者数・賃金は前年比を比較する。減少しない前提ではない。
  # 求人・失業保険申請等の件数は、別の読取方針として水準を使う。
  jp.nominal_wage_index:
    statistic: yoy
    # L1は速報も属性付きで保持し、L2で読むのは毎月勤労統計の確報だけ。
    # 確報は月 M を M+2 下旬に公表する（e-Stat 掲載日の実測は観測日 +
    # 82〜84 日）。
    publication_lag_days: 85
  jp.real_wage_index:
    statistic: yoy
    # 名目と同じ毎月勤労統計の確報。
    publication_lag_days: 85
  us.average_hourly_earnings:
    statistic: yoy
    # 雇用統計は月 M の値が M+1 第1週に届く。
    publication_lag_days: 35
  us.nonfarm_payrolls:
    statistic: yoy
    publication_lag_days: 35
  us.unemployment:
    publication_lag_days: 35
  # 通貨集計と中央銀行バランスシート。名目の残高なので水準の percentile は政策の
  # 方向を示さず、拡大・縮小のペースが位置を持つ。TGA・ON RRP は残高がゼロ近傍まで
  # 往復するため前年比が発散し、水準の percentile が読める側なので level に残す。
  ecb.balance_sheet:
    statistic: yoy
  jp.monetary_base:
    statistic: yoy
    # 日銀の公表契約は翌月第2営業日。月初へ正規化した次期観測からの暦日近似は33日。
    # https://www.boj.or.jp/en/statistics/outline/exp/exbase.htm
    publication_lag_days: 33
  us.fed_assets:
    statistic: yoy
    # H.4.1 は水曜時点を原則木曜16:30に公表する。
    # https://www.federalreserve.gov/releases/h41/
    publication_lag_days: 1
  us.m2:
    statistic: yoy
    # 月 M の値が M+1 末に届く。
    publication_lag_days: 57
  us.reverse_repo:
    statistic: level
  us.tga:
    statistic: level
    # WTREGEN は水曜を期末とする週平均で、fed_assets の水曜時点残高とは別の量。
    publication_lag_days: 1
  # 保存した H.4.1 等の入力から読む都度計算する近似値。入力の基準時点は同一でない。
  us.net_liquidity:
    publication_lag_days: 1
  # 四半期初日へ正規化された観測は、次の四半期開始後およそ1か月で届く。
  jp.tankan_large_mfg_di:
    publication_lag_days: 30
  jp.tankan_large_nonmfg_di:
    publication_lag_days: 30
  us.sloos_ci_tightening:
    publication_lag_days: 35
  # 日銀 貸出・預金動向は月 M を M+1 の第 7 営業日前後に公表する。
  jp.bank_lending_yoy:
    publication_lag_days: 40
  # 地区連銀サーベイは当月分を当月中旬に出す（観測月の翌月まで待たない）。
  us.empire_manufacturing:
    publication_lag_days: 17
  us.philly_fed_manufacturing:
    publication_lag_days: 22
  # 株価指数は1年騰落率の分布を比較する方針。上昇継続や投資価値を保証しない。
  # PER・PBR・CAPE・ERPの比率系列とは比較対象を分ける。
  em.equity:
    statistic: yoy
  europe.stoxx:
    statistic: yoy
  jp.nikkei225:
    statistic: yoy
  us.dow:
    statistic: yoy
  us.nasdaq:
    statistic: yoy
  us.russell2000:
    statistic: yoy
  us.sox:
    statistic: yoy
  us.sp500:
    statistic: yoy
  world.acwi_ex_us:
    statistic: yoy
