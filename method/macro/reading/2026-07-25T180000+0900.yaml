# 過去の Reading 規則。数値・field・dated identity は履歴再現のため保持する。
# 現行の用語・取得・解釈は docs/reference/market-context.md に集約する。
# 公表日・鮮度は当時の近似規約であり、公式日程や欠測検知の保証ではない。

schema_version: 1

defaults:
  daily:
    percentile_window_years: 10
    short_trend_months: 3
    long_trend_months: 12
    staleness_warn_days: 7
  weekly:
    percentile_window_years: 10
    short_trend_months: 3
    long_trend_months: 12
    staleness_warn_days: 21
  monthly:
    percentile_window_years: 10
    short_trend_months: 3
    long_trend_months: 12
    staleness_warn_days: 100
  quarterly:
    percentile_window_years: 10
    short_trend_months: 6
    long_trend_months: 12
    staleness_warn_days: 220

overrides:
  usd_cny:
    staleness_warn_days: 12
  usd_index.broad:
    staleness_warn_days: 12
  jp.topix:
    percentile_window_years: 5
    statistic: yoy
  jp.foreign_flows:
    percentile_window_years: 3
  jp.growth250:
    percentile_window_years: 5
    statistic: yoy
  jp.pmi_manufacturing:
    percentile_window_years: 3
    flags:
      - id: contraction
        comparison: below
        value: 50.0
  jp.pmi_services:
    percentile_window_years: 3
    flags:
      - id: contraction
        comparison: below
        value: 50.0
  us.pmi_manufacturing:
    percentile_window_years: 3
    flags:
      - id: contraction
        comparison: below
        value: 50.0
  us.pmi_services:
    percentile_window_years: 3
    flags:
      - id: contraction
        comparison: below
        value: 50.0
  credit.us_ig_oas:
    percentile_window_years: 3
  credit.us_hy_oas:
    percentile_window_years: 3
  credit.us_ccc_oas:
    percentile_window_years: 3
  credit.hy_ig_spread:
    percentile_window_years: 3
  us.10y_2y_spread:
    flags:
      - id: inverted
        comparison: below
        value: 0.0
  us.10y_3m_spread:
    flags:
      - id: inverted
        comparison: below
        value: 0.0
  us.erp:
    flags:
      - id: non_positive
        comparison: at_or_below
        value: 0.0
  jp.erp:
    flags:
      - id: non_positive
        comparison: at_or_below
        value: 0.0
  vix:
    flags:
      - id: stress
        comparison: at_or_above
        value: 30.0
  jp.real_10y_proxy:
    flags:
      - id: negative
        comparison: below
        value: 0.0
  us.real_10y:
    flags:
      - id: negative
        comparison: below
        value: 0.0
  jp.cgpi:
    statistic: yoy
