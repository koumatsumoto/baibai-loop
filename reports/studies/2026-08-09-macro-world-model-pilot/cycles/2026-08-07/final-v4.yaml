synthesis:
  dominant_forces:
  - summary: 雇用の負のimpulseとcapex・claimsの強いlevelが競合し、所得主導の減速か投資主導の正常化かを分ける。
    source_ids:
    - article-bls-employment-july-2026
    - series-us-core-capex-orders
    - series-us-initial-claims
    - series-credit-us-hy-oas
    force_id: labor-capex-divergence
    title: Labor-capex divergence
    transmission: 雇用→所得→消費の負経路と、capex→生産・所得の正経路が0–12か月で競合する。
    core_section_ids:
    - growth_demand
    - liquidity_credit
    series_ids:
    - us.core_capex_orders
    - credit.us_hy_oas
    counter_evidence: claimsとaggregate HYは広い需要破断を否定し、payroll revisionsは単月noiseの可能性を残す。
    direction: mixed
    confidence: medium
  - summary: 日米の実質・名目金利極値とCCC stress、薄いERPが、cash-flow失望を大きなvaluation変化へ増幅する。
    source_ids:
    - series-us-real-10y
    - series-credit-us-ccc-oas
    - series-us-erp
    force_id: discount-rate-tail-asymmetry
    title: Discount-rate and tail-credit asymmetry
    transmission: 政策・国債金利→借換・tail信用→valuationの順で遅れて波及する。
    core_section_ids:
    - rates_policy
    - liquidity_credit
    - valuation
    series_ids:
    - us.real_10y
    - credit.us_ccc_oas
    - us.erp
    counter_evidence: net liquidity、aggregate HY、VIX、SOXは広いstressをまだ確認しない。
    direction: adverse
    confidence: high
  - summary: 日本の生産・貸出・賃金改善に対し、消費低下・倒産・弱い円がbreadthを制約する。
    source_ids:
    - series-jp-real-consumption
    - series-jp-bankruptcies
    - series-usd-jpy
    force_id: japan-breadth-test
    title: Japan domestic breadth test
    transmission: 円・輸入costと実質所得が家計消費へ、JGBと貸出が企業cash flowへ伝わる。
    core_section_ids:
    - fx
    - japan
    series_ids:
    - usd_jpy
    - jp.real_consumption
    counter_evidence: 生産、manufacturing PMI、銀行貸出、TOPIXは改善が既に広がり始めた可能性を示す。
    direction: mixed
    confidence: medium
  - summary: 中国産業と銅は需要を支える一方、energy・通商措置はinflationと実質所得の外生tailを残す。
    source_ids:
    - series-copper
    - series-brent
    - article-ustr-forced-labor-july-2026
    force_id: external-energy-trade-tail
    title: External energy and trade tail
    transmission: 中国需要は数量を、energy・tradeは価格とpolicy constraintを通じてgrowthへ逆方向に効く。
    core_section_ids:
    - growth_demand
    - inflation_costs
    series_ids:
    - copper
    - brent
    counter_evidence: Brentのrelease間低下とUSD/CNYの安定はshockが現時点の中心状態ではないことを示す。
    direction: mixed
    confidence: medium
  interactions:
  - summary: 雇用悪化がtail信用へ到達すると、cash-flow低下と高discount rateが同時にvaluationを圧縮する。
    source_ids:
    - article-bls-employment-july-2026
    - series-credit-us-ccc-oas
    - series-us-real-10y
    force_ids:
    - labor-capex-divergence
    - discount-rate-tail-asymmetry
  - summary: energy再燃と円安が重なる場合、日本の実質所得・倒産経路が同時に悪化し、国内breadth testを下方へ解く。
    source_ids:
    - series-brent
    - series-usd-jpy
    - series-jp-bankruptcies
    force_ids:
    - japan-breadth-test
    - external-energy-trade-tail
