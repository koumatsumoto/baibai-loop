schema_version: 4
kind: macro-context
context_id: macro-context-2026-08-07-labor-capex-divergence
as_of: '2026-08-07'
published_at: '2026-08-09T15:40:00+09:00'
summary: 米7月雇用は非農業部門雇用者数が2.3万人減、5–6月も計10.3万人下方修正されたが、失業保険申請・設備投資・SOX・日本の生産はまだ需要崩れを追認していない。中心像は『雇用とcapexの乖離』で、米実質10年2.4%台、JGB10年2.77%、CCC
  OAS10%台、日米ERPの薄さが遅行破断を非対称なtailにする。日本は実質賃金・生産・貸出の改善に対し消費低下と倒産1,021件がbreadthを制約し、Brent反落はenergy shockを中心線からtailへ下げる。
