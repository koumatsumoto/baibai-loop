schema_version: 1
as_of: "2026-08-07"
hypotheses:
  - hypothesis_id: capex-supported-normalization
    plausibility_rank: 1
    mechanism_summary: Investment and industrial resilience keep aggregate demand near trend while labor weakness prompts gradual policy relief, producing uneven normalization rather than recession.
    evidence_for: [series:us.core_capex_orders, series:us.sox, series:jp.industrial_production, series:jp.pmi_manufacturing, series:copper, source:fed-mpr-july-2026]
    evidence_against: [source:bls-employment-july-2026, series:us.real_10y, series:credit.us_ccc_oas]
    unexplained_residuals:
      - Why payroll revisions are so weak while claims remain near the bottom of their distribution.
      - Why the U.S. equity risk premium remains deeply compressed despite higher real rates.
    required_assumptions:
      - Capex remains funded and diffuses beyond the largest technology firms.
      - Energy and tariff shocks do not reaccelerate broad inflation.
    discriminating_signposts:
      - U.S. core-capex orders and manufacturing PMI remain expansionary as payroll growth stabilizes.
      - Japan real consumption turns up without a further rise in bankruptcies.
    invalidation:
      - Two consecutive broad labor releases combine falling payrolls, rising unemployment, and materially higher initial claims.
  - hypothesis_id: delayed-demand-break
    plausibility_rank: 2
    mechanism_summary: Restrictive real rates and weaker labor income overwhelm concentrated capex, widening lower-quality credit stress and pulling consumption and production below trend.
    evidence_for: [source:bls-employment-july-2026, series:us.real_10y, series:credit.us_ccc_oas, series:jp.bankruptcies, source:fed-sloos-april-2026]
    evidence_against: [series:us.initial_claims, series:us.core_capex_orders, series:credit.us_hy_oas, series:jp.bank_lending_yoy]
    unexplained_residuals:
      - Why aggregate high-yield spreads and initial claims remain benign.
      - Why copper, EM equities, and Japanese manufacturing remain firm.
    required_assumptions:
      - Payroll weakness transmits to income and spending before policy can offset it.
      - Valuation compression tightens financial conditions beyond the CCC segment.
    discriminating_signposts:
      - Initial claims rise above their recent range while services PMI and consumption weaken.
      - Aggregate high-yield OAS follows CCC OAS wider and core-capex orders roll over.
    invalidation:
      - Payrolls stabilize, claims remain low, and capex broadens over the next two release cycles.
  - hypothesis_id: energy-trade-inflation-squeeze
    plausibility_rank: 3
    mechanism_summary: An energy or trade-policy shock raises imported costs, limits monetary easing, weakens real household income, and creates a stagflationary squeeze across Japan, Europe, and the United States.
    evidence_for: [source:eia-steo-august-2026, source:ustr-forced-labor-july-2026, series:jp.terms_of_trade, series:us.pce.core]
    evidence_against: [series:brent, series:us.cpi.headline, series:ecb.policy_rate, series:jp.real_wage_index]
    unexplained_residuals:
      - Why Brent has fallen materially since its recent release point.
      - Why copper and risk assets remain firm if the shock is already binding.
    required_assumptions:
      - Supply disruption persists long enough to pass through to core prices.
      - Policy makers prioritize inflation control over weakening demand.
    discriminating_signposts:
      - Brent reverses higher and CPI breadth rises after trade measures take effect.
      - Japan terms of trade and real consumption deteriorate together.
    invalidation:
      - Energy prices remain contained and core inflation decelerates through two releases.
