schema_version: 1
as_of: "2026-08-07"
graph:
  nodes:
    - {node_id: us-labor-impulse, node_type: observed_state, label: U.S. labor impulse weakens}
    - {node_id: household-demand, node_type: real_outcome, label: Household demand growth}
    - {node_id: capex-cycle, node_type: observed_state, label: U.S. and global capex cycle}
    - {node_id: productivity-diffusion, node_type: latent_state, label: AI and equipment productivity diffusion}
    - {node_id: inflation-persistence, node_type: latent_state, label: Inflation persistence}
    - {node_id: fed-reaction, node_type: policy_reaction, label: Federal Reserve reaction}
    - {node_id: real-discount-rate, node_type: financial_outcome, label: Real discount rate}
    - {node_id: lower-quality-credit, node_type: financial_outcome, label: Lower-quality credit stress}
    - {node_id: japan-real-income, node_type: observed_state, label: Japan real household income}
    - {node_id: boj-jgb-path, node_type: policy_reaction, label: BOJ and JGB path}
    - {node_id: yen-import-cost, node_type: nominal_outcome, label: Yen import-cost pressure}
    - {node_id: china-industrial-demand, node_type: observed_state, label: China industrial demand}
    - {node_id: energy-trade-shock, node_type: exogenous_shock, label: Energy and trade-policy shock}
    - {node_id: portfolio-cashflows, node_type: real_outcome, label: Portfolio company cash flows and discount rates}
  edges:
    - edge_id: e-labor-demand
      from_node: us-labor-impulse
      to_node: household-demand
      relation_kind: externally_identified_empirical_relation
      claim_strength: supported
      sign: positive
      lag: {min_months: 0, max_months: 6}
      evidence_ids: [source:bls-employment-july-2026, series:us.unemployment]
      falsifiers: [{kind: series, name: U.S. real personal consumption expenditures}]
    - edge_id: e-capex-labor
      from_node: capex-cycle
      to_node: us-labor-impulse
      relation_kind: judgmental_hypothesis
      claim_strength: plausible
      sign: positive
      lag: {min_months: 3, max_months: 18}
      evidence_ids: [series:us.core_capex_orders, source:fed-mpr-july-2026]
      falsifiers: [{kind: release_event, name: U.S. Employment Situation and core-capital-goods orders}]
    - edge_id: e-capex-productivity
      from_node: capex-cycle
      to_node: productivity-diffusion
      relation_kind: model_based_relation
      claim_strength: plausible
      sign: positive
      lag: {min_months: 6, max_months: 24}
      evidence_ids: [series:us.sox, series:us.core_capex_orders]
      falsifiers: [{kind: release_event, name: BEA productivity and industry investment releases}]
    - edge_id: e-productivity-demand
      from_node: productivity-diffusion
      to_node: household-demand
      relation_kind: model_based_relation
      claim_strength: speculative
      sign: positive
      lag: {min_months: 12, max_months: 24}
      evidence_ids: [source:fed-mpr-july-2026]
      falsifiers: [{kind: series, name: U.S. nonfarm business labor productivity}]
    - edge_id: e-labor-fed
      from_node: us-labor-impulse
      to_node: fed-reaction
      relation_kind: institutional_rule
      claim_strength: supported
      sign: negative
      lag: {min_months: 0, max_months: 6}
      evidence_ids: [source:fed-fomc-july-2026, source:bls-employment-july-2026]
      falsifiers: [{kind: release_event, name: Federal Open Market Committee decision}]
    - edge_id: e-inflation-fed
      from_node: inflation-persistence
      to_node: fed-reaction
      relation_kind: institutional_rule
      claim_strength: supported
      sign: positive
      lag: {min_months: 0, max_months: 6}
      evidence_ids: [series:us.pce.core, source:fed-fomc-july-2026]
      falsifiers: [{kind: release_event, name: Federal Open Market Committee decision and Summary of Economic Projections}]
    - edge_id: e-fed-real-rate
      from_node: fed-reaction
      to_node: real-discount-rate
      relation_kind: market_implied_relation
      claim_strength: supported
      sign: positive
      lag: {min_months: 0, max_months: 12}
      evidence_ids: [series:us.fed_funds.lower, series:us.real_10y]
      falsifiers: [{kind: series, name: U.S. 10-year TIPS yield}]
    - edge_id: e-rate-credit
      from_node: real-discount-rate
      to_node: lower-quality-credit
      relation_kind: internal_observational_association
      claim_strength: plausible
      sign: positive
      lag: {min_months: 3, max_months: 18}
      evidence_ids: [series:us.real_10y, series:credit.us_ccc_oas]
      falsifiers: [{kind: series, name: ICE BofA CCC and Lower U.S. High Yield Index Option-Adjusted Spread}]
    - edge_id: e-energy-inflation
      from_node: energy-trade-shock
      to_node: inflation-persistence
      relation_kind: externally_identified_empirical_relation
      claim_strength: supported
      sign: positive
      lag: {min_months: 0, max_months: 12}
      evidence_ids: [series:brent, source:eia-steo-august-2026]
      falsifiers: [{kind: series, name: U.S. CPI energy and core CPI diffusion}]
    - edge_id: e-energy-yen-cost
      from_node: energy-trade-shock
      to_node: yen-import-cost
      relation_kind: accounting_identity
      claim_strength: identified
      sign: positive
      lag: {min_months: 0, max_months: 6}
      evidence_ids: [series:jp.terms_of_trade, series:usd_jpy]
      falsifiers: [{kind: series, name: Japan import price index in yen terms}]
    - edge_id: e-yen-real-income
      from_node: yen-import-cost
      to_node: japan-real-income
      relation_kind: externally_identified_empirical_relation
      claim_strength: plausible
      sign: negative
      lag: {min_months: 1, max_months: 12}
      evidence_ids: [series:jp.real_wage_index, source:japan-cpi-june-2026]
      falsifiers: [{kind: series, name: Japan real cash earnings and real household consumption}]
    - edge_id: e-boj-yen-cost
      from_node: boj-jgb-path
      to_node: yen-import-cost
      relation_kind: market_implied_relation
      claim_strength: plausible
      sign: negative
      lag: {min_months: 0, max_months: 12}
      evidence_ids: [series:jp.policy_path_gap, series:usd_jpy, source:boj-mpm-july-2026]
      falsifiers: [{kind: series, name: USDJPY and Japan-U.S. two-year yield differential}]
    - edge_id: e-china-capex
      from_node: china-industrial-demand
      to_node: capex-cycle
      relation_kind: internal_observational_association
      claim_strength: plausible
      sign: positive
      lag: {min_months: 0, max_months: 12}
      evidence_ids: [series:copper, source:china-industry-june-2026]
      falsifiers: [{kind: series, name: China manufacturing new orders PMI and copper inventories}]
    - edge_id: e-real-rate-portfolio
      from_node: real-discount-rate
      to_node: portfolio-cashflows
      relation_kind: accounting_identity
      claim_strength: identified
      sign: negative
      lag: {min_months: 0, max_months: 24}
      evidence_ids: [series:us.real_10y, series:jp.10y]
      falsifiers: [{kind: series, name: Portfolio valuation multiples versus real sovereign yields}]
    - edge_id: e-demand-portfolio
      from_node: household-demand
      to_node: portfolio-cashflows
      relation_kind: accounting_identity
      claim_strength: supported
      sign: positive
      lag: {min_months: 0, max_months: 12}
      evidence_ids: [series:jp.real_consumption, series:us.pmi_services]
      falsifiers: [{kind: release_event, name: Portfolio company revenue and order disclosures}]
key_judgments:
  - judgment_id: j-labor-capex-divergence
    summary: The central state is a labor-capex divergence, with a negative payroll impulse but intact claims, equipment orders, and technology investment.
    state_ids: [us-labor-demand, us-capex-financial]
    node_ids: [us-labor-impulse, capex-cycle, household-demand]
    edge_ids: [e-labor-demand, e-capex-labor]
    horizons: [now, 0_3m, 3_12m]
    counter_hypothesis_ids: [delayed-demand-break]
    evidence_ids: [source:bls-employment-july-2026, series:us.initial_claims, series:us.core_capex_orders]
  - judgment_id: j-discount-rate-asymmetry
    summary: Restrictive real rates have not broken aggregate risk assets, but the CCC tail and compressed equity risk premium make downside transmission asymmetric.
    state_ids: [us-capex-financial, us-inflation-policy]
    node_ids: [real-discount-rate, lower-quality-credit, portfolio-cashflows]
    edge_ids: [e-fed-real-rate, e-rate-credit, e-real-rate-portfolio]
    horizons: [now, 0_3m, 3_12m]
    counter_hypothesis_ids: [capex-supported-normalization]
    evidence_ids: [series:us.real_10y, series:credit.us_ccc_oas, series:us.erp]
  - judgment_id: j-japan-breadth-test
    summary: Japan's production and lending upswing is not yet a broad domestic-demand expansion because consumption is soft and bankruptcies are elevated.
    state_ids: [japan-domestic, japan-rates-fx]
    node_ids: [japan-real-income, boj-jgb-path, yen-import-cost]
    edge_ids: [e-yen-real-income, e-boj-yen-cost]
    horizons: [now, 0_3m, 3_12m, 12_24m]
    counter_hypothesis_ids: [delayed-demand-break, energy-trade-inflation-squeeze]
    evidence_ids: [series:jp.industrial_production, series:jp.real_consumption, series:jp.bankruptcies, series:jp.10y]
  - judgment_id: j-external-two-sided
    summary: China and copper support industrial demand, while energy and trade policy remain a two-sided inflation and real-income tail rather than the baseline.
    state_ids: [china-energy-external, euro-policy-energy]
    node_ids: [china-industrial-demand, energy-trade-shock, inflation-persistence]
    edge_ids: [e-china-capex, e-energy-inflation, e-energy-yen-cost]
    horizons: [now, 0_3m, 3_12m]
    counter_hypothesis_ids: [energy-trade-inflation-squeeze]
    evidence_ids: [series:copper, series:brent, source:ustr-forced-labor-july-2026, source:eia-steo-august-2026]
baseline_path:
  now:
    - U.S. payroll momentum turns negative, but claims and unemployment do not yet confirm a broad labor break.
    - Capex, copper, and Japanese production remain firm while real rates and tail credit stress stay restrictive.
  0_3m:
    - Growth slows unevenly; policy remains constrained until labor weakness broadens or inflation recedes.
    - Japan tests whether improving real wages and production reach household consumption.
  3_12m:
    - Gradual policy relief and capex diffusion support below-trend but positive activity in the central path.
    - Refinancing and lower-quality credit reveal the cumulative effect of high real discount rates.
  12_24m:
    - Productivity diffusion can broaden income and investment, but failure to diffuse leaves a lower-growth equilibrium.
    - Japan carries structurally higher nominal rates, making cash-flow durability more important for portfolio valuation.
scenarios:
  - scenario_id: capex-supported-normalization
    name: Capex-supported uneven normalization
    plausibility_rank: 1
    initial_shock: Payroll weakness prompts caution without an immediate claims or credit break.
    persistence: Labor softness lasts two to three quarters while investment remains positive.
    propagation_delta: Capex and industrial income partly offset slower household demand.
    policy_reaction: The Federal Reserve eases gradually as inflation permits; the BOJ normalizes cautiously.
    paths: {growth: below trend but positive, inflation: slowly lower, rates: gradual easing in the U.S. and gradual normalization in Japan, credit: aggregate spreads contained with CCC stress, fx: yen remains weak before partial recovery, balance_sheet: refinancing pressure remains selective}
    signposts: [U.S. claims stay contained, Core-capex orders remain positive, Japan real consumption turns upward]
    invalidation: [Payroll weakness broadens into claims and aggregate credit, Core capex contracts for two releases]
    known_omissions: [Geopolitical event probabilities, Company-specific earnings execution]
  - scenario_id: delayed-demand-break
    name: Delayed demand and credit break
    plausibility_rank: 2
    initial_shock: Weak payroll income and high real rates reduce consumption and hiring.
    persistence: Demand weakness persists through refinancing and inventory cycles.
    propagation_delta: CCC stress spreads to aggregate credit and investment cancellation.
    policy_reaction: The Federal Reserve eases faster after confirmation; the BOJ pauses normalization.
    paths: {growth: contracts or stalls, inflation: falls after a lag, rates: sovereign yields decline, credit: spreads widen materially, fx: dollar initially firm and yen path two-sided, balance_sheet: leverage and refinancing dominate}
    signposts: [Initial claims rise materially, Services PMI contracts, Aggregate high-yield OAS follows CCC wider]
    invalidation: [Employment stabilizes with capex breadth, Credit spreads remain contained through two releases]
    known_omissions: [Fiscal automatic stabilizer size, Bank-specific loss absorption]
  - scenario_id: energy-trade-inflation-squeeze
    name: Energy and trade inflation squeeze
    plausibility_rank: 3
    initial_shock: Persistent energy disruption or trade restrictions raise landed input costs.
    persistence: Cost pressure survives long enough to enter core prices and wage bargaining.
    propagation_delta: Real incomes weaken while policy relief is delayed, producing stagflationary pressure.
    policy_reaction: Central banks keep policy tighter than growth alone would imply; fiscal relief targets households.
    paths: {growth: weakens, inflation: reaccelerates, rates: front ends stay restrictive and curves steepen, credit: lower-quality spreads widen, fx: energy importers weaken, balance_sheet: working capital and input-cost burdens rise}
    signposts: [Brent reverses sharply higher, CPI breadth rises, Japan terms of trade and consumption fall together]
    invalidation: [Energy prices remain contained, Core inflation falls across two releases]
    known_omissions: [Exact disruption duration, Country-level tariff exemptions]
unresolved_tensions:
  - July payroll deterioration and large revisions conflict with low initial claims and stable unemployment.
  - Strong aggregate risk assets and narrow high-yield spreads conflict with extreme real rates, valuation, and CCC stress.
  - Japan production, lending, and equities conflict with soft consumption, weak real exchange rate, and elevated bankruptcies.
  - Copper and China industrial data conflict with slower GDP breadth and new trade-policy frictions.
signposts:
  - U.S. Employment Situation, weekly initial claims, and unemployment rate
  - U.S. core-capital-goods orders, manufacturing and services PMI, and CCC versus aggregate HY OAS
  - Japan real wages, household consumption, bankruptcies, BOJ decisions, JGB yields, and USDJPY
  - China manufacturing new orders, industrial production, USD/CNY, copper, and Brent
  - CPI and core PCE breadth after energy and trade-policy implementation
