schema_version: 1
materiality_rule_decision:
  release_change_threshold_pct: 5
  revision_window: latest_two_effective_releases
  rationale: >-
    Every release change remains in the scan. Candidate status is reserved for a change large
    enough to discriminate a central question; otherwise 121 of 122 series become candidates.
standing_coverage:
  - series_id: jp.10y
    block: japan_rates_valuation
  - series_id: jp.policy_rate
    block: japan_rates_valuation
  - series_id: jp.erp
    block: japan_rates_valuation
  - series_id: usd_jpy
    block: japan_fx_external
  - series_id: jp.real_effective_exchange_rate
    block: japan_fx_external
  - series_id: jp.terms_of_trade
    block: japan_fx_external
  - series_id: jp.real_wage_index
    block: japan_domestic_demand
  - series_id: jp.real_consumption
    block: japan_domestic_demand
  - series_id: jp.industrial_production
    block: japan_production
  - series_id: jp.topix
    block: japan_market
  - series_id: us.nonfarm_payrolls
    block: us_labor_demand
  - series_id: us.unemployment
    block: us_labor_demand
  - series_id: us.core_capex_orders
    block: us_ai_capex
  - series_id: us.sox
    block: us_ai_capex
  - series_id: us.10y
    block: us_rates_valuation
  - series_id: us.real_10y
    block: us_rates_valuation
  - series_id: us.erp
    block: us_rates_valuation
  - series_id: us.sp500_cape
    block: us_rates_valuation
  - series_id: credit.us_hy_oas
    block: us_credit
  - series_id: usd_cny
    block: china_proxy
  - series_id: copper
    block: china_proxy
  - series_id: em.equity
    block: china_proxy
  - series_id: brent
    block: energy
  - series_id: ecb.policy_rate
    block: euro_policy
analyst_additions:
  - series_id: credit.us_ccc_oas
    reason: Lower-quality credit can contradict benign aggregate HY spreads.
  - series_id: us.net_liquidity
    reason: Liquidity can separate valuation support from real-demand support.
  - series_id: positioning.jpy_noncomm_net
    reason: Crowded yen positioning can amplify an otherwise small rate differential shock.
  - series_id: jp.bank_lending_yoy
    reason: Bank lending tests whether higher policy rates are constraining domestic credit.
  - series_id: jp.bankruptcies
    reason: Bankruptcies test whether accommodative aggregate lending masks weak firms.
  - series_id: jp.pmi_manufacturing
    reason: Manufacturing breadth is material to the industrial and external-demand channel.
  - series_id: jp.policy_path_gap
    reason: Market-implied BOJ path is distinct from the current policy rate.
  - series_id: us.gdp_growth
    reason: Q2 growth anchors the level before the July labor impulse.
  - series_id: us.initial_claims
    reason: Weekly claims discriminate a payroll revision from a broad labor break.
  - series_id: us.cpi.core
    reason: CPI goods and shelter detail can contradict the PCE inflation path.
  - series_id: us.pce.core
    reason: Core PCE is the Federal Reserve reaction-function inflation anchor.
  - series_id: us.fed_funds.lower
    reason: The current policy stance anchors the US rates path.
  - series_id: us.pmi_manufacturing
    reason: Manufacturing breadth tests the capital-expenditure narrative.
  - series_id: us.pmi_services
    reason: Services breadth tests whether labor weakness is broad.
decisions:
  - series_id: aud_jpy
    status: excluded
    reason: USD/JPY and the real effective exchange rate more directly identify portfolio currency exposure.
  - series_id: brent
    status: selected
  - series_id: copper
    status: selected
  - series_id: credit.us_ccc_oas
    status: selected
  - series_id: de.10y
    status: excluded
    reason: ECB policy is the selected Euro coordinate; the German curve does not change a central portfolio question.
  - series_id: em.equity
    status: selected
  - series_id: eur_jpy
    status: excluded
    reason: USD/JPY and the real effective exchange rate provide the material yen channels without duplicating crosses.
  - series_id: europe.stoxx
    status: excluded
    reason: Euro equity performance is not a standing portfolio exposure and adds no distinct mechanism.
  - series_id: gold
    status: excluded
    reason: Gold is a market-price coordinate and does not discriminate the selected inflation or growth hypotheses.
  - series_id: gold_copper_ratio
    status: excluded
    reason: Copper and official China activity releases identify the proxy basket more directly.
  - series_id: jp.10y
    status: selected
  - series_id: jp.20y
    status: excluded
    reason: The 10-year yield is the preregistered discount-rate anchor; the 20-year point is redundant.
  - series_id: jp.2y
    status: excluded
    reason: The policy rate and policy-path gap identify the near-term BOJ path more directly.
  - series_id: jp.30y
    status: excluded
    reason: The 10-year yield is the preregistered discount-rate anchor; the 30-year point is redundant.
  - series_id: jp.5y
    status: excluded
    reason: The policy-path gap and 10-year yield bracket the relevant curve without another tenor.
  - series_id: jp.bank_lending_yoy
    status: selected
  - series_id: jp.bankruptcies
    status: selected
  - series_id: jp.consumer_confidence
    status: excluded
    reason: Real wages and real consumption provide harder household-demand evidence.
  - series_id: jp.cpi.core_yoy
    status: excluded
    reason: BOJ policy evidence and terms of trade are sufficient for the selected inflation transmission question.
  - series_id: jp.cpi.services
    status: excluded
    reason: The series adds inflation composition but does not change the selected policy and household paths.
  - series_id: jp.erp
    status: selected
  - series_id: jp.export_price_index
    status: excluded
    reason: Terms of trade and the real effective exchange rate capture the material external-price channel.
  - series_id: jp.foreign_flows
    status: excluded
    reason: Flow volatility is not needed to identify the portfolio's structural macro exposure.
  - series_id: jp.industrial_production
    status: selected
  - series_id: jp.job_openings_ratio
    status: excluded
    reason: Household income, consumption, and production are the selected Japan activity evidence.
  - series_id: jp.machinery_orders
    status: excluded
    reason: Industrial production and manufacturing PMI provide the selected production breadth evidence.
  - series_id: jp.monetary_base
    status: excluded
    reason: Policy rate, path gap, and bank lending identify transmission more directly than the monetary base.
  - series_id: jp.n225_iv_skew
    status: excluded
    reason: Option skew is a market risk coordinate and does not identify the economic mechanism.
  - series_id: jp.n225_iv_term
    status: excluded
    reason: Option term structure is a market risk coordinate and does not identify the economic mechanism.
  - series_id: jp.nikkei225
    status: excluded
    reason: TOPIX is the selected broad Japan market coordinate.
  - series_id: jp.nikkei_pbr
    status: excluded
    reason: ERP and the earnings-yield-minus-JGB calculation are the selected valuation anchors.
  - series_id: jp.nikkei_per
    status: excluded
    reason: ERP and the earnings-yield-minus-JGB calculation are the selected valuation anchors.
  - series_id: jp.nominal_wage_index
    status: excluded
    reason: Real wage is the standing household purchasing-power measure.
  - series_id: jp.pmi_manufacturing
    status: selected
  - series_id: jp.pmi_services
    status: excluded
    reason: Real consumption and wages identify domestic services demand with less survey overlap.
  - series_id: jp.policy_path_gap
    status: selected
  - series_id: jp.policy_rate
    status: selected
  - series_id: jp.real_10y_proxy
    status: excluded
    reason: Nominal JGB yield and BOJ policy path are the preregistered discount-rate evidence.
  - series_id: jp.real_consumption
    status: selected
  - series_id: jp.real_effective_exchange_rate
    status: selected
  - series_id: jp.real_wage_index
    status: selected
  - series_id: jp.tankan_large_mfg_di
    status: excluded
    reason: Manufacturing PMI and industrial production cover current breadth and realized output.
  - series_id: jp.tankan_large_nonmfg_di
    status: excluded
    reason: Real consumption and wages identify the domestic-demand channel more directly.
  - series_id: jp.unemployment
    status: excluded
    reason: Japan labor is not the event-specific shock and real wages are the material household channel.
  - series_id: jp.watcher_current_di
    status: excluded
    reason: Real consumption and wages provide the selected household-demand evidence.
  - series_id: natgas
    status: excluded
    reason: Brent is the selected globally transmitted energy price.
  - series_id: positioning.jpy_noncomm_net
    status: selected
  - series_id: positioning.ust10y_noncomm_net
    status: excluded
    reason: Rates and real rates identify the US discount path without adding positioning noise.
  - series_id: silver
    status: excluded
    reason: Silver does not discriminate the selected energy, inflation, or China mechanisms.
  - series_id: us.10y
    status: selected
  - series_id: us.10y_3m_spread
    status: excluded
    reason: Policy and real-rate levels are more direct for the reaction-function question.
  - series_id: us.30y
    status: excluded
    reason: The 10-year nominal and real yields are the selected US discount-rate anchors.
  - series_id: us.building_permits
    status: excluded
    reason: Housing is not a standing exposure and Q2 GDP supplies the aggregate demand level.
  - series_id: us.claims_4wk_ma
    status: excluded
    reason: Initial claims retain the observable weekly prints without duplicating the moving average.
  - series_id: us.consumer_sentiment
    status: excluded
    reason: GDP, PMIs, and labor releases provide observed demand and breadth rather than sentiment alone.
  - series_id: us.core_capex_orders
    status: selected
  - series_id: us.cpi.core
    status: selected
  - series_id: us.empire_manufacturing
    status: excluded
    reason: National manufacturing PMI is the selected breadth measure.
  - series_id: us.erp
    status: selected
  - series_id: us.fed_funds.lower
    status: selected
  - series_id: us.fed_funds.upper
    status: excluded
    reason: The lower bound plus the stated target range identify the same policy decision without duplicate series.
  - series_id: us.federal_deficit
    status: excluded
    reason: No new fiscal impulse is identified within the cycle cutoff.
  - series_id: us.gdp_growth
    status: selected
  - series_id: us.housing_starts
    status: excluded
    reason: Housing is not a standing exposure and Q2 GDP supplies the aggregate demand level.
  - series_id: us.industrial_production
    status: excluded
    reason: National manufacturing PMI and core capital-goods orders target the relevant production channel.
  - series_id: us.initial_claims
    status: selected
  - series_id: us.jolts_openings
    status: excluded
    reason: The July employment release and weekly claims are more current for the event-specific question.
  - series_id: us.m2
    status: excluded
    reason: Net liquidity and policy rates identify financial conditions more directly.
  - series_id: us.move
    status: excluded
    reason: Bond volatility does not identify the economic state or policy reaction by itself.
  - series_id: us.net_liquidity
    status: selected
  - series_id: us.nfci
    status: excluded
    reason: Credit spreads, policy rates, and net liquidity provide decomposable financial-condition evidence.
  - series_id: us.nonfarm_payrolls
    status: selected
  - series_id: us.pce.core
    status: selected
  - series_id: us.philly_fed_manufacturing
    status: excluded
    reason: National manufacturing PMI is the selected breadth measure.
  - series_id: us.pmi_manufacturing
    status: selected
  - series_id: us.pmi_services
    status: selected
  - series_id: us.ppi
    status: excluded
    reason: Core CPI, core PCE, and energy prices cover the material inflation channels.
  - series_id: us.real_10y
    status: selected
  - series_id: us.reverse_repo
    status: excluded
    reason: Net liquidity is the selected aggregate liquidity coordinate.
  - series_id: us.sloos_ci_tightening
    status: excluded
    reason: The latest official survey predates the cycle; current credit spreads are used with this lag noted externally.
  - series_id: us.sox
    status: selected
  - series_id: us.sp500_cape
    status: selected
  - series_id: usd_index.broad
    status: excluded
    reason: USD/JPY and USD/CNY are the material portfolio and China-proxy crosses.
  - series_id: usd_jpy
    status: selected
  - series_id: wti
    status: excluded
    reason: Brent is the selected global energy benchmark and avoids duplicate oil-price signals.
