packs:
  - pack_id: us-labor-demand
    block: U.S. labor and household demand
    evidence_for:
      - series:us.initial_claims
      - series:us.unemployment
      - source:fed-mpr-july-2026
    evidence_against:
      - series:us.nonfarm_payrolls
      - series:us.gdp_growth
      - source:bls-employment-july-2026
      - source:bea-gdp-q2-2026
    open_questions:
      - Whether the July payroll decline and downward revisions mark a regime change or measurement noise before claims and unemployment deteriorate.
  - pack_id: us-capex-financial
    block: U.S. capex, inflation, policy, and financial conditions
    evidence_for:
      - series:us.core_capex_orders
      - series:us.pmi_manufacturing
      - series:us.pmi_services
      - series:us.sox
      - series:us.net_liquidity
      - series:credit.us_hy_oas
      - source:fed-fomc-july-2026
    evidence_against:
      - series:us.10y
      - series:us.real_10y
      - series:us.erp
      - series:us.sp500_cape
      - series:credit.us_ccc_oas
      - series:us.cpi.core
      - series:us.cpi.headline
      - series:us.pce.core
      - series:us.fed_funds.lower
      - source:bea-pio-june-2026
      - source:fed-sloos-april-2026
    open_questions:
      - Whether AI and equipment investment can remain broad enough to offset weaker labor income under high real discount rates.
  - pack_id: japan-domestic-policy
    block: Japan domestic cycle, rates, and currency
    evidence_for:
      - series:jp.industrial_production
      - series:jp.pmi_manufacturing
      - series:jp.bank_lending_yoy
      - series:jp.real_wage_index
      - series:jp.topix
      - source:meti-iip-june-2026
      - source:boj-mpm-july-2026
    evidence_against:
      - series:jp.real_consumption
      - series:jp.bankruptcies
      - series:jp.10y
      - series:jp.erp
      - series:jp.policy_rate
      - series:jp.policy_path_gap
      - series:jp.real_effective_exchange_rate
      - series:jp.terms_of_trade
      - series:usd_jpy
      - series:positioning.jpy_noncomm_net
      - source:japan-household-june-2026
      - source:japan-cpi-june-2026
    open_questions:
      - Whether real-income repair reaches consumption before funding costs and bankruptcies broaden.
  - pack_id: china-energy-trade
    block: China demand, energy, and trade-policy transmission
    evidence_for:
      - series:copper
      - series:em.equity
      - series:usd_cny
      - source:china-gdp-h1-2026
      - source:china-pmi-june-2026
      - source:china-industry-june-2026
    evidence_against:
      - series:brent
      - source:eia-steo-august-2026
      - source:ustr-forced-labor-july-2026
      - source:boj-energy-outlook-2026
    open_questions:
      - Whether firm metals and EM prices represent durable final demand or inventory and policy support vulnerable to trade restrictions.
  - pack_id: euro-policy-energy
    block: Euro-area policy and energy sensitivity
    evidence_for:
      - series:ecb.policy_rate
      - source:ecb-july-2026
    evidence_against:
      - series:brent
      - source:eia-steo-august-2026
    open_questions:
      - Whether lower policy restriction can offset an externally driven energy-price shock.
