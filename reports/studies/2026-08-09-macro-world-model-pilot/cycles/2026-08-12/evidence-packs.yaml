packs:
  - pack_id: pack-japan-policy-and-rates
    block: japan_policy_and_rates
    evidence_for:
      - series:jp.policy_rate
      - series:jp.policy_path_gap
      - series:jp.2y
      - series:jp.5y
      - series:jp.10y
      - series:jp.20y
      - series:jp.30y
      - series:jp.real_10y_proxy
      - series:jp.monetary_base
      - ext:boj-statements-2026
      - ext:boj-call-market
      - ext:mof-jgb-rates
    evidence_against:
      - series:jp.cpi.core_yoy
      - series:jp.bank_lending_yoy
      - ext:boj-mpm-schedule
    open_questions:
      - 実効コールレート 0.977% と 2 年 1.618% の 64bp のギャップは、追加利上げの織り込みなのか、国債需給と財政プレミアムの上乗せなのか、この cycle の観測だけでは分離できない。
      - 銀行貸出が前年比 5.9% で伸びている状態は、金融引き締めの伝達が遅れているのか、名目成長の反映なのかを識別する系列を持たない。
      - 政策金利の水準に対して マネタリーベースが前年比 -13.8% と極端に縮んでおり、量と金利のどちらが実体へ効いているかを分けられない。
  - pack_id: pack-japan-prices-and-costs
    block: japan_prices_and_costs
    evidence_for:
      - series:jp.import_price_index
      - series:jp.export_price_index
      - series:jp.cgpi
      - series:jp.terms_of_trade
    evidence_against:
      - series:jp.cpi.core_yoy
      - series:jp.cpi.services
    open_questions:
      - 輸入物価 前年比 +29.7% と 企業物価 +7.1% に対して 消費者物価コアが +1.5% にとどまる差は、転嫁の遅れなのか、政府のエネルギー負担軽減策による見かけの抑制なのかを分離できない。
      - 交易条件が 19.5 パーセンタイルまで悪化した状態が、企業のどの階層で吸収されているかを直接観測する系列がない。
  - pack_id: pack-japan-labor-and-domestic-demand
    block: japan_labor_and_domestic_demand
    evidence_for:
      - series:jp.real_wage_index
      - series:jp.nominal_wage_index
      - series:jp.unemployment
      - series:jp.real_consumption
      - series:jp.industrial_production
      - series:jp.machinery_orders
      - series:jp.pmi_manufacturing
      - series:jp.tankan_large_mfg_di
      - series:jp.tankan_large_nonmfg_di
      - series:jp.real_exports
      - ext:esri-machinery-orders
      - ext:esri-gdp-schedule
      - ext:esri-gdp-archive-2026
    evidence_against:
      - series:jp.pmi_services
      - series:jp.consumer_confidence
      - series:jp.job_openings_ratio
      - series:jp.bankruptcies
    open_questions:
      - 実質賃金が前年比 +1.8%（95.7 パーセンタイル）である一方で 消費者態度指数が 27.1 パーセンタイルにとどまる乖離は、賃金の分布（大企業と中小の差）を観測できないため説明を確定できない。
      - 倒産件数 1,028 件が上場企業の需要にどこまで波及するかは、規模別の倒産分布を機械系列として持たないため測れない。
      - 4-6 月期 GDP 1 次速報が 2026-08-17 に出るまで、四半期の需要水準は月次系列の合成でしか読めない。
  - pack_id: pack-japan-external-and-currency
    block: japan_external_and_currency
    evidence_for:
      - series:usd_jpy
      - series:eur_jpy
      - series:aud_jpy
      - series:jp.real_effective_exchange_rate
      - series:usd_index.broad
      - ext:mof-feio-monthly
    evidence_against:
      - series:rate_diff.us_jp_10y
      - series:positioning.jpy_noncomm_net
    open_questions:
      - 2026-07-28 の 163.913 から 2026-08-03 の 156.680 への 7.233 円の円高が、当局の介入によるものか市場要因かは、財務省の月次公表が 2026-07-29 までしか及ばないため一次情報で確定できない。
      - 金利差が 12 か月で 87bp 縮小したのに円が 10.7 円弱くなった差は、資本収支のフロー（対外直接投資・家計の外貨投資）を機械系列として持たないため残差のままである。
  - pack_id: pack-japan-equity-and-flows
    block: japan_equity_and_flows
    evidence_for:
      - series:jp.nikkei225
      - series:jp.nikkei_per
      - series:jp.nikkei_pbr
    evidence_against:
      - series:jp.erp
      - series:jp.foreign_flows
      - series:jp.n225_iv_30d
      - series:jp.n225_iv_skew
      - series:jp.n225_iv_term
    open_questions:
      - 日経平均が前年比 +60% でありながら 海外投資家が週次で 4,903 億円の売り越しに転じている差は、誰が買っているか（自社株買い・事業法人・個人）を機械系列で持たないため帰属できない。
      - 日本株 IV が 93.2 パーセンタイルなのに スキューが 3.4 パーセンタイルという組は、下落を恐れていない大きな変動の織り込みを意味するが、その変動の向きを識別する観測がない。
  - pack_id: pack-united-states-demand-and-prices
    block: united_states_demand_and_prices
    evidence_for:
