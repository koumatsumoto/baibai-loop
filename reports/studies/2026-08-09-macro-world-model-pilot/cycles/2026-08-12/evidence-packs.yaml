      - 2 年 4.25% と FF 中点 3.625% の 62.5bp のギャップが、利上げ確率の織り込みなのか期間プレミアムなのかを、この cycle の系列では分離できない。
      - 株式益回りが 10 年金利を 136bp 下回る状態が持続する条件は、成長期待の水準を直接観測できないため反証系列を持たない。
  - pack_id: pack-global-liquidity-credit-and-commodities
