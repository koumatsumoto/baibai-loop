      - series:usd_cny
      - series:de.10y
      - series:ecb.policy_rate
      - ext:frb-sloos-202607
      - ext:frb-h41-20260806
      - ext:ecb-mp-20260723
    evidence_against:
      - series:credit.us_ccc_oas
      - series:us.move
      - series:gold
      - series:silver
      - series:wti
      - series:brent
      - ext:eia-steo-202608
    open_questions:
      - CCC スプレッドが 96.4 パーセンタイルなのに HY 全体が 8.9 パーセンタイルという組は、最低格付け層に限った信用イベントか、指数構成の変化かを識別できない。
      - 銅が 100 パーセンタイルにある一方で 中国の直接系列を 1 本しか持たないため、実需と在庫・投機のどちらが価格を作っているかは proxy でしか読めない。
      - EIA が 2027 年の Brent を 69 ドルへ下げる前提はホルムズ海峡の通航制約の解消であり、その解消時期を観測する系列を持たない。
