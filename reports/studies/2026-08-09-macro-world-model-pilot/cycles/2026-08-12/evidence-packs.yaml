      - series:us.unemployment
      - series:us.consumer_sentiment
      - series:us.gdp_growth
      - series:us.average_hourly_earnings
      - series:us.cpi.core
      - series:us.cpi.headline
      - series:us.pce.core
      - series:us.ppi
      - series:us.inflation_5y5y
      - series:us.breakeven_10y
    open_questions:
      - 新規失業保険が 2.3 パーセンタイル（極端に少ない）である一方で 雇用者数の前年比が 14.3 パーセンタイルまで落ちた組は、解雇なき採用停止を示すが、この状態がいつまで安定でいられるかを測る系列がない。
      - 7 月の米消費者物価は本 cycle の cutoff 後（2026-08-12 米東部時間 08:30）に公表されるため、直近の物価は 6 月分までしか読めない。
      - 設備投資受注 前年比 +12.9% がデータセンター投資にどれだけ集中しているかは、Beige Book の質的記述以上に分解できない。
