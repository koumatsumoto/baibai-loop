synthesis:
  dominant_forces:
  - force_id: real-rate-regime-shift
    title: 実質割引率のレジーム転換
    summary: 日米独の実質・名目長期金利が同時に歴史的上端へ移り、株式の相対価値がどの国でも薄くなっている。 米実質 10 年 2.43%（99.5 パーセンタイル）、米 30 年 5.25%（100）、独 10 年 2.97%（98.3）。
      米株式リスクプレミアムは -1.36%（0.8）で非正、CAPE は 42.24（100）。
    transmission: 政策金利の据え置きと財政拡張が期間プレミアムを押し上げ、実質金利の上昇が株式の割引率へ直接入る。 10 年国債の投機ネットは -979,243 枚（1.5 パーセンタイル）で、金利上昇の持続を市場が資金で表明している。
      高い実質金利は 6-18 か月の遅れで住宅と設備投資へ効くため、現在の投資の強さは将来の減速を否定しない。
    counter_evidence: 資金条件は緩和側にある。NFCI は -0.529（36.9 パーセンタイル）、HY スプレッドは 2.70%（8.9）、 SLOOS の C&I 厳格化ネットは 0.0% で 12 か月前の 9.5pt
      から解消した。割引率の上昇が金融の逼迫を 伴っていないため、レジーム転換の資産価格への伝達は今のところ valuation 面に限られる。
    core_section_ids:
    - rates_policy
    - valuation
    - liquidity_credit
    series_ids:
    - us.real_10y
    - us.erp
    - positioning.ust10y_noncomm_net
    source_ids:
    - series-us-real-10y
    - series-us-erp
    - series-positioning-ust10y-noncomm-net
    - article-fomc-20260729
    - article-frb-h15-20260811
    direction: adverse
    confidence: high
  - force_id: yen-outflow-residual
    title: 金利差で説明されない円の残差
    summary: USD/JPY は 159.203（97.0 パーセンタイル）で、7/28 の 163.913 から 8/3 の 156.680 まで 7.233 円 円高になった後 6 営業日で 2.523 円（34.9%）戻した。米日
      10 年金利差は 1.905%（29.7 パーセンタイル、 12 か月 -87bp）、円ネットショートは -45,473 枚（54.7）で、いずれも円安を説明しない。
    transmission: 円の水準は輸入物価（前年比 +29.7%）を通じて費用へ入り、交易条件 0.827（19.5 パーセンタイル）として 国内へ配分される。転嫁できない層では資金繰りに現れ、倒産は 1,028 件（100 パーセンタイル）に達した。
      同じ円安が外貨建て利益の円換算では利益を押し上げるため、費用と収益の符号が国内で逆になる。
    counter_evidence: 日本の政策経路ギャップは 0.634%（97.9 パーセンタイル）で、市場は追加利上げを織り込んでいる。 金利差が縮小し利上げ期待が強い状態は、本来なら円高方向に働く。実質輸出は前年比 -0.29%
      と数量では 伸びておらず、円安が輸出数量を通じて需要を作っているという説明も成立しない。
    core_section_ids:
    - fx
    - inflation_costs
    - japan
    series_ids:
    - usd_jpy
    - jp.import_price_index
    - jp.bankruptcies
    source_ids:
    - series-usd-jpy
    - series-jp-import-price-index
    - series-jp-bankruptcies
    - article-mof-feio-monthly
    direction: adverse
    confidence: medium
  - force_id: us-hiring-freeze-with-capex
    title: 解雇なき採用停止と設備投資の併存
    summary: 米国の新規失業保険は 199,000 件（2.3 パーセンタイル）と歴史的に少ないまま、雇用者数の前年比は +0.2%（14.3）へ落ち、5 月・6 月は合計 103,000 人の下方改定を受けた。同時にコア資本財受注は
      前年比 +12.9%（94.9）、Philadelphia 連銀は 41.4（98.3）である。
    transmission: 採用の停止は所得の伸びを削るが解雇を伴わないため、消費は緩やかにしか落ちない。企業側は労働では なく資本で生産能力を積んでおり、Beige Book は 12 地区中 11 地区の緩やかな拡大とデータセンター・
      機械・防衛の牽引を報告している。銀行の C&I 基準は不変で大中堅企業の需要は強まっており、投資は 資金制約を受けていない。物価が 2% へ収束しないため、政策は労働の減速に反応できない。
    counter_evidence: 米消費者態度指数は 55.2（10.9 パーセンタイル）と低位で、3 か月では +10.4pt 反発している。所得の 弱さが家計心理へ一方向に効いているとは言えない。SLOOS では住宅ローンと自動車ローンの需要が
      弱まっており、家計側の需要縮小は信用面では既に始まっている。
    core_section_ids:
    - growth_demand
    - rates_policy
    - liquidity_credit
    series_ids:
    - us.nonfarm_payrolls
    - us.policy_path_gap
    - us.sloos_ci_tightening
    source_ids:
    - series-us-nonfarm-payrolls
    - series-us-policy-path-gap
    - series-us-sloos-ci-tightening
    - article-frb-beigebook-202607
    - article-frb-sloos-202607
    direction: mixed
    confidence: medium
  - force_id: japan-discount-rate-squeeze
    title: 日本の正常化が作る割引率の挟撃
    summary: 日本国債は 2 年 1.618%（100 パーセンタイル）から 30 年 3.957%（99.4）まで全年限が上端にあり、 政策経路ギャップ 0.634%（97.9）が追加利上げの織り込みを示す。株式リスクプレミアムは
      2.96% （5.1 パーセンタイル）まで圧縮し、PBR は 1.91（99.3）である。
    transmission: 株式リスクプレミアムは定義上 益回り − 10 年国債利回りなので、10 年が 2.815% から 3.0% へ進むと 利益が一定なら 19bp 削られる。同時に貸出金利の上昇は銀行貸出（前年比 +5.9%、94.1
      パーセンタイル）を 通じて企業の資金コストへ入り、マネタリーベースは前年比 -13.8%（0.8）で量的にも締まっている。 価格の維持は利益成長に依存する。
    counter_evidence: 日経平均の PER は 3 か月で 17.48 へ 2.77 低下しており、価格上昇を上回る速度で利益が伸びている。 消費者物価コアは 1.6%（60.2 パーセンタイル）にとどまり、日銀が正常化を急ぐ根拠は物価側では
      まだ強くない。この 2 点は、割引率の上昇が利益で相殺され続ける可能性を残す。
    core_section_ids:
    - rates_policy
    - valuation
    - japan
    series_ids:
    - jp.10y
    - jp.erp
    - jp.bank_lending_yoy
    source_ids:
    - series-jp-10y
    - series-jp-erp
    - series-jp-bank-lending-yoy
    - article-boj-statements-2026
    direction: adverse
    confidence: high
  interactions:
  - force_ids:
    - real-rate-regime-shift
    - japan-discount-rate-squeeze
    summary: 世界の実質金利上昇と日本固有の正常化が同時に効くと、日本株のリスクプレミアムは外から（世界の 割引率）と内から（JGB 利回り）の両方で圧縮される。5.1 パーセンタイルという薄さは、どちらか一方が 戻っても解消しない水準にある。
