    summary: 円安が外貨建て利益の円換算を押し上げる一方で正常化が割引率を上げるため、同じ企業の評価に逆向きの 力が同時にかかる。円が反転すると換算益が剥落し、そのとき割引率だけが高いまま残るのが最も痛い 組み合わせである。
