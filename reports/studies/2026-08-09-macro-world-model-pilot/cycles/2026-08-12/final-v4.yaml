context_id: macro-context-2026-08-12-yen-retracement-real-rate-squeeze
as_of: '2026-08-12'
published_at: '2026-08-12T21:28:15+09:00'
summary: 中心像は『介入の戻りと割引率の挟撃』。当局介入で 7/28 の 163.913 から 8/3 の 156.680 まで 7.233 円 （4.4%）円高になった USD/JPY は、6 営業日で 159.203 へ 2.523
  円（34.9%）戻した。米日 10 年金利差は 12 か月で 87bp 縮んで 1.905%（29.7 パーセンタイル）、円ショートも -45,473 枚（54.7）と極端でないため、 戻りの駆動は金利でも投機でもない残差である。同時に日米独の実質割引率が上端に張り付き（米実質
  10 年 2.43%、日 10 年 2.815%、独 10 年 2.97%）、日本株のリスクプレミアムは 2.96%（5.1 パーセンタイル）まで 圧縮した。日経平均は前年比 +60.1% だが PER は 3 か月で 2.77 低下しており、価格は割引率でなく利益の伸びに
  乗っている。米国は解雇なき採用停止（新規失業保険 199,000 件 = 2.3 パーセンタイル、雇用者数 前年比 +0.2%）と設備投資 +12.9% が併存し、政策は物価側に縛られたまま 7/29 会合で 3 名が利上げ反対票を投じた。
  日本では倒産が 2 か月連続 1,000 件超（7 月 1,028 件、100 パーセンタイル）で、円安のコストが中小・ サービスへ、便益が外貨建て利益の円換算へ非対称に配分されている。
