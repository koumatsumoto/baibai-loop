schema_version: 1
as_of: "2026-08-12"

baseline_path:
  now:
    - 日米独の実質割引率が同時に歴史的上端にある。米実質 10 年 2.43%（99.5 パーセンタイル）、日 10 年 2.815%（99.8）、独 10 年 2.97%（98.3）。
    - 日本の株式リスクプレミアムは 2.96%（5.1 パーセンタイル）まで圧縮し、米国は -1.36%（0.8）で非正のまま。価格の上昇は割引率ではなく利益の伸びに依存している。
    - 円は 159.203（97.0 パーセンタイル）。7/28 の 163.913 から 8/3 の 156.680 へ 7.233 円円高となった後、6 営業日で 2.523 円（34.9%）戻した。
    - 米国は解雇なき採用停止。新規失業保険 199,000 件（2.3 パーセンタイル）と 雇用者数 前年比 +0.2%（14.3）が併存し、設備投資受注は +12.9%（94.9）。
    - 日本は上流物価と下流物価の乖離が大きい。輸入物価 +29.7% に対しコア CPI +1.6%。倒産は 1,028 件（100 パーセンタイル）で人手不足と価格上昇が主因。
  0_3m:
    - 政策はどちらの中銀も据え置きが基本線。BOJ の次回会合は 9/17-18、その前に 8/17 の 4-6 月期 GDP 1 次速報が入る。
    - 円は 155-165 円。介入効果の減衰が続けば 8 月末までに介入前水準へ復帰する経路が中心。
    - 日本の株式リスクプレミアムは 2.5-3.5%。10 年が 3.0% を超えると 2% 台前半へ再圧縮する。
    - 米国は雇用者数の伸びが月 0-50,000 人。物価は 7 月分の公表で方向が更新される。
    - エネルギーは EIA の 2026 年平均 87 ドル前後。ホルムズ海峡の制約が解けない限り下値は限定的。
  3_12m:
    - BOJ が追加利上げを 1 回入れる経路が中心。実効コールは 1.2% 台、10 年は 3% 近傍。
    - 日本のコア物価は 2026 年度後半に 2% を明確に上回るかが分岐点。上回れば正常化は続き、下回れば止まる。
    - 円は追加利上げが入れば 150 円台、入らなければ 165 円超の再試行。
    - 米国は潜在成長を下回る 1-2% の成長。利下げは物価が 2% へ収束した場合に限られる。
    - エネルギーは供給正常化が進めば低下し、実質所得を改善させる。
  12_24m:
    - 名目 10 年は米 4.5-5.5%、日 3% 台前半が新しい基準線になる。
    - 日本の政策金利は 1.25-1.50%。1990 年代以来の水準が定着する。
    - 人手不足が価格転嫁力のある企業とない企業を選別し、内需は総量より構成が変わる。
    - 株式は割引率の高い環境で、資本効率の改善が続く企業だけが現在のバリュエーションを維持する。
    - 実質実効為替の 0.8 パーセンタイルという割安の是正は、起きるとしても緩やかである。

key_judgments:
  - judgment_id: kj-intervention-decay
    summary: >-
      当局の為替操作は水準を段差的に動かすが、円の向きは変えていない。7/28 の 163.913 から 8/3 の
      156.680 までの 7.233 円（4.4%）の円高に対し、続く 6 営業日で 2.523 円（34.9%）が戻った。1 営業日
      あたり 0.42 円の戻りが続けば、8 月末までに操作前の水準へ復帰する。金利差は 12 か月で 87bp 縮小し、
      投機ポジションも 54.7 パーセンタイルと極端でないため、戻りの駆動は金利でも投機でもない残差である。
    state_ids:
      - japan_external_currency
    node_ids:
      - n-official-fx-intervention
      - n-yen-external-value
      - n-japan-cross-border-capital-outflow
    edge_ids:
      - e14
      - e15
      - e16
    horizons:
      - now
      - 0_3m
    counter_hypothesis_ids:
      - h-real-rate-regime-shift
    evidence_ids:
      - series:usd_jpy
      - series:rate_diff.us_jp_10y
      - series:positioning.jpy_noncomm_net
      - series:jp.real_effective_exchange_rate
      - ext:mof-feio-monthly
  - judgment_id: kj-discount-rate-compression
    summary: >-
      日本株の価格上昇は割引率の低下ではなく利益の伸びに依存している。日経平均は前年比 +60.1% だが、
      3 か月で PER は 17.48 へ 2.77 低下しており、価格を上回る速度で利益が伸びている。その一方で
      株式リスクプレミアムは 2.96%（5.1 パーセンタイル）まで圧縮し、10 年国債が 3.0% へ進むと定義上
      さらに 19bp 削られる。PBR 1.91（99.3 パーセンタイル）はこの薄いプレミアムの上に載っている。
    state_ids:
      - japan_equity_flows
      - japan_policy_rates
    node_ids:
      - n-jgb-term-structure
      - n-japan-equity-risk-premium
      - n-global-real-rate-level
    edge_ids:
      - e02
      - e04
      - e13
    horizons:
      - now
      - 0_3m
      - 3_12m
    counter_hypothesis_ids:
      - h-structural-yen-outflow
    evidence_ids:
      - series:jp.erp
      - series:jp.10y
      - series:jp.nikkei_per
      - series:jp.nikkei_pbr
      - series:us.real_10y
      - series:jp.foreign_flows
  - judgment_id: kj-us-hiring-freeze
    summary: >-
      米国の労働は解雇ではなく採用の停止で減速している。新規失業保険は 199,000 件（2.3 パーセンタイル）
      と歴史的に少ないまま、雇用者数の前年比は +0.2%（14.3）へ落ち、5 月・6 月は合計 103,000 人の下方
      改定を受けた。同時に設備投資受注は前年比 +12.9%（94.9）で、Beige Book は 12 地区中 11 地区の緩やかな
      拡大とデータセンター・機械・防衛の牽引を報告している。この非対称のため、政策は物価側に縛られ、
      7/29 の会合では 3 名が利上げを求めて反対した。緩和余地は現時点で開いていない。
    state_ids:
      - united_states_demand_prices
      - united_states_policy_valuation
    node_ids:
      - n-us-hiring-rate
      - n-us-capital-expenditure
      - n-us-policy-rate-path
    edge_ids:
      - e01
      - e22
      - e23
    horizons:
      - now
      - 0_3m
      - 3_12m
    counter_hypothesis_ids:
      - h-supply-constraint-persistence
    evidence_ids:
      - series:us.nonfarm_payrolls
      - series:us.initial_claims
      - series:us.core_capex_orders
      - series:us.policy_path_gap
      - ext:fomc-20260729
      - ext:frb-beigebook-202607
  - judgment_id: kj-asymmetric-yen-cost
    summary: >-
      円安の効果は日本国内で非対称に配分されている。外貨建て利益を持つ企業には換算益として現れ、
      輸入コストを価格へ転嫁できない層には資金繰りとして現れる。輸入物価は前年比 +29.7%、交易条件は
      19.5 パーセンタイルで、倒産は 1,028 件（100 パーセンタイル、12 か月 +223 件）に達した。この非対称は
      正常化の速度制約になる。物価が上がっているのに内需が耐えられない状態では、政策は物価ではなく
      内需で止まる。
    state_ids:
      - japan_prices_costs
      - japan_labor_domestic_demand
    node_ids:
      - n-japan-imported-cost
      - n-japan-small-firm-solvency
      - n-yen-translated-foreign-currency-earnings
    edge_ids:
      - e05
      - e09
      - e12
    horizons:
      - 0_3m
      - 3_12m
      - 12_24m
    counter_hypothesis_ids:
      - h-real-rate-regime-shift
    evidence_ids:
      - series:jp.import_price_index
      - series:jp.bankruptcies
      - series:jp.terms_of_trade
      - series:jp.nikkei_per
      - series:usd_jpy
      - series:jp.pmi_services

scenarios:
  - scenario_id: capex-led-plateau
    name: 設備投資が支える高原（実質金利高止まりのまま利益が持ちこたえる）
    plausibility_rank: 1
    initial_shock: 新しい外生ショックは入らず、7/29 と 7/31 の据え置き決定が示す政策の現状維持が続く。
    persistence: 実質割引率は上端に留まり、ホルムズ海峡の制約による日量 60 万バレルの供給途絶も継続する。
    propagation_delta: 米国の設備投資（受注 前年比 +12.9%）が需要の穴を埋め、日本の実質賃金（+1.8%）が消費を下支えする。倒産の増加は中小に限られ、上場企業の需要には波及しない。
    policy_reaction: BOJ は 9 月または 10 月の会合で 1 回の利上げを検討し、FOMC は据え置きを続ける。どちらも会合ごとの判断を維持する。
    paths:
      growth: 日本は年率 1% 前後、米国は 1-2%。潜在成長の近傍で横ばい。
      inflation: 日本のコアは 1.5-2.0%、米国のコア PCE は 3% 前後で高止まり。
      rates: 日 10 年 2.7-3.1%、米 10 年 4.5-5.0%。曲線の形は変わらない。
      credit: IG・HY は現状のタイトさを維持し、CCC だけが 10% 台で高止まりする。
      fx: 155-165 円。介入効果の減衰で緩やかな円安が続く。
      balance_sheet: 日銀の国債買入減額と Fed の資産横ばいが続き、期間プレミアムは高止まりする。
    signposts:
      - 米コア資本財受注の前年比が 10% を超え続ける。
      - 日本の実質賃金の前年比が 1.0% を上回り続ける。
      - CCC スプレッドの拡大が HY 全体へ波及しない。
    invalidation:
      - 米新規失業保険の 4 週平均が 240,000 件を超える。
      - 日本の株式リスクプレミアムが 2.0% を下回る。
    known_omissions:
      - 通商政策の追加措置が個別品目に与える影響を集計系列で追えない。
      - 4-6 月期 GDP（2026-08-17 公表）の内訳を織り込んでいない。
  - scenario_id: yen-slide-and-margin-squeeze
    name: 円安再進行とマージン圧搾（コストが内需企業の資金繰りを壊す）
    plausibility_rank: 2
    initial_shock: 為替操作の効果が完全に減衰し、USD/JPY が 7/28 の 163.913 を超えて上抜ける。
    persistence: 金利差が縮小しても円安が続く状態が定着し、輸入物価の前年比が 30% 台へ再加速する。
    propagation_delta: 交易条件の悪化が中小・サービス業へ集中し、倒産件数が月 1,100 件を超える。人手不足起因の倒産が過去最多を更新し、内需が数量ベースで縮む。実質賃金は物価上昇に追い越されて再びマイナスへ入る。
    policy_reaction: 当局は再度の為替操作へ動くが、実績額の公表は月次で遅れる。BOJ は物価ではなく内需の毀損を理由に利上げを見送り、政策金利期待の縮小がさらに円安を招く。
    paths:
      growth: 日本は年率 0% 近傍へ減速。米国は 1% 台を維持する。
      inflation: 日本のコアは 2.5% を超え、性質は需要ではなくコストである。
      rates: 日 10 年は 3.0-3.4% へ上昇するが、実質は物価上昇で低下する。米 10 年は 4.7-5.2%。
      credit: 日本の中小向け与信が悪化し、倒産の増加が金融機関の与信費用へ現れる。米 CCC は 11% を超える。
      fx: 165-175 円。操作の戻り率が今回の 34.9% を上回る。
      balance_sheet: 円買い操作で外貨準備が減少し、国債買入の減額が続く。
    signposts:
      - USD/JPY が 163.913 を終値で上抜ける。
      - 倒産件数が 2 か月続けて 1,100 件を超える。
      - 日本の実質賃金の前年比がマイナスへ転じる。
      - 交易条件が 0.80 を下回る。
    invalidation:
      - USD/JPY が 150 円を下回る。
      - 輸入物価の前年比が 15% を下回る。
    known_omissions:
      - 政府の物価対策の追加規模を織り込んでいない。
      - 中小企業向けの資金繰り支援策の有無を観測できない。
  - scenario_id: supply-normalisation-and-real-rate-relief
    name: 供給正常化と実質金利の緩和（エネルギーが下がり割引率が戻る）
    plausibility_rank: 3
    initial_shock: ホルムズ海峡の通航制約が想定より早く解け、EIA が中東の供給途絶見積りを下方修正する。
    persistence: Brent が 75 ドルを下回って定着し、日本の輸入物価の前年比が 10% 台へ低下する。
    propagation_delta: 実質所得の改善が日米の家計需要を戻し、期待インフレの低下が実質金利を押し下げる。株式リスクプレミアムは益回りの上昇ではなく割引率の低下で回復する。倒産の増加は止まる。
    policy_reaction: FOMC は物価の収束を確認して緩和余地を開く。BOJ はコスト起点の物価が剥落するため利上げを急がず、金利差の是正が円高方向に効く。
    paths:
      growth: 日本は 1% 台前半へ回復、米国は 2% 前後へ戻る。
      inflation: 日本のコアは 1% 台前半、米国のコア PCE は 2% 台半ばへ低下する。
      rates: 日 10 年 2.3-2.7%、米 10 年 4.0-4.5%。実質金利が名目より速く低下する。
      credit: CCC スプレッドが 9% を下回り、質の分散が解消する。
      fx: 145-155 円。金利差の是正と交易条件の改善が同時に効く。
      balance_sheet: 中銀の資産縮小ペースが緩み、期間プレミアムが低下する。
    signposts:
      - EIA の次回 Short-Term Energy Outlook が中東の供給途絶見積りを日量 60 万バレルから引き下げる。
      - Brent が 3 か月続けて 75 ドルを下回る。
      - 米実質 10 年が 2.0% を下回る。
      - 日本の輸入物価の前年比が 15% を下回る。
    invalidation:
      - Brent が 100 ドルを超える。
      - 米実質 10 年が 2.6% を超える。
    known_omissions:
      - 中東情勢は政策変数ではなく外生であり、解消時期に確率を置く根拠が弱い。
      - 供給正常化が金属価格へ及ぼす影響は原油と経路が異なるため織り込んでいない。

unresolved_tensions:
  - 日経平均が前年比 +60.1% で PBR が 99.3 パーセンタイルにある一方、海外投資家は週次で 4,903 億円の売り越しに転じている。誰が買っているかを機械系列で帰属できないため、価格形成の主体が不明のままである。
  - 日本株の 30 日 IV は 93.2 パーセンタイルと高いのに、スキューは 3.4 パーセンタイルと低い。大きな変動を織り込みながら下落方向を恐れていない状態であり、向きを識別する観測がない。
  - 米国の新規失業保険は 2.3 パーセンタイルで極端に少ないのに、雇用者数の伸びは 14.3 パーセンタイルまで落ちている。解雇なき停滞がいつまで安定でいられるかを測る系列を持たない。
  - CCC スプレッドが 96.4 パーセンタイルまで拡大しているのに HY 全体は 8.9 パーセンタイルでタイトである。最低格付け層に限った事象か信用サイクルの初期かを判定できない。
  - 日本の実質賃金は 95.7 パーセンタイルで強いのに、消費者態度指数は 27.1 パーセンタイルにとどまる。賃金の分布情報を持たないため乖離を説明できない。
  - 為替操作の実施の有無と規模は、財務省の月次公表が 2026-07-29 までしか及ばないため一次情報で確認できない。

signposts:
  - USD/JPY が 163.913（2026-07-28 の水準）を上抜けるか、150 円を下回るか。
  - 日本 10 年国債利回りが 3.0% を超えるか、2.5% を下回るか。
  - 日本の株式リスクプレミアムが 2.5% を下回るか、4.0% を上回るか。
  - 2026-08-17 08:50 の 4-6 月期 GDP 1 次速報（内閣府）。
  - 2026-09-17〜18 の日銀金融政策決定会合。
  - 米新規失業保険の 4 週平均が 240,000 件を超えるか。
  - 米コア資本財受注の前年比が 10% を割るか。
  - EIA の次回 Short-Term Energy Outlook が中東の供給途絶見積りを引き下げるか。
  - 倒産件数が 2 か月続けて 1,100 件を超えるか、850 件を下回るか。
  - 財務省の外国為替平衡操作 月次公表（2026-07-30 以降を対象）で操作額が開示されるか。

