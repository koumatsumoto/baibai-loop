analyst_additions:
  - series_id: rate_diff.us_jp_10y
    reason: >-
      円の水準を金利差で説明できるかを識別する変数であり、水準が中位でも今 cycle の中心的な問いに直接効く。
  - series_id: jp.import_price_index
    reason: >-
      円安の輸入コスト転嫁経路を測る。交易条件と組で読む。
  - series_id: jp.cgpi
    reason: >-
      企業間取引段階の価格転嫁を測り、消費者物価への波及の手前を識別する。
  - series_id: jp.real_exports
    reason: >-
      数量ベースの外需を測る。名目輸出は為替換算で膨らむため、需要の実体はこちらで読む。
  - series_id: jp.n225_iv_30d
    reason: >-
      日本株の恐怖観測。VIX は米国市場の指標であり、判断対象が日本株なら代理にならない。
  - series_id: us.unemployment
    reason: >-
      求人・新規失業保険・雇用者数と組で労働市場の状態を確定するために必要。
  - series_id: us.retail_sales
    reason: >-
      米最終需要の水準。設備投資と家計需要の分岐を識別する。
  - series_id: us.breakeven_10y
    reason: >-
      名目金利を実質と期待インフレへ分解するために必要。
  - series_id: credit.hy_ig_spread
    reason: >-
      HY と IG の質的分散を測り、CCC 単独のワイド化が信用全体の逼迫かを識別する。
