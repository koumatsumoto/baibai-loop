# Shortlist draft (operator-authored, per cycle).
#
# The Research Gate: review the exact Ranked Set and record each judgment
# here, then publish it as the canonical shortlist. Select only candidates with a
# defensible narrative; selecting zero is valid, and rejected entries may cover
# the full ranked set:
#
#   uv run baibai-engine screening shortlist publish /tmp/shortlist.yaml \
#     --db stores/application/baibai.sqlite --runs-db stores/screening/runs.sqlite
#
# publish binds the draft to its source selection: selection_id / run_revision_id
# / as_of / macro_context_id must match the selection, and every ticker
# must equal the selection's review-capped ranked set. selected entries require `rank` and
# `narrative`; rejected entries must omit both, give a concrete reason
# (not "順位が低い" / "予算外"), and summarize its primary cause in
#
# Each field has one role under the Shortlist writing contract in
# docs/reference/screening-runtime.md. Selected means that a candidate earns a
# primary-research slot; it is not a buy recommendation. The schema checks
# presence, while the author preserves each claim and field boundary.
#
# The published narrative is read by the baibai-web /shortlist review surface.

schema_version: 7
kind: shortlist
shortlist_id: "shortlist-YYYYMMDD-<slug>"   # matches ^shortlist-\d{8}-[a-z0-9-]+$
selection_id: "<selection_id from `screening select`>"
run_revision_id: "<run_revision_id from `screening run`>"
as_of: "YYYY-MM-DD"
published_at: "YYYY-MM-DDTHH:MM:SS+09:00"    # must carry a timezone
macro_context_id: null                        # or the bound published macro context id
review_basis_shortlist_id: null                # copy judged_through_shortlist_id
research_gate_contract_id: research-gate-v1
entries:
  - ticker: "XXXX"
    decision: selected
    rank: 1                                   # 暫定順位。selected 内で 1..N を欠番・重複なく
    reason: "Gate判断を先に置いた1行サマリ（一次リサーチへ進める／見送る理由）"
    narrative:
      ploss: "中"                             # 低 / 中低 / 中 / 要精査 / 高
      why: "現値に誤価格が生じている可能性を説明する仮説"
      temporary: "一時要因が説明する範囲・期間と根拠"
      structural: "構造要因が説明する範囲・期間と根拠"
      survive: "悪化シナリオを5年間耐える事業・財務上の根拠と限界"
      unlock: "価値が収益・cash flow・還元へ伝わる仕組み"
      upside: "暫定上値の水準・成立前提・anchorの出どころ"
      downside: "悪化時の暫定下値・前提・根拠（資産だけを株価の床と断定しない）"
      rr: "上値と下値を比べ、一次リサーチに値する非対称があるか"
      catalyst: "判断を更新する観測条件（datedなら日付もcatalyst_dateへ）"
      catalyst_date: null                     # or "YYYY-MM-DD"（as_of 以降・as_of + 550 日以内）
      macro: "Macro Contextのconnectionが判断のどこへ、どちら向きに効くか（非該当なら根拠）"
      counter: "selected判断と競合する最も強い反対仮説"
      research: "競合仮説を識別する質問・一次source・判断変更条件"
      value: "他候補や現金と比べ、一次リサーチ枠を使う追加価値"
      prov: "全field後の暫定結論・未解決点・次段階へ進む理由"
      sector_label: null                      # optional; defaults to the screen's sector_33
  - ticker: "YYYY"
    decision: rejected
    reason: "非選択の具体的理由"
