    notes: 厚労省 毎月勤労統計の実質賃金指数(現金給与総額・事業所規模5人以上・調査産業計・季節調整値)。名目賃金を消費者物価で割った家計の購買力で、日銀が賃金と物価の好循環を判断する中心。jp.nominal_wage_indexと対で名目と実質の乖離=物価による目減りを読む。デフレーターは消費者物価指数の「持家の帰属家賃を除く総合」であってjp.cpi.headline(総合)ではないため、名目÷jp.cpi.headlineでは再現しない(2026-05の含意デフレーターは115.8、総合は113.5)。selectorを訂正したときと基準改定のときは`refresh --all-history`を1回通す。事業所入替えとベンチマーク更新により2024年1月以降と2023年12月以前には段差がある
    aliases: [実質賃金, 実質賃金指数, real wage index]
