    geography: japan
    frequency: daily
    unit: percent
    plausible_min: -100
    plausible_max: 100
    reading_key: n225_iv_skew
    source_id: jquants-options-n225
    notes: moneyness0.95 put IV から ATM put IV を引いたIVポイント差を、採用した逆平方根満期軸で30日へ補間する。採用限月が残存30日ちょうどならその限月だけを使い、使わない限月の基準差では欠測にしない。正値は対象putのIVがATM putより高いことを示すが、保険料や市場心理の直接測定ではない。期間調整は分析上の仮定であり、SQ周期の除去を一般に保証しない。両脚の差で基準誤差が相殺するとも限らないため、現行の基準不整合判定日は欠測とする。水準の高低はreadingのpercentileで読む
    aliases: [IVスキュー, skew, オプションスキュー]
