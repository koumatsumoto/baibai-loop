# Virtual L2 series computed from current selected source observations on read.
# reading_key names reading/formulas.py. No separate stored observation,
# acquisition, refresh order, or correction cascade is needed for these formulas.
series:
  - series_id: us.net_liquidity
    name: 米ネット流動性(近似)
    category: financial-conditions
    geography: us
    frequency: weekly
    unit: usd-billion
    plausible_min: 50
    plausible_max: 100000
    provider: derived
    reading_key: us.net_liquidity
    source_id: derived-net-liquidity
    source_url: https://github.com/koumatsumoto/baibai-loop/blob/main/engine/src/baibai_engine/market_context/reading/formulas.py
    notes: (FRB総資産 − TGA週平均)/1000 − RRP。資産とTGAは百万USD、RRPは10億USD。水曜時点の資産・日次RRPとTGA週平均の混合であり、同時点の厳密な準備残高や投資可能資金ではない
    aliases: [ネット流動性, net liquidity, US net liquidity]
  - series_id: us.erp
    name: 米株式リスクプレミアム
    category: valuation
    geography: us
    frequency: monthly
    unit: percent
    plausible_min: -10
    plausible_max: 15
    provider: derived
    reading_key: us.erp
    source_id: derived-us-erp
    source_url: https://github.com/koumatsumoto/baibai-loop/blob/main/engine/src/baibai_engine/market_context/reading/formulas.py
    notes: S&P500益回り − 米10Yの単純な利回り差。将来の超過収益率や割高・割安の確定値ではない
    aliases: [米ERP, US ERP, equity risk premium]
  - series_id: rate_diff.us_jp_10y
    name: 日米10Y金利差
    category: rates
    geography: world
    frequency: daily
    unit: percent
    plausible_min: -5
    plausible_max: 10
    provider: derived
    reading_key: rate_diff.us_jp_10y
    source_id: derived-us-jp-10y
    source_url: https://github.com/koumatsumoto/baibai-loop/blob/main/engine/src/baibai_engine/market_context/reading/formulas.py
    notes: 米10Y − 日10Y。円 carry の基本観測点
    aliases: [日米金利差, US-JP 10Y differential, rate differential]
  - series_id: us.policy_path_gap
    name: 米政策経路ギャップ(2Y−FF中点)
    category: rates
    geography: us
    frequency: daily
    unit: percent
    plausible_min: -8
    plausible_max: 8
    provider: derived
    reading_key: us.policy_path_gap
    source_id: derived-us-policy-path-gap
    source_url: https://github.com/koumatsumoto/baibai-loop/blob/main/engine/src/baibai_engine/market_context/reading/formulas.py
    notes: 米2Y − FF目標レンジ中点。目標レンジの中点と国債利回りの観測差で、実効FF金利との差でも政策変更幅・確率の推計でもない
    aliases: [米政策経路ギャップ, US policy path gap, 2Y-FF spread]
  - series_id: jp.policy_path_gap
    name: 日本政策経路ギャップ(2Y−政策金利)
    category: rates
    geography: japan
    frequency: daily
    unit: percent
    plausible_min: -8
    plausible_max: 8
    provider: derived
    reading_key: jp.policy_path_gap
    source_id: derived-jp-policy-path-gap
    source_url: https://github.com/koumatsumoto/baibai-loop/blob/main/engine/src/baibai_engine/market_context/reading/formulas.py
    notes: 日本2Y − 無担保コールO/N。異なる満期・金融商品の観測差で、利上げ幅・確率を直接示さない
    aliases: [日本政策経路ギャップ, JP policy path gap]
  - series_id: credit.hy_ig_spread
    name: 米HY-IGスプレッド
    category: credit
    geography: us
    frequency: daily
    unit: bp
    plausible_min: 0
    plausible_max: 2500
    provider: derived
    reading_key: credit.hy_ig_spread
    source_id: derived-hy-ig
    source_url: https://github.com/koumatsumoto/baibai-loop/blob/main/engine/src/baibai_engine/market_context/reading/formulas.py
    notes: HY OAS − IG OAS を bp 換算。信用スプレッドの水準差で、差の存在だけから信用の質の悪化を確定しない
    aliases: [HY-IGスプレッド, credit quality spread]
  - series_id: gold_copper_ratio
    name: 金銅比価
    category: commodity
    geography: world
    frequency: daily
    unit: ratio
    plausible_min: 0
    plausible_max: 2000
    provider: derived
