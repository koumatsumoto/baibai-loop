    source_url: https://github.com/koumatsumoto/baibai-loop/blob/main/engine/src/baibai_engine/market_context/reading/formulas.py
    notes: 金先物 / 銅先物の価格比。入力の価格単位に依存し、この比率だけでrisk-offや景気減速を断定しない
    aliases: [金銅比, gold copper ratio]
