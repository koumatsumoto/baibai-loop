  - series_id: jp.real_10y_proxy
    name: 日本実質10Y金利(近似)
    category: rates
    geography: japan
    frequency: monthly
    unit: percent
    plausible_min: -8
    plausible_max: 8
    provider: derived
    reading_key: jp.real_10y_proxy
    source_id: derived-jp-real-10y-proxy
    source_url: https://github.com/koumatsumoto/baibai-loop/blob/main/engine/src/baibai_engine/market_context/reading/formulas.py
    notes: 月末10Y JGB利回り − 実績コアCPI前年比。負は名目利回りが実績物価上昇率を下回ることを示す。期待インフレを控除した実質金利ではない
    aliases: [日本実質金利, JP real 10Y, 実質長期金利, real yield proxy]
  - series_id: us.10y_2y_spread
    name: 10Y-2Yスプレッド
    category: rates
    geography: us
    frequency: daily
