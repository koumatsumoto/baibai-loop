# Candidate shortlist report narratives (operator-authored, per cycle).
#
# The renderer pulls every hard number (price, valuation, dividend basis,
# expected return, fair-value anchor, input hashes) from the screening output;
# this file supplies only the qualitative judgment. Copy it next to the run's
# screening output (e.g. .cache/opportunity/ASOF/narratives.yaml), fill it for
# the audit-pool tickers required by docs/operations/decision-cycle.md OP3, then run:
#
#   uv run python -m tools.candidate_report.render \
#     --selection  .cache/opportunity/ASOF/selection-output.yaml \
#     --candidates .cache/opportunity/ASOF/candidates.yaml \
#     --narratives .cache/opportunity/ASOF/narratives.yaml \
#     --out        .cache/opportunity/ASOF/candidate-report.html
#
# The generated HTML is an ephemeral .cache artifact and is not committed.

meta:
  title: "日本株 候補レポート — 第1段階（深掘り候補の提示）"
  target_session: "YYYY-MM-DD"        # the session the eventual limit is planned for
  order_by: "FVアンカー乖離の降順"      # describes the display order (not a recommendation rank)
  intro_notes:                         # bullets under the brief; note any screening fixes / basis
    - "母集団: universe → audit pool 上位20 → N候補。選定基準は永久損失リスク/FV乖離/portfolio追加価値/購入可能性。"
    - "投資対象外条件があれば明記（例: パチンコ等）。"

# Ordered list; the order here is the display order. Each ticker must be in the
# run's audit_pool. ploss は 低 / 中低 / 中 / 要精査 / 高 のいずれか。
candidates:
  - ticker: "XXXX"
    sector_label: ""      # optional; defaults to the screen's sector_33
    ploss: "中"
    prov: "暫定判断（1行）"
    why: "なぜ安くなっている可能性があるか"
    temporary: "一時的な問題である可能性"
    structural: "構造的な問題である可能性"
    survive: "財務的に5年間耐えられそうか"
    unlock: "何が改善すれば株主価値が上がるか"
    counter: "最も強い反対仮説"
    research: "個別リサーチで確認する事項"
    value: "この候補を深掘りする価値"

# audit-pool tickers that were reviewed but not shortlisted, with concrete
# reasons (not just "順位が低い" / "予算外"). ユーザー投資対象外もここへ理由付きで。
excluded:
  - ticker: "YYYY"
    reason: "非選択の具体的理由"
