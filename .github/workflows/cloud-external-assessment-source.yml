name: cloud-external-assessment-source

on:
  workflow_call:
    inputs:
      source:
        required: true
        type: string
      run_id:
        required: true
        type: string
      master_asof:
        type: string
        default: ''
      observation_date:
        type: string
        default: ''
      operation:
        required: true
        type: string

permissions:
  contents: read

# Own one source through terminal sealing, including explicit partial closure.
# Sibling sources never wait for this workflow's acquisition to complete.
concurrency:
  group: external-assessment-acquire-${{ inputs.source }}
  queue: max
  cancel-in-progress: false

jobs:
  acquire:
    if: ${{ inputs.operation == 'collect_and_publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SOURCE: ${{ inputs.source }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
      MASTER_ASOF: ${{ inputs.master_asof }}
      OBSERVATION_DATE: ${{ inputs.observation_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Provision DuckDB httpfs extension
        run: uv run python -m tools.diagnostics.provision_duckdb_httpfs
      - name: Freeze and acquire one source with bounded cohort checkpoints
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          args=(--source "$SOURCE" --run-id "$SOURCE_RUN_ID" --directory "$RUNNER_TEMP/source-plan")
          if [ -n "$OBSERVATION_DATE" ]; then args+=(--observation-date "$OBSERVATION_DATE");
          else args+=(--master-asof "$MASTER_ASOF"); fi
          timeout --signal=TERM --kill-after=30s 270m uv run python -m baibai_batch.jobs.external_assessment_sources acquire "${args[@]}"

  publish:
    needs: acquire
    outputs:
      message_json: ${{ steps.notice.outputs.message_json }}
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    # The existing publication lease expires after 120 minutes.
    timeout-minutes: 110
    concurrency:
      group: cloud-publish
      queue: max
      cancel-in-progress: false
    env:
      SOURCE_RUNS: ${{ format('[{{"source":"{0}","run_id":"{1}"}}]', inputs.source, inputs.run_id) }}
      MASTER_ASOF: ${{ inputs.master_asof }}
      EXTERNAL_ASSESSMENT_OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Inspect exact source handoffs before leasing or hydration
        id: ready
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          args=(--selection-json "$SOURCE_RUNS" --report-output "$RUNNER_TEMP/source-publication.json")
          if [ -n "$MASTER_ASOF" ]; then args+=(--master-asof "$MASTER_ASOF"); fi
          if [ "$EXTERNAL_ASSESSMENT_OPERATION" = publish_confirmed_partial ]; then args+=(--confirmed-partial); fi
          uv run python -m baibai_batch.jobs.external_assessment_sources inspect "${args[@]}"
      - name: Provision DuckDB httpfs extension
        if: ${{ steps.ready.outputs.ready == 'true' }}
        run: uv run python -m tools.diagnostics.provision_duckdb_httpfs
      - name: Acquire the existing publication lease
        id: lease-acquire
        if: ${{ steps.ready.outputs.ready == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: uv run python -m baibai_batch.storage.publication_lease acquire --purpose operator --handle "$RUNNER_TEMP/external-assessment-publication-lease.json"
      - name: Pull and hydrate the latest canonical release
        if: ${{ steps.ready.outputs.ready == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          batch/scripts/r2_transfer.sh pull-market
          batch/scripts/r2_transfer.sh hydrate-market
      - name: Import confirmed receipts and publish with remote readback
        id: publish
        if: ${{ steps.ready.outputs.ready == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          args=(--selection-json "$SOURCE_RUNS" --directory "$RUNNER_TEMP/external-assessment-readback" --lease-handle "$RUNNER_TEMP/external-assessment-publication-lease.json" --report-output "$RUNNER_TEMP/source-publication.json")
          if [ -n "$MASTER_ASOF" ]; then args+=(--master-asof "$MASTER_ASOF"); fi
          if [ "$EXTERNAL_ASSESSMENT_OPERATION" = publish_confirmed_partial ]; then args+=(--confirmed-partial); fi
          uv run python -m baibai_batch.jobs.external_assessment_sources publish "${args[@]}"
      - name: Release publication lease
        id: lease-release
        if: ${{ always() && steps.lease-acquire.outputs.acquired == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: uv run python -m baibai_batch.storage.publication_lease release --handle "$RUNNER_TEMP/external-assessment-publication-lease.json"
      - name: Record cancellation for notification
        id: cancellation
        if: ${{ cancelled() }}
        run: printf 'cancelled=true\n' >> "$GITHUB_OUTPUT"
      - name: Prepare the safe per-source notification without sending
        id: notice
        if: ${{ always() }}
        continue-on-error: true
        env:
          PYTHONPATH: batch/src
        run: python3 -m baibai_batch.observability.external_assessment_discord --render-only --sources-report "$RUNNER_TEMP/source-publication.json" --plan-result success --publish-result "${{ steps.publish.outcome }}" --lease-release-outcome "${{ steps.lease-release.outcome }}" --cancelled "${{ steps.cancellation.outputs.cancelled || 'false' }}"

  notify:
    needs: [acquire, publish]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record cancellation for notification
        id: cancellation
        if: ${{ cancelled() }}
        run: printf 'cancelled=true\n' >> "$GITHUB_OUTPUT"
      - name: Send this source notification
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONPATH: batch/src
          SOURCE_NOTICE_JSON: ${{ needs.publish.outputs.message_json }}
        run: python3 -m baibai_batch.observability.external_assessment_discord --message-json "$SOURCE_NOTICE_JSON" --plan-result "success" --acquire-result "${{ needs.acquire.result }}" --publish-result "${{ needs.publish.result }}" --cancelled "${{ steps.cancellation.outputs.cancelled || 'false' }}"
