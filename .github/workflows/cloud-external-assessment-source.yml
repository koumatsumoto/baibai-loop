name: cloud-external-assessment-source

on:
  workflow_call:
    inputs:
      source:
        required: true
        type: string
      run_id:
        required: true
        type: string
      master_asof:
        type: string
        default: ''
      observation_date:
        type: string
        default: ''
      operation:
        required: true
        type: string

permissions:
  contents: read

# Own acquisition and immutable inspected handoff; common integration seals terminals.
# Sibling sources never wait for this workflow's acquisition to complete.
concurrency:
  group: external-assessment-acquire-${{ inputs.source }}
  queue: max
  cancel-in-progress: false

jobs:
  acquire:
    concurrency:
      group: source-host-external-${{ inputs.source }}
      queue: max
      cancel-in-progress: false
    if: ${{ inputs.operation == 'collect' }}
    runs-on: ubuntu-24.04
    # Keep both original budgets; the acquire process still has its own hard limit.
    timeout-minutes: 315
    outputs:
      collect_result: ${{ steps.collect.outcome }}
      ready_result: ${{ steps.ready.outcome }}
      observation_date: ${{ steps.cycle.outputs.observation_date }}
    env:
      UV_NO_DEV: "true"
      SOURCE: ${{ inputs.source }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
      MASTER_ASOF: ${{ inputs.master_asof }}
      OBSERVATION_DATE: ${{ inputs.observation_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Resolve the collectible cycle after the shared host queue
        id: cycle
        run: |
          args=(--source "$SOURCE" --run-id "$SOURCE_RUN_ID")
          if [ -n "$OBSERVATION_DATE" ]; then args+=(--observation-date "$OBSERVATION_DATE"); fi
          uv run python -m baibai_jobs.acquisition.external_assessments.sources resolve "${args[@]}"
      - name: Freeze and acquire one source with bounded cohort checkpoints
        id: collect
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SOURCE_RUN_ID: ${{ steps.cycle.outputs.run_id }}
          OBSERVATION_DATE: ${{ steps.cycle.outputs.observation_date }}
        run: |
          args=(--source "$SOURCE" --run-id "$SOURCE_RUN_ID" --directory "$RUNNER_TEMP/source-plan")
          if [ -n "$OBSERVATION_DATE" ]; then args+=(--observation-date "$OBSERVATION_DATE");
          else args+=(--master-asof "$MASTER_ASOF"); fi
          timeout --signal=TERM --kill-after=30s 270m uv run python -m baibai_jobs.acquisition.external_assessments.sources acquire "${args[@]}"
      - name: Freeze cumulative handoff for the resolved cycle
        id: ready
        if: >-
          ${{ !cancelled() && steps.cycle.outcome == 'success' && steps.cycle.outputs.run_id != '' &&
              (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        timeout-minutes: 15
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SOURCE_RUNS: ${{ format('[{{"source":"{0}","run_id":"{1}"}}]', inputs.source, steps.cycle.outputs.run_id) }}
        run: |
          args=(--selection-json "$SOURCE_RUNS" --cumulative --report-output "$RUNNER_TEMP/source-ready.json")
          if [ -n "$MASTER_ASOF" ]; then args+=(--master-asof "$MASTER_ASOF"); fi
          uv run python -m baibai_jobs.acquisition.external_assessments.sources ready "${args[@]}"

  handoff:
    env:
      UV_NO_DEV: "true"
    if: ${{ !cancelled() && inputs.operation == 'stage_confirmed_partial' }}
    outputs:
      ready_result: ${{ steps.ready.outcome }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Freeze operator-confirmed partial for the requested source plan
        id: ready
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SOURCE_RUNS: ${{ format('[{{"source":"{0}","run_id":"{1}"}}]', inputs.source, inputs.run_id) }}
          MASTER_ASOF: ${{ inputs.master_asof }}
        run: |
          uv run python -m baibai_jobs.acquisition.external_assessments.sources ready \
            --selection-json "$SOURCE_RUNS" --master-asof "$MASTER_ASOF" --confirmed-partial \
            --report-output "$RUNNER_TEMP/source-ready.json"

  notify:
    needs: [acquire, handoff]
    if: >-
      ${{ always() && github.ref == 'refs/heads/main' &&
          (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report the independent source receipt outcome
        continue-on-error: true
        env:
          PYTHONPATH: jobs/src
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SOURCE_GROUP: external-${{ inputs.source }}
          ASOF: ${{ needs.acquire.outputs.observation_date || inputs.master_asof }}
          SOURCE_JOB_RESULT: ${{ inputs.operation == 'collect' && needs.acquire.result || needs.handoff.result }}
          ACQUIRE_RESULT: ${{ inputs.operation == 'stage_confirmed_partial' && 'skipped' || needs.acquire.outputs.collect_result || 'unknown' }}
          STAGE_RESULT: ${{ needs.acquire.outputs.ready_result || needs.handoff.outputs.ready_result || 'unknown' }}
        run: python3 -m baibai_jobs.observability.source_discord
