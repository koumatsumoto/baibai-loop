name: import-edinet-archives-once

# Temporary operator entry. No schedule, provider GET, ordinary publication or cleanup.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect / plan / apply / verify。apply前にplanのSHAを保存する"
        required: true
        type: choice
        options: [inspect, plan, apply, verify]
        default: inspect
      expected_code_sha:
        description: "この入口を含む固定main commit（40桁）"
        required: true
        type: string
      release_id:
        description: "固定market release。inspect以外は必須"
        type: string
      manifest_sha256:
        description: "固定release manifest SHA256"
        type: string
      market_sha256:
        description: "固定canonical market.sqlite SHA256"
        type: string
      list_head_sha256:
        description: "固定一覧head本文SHA256"
        type: string
      archive_head_sha256:
        description: "実行直前のarchive head本文SHA256、又は確認済みabsent"
        type: string
      plan_sha256:
        description: "前回planのSHA256。apply/verifyは完全一致必須"
        type: string
      initialize_archive_head:
        description: "初回の未作成headだけ明示initialize。再開時はfalse"
        type: boolean
        default: false
      bucket:
        description: "既存運用bucket"
        type: string
        default: baibai-stores

permissions:
  contents: read
  actions: read

concurrency:
  group: common-source-integration
  queue: max
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.ref == 'refs/heads/main' }}
    concurrency:
      group: source-acquire-edinet
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Less than the existing 120-minute operator lease. No lease extension.
    timeout-minutes: 110
    env:
      MODE: ${{ inputs.mode }}
      EXPECTED_CODE_SHA: ${{ inputs.expected_code_sha }}
      FIXED_RELEASE: ${{ inputs.release_id }}
      FIXED_MANIFEST: ${{ inputs.manifest_sha256 }}
      FIXED_MARKET: ${{ inputs.market_sha256 }}
      FIXED_LIST_HEAD: ${{ inputs.list_head_sha256 }}
      EXPECTED_ARCHIVE_HEAD: ${{ inputs.archive_head_sha256 }}
      EXPECTED_PLAN: ${{ inputs.plan_sha256 }}
      INITIALIZE_ARCHIVE_HEAD: ${{ inputs.initialize_archive_head }}
      IMPORT_BUCKET: ${{ inputs.bucket }}
      R2_STORES_BUCKET: ${{ inputs.bucket }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Validate fixed input and continuous drain before credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m tools.diagnostics.import_edinet_archives_once check
      - name: Acquire existing publication lease
        id: lease-acquire
        if: inputs.mode != 'inspect'
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          umask 077
          log="$RUNNER_TEMP/edinet-import-lease.log"
          uv run python -m baibai_jobs.publication.lease acquire --purpose operator \
            --handle "$RUNNER_TEMP/edinet-import-lease.json" >"$log" 2>&1
      - name: Inspect or prepare and verify the exact finite import
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          umask 077
          log="$RUNNER_TEMP/edinet-import-private.log"
          summary="$RUNNER_TEMP/edinet-import-summary.json"
          set +e
          uv run python -m tools.diagnostics.import_edinet_archives_once run \
            --lease-handle "$RUNNER_TEMP/edinet-import-lease.json" --summary "$summary" \
            --private-log "$log" --public-fd 3 3>&1 >>"$log" 2>&1
          code=$?
          set -e
          printf 'edinet_import_exit_code=%s\n' "$code"
          exit "$code"
      - name: Release existing publication lease
        if: ${{ always() && steps.lease-acquire.outputs.acquired == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          umask 077
          log="$RUNNER_TEMP/edinet-import-lease-release.log"
          uv run python -m baibai_jobs.publication.lease release \
            --handle "$RUNNER_TEMP/edinet-import-lease.json" >"$log" 2>&1
          echo 'publication_lease_released=true'
      # Raw inputs, plan contents and captured errors never become public artifacts.
      # The parent keeps normal writers disabled until #1910 cutover and acceptance.
