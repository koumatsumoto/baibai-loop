name: cloud-materialize

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: cloud-publish
  queue: max
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Sync Python environment
        run: uv sync --locked

      - name: Acquire publication lease
        id: lease-acquire
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: uv run python -m baibai_jobs.publication.lease acquire --purpose materialize --handle "$RUNNER_TEMP/publication-lease-handle.json"

      - name: Pull application store
        id: pull-app
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: jobs/scripts/r2_transfer.sh pull-app

      # Market data enriches application facts but must be fully hydrated before use.
      # Keep acquisition failure visible while still publishing independent ledger/tasks.
      - name: Pull and hydrate market store from the lake release
        id: market
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          jobs/scripts/r2_transfer.sh pull-market
          jobs/scripts/r2_transfer.sh hydrate-market

      - name: Materialize read models
        id: materialize
        if: ${{ !cancelled() && steps.pull-app.outcome == 'success' }}
        env:
          MARKET_OUTCOME: ${{ steps.market.outcome }}
        run: |
          if [[ "$MARKET_OUTCOME" != "success" && -d stores/market ]]; then
            mv stores/market "$RUNNER_TEMP/unverified-market"
          fi
          uv run python -m baibai_web.materialize --output-dir "$RUNNER_TEMP/serving"

      - name: Upload serving objects
        if: ${{ !cancelled() && steps.materialize.outcome == 'success' }}
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: jobs/scripts/r2_transfer.sh upload-portfolio-views "$RUNNER_TEMP/serving"

      - name: Release publication lease
        id: lease-release
        if: ${{ always() && steps.lease-acquire.outputs.acquired == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: uv run python -m baibai_jobs.publication.lease release --handle "$RUNNER_TEMP/publication-lease-handle.json"
