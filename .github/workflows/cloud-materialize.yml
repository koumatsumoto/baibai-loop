name: cloud-materialize

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-publish
  queue: max
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Sync Python environment
        run: uv sync --locked

      # The lake reads Parquet over R2 through DuckDB's httpfs extension, and runtime
      # sessions disable extension downloads outright — a read path that could fetch
      # executable code on demand is not one that fails closed. The install happens here,
      # before credentials are present, so a missing extension is a setup failure with
      # nothing published rather than a data failure part-way through a run.
      - name: Provision DuckDB httpfs extension
        run: uv run python -m tools.diagnostics.provision_duckdb_httpfs

      - name: Acquire publication lease
        id: lease-acquire
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: uv run python -m baibai_batch.storage.publication_lease acquire --purpose materialize --handle "$RUNNER_TEMP/publication-lease-handle.json"

      - name: Pull stores
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          batch/scripts/r2_transfer.sh pull-machine
          batch/scripts/r2_transfer.sh pull-app

      # The market store arrives holding only what the lake does not own — the coverage
      # ledger and the operator-derived tables. Filling the rest from the current release
      # is what makes it the store every reader already expects. It fails closed on the
      # published row counts, so a fill that silently did nothing cannot reach the export
      # as an empty market. Without it this workflow republishes every valuation, daily
      # delta and security view with no price behind it.
      - name: Hydrate market store from the L1 release
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: batch/scripts/r2_transfer.sh hydrate-market

      - name: Materialize read models
        run: uv run python -m baibai_web.materialize --output-dir "$RUNNER_TEMP/serving" --batch manual

      - name: Upload serving objects
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Not a credential. This workflow is the one to compare in-flight counts
          # on, because nothing else runs beside the upload here.
          R2_SERVING_UPLOAD_CONCURRENCY: ${{ vars.R2_SERVING_UPLOAD_CONCURRENCY }}
        # Same two stages the daily batch publishes through, in the same order.
        # Nothing runs alongside them here, so they are simply sequential.
        run: |
          batch/scripts/r2_transfer.sh upload-serving-views "$RUNNER_TEMP/serving"
          batch/scripts/r2_transfer.sh publish-serving-tail "$RUNNER_TEMP/serving"

      - name: Release publication lease
        id: lease-release
        if: ${{ always() && steps.lease-acquire.outputs.acquired == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: uv run python -m baibai_batch.storage.publication_lease release --handle "$RUNNER_TEMP/publication-lease-handle.json"
