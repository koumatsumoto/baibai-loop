name: cloud-materialize

on:
  workflow_dispatch:
    inputs:
      market_release_id:
        description: "元の日次runの公開市場release ID（復旧時は3項目すべて必須）"
        required: false
        type: string
      market_manifest_sha256:
        description: "同じrunの市場release manifest SHA-256"
        required: false
        type: string
      machine_receipt_sha256:
        description: "同じrunのcore upload成功ログにあるmachine_receipt_sha256"
        required: false
        type: string
  workflow_call:

permissions:
  contents: read

concurrency:
  group: cloud-publish
  queue: max
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MARKET_RELEASE_ID: ${{ inputs.market_release_id }}
      MARKET_MANIFEST_SHA256: ${{ inputs.market_manifest_sha256 }}
      MACHINE_RECEIPT_SHA256: ${{ inputs.machine_receipt_sha256 }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Sync Python environment
        run: uv sync --locked

      - name: Validate requested market identity
        id: target
        if: ${{ inputs.market_release_id != '' || inputs.market_manifest_sha256 != '' || inputs.machine_receipt_sha256 != '' }}
        run: |
          uv run python -m baibai_jobs.publication.machine_bundle -- "$MARKET_RELEASE_ID" "$MARKET_MANIFEST_SHA256" "$MACHINE_RECEIPT_SHA256"

      - name: Acquire publication lease
        id: lease-acquire
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: uv run python -m baibai_jobs.publication.lease acquire --purpose materialize --handle "$RUNNER_TEMP/publication-lease-handle.json"

      - name: Pin the current published market and runs pair
        if: ${{ steps.target.outcome == 'success' }}
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          umask 077
          uv run python -m baibai_jobs.publication.machine_bundle --capture "$RUNNER_TEMP/materialize-market-pair.json" -- "$MARKET_RELEASE_ID" "$MARKET_MANIFEST_SHA256" "$MACHINE_RECEIPT_SHA256"

      - name: Pull application store
        id: pull-app
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          umask 077
          jobs/scripts/r2_transfer.sh pull-app > "$RUNNER_TEMP/materialize-pull-app-private.log" 2>&1

      # Market data enriches application facts; hydrate only its display inputs.
      # Keep acquisition failure visible while still publishing independent portfolio views.
      - name: Pull market store and hydrate portfolio inputs from its lake release
        id: market
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          jobs/scripts/r2_transfer.sh pull-market
          jobs/scripts/r2_transfer.sh hydrate-portfolio

      - name: Materialize read models
        id: materialize
        if: >-
          ${{ !cancelled() && steps.pull-app.outcome == 'success' &&
          (steps.market.outcome == 'success' || steps.target.outcome == 'skipped') }}
        env:
          MARKET_OUTCOME: ${{ steps.market.outcome }}
        run: |
          umask 077
          {
            if [[ "$MARKET_OUTCOME" != "success" && -d stores/market ]]; then
              mv stores/market "$RUNNER_TEMP/unverified-market"
            fi
            uv run python -m baibai_web.materialize --output-dir "$RUNNER_TEMP/serving"
          } > "$RUNNER_TEMP/materialize-private.log" 2>&1

      - name: Upload serving objects
        if: ${{ !cancelled() && steps.materialize.outcome == 'success' }}
        env:
          PUBLICATION_LEASE_HANDLE: ${{ runner.temp }}/publication-lease-handle.json
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          umask 077
          if [[ -n "$MARKET_RELEASE_ID" ]]; then
            uv run python -m baibai_jobs.publication.machine_bundle --verify "$RUNNER_TEMP/materialize-market-pair.json" -- "$MARKET_RELEASE_ID" "$MARKET_MANIFEST_SHA256" "$MACHINE_RECEIPT_SHA256"
          fi
          jobs/scripts/r2_transfer.sh upload-portfolio-views "$RUNNER_TEMP/serving" > "$RUNNER_TEMP/materialize-upload-private.log" 2>&1

      - name: Release publication lease
        id: lease-release
        if: ${{ always() && steps.lease-acquire.outputs.acquired == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: uv run python -m baibai_jobs.publication.lease release --handle "$RUNNER_TEMP/publication-lease-handle.json"
