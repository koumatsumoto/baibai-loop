name: cloud-margin-alerts-diagnose-once

# 失敗済み移行のmetadata診断のみ。原本・lease・canonical・flagは変更しない。
on:
  push:
    branches: [codex/margin-alerts-diagnose-20261106]
    paths: [.github/workflows/cloud-margin-alerts-diagnose-once.yml]

permissions:
  contents: read

concurrency:
  group: cloud-publish
  queue: max
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      ${{ github.repository == 'koumatsumoto/baibai-loop' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/codex/margin-alerts-diagnose-20261106' &&
          github.run_attempt == 1 &&
          github.event.head_commit.message == 'ops: 日々公表移行の保存metadataを一度だけ診断 (2026-11-06)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: source-acquire-jquants
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Require the reviewed code and only this temporary workflow change
        env:
          EXPECTED_CODE_SHA: 76a82af5808c7dd17e3b0efe7caf7a7268284b11
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_CODE_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = '.github/workflows/cloud-margin-alerts-diagnose-once.yml'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Read only the preserved migration metadata and native head
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          cat > "$RUNNER_TEMP/margin_alerts_diagnose_once.py" <<'PY_DIAGNOSE'
          """既存margin移行の私有metadataとheadだけを読み、raw不足とL2品質を分ける。"""
          
          from __future__ import annotations
          
          import contextlib
          import hashlib
          import json
          import os
          import re
          import sys
          from datetime import UTC, date, datetime, timedelta
          from pathlib import Path
          
          from baibai_engine.data_collection.providers.jquants.margin_alerts_native import (
              HEAD_KEY,
              FixedMarginAlertsL1,
              plan_margin_alert_days,
          )
          from baibai_engine.storage.objects.r2 import Boto3R2Store
          
          RUN_ID = "42132114612"
          PRIVATE_PREFIX = f"coordination/cutovers/margin-alerts-native/{RUN_ID}/"
          NAMES = ("state", "plan", "applied", "comparison", "next-acquisition-plan", "outcome")
          OBJECT_LIMIT = 16 * 1024 * 1024
          TOTAL_LIMIT = 32 * 1024 * 1024
          LIST_LIMIT = 32
          HEX = r"[0-9a-f]{64}"
          
          
          class DiagnosisFailure(RuntimeError):
              """公開可能な固定reasonだけを保持する。"""
          
          
          def require(condition, code):
              if not condition:
                  raise DiagnosisFailure(code)
          
          
          class MetadataReader:
              """exact runの6JSONとnative head以外のbody、全write経路を公開しない。"""
          
              def __init__(self, store):
                  self.store = store
                  self.bytes_read = 0
          
              def listing(self):
                  found = {}
                  for index, (key, size) in enumerate(self.store.iter_objects(PRIVATE_PREFIX)):
                      require(index < LIST_LIMIT, "private_listing_limit")
                      require(key.startswith(PRIVATE_PREFIX), "private_listing_outside_scope")
                      found[key] = size
                  return found
          
              def head(self, key):
                  allowed = key == HEAD_KEY or any(
                      re.fullmatch(re.escape(PRIVATE_PREFIX + name + ".json-") + HEX, key)
                      for name in NAMES
                  )
                  require(allowed, "metadata_outside_scope")
                  return self.store.head(key)
          
              def get(self, key):
                  before = self.head(key)
                  require(before is not None, "required_metadata_missing")
                  require(0 <= before.size <= OBJECT_LIMIT, "metadata_object_limit")
                  require(self.bytes_read + before.size <= TOTAL_LIMIT, "metadata_total_limit")
                  self.bytes_read += before.size
                  response = self.store._client(before.size).get_object(
                      Bucket=self.store.bucket, Key=key, IfMatch=before.etag
                  )
                  body = response["Body"]
                  try:
                      payload = body.read(before.size + 1)
                  finally:
                      body.close()
                  require(len(payload) == before.size, "metadata_size_changed")
                  require(self.head(key) == before, "metadata_changed_during_read")
                  return payload, before
          
          
          def analyze(documents, fixed):
              """固定metadataのみから分類する。原本の再検証・新しい完了認定ではない。"""
              state, plan, applied, comparison, following, outcome = (
                  documents[name] for name in NAMES
              )
              require(state["format"] == "margin-alerts-cutover-once-v1", "state_format_invalid")
              for key in ("release_id", "manifest_sha256"):
                  require(state[key] == plan[key] == comparison[key], "release_binding_mismatch")
              require(state["known_at"] == plan["known_at"], "clock_binding_mismatch")
              clock = datetime.fromisoformat(state["known_at"])
              require(clock.utcoffset() is not None, "clock_timezone_missing")
              asof = date.fromisoformat(state["asof"])
              require(
                  asof.isoformat() == comparison["as_of"] == following["asof"],
                  "asof_binding_mismatch",
              )
              require(
                  fixed.content_id
                  == applied["head_sha256"]
                  == comparison["head_sha256"]
                  == following["head_sha256"],
                  "native_head_differs_from_applied",
              )
              require(
                  not plan["blocked"] and bool(plan["attempts"]), "finite_plan_not_applicable"
              )
              attempts = {item["request_id"]: item["sha256"] for item in plan["attempts"]}
              require(len(attempts) == len(plan["attempts"]), "duplicate_plan_identity")
              head = fixed.value()
              require(
                  attempts
                  == {key: value["fingerprint"] for key, value in head["receipts"].items()},
                  "native_receipts_differ_from_plan",
              )
              require(
                  not comparison["differences"]
                  and comparison["rows"]
                  == comparison["legacy_rows"]
                  == comparison["native_rows"]
                  == comparison["matched_rows"],
                  "saved_comparison_not_equal",
              )
              require(
                  outcome.get("native_applied") is True
                  and outcome.get("native_verified") is True
                  and outcome.get("comparison_equal") is True
                  and outcome.get("migration_completed") is False
                  and outcome.get("coverage_complete") is False
                  and outcome.get("failed_phase") == "verify_compare",
                  "saved_outcome_differs_from_reported_failure",
              )
              scopes = head["scopes"]
              require(bool(scopes), "native_scopes_empty")
              first, last = (
                  min(map(date.fromisoformat, scopes)),
                  max(asof, *map(date.fromisoformat, scopes)),
              )
              days = tuple(
                  first + timedelta(days=offset) for offset in range((last - first).days + 1)
              )
              # Exact row parity implies all old row dates are in this native interval.
              require(len(days) == comparison["publication_days"], "comparison_interval_mismatch")
              missing, failed, held, raw_partial = [], [], [], []
              for day in days:
                  scope = scopes.get(day.isoformat(), {})
                  for key in ("confirmed_at", "last_attempt_at", "changed_at"):
                      if value := scope.get(key):
                          moment = datetime.fromisoformat(value)
                          require(
                              moment.utcoffset() is not None and moment <= clock,
                              "scope_after_boundary",
                          )
                  for key in ("adopted", "failure", "held"):
                      if identity := scope.get(key):
                          require(identity in head["receipts"], "scope_receipt_missing")
                  if not scope.get("adopted"):
                      missing.append(day)
                  if scope.get("failure"):
                      failed.append(day)
                  if scope.get("held"):
                      held.append(day)
                  if scope.get("adopted") and (scope.get("failure") or scope.get("held")):
                      raw_partial.append(day)
              require(
                  len(missing) == comparison["unavailable_days"],
                  "saved_unavailable_count_mismatch",
              )
              partial_count = comparison["partial_days"]
              require(
                  type(partial_count) is int
                  and len(raw_partial) <= partial_count <= len(days) - len(missing),
                  "saved_partial_count_mismatch",
              )
              require(
                  comparison["coverage_status"] == "partial" and (missing or partial_count),
                  "saved_coverage_inconsistent",
              )
              planned = plan_margin_alert_days(fixed, asof=asof)
              require(
                  [day.isoformat() for day in planned] == following["days"]
                  and following["provider_requests_performed"] == 0,
                  "saved_next_plan_mismatch",
              )
              unresolved = set(missing + failed + held)
              overlap_start = asof - timedelta(days=7)
              quality_extra = partial_count - len(raw_partial)
              public = {
                  "diagnostic_completed": True,
                  "private_evidence_bound": True,
                  "native_head_matches_applied": True,
                  "native_receipts_match_fixed_plan": True,
                  "comparison_equal": True,
                  "raw_coverage_complete": not unresolved,
                  "raw_missing_days_present": bool(missing),
                  "raw_failed_days_present": bool(failed),
                  "raw_held_days_present": bool(held),
                  "raw_gaps_before_recent_overlap": any(
                      day < overlap_start for day in unresolved
                  ),
                  "raw_gaps_after_asof": any(day > asof for day in unresolved),
                  "comparison_extends_after_asof": last > asof,
                  "additional_projection_quality_partial": quality_extra > 0,
                  # If raw and L2 failures overlap, metadata cannot rule out extra quality problems.
                  "projection_quality_partial_count_exact": not raw_partial,
                  "next_acquisition_plan_matches": True,
                  "next_acquire_within_eight_days": len(planned) <= 8,
                  "original_bytes_reverified": False,
                  "retention_verified": False,
                  "migration_completion_changed": False,
                  "remote_writes": False,
                  "provider_requests": False,
              }
              private = {
                  "comparison_start": first.isoformat(),
                  "comparison_end": last.isoformat(),
                  "missing_days": [day.isoformat() for day in missing],
                  "failed_days": [day.isoformat() for day in failed],
                  "held_days": [day.isoformat() for day in held],
                  "raw_partial_days": [day.isoformat() for day in raw_partial],
                  "additional_projection_partial_days": quality_extra,
                  "next_days": [day.isoformat() for day in planned],
              }
              return public, private
          
          
          def inspect(store):
              reader = MetadataReader(store)
              before = reader.listing()
              documents, keys = {}, {}
              for name in NAMES:
                  matches = [
                      key
                      for key in before
                      if re.fullmatch(re.escape(PRIVATE_PREFIX + name + ".json-") + HEX, key)
                  ]
                  require(len(matches) == 1, "private_document_missing_or_ambiguous")
                  key = matches[0]
                  payload, _ = reader.get(key)
                  require(
                      hashlib.sha256(payload).hexdigest() == key.rsplit("-", 1)[1],
                      "private_digest_mismatch",
                  )
                  documents[name], keys[name] = json.loads(payload), key
              payload, native = reader.get(HEAD_KEY)
              fixed = FixedMarginAlertsL1(payload, native.etag)
              public, details = analyze(documents, fixed)
              require(before == reader.listing(), "private_evidence_changed")
              require(reader.head(HEAD_KEY) == native, "native_head_changed")
              public["native_head_stable"] = True
              private = {
                  "checked_at": datetime.now(UTC).isoformat(),
                  "run_id": RUN_ID,
                  "private_keys": keys,
                  "documents": documents,
                  "native_head": fixed.value(),
                  "native_etag": native.etag,
                  "native_head_sha256": fixed.content_id,
                  "metadata_bytes": reader.bytes_read,
                  "diagnosis": details,
                  "public": public,
              }
              return public, private
          
          
          def private_file(path):
              return os.fdopen(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), "w")
          
          
          def main():
              output = sys.stdout
              try:
                  directory = Path(os.environ["RUNNER_TEMP"])
                  with (
                      private_file(directory / "margin-diagnosis-private.log") as private_log,
                      contextlib.redirect_stdout(private_log),
                      contextlib.redirect_stderr(private_log),
                      contextlib.closing(Boto3R2Store(bucket="baibai-stores")) as store,
                  ):
                      require(os.environ.get("GITHUB_RUN_ATTEMPT") == "1", "first_attempt_only")
                      public, private = inspect(store)
                      with private_file(directory / "margin-diagnosis-private.json") as stream:
                          json.dump(private, stream, sort_keys=True)
              except Exception as error:  # noqa: BLE001 - 私有情報を公開tracebackへ漏らさない最外境界。
                  public = {
                      "diagnostic_completed": False,
                      "remote_writes": False,
                      "provider_requests": False,
                      "error_type": type(error).__name__,
                  }
                  if isinstance(error, DiagnosisFailure):
                      public["reason"] = str(error)
              output.write(
                  json.dumps({"at": datetime.now(UTC).isoformat(), **public}, sort_keys=True)
                  + "\n"
              )
              return 0 if public["diagnostic_completed"] else 1
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          PY_DIAGNOSE
          uv run python "$RUNNER_TEMP/margin_alerts_diagnose_once.py"
