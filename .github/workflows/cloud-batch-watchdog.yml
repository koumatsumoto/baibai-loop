name: cloud-batch-watchdog

on:
  schedule:
    - cron: "0 12 * * *" # Acquisition (07:43/08:43/09:13 UTC), including weekends.
    - cron: "0 16 * * *" # Common integration (13:43 UTC); queued/running is not missing.
  workflow_dispatch:
    inputs:
      check_date:
        description: "Optional YYYY-MM-DD; evaluate the window a scheduled run on that date would have used"
        required: false
        type: string

permissions:
  contents: read
  actions: read

# The watchdog only reads run history and posts a message, so it must never wait
# behind (or hold up) the publish pipeline it is watching.
concurrency:
  group: cloud-batch-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '0 16 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The watchdog scripts must import on the runner's system python3: this job
      # deliberately installs nothing, so a dependency creeping in would only
      # surface at the moment an alert is due.
      - name: Smoke-check watchdog scripts
        id: smoke
        env:
          PYTHONPATH: jobs/src
        run: python3 -c "import baibai_jobs.observability.watchdog; import baibai_jobs.validation.workflow_inputs"

      # Validate the untrusted dispatch value before any credential-bearing step.
      # The scheduled event supplies an empty value, which is valid.
      - name: Validate dispatch input
        id: validate-input
        env:
          WATCHDOG_CHECK_DATE: ${{ inputs.check_date }}
          PYTHONPATH: jobs/src
        run: |
          python3 -m baibai_jobs.validation.workflow_inputs watchdog \
            --check-date "$WATCHDOG_CHECK_DATE"
          echo "check_date=$WATCHDOG_CHECK_DATE" >> "$GITHUB_OUTPUT"

      - name: Fetch common integration workflow history
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/cloud-daily-batch.yml/runs" \
            -f per_page=100 -f branch=main \
            > "$RUNNER_TEMP/daily-batch-runs.json"

      - name: "Alert Discord #batch-runs when the integration job is missing"
        id: watchdog
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WATCHDOG_CHECK_DATE: ${{ steps.validate-input.outputs.check_date }}
          PYTHONPATH: jobs/src
        run: |
          # $WATCHDOG_CHECK_DATE carries the dispatch input safely as a variable;
          # never interpolate inputs.* into this run block (script injection).
          python3 -m baibai_jobs.observability.watchdog \
            --read-run-results \
            --runs-json "$RUNNER_TEMP/daily-batch-runs.json" \
            --check-date "$WATCHDOG_CHECK_DATE"

  economic:
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '0 12 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read economic source workflow history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/cloud-economic-sources.yml/runs" \
            -f per_page=100 -f branch=main > "$RUNNER_TEMP/economic-runs.json"
      - name: Report a missing complete economic run, including weekends
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WATCHDOG_CHECK_DATE: ${{ inputs.check_date }}
          PYTHONPATH: jobs/src
        run: |
          python3 -m baibai_jobs.validation.workflow_inputs watchdog --check-date "$WATCHDOG_CHECK_DATE"
          python3 -m baibai_jobs.observability.watchdog --economic --read-run-results \
            --runs-json "$RUNNER_TEMP/economic-runs.json" --check-date "$WATCHDOG_CHECK_DATE"

  market:
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '0 12 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read market acquisition slot history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/cloud-market-sources.yml/runs" -f per_page=100 -f branch=main > "$RUNNER_TEMP/market-runs.json"
      - name: Report missing market acquisition slots together
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WATCHDOG_CHECK_DATE: ${{ inputs.check_date }}
          PYTHONPATH: jobs/src
        run: |
          python3 -m baibai_jobs.validation.workflow_inputs watchdog --check-date "$WATCHDOG_CHECK_DATE"
          python3 -m baibai_jobs.observability.watchdog --market --read-run-results --runs-json "$RUNNER_TEMP/market-runs.json" --check-date "$WATCHDOG_CHECK_DATE"
