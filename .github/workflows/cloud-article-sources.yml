name: cloud-article-sources

on:
  schedule:
    # Six slots/day; 13:13 UTC precedes the independent 13:43 daily integration.
    - cron: '13 1,5,9,13,17,21 * * *'
  workflow_dispatch:
    inputs:
      group:
        description: '取得group（scheduledは定期と同じTSR・日銀のみ。重複・cooldownは維持）'
        type: choice
        default: all
        options: [all, public, world, rakuten, scheduled]
      operation:
        description: '通常取得、または切替前の固定BOJ保留だけを読取検証'
        type: choice
        default: acquire
        options: [acquire, verify_boj_pending]
      boj_stage_id:
        description: 'verify_boj_pending専用の固定BOJ stage ID'
        type: string
      boj_manifest_sha256:
        description: 'verify_boj_pending専用の固定manifest SHA-256'
        type: string

permissions:
  contents: read

jobs:
  acquire:
    if: >-
      ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch'
      && (inputs.operation || 'acquire') == 'acquire' && !inputs.boj_stage_id && !inputs.boj_manifest_sha256) }}
    env:
      UV_NO_DEV: "true"
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON((github.event_name == 'schedule' || inputs.group == 'scheduled') && '["scheduled"]' || '["public","world","rakuten"]') }}
    # Scheduled and manual public share one queue; manual Toushiru keeps its own.
    # No global provider barrier, publication lease, or model calculation here.
    concurrency:
      group: source-host-${{ (matrix.group == 'public' || matrix.group == 'scheduled') && 'article-public' || matrix.group }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select group before credentials
        id: scope
        env:
          REQUESTED_GROUP: ${{ inputs.group || 'all' }}
          GROUP: ${{ matrix.group }}
        run: |
          case "$REQUESTED_GROUP" in all|public|world|rakuten|scheduled) ;; *) exit 2 ;; esac
          if [ "$REQUESTED_GROUP" = all ] || [ "$REQUESTED_GROUP" = "$GROUP" ]; then
            echo 'selected=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.scope.outputs.selected == 'true'
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.scope.outputs.selected == 'true'
        with:
          enable-cache: true
      - run: uv sync --locked
        if: steps.scope.outputs.selected == 'true'
      - name: Pin original slot and reserve private staging time
        id: clock
        if: steps.scope.outputs.selected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')"
          printf 'created_at=%s\n' "$created_at" >> "$GITHUB_OUTPUT"
          echo "BAIBAI_ACQUISITION_DEADLINE=$(( $(date +%s) + 15 * 60 ))" >> "$GITHUB_ENV"
      - name: Acquire due sources and save each partial privately
        if: steps.scope.outputs.selected == 'true'
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GROUP: ${{ matrix.group }}
          CREATED_AT: ${{ steps.clock.outputs.created_at }}
          IDENTITY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          args=(--group "$GROUP" --created-at "$CREATED_AT" --identity "$IDENTITY")
          uv run python -m baibai_jobs.acquisition.articles "${args[@]}" \
            --directory "$RUNNER_TEMP/article-handoffs"

  verify-boj-pending:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && github.run_attempt == '1' && inputs.operation == 'verify_boj_pending' }}
    # The snapshot must not overlap another ordinary BOJ acquisition.
    concurrency:
      group: source-host-article-public
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      UV_NO_DEV: "true"
      BOJ_STAGE_ID: ${{ inputs.boj_stage_id }}
      BOJ_MANIFEST_SHA256: ${{ inputs.boj_manifest_sha256 }}
    steps:
      - name: Validate the exact BOJ target before credentials
        id: verify-input
        run: |
          if [[ "$GITHUB_REPOSITORY" != koumatsumoto/baibai-loop || "$GITHUB_EVENT_NAME" != workflow_dispatch ||
                "$GITHUB_REF" != refs/heads/main || "$GITHUB_RUN_ATTEMPT" != 1 ||
                ! "$BOJ_STAGE_ID" =~ ^boj_news-[A-Za-z0-9][A-Za-z0-9_-]{0,110}$ ||
                ! "$BOJ_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Exact current-main BOJ stage and digest required' >&2
            exit 2
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm the exact main event checkout
        id: verify-checkout
        run: |
          test -n "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Verify the fixed pending BOJ seeds without acquiring or exporting originals
        id: verify-pending
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          uv run python -m baibai_jobs.acquisition.articles verify-boj-pending \
            --stage-id "$BOJ_STAGE_ID" --manifest-sha256 "$BOJ_MANIFEST_SHA256"
