name: minkabu bounded header comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    concurrency:
      group: source-host-minkabu
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - run: uv sync --locked
      - name: Compare four ordinary requests without secrets or network configuration changes
        run: uv run python tools/diagnose_minkabu_headers.py
