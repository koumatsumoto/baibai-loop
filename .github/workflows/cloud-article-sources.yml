name: minkabu offline environment comparison
on:
  workflow_dispatch:
    inputs:
      group:
        type: choice
        options: [minkabu]
        default: minkabu
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - run: uv sync --locked
      - name: Inspect effective settings without provider requests
        run: uv run python tools/diagnose_minkabu_environment.py
