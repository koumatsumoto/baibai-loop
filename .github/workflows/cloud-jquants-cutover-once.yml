name: cloud-jquants-cutover-once

# One finite migration of retained originals. Never a recurring acquisition job.
on:
  push:
    branches: [codex/issue1820-jquants-cutover-once]
    paths: [.github/workflows/cloud-jquants-cutover-once.yml]

permissions:
  contents: read

concurrency:
  group: cloud-publish
  queue: max
  cancel-in-progress: false

jobs:
  cutover:
    if: >-
      ${{ github.repository == 'koumatsumoto/baibai-loop' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/codex/issue1820-jquants-cutover-once' &&
          github.run_attempt == 1 &&
          github.event.head_commit.message == 'ops: run one-off J-Quants native migration 2026-11-05' }}
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Require the reviewed merged code as the exact base
        env:
          EXPECTED_CODE_SHA: 3156e32ba63739c308db152d808b856244e8cfa8
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_CODE_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Migrate fixed originals and read every native pack back
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          uv run python - <<'PY'
          """正規ownerによる一回限りのJ-Quants原本移行。canonicalと旧原本は変更しない。"""
          
          from __future__ import annotations
          
          import base64
          import contextlib
          import gc
          import hashlib
          import json
          import os
          import sqlite3
          import sys
          import tempfile
          from datetime import UTC, date, datetime
          from pathlib import Path
          
          from baibai_engine.data_collection.providers.jquants.calendar_native import CalendarL1
          from baibai_engine.data_collection.providers.jquants.financial_native import FinancialL1
          from baibai_engine.data_collection.providers.jquants.master_native import MasterL1
          from baibai_engine.data_collection.providers.jquants.price_native import PriceL1
          from baibai_engine.storage.json import write_json_atomic
          from baibai_engine.storage.objects.r2 import Boto3R2Store, LakePublishError
          from baibai_engine.storage.snapshots.duck import lake_session
          from baibai_engine.storage.snapshots.objects import LakeObjectCache
          from baibai_engine.storage.snapshots.reader import resolve_release
          from baibai_engine.storage.snapshots.release import LakeReleasePointer
          from baibai_engine.storage.snapshots.sources import sha256_file
          from baibai_jobs.acquisition.receipts import available_handoffs
          from baibai_jobs.maintenance import calendar_native_cutover as calendar
          from baibai_jobs.maintenance import financial_native_cutover as financial
          from baibai_jobs.maintenance import master_native_cutover as master
          from baibai_jobs.maintenance import price_native_cutover as price
          from baibai_jobs.maintenance.economic_cutover import _read
          from baibai_jobs.publication import lease
          
          POINTER = "lake/pointers/market/current.json"
          MANIFEST = "machine-manifest.json"
          SOURCES = (
              ("calendar", calendar, CalendarL1, ("jquants-market", "tradingview")),
              ("financial", financial, FinancialL1, ("jquants-financial",)),
              ("master", master, MasterL1, ("jquants-market", "tradingview")),
              ("price", price, PriceL1, ("jquants-market",)),
          )
          
          
          class FixedStore:
              """Read any retained input; write only the four native namespaces and private evidence."""
          
              def __init__(self, store, guard, prefix):
                  self.store, self.guard, self.prefix = store, guard, prefix
          
              def head(self, key):
                  return self.store.head(key)
          
              def get_bytes(self, key):
                  return self.store.get_bytes(key)
          
              def read_bytes(self, key):
                  return self.store.get_bytes(key)
          
              def iter_objects(self, prefix):
                  return self.store.iter_objects(prefix)
          
              def download_file(self, key, path, *, max_bytes=None, **kwargs):
                  if max_bytes is not None:
                      kwargs.setdefault("expect_bytes", max_bytes)
                  return self.store.download_file(key, path, **kwargs)
          
              def put_file(self, key, path, **kwargs):
                  prefixes = tuple(module.PREFIX for _, module, _, _ in SOURCES)
                  if not key.startswith((*prefixes, self.prefix)):
                      raise ValueError("write outside the native migration scope")
                  if key.endswith("/head.json") and key.startswith(prefixes):
                      if not kwargs.get("if_none_match") and not kwargs.get("if_match"):
                          raise ValueError("native head requires its conditional write")
                  elif not kwargs.get("if_none_match"):
                      raise ValueError("migration bodies and evidence must be immutable")
                  self.guard()
                  return self.store.put_file(key, path, **kwargs)
          
          
          def preserve(store, prefix, path):
              digest = sha256_file(path)
              key = prefix + "objects/" + digest
              if store.head(key) is None:
                  payload = path.read_bytes()
                  with contextlib.suppress(LakePublishError):
                      store.put_file(
                          key,
                          path,
                          sha256=digest,
                          content_md5=base64.b64encode(
                              hashlib.md5(payload, usedforsecurity=False).digest()
                          ).decode(),
                          content_type="application/octet-stream",
                          if_none_match=True,
                      )
              if hashlib.sha256(store.get_bytes(key)).hexdigest() != digest:
                  raise ValueError("private migration evidence failed readback")
              return {"key": key, "sha256": digest}
          
          
          def market_schema(store, etag):
              response = store._client().get_object(
                  Bucket=store.bucket, Key="market.sqlite", Range="bytes=0-99", IfMatch=etag
              )
              with contextlib.closing(response["Body"]) as body:
                  header = body.read(101)
              if not response.get("ContentRange", "").startswith("bytes 0-99/") or len(header) != 100:
                  raise ValueError("market schema read was not a bounded SQLite header")
              if header[:16] != b"SQLite format 3\x00":
                  raise ValueError("market header is not SQLite")
              return int.from_bytes(header[60:64], "big")
          
          
          def model_asof(store, directory, pointer, etag):
              path = directory / "fixed-runs.sqlite"
              if _read(store, "runs.sqlite", path).etag != etag:
                  raise ValueError("model generation changed during fixed download")
              with contextlib.closing(
                  sqlite3.connect(path.resolve().as_uri() + "?mode=ro", uri=True)
              ) as conn:
                  row = conn.execute(
                      "SELECT header FROM model_generation WHERE generation_id=?",
                      ("models-" + pointer.release_id,),
                  ).fetchone()
              if row is None:
                  raise ValueError("fixed release lacks its matching model generation")
              saved = json.loads(row[0])
              source = saved["inputs"]["market"]
              if source["reference"] != pointer.release_id or source["sha256"] != pointer.manifest_sha256:
                  raise ValueError("model generation differs from the fixed release")
              return date.fromisoformat(saved["as_of"])
          
          
          def execute(
              store,
              directory,
              prefix,
              *,
              schema_reader=market_schema,
              asof_reader=model_asof,
              sources=SOURCES,
              emit=lambda **_: None,
          ):
              directory.mkdir(parents=True, exist_ok=False)
              handle, _ = lease.acquire(store, "operator")
              phase = "pin_base"
              report = {"migration_completed": False, "lease_released": False, "flags_changed": False}
              evidence = {}
              guarded = None
              try:
                  tracked = ("market.sqlite", "runs.sqlite", MANIFEST, POINTER)
                  heads = {key: store.head(key) for key in tracked}
                  if any(head is None for head in heads.values()):
                      raise ValueError("required canonical base is missing")
                  etags = {key: head.etag for key, head in heads.items()}
                  manifest = json.loads(store.get_bytes(MANIFEST))
                  if manifest.get("schema_version") != 1 or manifest.get("keys") != {
                      key: etags[key] for key in ("market.sqlite", "runs.sqlite")
                  }:
                      raise ValueError("requires completed market cutover two-key bundle")
                  if schema_reader(store, etags["market.sqlite"]) != 50:
                      raise ValueError("requires completed market schema50")
                  pointer = LakeReleasePointer.model_validate_json(store.get_bytes(POINTER))
                  asof = asof_reader(store, directory, pointer, etags["runs.sqlite"])
                  known_at = datetime.now(UTC)
          
                  def guard():
                      lease.verify_held(store, handle)
                      for key, etag in etags.items():
                          current = store.head(key)
                          if current is None or current.etag != etag:
                              raise ValueError("fixed canonical base changed")
          
                  guard()
                  guarded = FixedStore(store, guard, prefix)
                  cache = LakeObjectCache(root=directory / "mirror", source=guarded)
                  release = resolve_release(
                      cache.source, pointer.release_id, manifest_sha256=pointer.manifest_sha256
                  )
                  context = directory / "context.json"
                  write_json_atomic(
                      context,
                      {
                          "base": etags,
                          "release": pointer.model_dump(mode="json"),
                          "as_of": asof.isoformat(),
                          "known_at": known_at.isoformat(),
                      },
                  )
                  evidence["context"] = preserve(guarded, prefix, context)
          
                  def checkpoint():
                      index = directory / "evidence.json"
                      write_json_atomic(index, {"phase": phase, "files": evidence, "report": report})
                      saved = preserve(guarded, prefix, index)
                      # The fixed name is a create-only discovery pointer for this checkpoint.
                      destination = prefix + "checkpoints/" + saved["sha256"] + ".json"
                      payload = index.read_bytes()
                      if guarded.head(destination) is None:
                          with contextlib.suppress(LakePublishError):
                              guarded.put_file(
                                  destination,
                                  index,
                                  sha256=saved["sha256"],
                                  content_md5=base64.b64encode(
                                      hashlib.md5(payload, usedforsecurity=False).digest()
                                  ).decode(),
                                  content_type="application/json",
                                  if_none_match=True,
                              )
                      if guarded.get_bytes(destination) != payload:
                          raise ValueError("migration checkpoint failed readback")
          
                  plans = {}
                  for name, module, _, _ in sources:
                      phase = "prepare_" + name
                      guard()
                      with lake_session() as session:
                          plan = module.prepare_migration(
                              session,
                              release=release,
                              cache=cache,
                              store=guarded,
                              known_at=known_at,
                              directory=directory / name,
                          )
                      plans[name] = plan
                      evidence[name + "_plan"] = preserve(guarded, prefix, directory / name / "plan.json")
                      report[name + "_plan_blocked"] = bool(plan["blocked"])
                      report[name + "_has_originals"] = bool(plan["attempts"])
                      checkpoint()
                      emit(
                          phase=phase,
                          plan_blocked=bool(plan["blocked"]),
                          originals_present=bool(plan["attempts"]),
                      )
                      gc.collect()
                  if any(plan["blocked"] or not plan["attempts"] for plan in plans.values()):
                      raise ValueError("finite preparation has unresolved originals")
                  phase = "validate_stage_boundary"
                  for name, _, _, groups in sources:
                      current = [
                          entry
                          for source in groups
                          for entry in available_handoffs(guarded, source=source, include_integrated=True)
                      ]
                      if current != plans[name]["handoffs"]:
                          raise ValueError("handoff set changed after finite preparation")
                  guard()
                  for name, module, owner_class, _ in sources:
                      phase = "apply_" + name
                      owner = owner_class(guarded, directory / (name + "-writer"))
                      if guarded.head(module.PREFIX + "head.json") is None:
                          owner.initialize()  # The owner refuses any nonempty namespace.
                      result = module.apply_migration(owner, directory=directory / name)
                      cold_owner = owner_class(guarded, directory / (name + "-cold"))
                      module.verify_migration(cold_owner, directory=directory / name)
                      evidence[name + "_applied"] = preserve(
                          guarded, prefix, directory / name / "applied.json"
                      )
                      report[name + "_raw_readback_verified"] = True
                      report[name + "_held_present"] = bool(result["held"])
                      checkpoint()
                      emit(
                          phase=phase, all_originals_readback_verified=True, held_present=bool(result["held"])
                      )
                      gc.collect()
                  for name, module, owner_class, _ in sources:
                      phase = "compare_" + name
                      kwargs = {}
                      if name == "price":
                          kwargs = {
                              "as_of": asof,
                              "calendar": CalendarL1(guarded, directory / "calendar-compare").fixed(),
                          }
                      with lake_session() as session:
                          comparison = module.compare_projection(
                              session,
                              release=release,
                              cache=cache,
                              owner=owner_class(guarded, directory / (name + "-compare")),
                              directory=directory / name,
                              **kwargs,
                          )
                      evidence[name + "_comparison"] = preserve(
                          guarded, prefix, directory / name / "comparison.json"
                      )
                      report[name + "_projection_matches"] = not bool(comparison["differences"])
                      if name == "price":
                          report["price_publication_complete"] = comparison["coverage_status"] == "complete"
                      checkpoint()
                      emit(phase=phase, projection_matches=report[name + "_projection_matches"])
                      del comparison
                      gc.collect()
                  guard()
                  report.update(
                      migration_completed=True,
                      canonical_unchanged=True,
                      old_originals_retained=True,
                      native_activation_ready=all(
                          report[name + "_projection_matches"] and not report[name + "_held_present"]
                          for name, _, _, _ in sources
                      )
                      and report.get("price_publication_complete", True),
                  )
                  phase = "complete"
                  checkpoint()
              except Exception as error:
                  report.update(failed_phase=phase, error_type=type(error).__name__)
                  if guarded is not None:
                      try:
                          failure = directory / "failure.json"
                          write_json_atomic(
                              failure, {"phase": phase, "error": str(error), "type": type(error).__name__}
                          )
                          preserve(guarded, prefix, failure)
                      except Exception:
                          report["failure_evidence_unavailable"] = True
              finally:
                  try:
                      lease.release(store, handle)
                      report["lease_released"] = True
                  except Exception as error:
                      report["lease_release_error_type"] = type(error).__name__
              return report
          
          
          def main():
              run_id = os.environ.get("GITHUB_RUN_ID", "")
              if not run_id.isdigit() or os.environ.get("GITHUB_RUN_ATTEMPT") != "1":
                  print(json.dumps({"refused": True}))
                  return 1
              public = sys.stdout
          
              def emit(**value):
                  print(json.dumps(value, sort_keys=True), file=public, flush=True)
          
              directory = Path(tempfile.mkdtemp(prefix="jquants-native-cutover-"))
              try:
                  with (
                      (directory / "private.log").open("w") as private,
                      contextlib.redirect_stdout(private),
                      contextlib.redirect_stderr(private),
                      contextlib.closing(Boto3R2Store(bucket="baibai-stores")) as store,
                  ):
                      report = execute(
                          store,
                          directory / "migration",
                          f"coordination/cutovers/jquants-native/{run_id}/",
                          emit=emit,
                      )
              except Exception as error:
                  report = {"migration_completed": False, "error_type": type(error).__name__}
              emit(**report)
              return 0 if report.get("migration_completed") and report.get("lease_released") else 1
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          PY
