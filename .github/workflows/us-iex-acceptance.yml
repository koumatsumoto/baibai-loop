name: us-iex-acceptance

on:
  workflow_dispatch:
    inputs:
      expected_date:
        description: "New York price session (YYYY-MM-DD; ignored for assets)"
        required: true
        type: string
      feed:
        description: "Check Alpaca assets, or verify IEX/SIP sample prices"
        type: choice
        default: iex
        options: [iex, sip, assets]

permissions:
  contents: read

jobs:
  check-iex-session:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'koumatsumoto/baibai-loop' && github.ref == 'refs/heads/main' && inputs.feed == 'iex' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Prepare locked dependencies
        run: uv sync --locked --no-dev

      - name: Verify IEX session dates without retaining price data
        env:
          EXPECTED_NY_DATE: ${{ inputs.expected_date }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: uv run --offline --no-sync python -m tools.experiments.us_iex_acceptance --expected-date="$EXPECTED_NY_DATE"

  check-sip-session:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'koumatsumoto/baibai-loop' && github.ref == 'refs/heads/main' && inputs.feed == 'sip' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check historical SIP access without retaining prices
        env:
          EXPECTED_NY_DATE: ${{ inputs.expected_date }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import UTC, date, datetime, time, timedelta
          from math import isfinite
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import HTTPRedirectHandler, Request, build_opener
          from zoneinfo import ZoneInfo
          
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          ny = ZoneInfo("America/New_York")
          try:
              expected = date.fromisoformat(os.environ["EXPECTED_NY_DATE"])
              if expected.isoformat() != os.environ["EXPECTED_NY_DATE"]:
                  raise ValueError
          except ValueError:
              raise SystemExit("status=invalid_date") from None
          start = datetime.combine(expected, time.min, ny)
          end = datetime.combine(expected, time(19), ny)
          if datetime.now(UTC) < end + timedelta(minutes=15):
              raise SystemExit("status=awaiting_historical_window")
          headers = {
              "APCA-API-KEY-ID": os.environ.get("APCA_API_KEY_ID", ""),
              "APCA-API-SECRET-KEY": os.environ.get("APCA_API_SECRET_KEY", ""),
          }
          if not all(headers.values()):
              raise SystemExit("status=missing_credentials")
          # NVDA is Nasdaq-listed; KO is NYSE-listed. This is a coverage sample, not the universe.
          symbols = ("NVDA", "KO")
          params = urlencode(dict(symbols=",".join(symbols), timeframe="1Day",
                                  start=start.isoformat(), end=end.isoformat(), feed="sip",
                                  currency="USD", adjustment="raw", asof="-"))
          request = Request("https://data.alpaca.markets/v2/stocks/bars?" + params, headers=headers)
          try:
              with build_opener(NoRedirect()).open(request, timeout=15) as response:
                  response_status = response.status
                  body = response.read(262145)
              if response_status != 200 or len(body) > 262144:
                  raise ValueError
              payload = json.loads(body)
              if payload["next_page_token"] is not None or not isinstance(payload["bars"], dict):
                  raise ValueError
              bars = payload["bars"]
              if set(bars) - set(symbols):
                  raise ValueError
              def valid_daily_bar(rows):
                  if not isinstance(rows, list) or len(rows) != 1:
                      return False
                  row = rows[0]
                  stamp = datetime.fromisoformat(row["t"])
                  if stamp.utcoffset() is None or stamp.astimezone(ny) != start:
                      return False
                  o, h, low, c, volume = (row[key] for key in ("o", "h", "l", "c", "v"))
                  if any(type(value) not in (int, float) or not isfinite(value)
                         for value in (o, h, low, c, volume)):
                      return False
                  return 0 < low <= min(o, c) <= max(o, c) <= h and volume >= 0
          
              matched = [symbol for symbol in symbols if valid_daily_bar(bars.get(symbol, []))]
          except HTTPError as error:
              raise SystemExit(f"feed=sip status=http_error http_status={error.code}") from None
          except (URLError, OSError, ValueError, KeyError, TypeError, AttributeError, OverflowError):
              raise SystemExit("feed=sip status=invalid_or_incomplete_response") from None
          print(f"feed=sip session={expected} symbols_ok={len(matched)}/{len(symbols)} "
                f"matched={','.join(matched) or '-'}")
          raise SystemExit(0 if len(matched) == len(symbols) else 1)
          PY

  check-assets:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'koumatsumoto/baibai-loop' && github.ref == 'refs/heads/main' && inputs.feed == 'assets' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Prepare locked dependencies
        run: uv sync --locked --no-dev

      - name: Count active US equity assets without retaining the listing
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          uv run --offline --no-sync python - <<'PY'
          import json
          from collections import Counter
          from datetime import UTC, datetime
          from time import monotonic
          
          from httpx2 import HTTPTransport
          
          from baibai_engine.data_collection.providers.alpaca_http import receive_paper_us_assets
          from baibai_jobs.integration.us_daily_handoff import alpaca_paper_credentials_from_env
          
          started = monotonic()
          try:
              credentials = alpaca_paper_credentials_from_env()
          except ValueError:
              raise SystemExit("assets status=missing_credentials") from None
          try:
              with HTTPTransport(trust_env=False, retries=0) as transport:
                  receipt = receive_paper_us_assets(
                      credentials=credentials,
                      transport=transport,
                      clock=lambda: datetime.now(UTC),
                  )
          except OSError:
              raise SystemExit("assets status=transport_or_http_failure") from None
          except ValueError:
              raise SystemExit("assets status=invalid_or_incomplete_response") from None
          rows = receipt.assets
          print(json.dumps({
              "source": "alpaca_paper_assets",
              "received_at": receipt.received_at.isoformat(),
              "elapsed_ms": round((monotonic() - started) * 1000),
              "bytes": len(receipt.body),
              "asset_count": len(rows),
              "tradable_count": sum(row.tradable for row in rows),
              "by_exchange": dict(sorted(Counter(row.exchange for row in rows).items())),
          }))
          PY
