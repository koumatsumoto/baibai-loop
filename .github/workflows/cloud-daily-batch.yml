name: cloud-daily-batch
# Display the requested recovery day. The watchdog reads the actual notice as-of
# from the terminal step result, including for delayed starts and reruns.
run-name: "daily ${{ inputs.asof || '' }}"

on:
  schedule:
    # 22:43 JST, independently of every acquisition workflow. Late receipts wait
    # for the next integration; weekends still compose macro/Reading/Research.
    - cron: "43 13 * * *"
  workflow_dispatch:
    inputs:
      asof:
        description: "Optional YYYY-MM-DD; Screening still applies the business-day gate"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: common-source-integration
  queue: max
  cancel-in-progress: false

jobs:
  daily:
    concurrency:
      group: cloud-publish
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    # Offline integration, materialization and publication fit within the 120-minute lease.
    timeout-minutes: 110

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The notification script must import on the runner's system python3
      # (before setup-python), so the final notification step can run it without
      # uv. The import is what guarantees the stdlib-only / no-3.13-syntax contract.
      - name: Smoke-check notification script
        id: smoke
        env:
          PYTHONPATH: jobs/src
        run: python3 -c "import baibai_jobs.observability.discord"

      # Validate the untrusted dispatch value before any credential-bearing step.
      # The scheduled event supplies an empty value, which is valid.
      - name: Validate dispatch input
        id: validate-input
        env:
          MANUAL_ASOF: ${{ inputs.asof }}
          PYTHONPATH: jobs/src
        run: |
          python3 -m baibai_jobs.validation.workflow_inputs daily --asof "$MANUAL_ASOF"
          echo "asof=$MANUAL_ASOF" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        id: setup-uv
        with:
          enable-cache: true

      - name: Sync Python environment
        id: sync
        run: uv sync --locked

      # The lake reads Parquet over R2 through DuckDB's httpfs extension, and runtime
      # sessions disable extension downloads outright — a read path that could fetch
      # executable code on demand is not one that fails closed. The install happens here,
      # before credentials are present, so a missing extension is a setup failure with
      # nothing published rather than a data failure part-way through a run.
      # failure policy: 2 — screening cannot read the published L1 release without httpfs.
      - name: Provision DuckDB httpfs extension
        id: duckdb-httpfs
        run: uv run python -m tools.diagnostics.provision_duckdb_httpfs

      - name: Pin the original integration run clock
        id: clock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')"
          printf 'created_at=%s\n' "$created_at" >> "$GITHUB_OUTPUT"

      - name: Freeze currently ready source handoffs
        id: source-plan
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MANUAL_ASOF: ${{ steps.validate-input.outputs.asof }}
          RUN_CREATED_AT: ${{ steps.clock.outputs.created_at }}
        run: |
          asof="$MANUAL_ASOF"
          if [ -z "$asof" ]; then asof=$(uv run python -c 'import os; from datetime import datetime; from baibai_jobs.jobs.schedule import integration_target_date; print(integration_target_date(datetime.fromisoformat(os.environ["RUN_CREATED_AT"]), scheduled=os.environ["GITHUB_EVENT_NAME"] == "schedule"))'); fi
          echo "asof=$asof" >> "$GITHUB_OUTPUT"
          uv run python -m baibai_jobs.jobs.source_integration plan --directory "$RUNNER_TEMP/integration"

      - name: Acquire publication lease
        id: lease-acquire
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: uv run python -m baibai_jobs.storage.publication_lease acquire --purpose daily --handle "$RUNNER_TEMP/publication-lease-handle.json"

      # failure policy: 1 — the batch cannot compute without the canonical stores.
      - name: Pull stores
        id: pull
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          jobs/scripts/r2_transfer.sh pull-machine
          jobs/scripts/r2_transfer.sh pull-app

      # The market store arrives holding only what the lake does not own — the coverage
      # ledger and the operator-derived tables. Filling the rest from the current release
      # is what makes it the store every reader already expects. It fails closed on the
      # published row counts, so a fill that silently did nothing cannot reach screening
      # as an empty universe.
      # failure policy: 2 — incomplete hydration would make the screening output invalid.
      - name: Hydrate market store from the L1 release
        id: hydrate
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: jobs/scripts/r2_transfer.sh hydrate-market

      - name: Apply fixed original receipts and common offline extraction
        id: source-integration
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ASOF: ${{ steps.source-plan.outputs.asof }}
        run: uv run python -m baibai_jobs.jobs.source_integration apply --asof "$ASOF" --directory "$RUNNER_TEMP/integration"

      # failure policy: 1 — an unsafe store or failed full export cannot be published.
      - name: Run common integration job
        id: batch
        shell: bash
        env:
          INTEGRATION_ASOF: ${{ steps.source-plan.outputs.asof }}
        run: |
          args=(--saved-inputs --asof "$INTEGRATION_ASOF" --output-dir "$RUNNER_TEMP/serving" --notice-output "$RUNNER_TEMP/batch-notice.json")
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            args+=(--scheduled)
          fi
          set +e
          uv run baibai-jobs daily "${args[@]}"
          code=$?
          set -e
          # Finalize the outputs BEFORE any fatal exit so the notification step
          # can still see the batch exit code and the local export state.
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [[ -f "$RUNNER_TEMP/serving/views/meta.json" ]]; then
            echo "export_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "export_ready=false" >> "$GITHUB_OUTPUT"
          fi
          # Common integration can change facts before the daily observer runs.
          python3 - <<'PYNOTICE' >> "$GITHUB_OUTPUT"
          import json
          import os
          import sys
          from datetime import date
          from pathlib import Path

          market_updated = True
          asof = "unknown"
          try:
              notice = json.loads((Path(os.environ["RUNNER_TEMP"]) / "batch-notice.json").read_text())
              if isinstance(notice, dict) and isinstance(notice.get("asof"), str):
                  candidate = notice["asof"]
                  try:
                      if date.fromisoformat(candidate).isoformat() == candidate:
                          asof = candidate
                  except ValueError:
                      pass
              value = notice.get("market_updated") if isinstance(notice, dict) else None
              if not isinstance(value, bool):
                  raise ValueError
              market_updated = True  # Common replay/extraction preceded the daily observer.
          except (OSError, ValueError):
              print("::warning::Daily notice unavailable or invalid; continuing L1 publication.", file=sys.stderr)
          print("market_updated=" + str(market_updated).lower())
          print("asof=" + asof)
          PYNOTICE
          if [[ $code -ne 0 && $code -ne 3 ]]; then
            exit "$code"
          fi

      # Publish before the store push, never after. A store push whose publication then
      # failed would leave the cloud holding a store that claims today's coverage while
      # the rows behind it exist only locally — and coverage saying "already fetched" is
      # exactly what stops the next run from repairing it.
      # failure policy: 2 — a broken release would corrupt the next hydration input.
      - name: Publish the L1 release
        id: publish-lake
        if: steps.batch.outputs.export_ready == 'true' && steps.batch.outputs.market_updated == 'true'
        env:
          PUBLICATION_LEASE_HANDLE: ${{ runner.temp }}/publication-lease-handle.json
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail
          jobs/scripts/r2_transfer.sh publish-lake \
            | tee "$RUNNER_TEMP/lake-publish-report.json"

      # The store push runs first and the views mirror only after it succeeded. The two
      # ran together while the views side — 54MB across 3,740 objects, request-bound —
      # was the longer of the two by a wide margin and the wall clock was what the
      # ordering was chosen on. What that traded away is the direction of the partial
      # state a failure leaves: a machine push that failed beside a views upload that
      # succeeded leaves `views/` describing a run no remote store holds, and it stands
      # until the next successful run replaces it. Serialised this way the surviving
      # mismatch is always the harmless one — views older than the store, never a store
      # older than the views.
      #
      # Only `views/` joins the store push. It is rewritten every business day, so a
      # run whose push fails leaves views the next run replaces. `history/` and
      # `meta.json` are published afterwards, once the store holding this run is
      # persisted, so no permanent record of an unpersisted run is ever written.
      # failure policy: 2 — views must never describe a run absent from the remote store.
      - name: Upload machine stores and serving views
        id: upload-stores
        if: steps.batch.outputs.export_ready == 'true'
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Not a credential. Unset resolves to the script's default, so comparing
          # two in-flight counts on the real bucket is a repository variable rather
          # than a code change.
          R2_SERVING_UPLOAD_CONCURRENCY: ${{ vars.R2_SERVING_UPLOAD_CONCURRENCY }}
        run: |
          # Each side writes to its own log and both are printed once they are done,
          # so the store push's timing report stays readable next to the mirror's.
          machine_log="$RUNNER_TEMP/upload-machine.log"
          views_log="$RUNNER_TEMP/upload-views.log"
          machine_code=0
          jobs/scripts/r2_transfer.sh push-machine >"$machine_log" 2>&1 || machine_code=$?
          views_code=0
          views_ran=0
          if [[ $machine_code -eq 0 ]]; then
            views_ran=1
            jobs/scripts/r2_transfer.sh upload-serving-views "$RUNNER_TEMP/serving" \
              >"$views_log" 2>&1 || views_code=$?
          fi
          # A side that succeeded is folded away; a side that failed is printed
          # open, because a collapsed group is the first thing a reader opening a
          # red run has to fight past.
          print_log() {
            if [[ "$2" -eq 0 ]]; then
              echo "::group::$1"
              cat "$3"
              echo "::endgroup::"
            else
              echo "::error::$1 upload failed with exit $2"
              cat "$3"
            fi
          }
          print_log machine "$machine_code" "$machine_log"
          if [[ $views_ran -eq 1 ]]; then
            print_log views "$views_code" "$views_log"
          else
            echo "views upload not attempted: the store push failed first"
          fi
          # Written before the exit so the notification can tell which side failed;
          # a step killed by a timeout writes neither, which the notifier reads as
          # unknown rather than as "did not upload". `skipped` is written out rather
          # than left absent, so "the mirror never ran" and "the step never got to
          # say" stay distinguishable.
          if [[ $machine_code -eq 0 ]]; then
            echo "machine=success" >> "$GITHUB_OUTPUT"
          else
            echo "machine=failure" >> "$GITHUB_OUTPUT"
          fi
          if [[ $views_ran -eq 0 ]]; then
            echo "views=skipped" >> "$GITHUB_OUTPUT"
          elif [[ $views_code -eq 0 ]]; then
            echo "views=success" >> "$GITHUB_OUTPUT"
          else
            echo "views=failure" >> "$GITHUB_OUTPUT"
          fi
          # The transfer script distinguishes its exits (2 is a refused contract,
          # 126/127 a launch failure), so one of them is carried out rather than
          # flattened to 1.
          if [[ $machine_code -ne 0 ]]; then
            exit "$machine_code"
          fi
          if [[ $views_code -ne 0 ]]; then
            exit "$views_code"
          fi

      # failure policy: 2 — history must never record a run whose stores were not persisted.
      - name: Publish serving history and freshness
        id: publish-serving
        if: steps.upload-stores.outcome == 'success'
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: jobs/scripts/r2_transfer.sh publish-serving-tail "$RUNNER_TEMP/serving"

      - name: Verify economic accepted receipts and seal canonical handoffs
        id: source-seal
        if: ${{ always() && steps.upload-stores.outputs.machine == 'success' && steps.publish-lake.outcome == 'success' }}
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          jobs/scripts/r2_transfer.sh pull-indicators
          uv run python -m baibai_jobs.jobs.source_integration verify --directory "$RUNNER_TEMP/integration"
          uv run python -m baibai_jobs.jobs.source_integration seal --directory "$RUNNER_TEMP/integration" --lease-handle "$RUNNER_TEMP/publication-lease-handle.json"
      - name: Refresh source-scoped inputs from this canonical generation
        id: source-inputs
        if: ${{ always() && steps.source-seal.outcome == 'success' }}
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ASOF: ${{ steps.source-plan.outputs.asof }}
          IDENTITY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: uv run python -m baibai_jobs.jobs.source_integration inputs --asof "$ASOF" --identity "$IDENTITY" --directory "$RUNNER_TEMP/integration" --lease-handle "$RUNNER_TEMP/publication-lease-handle.json"
      - name: Report integration failures and deferred source inputs
        id: source-check
        if: ${{ always() && steps.source-seal.outcome == 'success' }}
        run: uv run python -m baibai_jobs.jobs.source_integration check --directory "$RUNNER_TEMP/integration"

      - name: Release publication lease
        id: lease-release
        if: ${{ always() && steps.lease-acquire.outputs.acquired == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: uv run python -m baibai_jobs.storage.publication_lease release --handle "$RUNNER_TEMP/publication-lease-handle.json"

      # `cancelled()` is a status-check function: it is only evaluated in an `if`
      # conditional, and interpolating it into a `run:` block makes the whole
      # workflow file invalid. Capture the state as a step output instead.
      - name: Record cancellation
        id: cancellation
        if: ${{ cancelled() }}
        run: echo "cancelled=true" >> "$GITHUB_OUTPUT"

      # Single notification point. Runs once for every terminal state after all
      # prior step outcomes are known. `always()` rather than `!cancelled()`:
      # GitHub reports a `timeout-minutes` expiry as a *cancellation*, and a hung
      # batch is exactly the silent failure this notification exists to catch —
      # `!cancelled()` would skip it. A manual cancel costs one extra
      # `[CANCELLED]` message, which is far cheaper than losing every timeout.
      # The webhook secret is scoped to this step only. A delivery failure never
      # fails the run: data/publication failures have their own step outcomes,
      # and a delivery failure must not overwrite them. A red job alone does not
      # prove publication never happened, since later steps can also fail.
      - name: "Notify Discord #batch-runs for ${{ steps.batch.outputs.asof || 'unknown' }}"
        id: notify
        if: ${{ always() }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SOURCE_INPUTS_OUTCOME: ${{ steps.source-inputs.outcome }}
          PYTHONPATH: jobs/src
        run: |
          python3 -m baibai_jobs.observability.discord \
            --notice-path "$RUNNER_TEMP/batch-notice.json" \
            --integration-report-path "$RUNNER_TEMP/integration/applied.json" \
            --batch-exit-code "${{ steps.batch.outputs.exit_code }}" \
            --smoke-outcome "${{ steps.smoke.outcome }}" \
            --setup-outcome "${{ steps.setup.outcome }}" \
            --sync-outcome "${{ steps.sync.outcome }}" \
            --lease-acquire-outcome "${{ steps.lease-acquire.outcome }}" \
            --pull-outcome "${{ steps.pull.outcome }}" \
            --hydrate-outcome "${{ steps.hydrate.outcome }}" \
            --publish-lake-outcome "${{ steps.publish-lake.outcome }}" \
            --upload-stores-outcome "${{ steps.upload-stores.outcome }}" \
            --publish-serving-outcome "${{ steps.publish-serving.outcome }}" \
            --source-integration-outcome "${{ steps.source-integration.outcome }}" \
            --source-seal-outcome "${{ steps.source-seal.outcome }}" \
            --source-inputs-outcome "$SOURCE_INPUTS_OUTCOME" \
            --source-check-outcome "${{ steps.source-check.outcome }}" \
            --lease-release-outcome "${{ steps.lease-release.outcome }}" \
            --cancelled "${{ steps.cancellation.outputs.cancelled || 'false' }}"
