name: cloud-daily-batch

on:
  schedule:
    # 16:43 JST. The only same-day requirement is the J-Quants daily-price update,
    # published around 16:30 JST, which `asof = today` depends on; the run keeps 13
    # minutes of margin. The JPX regulation pages are event-driven status pages the
    # coverage gate accepts for 7 business days, and the margin balances are weekly,
    # so neither needs the evening refresh — a designation landing after this run is
    # picked up the next business day.
    #
    # The odd minute is deliberate: GitHub concentrates scheduled work on :00 / :15 /
    # :30 / :45, and a schedule pinned there waits behind that queue.
    - cron: "43 7 * * 1-5"
  workflow_dispatch:
    inputs:
      asof:
        description: "Optional YYYY-MM-DD; skips the business-day gate for a manual rerun"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloud-publish
  queue: max
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    # Warm incremental runs target <=20min for the job and <=300s for EDINET extraction.
    # The wider ceiling covers the store-backup copy waiting out its own read timeout
    # and retries, so a stuck copy fails as a step
    # — with its error in the Discord notification — instead of expiring the job,
    # which GitHub reports as a cancellation with no cause attached.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Dependency-free notification scripts must import on the runner's system
      # python3 (before setup-python), so the final notification step can run
      # them without uv. The import (not just py_compile) is what guarantees the
      # stdlib-only / no-3.13-syntax contract. Also captures the run start time.
      - name: Smoke-check notification scripts
        id: smoke
        env:
          PYTHONPATH: batch/src
        run: |
          python3 -m py_compile batch/src/baibai_batch/observability/summary.py batch/src/baibai_batch/observability/discord.py
          python3 -c "import baibai_batch.observability.summary; import baibai_batch.observability.discord"
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_OUTPUT"

      # Validate the untrusted dispatch value before any credential-bearing step.
      # The scheduled event supplies an empty value, which is valid.
      - name: Validate dispatch input
        id: validate-input
        env:
          MANUAL_ASOF: ${{ inputs.asof }}
          PYTHONPATH: batch/src
        run: |
          python3 -m baibai_batch.validation.workflow_inputs daily --asof "$MANUAL_ASOF"
          echo "asof=$MANUAL_ASOF" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        id: setup-uv
        with:
          enable-cache: true

      - name: Sync Python environment
        id: sync
        run: uv sync --locked

      # The spglobal_pmi / nikkei providers fall back to a headless Chromium for
      # WAF-gated fetches. Cache the browser keyed on the pinned Playwright
      # version so the ~114MB binary is downloaded only when that version
      # changes, not on every run.
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version=$(uv run python -c \
            "import importlib.metadata as m; print(m.version('playwright'))")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium

      # This runs before credential-bearing steps. It proves the allowlisted browser
      # environment still starts in both the restored-cache and fresh-install paths.
      - name: Smoke-check isolated Chromium environment
        id: browser-smoke
        run: >-
          uv run python -c "from baibai_engine.macro.indicators.providers.browser import
          BrowserFetcher; fetcher=BrowserFetcher();
          content=fetcher.fetch_html('data:text/html,<p>baibai-browser-smoke</p>');
          fetcher.close(); assert 'baibai-browser-smoke' in content"

      - name: Pull stores
        id: pull
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          batch/scripts/r2_transfer.sh pull-machine
          batch/scripts/r2_transfer.sh pull-app

      - name: Run daily batch
        id: batch
        shell: bash
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          # Public JPX regulation pages (not secrets). bootstrap-cache requires
          # all four sources named by universe.required_jpx_flags.
          JPX_SPECIAL_CAUTION_INDEX_URL: https://www.jpx.co.jp/markets/statistics-equities/margin/index.html
          JPX_REORGANIZATION_URL: https://www.jpx.co.jp/listing/market-alerts/supervision/
          JPX_TRADING_HALT_URL: https://www.jpx.co.jp/markets/equities/suspended/
          JPX_DELISTING_WARNING_URL: https://www.jpx.co.jp/listing/stocks/delisted/
          MANUAL_ASOF: ${{ steps.validate-input.outputs.asof }}
        run: |
          args=(--output-dir "$RUNNER_TEMP/serving" --summary-output "$RUNNER_TEMP/batch-summary.json")
          if [[ -n "$MANUAL_ASOF" ]]; then
            args+=(--asof "$MANUAL_ASOF")
          fi
          set +e
          uv run baibai-batch daily "${args[@]}"
          code=$?
          set -e
          # Finalize the outputs BEFORE any fatal exit so the notification step
          # can still see the batch exit code and the local export state.
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [[ -f "$RUNNER_TEMP/serving/views/meta.json" ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "local_export=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "local_export=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ $code -ne 0 && $code -ne 3 ]]; then
            exit "$code"
          fi

      # The store push moves 1.88GB and is bandwidth-bound; the views mirror moves
      # 54MB across 3,740 objects and is request-bound. Run serially they add up
      # (248s + 282s measured); run together each fills the other's waiting.
      #
      # Only `views/` joins the store push. It is rewritten every business day, so a
      # run whose push fails leaves views the next run replaces. `history/` and
      # `meta.json` are published afterwards, once the store holding this run is
      # persisted, so no permanent record of an unpersisted run is ever written.
      - name: Upload machine stores and serving views
        id: upload-parallel
        if: steps.batch.outputs.published == 'true'
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Not a credential. Unset resolves to the script's default, so comparing
          # two in-flight counts on the real bucket is a repository variable rather
          # than a code change.
          R2_SERVING_UPLOAD_CONCURRENCY: ${{ vars.R2_SERVING_UPLOAD_CONCURRENCY }}
        run: |
          # Each side writes to its own log so the two do not interleave into an
          # unreadable stream; both are printed in full once they have finished.
          machine_log="$RUNNER_TEMP/upload-machine.log"
          views_log="$RUNNER_TEMP/upload-views.log"
          batch/scripts/r2_transfer.sh push-machine >"$machine_log" 2>&1 &
          machine_pid=$!
          batch/scripts/r2_transfer.sh upload-serving-views "$RUNNER_TEMP/serving" \
            >"$views_log" 2>&1 &
          views_pid=$!
          machine_code=0
          wait "$machine_pid" || machine_code=$?
          views_code=0
          wait "$views_pid" || views_code=$?
          # A side that succeeded is folded away; a side that failed is printed
          # open, because a collapsed group is the first thing a reader opening a
          # red run has to fight past.
          for side in "machine:$machine_code:$machine_log" "views:$views_code:$views_log"; do
            name="${side%%:*}"
            rest="${side#*:}"
            code="${rest%%:*}"
            log="${rest#*:}"
            if [[ "$code" -eq 0 ]]; then
              echo "::group::$name"
              cat "$log"
              echo "::endgroup::"
            else
              echo "::error::$name upload failed with exit $code"
              cat "$log"
            fi
          done
          # Written before the exit so the notification can tell which side failed;
          # a step killed by a timeout writes neither, which the notifier reads as
          # unknown rather than as "did not upload".
          if [[ $machine_code -eq 0 ]]; then
            echo "machine=success" >> "$GITHUB_OUTPUT"
          else
            echo "machine=failure" >> "$GITHUB_OUTPUT"
          fi
          if [[ $views_code -eq 0 ]]; then
            echo "views=success" >> "$GITHUB_OUTPUT"
          else
            echo "views=failure" >> "$GITHUB_OUTPUT"
          fi
          # The transfer script distinguishes its exits (2 is a refused contract,
          # 126/127 a launch failure), so one of them is carried out rather than
          # flattened to 1.
          if [[ $machine_code -ne 0 ]]; then
            exit "$machine_code"
          fi
          if [[ $views_code -ne 0 ]]; then
            exit "$views_code"
          fi

      - name: Publish serving history and freshness
        id: publish-serving
        if: steps.upload-parallel.outcome == 'success'
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: batch/scripts/r2_transfer.sh publish-serving-tail "$RUNNER_TEMP/serving"

      - name: Report deferred batch failure
        id: deferred-report
        if: steps.batch.outputs.exit_code == '3'
        run: exit 3

      # `cancelled()` is a status-check function: it is only evaluated in an `if`
      # conditional, and interpolating it into a `run:` block makes the whole
      # workflow file invalid. Capture the state as a step output instead.
      - name: Record cancellation
        id: cancellation
        if: ${{ cancelled() }}
        run: echo "cancelled=true" >> "$GITHUB_OUTPUT"

      # Single notification point. Runs once for every terminal state after all
      # prior step outcomes are known. `always()` rather than `!cancelled()`:
      # GitHub reports a `timeout-minutes` expiry as a *cancellation*, and a hung
      # batch is exactly the silent failure this notification exists to catch —
      # `!cancelled()` would skip it. A manual cancel costs one extra
      # `[CANCELLED]` message, which is far cheaper than losing every timeout.
      # The webhook secret is scoped to this step only; a delivery failure fails
      # the run so a successful data run with a broken notification is visible.
      - name: "Notify Discord #batch-runs"
        id: notify
        if: ${{ always() }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MANUAL_ASOF: ${{ steps.validate-input.outputs.asof }}
          PYTHONPATH: batch/src
        run: |
          # $MANUAL_ASOF carries the dispatch input safely as a variable;
          # never interpolate inputs.* into this run block (script injection).
          python3 -m baibai_batch.observability.discord \
            --summary-path "$RUNNER_TEMP/batch-summary.json" \
            --batch-exit-code "${{ steps.batch.outputs.exit_code }}" \
            --local-export "${{ steps.batch.outputs.local_export }}" \
            --smoke-outcome "${{ steps.smoke.outcome }}" \
            --setup-outcome "${{ steps.setup.outcome }}" \
            --sync-outcome "${{ steps.sync.outcome }}" \
            --pull-outcome "${{ steps.pull.outcome }}" \
            --upload-machine-outcome "${{ steps.upload-parallel.outputs.machine }}" \
            --upload-serving-outcome "${{ steps.upload-parallel.outputs.views }}" \
            --upload-parallel-outcome "${{ steps.upload-parallel.outcome }}" \
            --publish-serving-outcome "${{ steps.publish-serving.outcome }}" \
            --asof "$MANUAL_ASOF" \
            --run-started-at "${{ steps.smoke.outputs.started_at }}" \
            --cancelled "${{ steps.cancellation.outputs.cancelled || 'false' }}" \
            --output "$RUNNER_TEMP/workflow-run-summary.json"

      # Publish the same summary the notification carries so the System page can
      # show a run that failed before the export produced anything. Best-effort:
      # this must not change the run's outcome, which the notification step and
      # the failure policy above already decided.
      - name: Upload run summary
        id: upload-run-summary
        if: ${{ always() && steps.validate-input.outcome == 'success' }}
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: batch/scripts/r2_transfer.sh upload-run-summary "$RUNNER_TEMP/workflow-run-summary.json"
