name: cloud-daily-batch
# Display metadata, never executed. It is also the only place the day a recovery
# dispatch is for appears in the run listing, which is what lets the watchdog tell a
# past-dated recovery from the run that answers for today. A scheduled firing leaves
# the date empty, which reads as "for its own day".
run-name: "daily ${{ inputs.asof || '' }}"

on:
  schedule:
    # 16:43 JST. The only same-day requirement is the J-Quants daily-price update,
    # published around 16:30 JST, which the scheduled target day depends on; the run
    # keeps 13 minutes of margin. The JPX regulation pages are event-driven status pages the
    # coverage gate accepts for 7 business days, and the margin balances are weekly,
    # so neither needs the evening refresh — a designation landing after this run is
    # picked up the next business day.
    #
    # The odd minute is deliberate: GitHub concentrates scheduled work on :00 / :15 /
    # :30 / :45, and a schedule pinned there waits behind that queue.
    - cron: "43 7 * * 1-5"
  workflow_dispatch:
    inputs:
      asof:
        description: "Optional YYYY-MM-DD; skips the business-day gate for a manual rerun"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloud-publish
  queue: max
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    # batch の最悪 ~32 分（EDINET 全再取得）+ 全導出 publish + upload。超過は cancelled として Discord に出る
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The notification script must import on the runner's system python3
      # (before setup-python), so the final notification step can run it without
      # uv. The import is what guarantees the stdlib-only / no-3.13-syntax contract.
      - name: Smoke-check notification script
        id: smoke
        env:
          PYTHONPATH: batch/src
        run: python3 -c "import baibai_batch.observability.discord"

      # Validate the untrusted dispatch value before any credential-bearing step.
      # The scheduled event supplies an empty value, which is valid.
      - name: Validate dispatch input
        id: validate-input
        env:
          MANUAL_ASOF: ${{ inputs.asof }}
          PYTHONPATH: batch/src
        run: |
          python3 -m baibai_batch.validation.workflow_inputs daily --asof "$MANUAL_ASOF"
          echo "asof=$MANUAL_ASOF" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        id: setup-uv
        with:
          enable-cache: true

      - name: Sync Python environment
        id: sync
        run: uv sync --locked

      # The spglobal_pmi / nikkei providers fall back to a headless Chromium for
      # WAF-gated fetches. Cache the browser keyed on the pinned Playwright
      # version so the ~114MB binary is downloaded only when that version
      # changes, not on every run.
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version=$(uv run python -c \
            "import importlib.metadata as m; print(m.version('playwright'))")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium

      # This runs before credential-bearing steps. It proves the allowlisted browser
      # environment still starts in both the restored-cache and fresh-install paths.
      - name: Smoke-check isolated Chromium environment
        id: browser-smoke
        run: >-
          uv run python -c "from baibai_engine.macro.indicators.providers.browser import
          BrowserFetcher; fetcher=BrowserFetcher();
          content=fetcher.fetch_html('data:text/html,<p>baibai-browser-smoke</p>');
          fetcher.close(); assert 'baibai-browser-smoke' in content"

      # The lake reads Parquet over R2 through DuckDB's httpfs extension, and runtime
      # sessions disable extension downloads outright — a read path that could fetch
      # executable code on demand is not one that fails closed. The install happens here,
      # before credentials are present, so a missing extension is a setup failure with
      # nothing published rather than a data failure part-way through a run.
      # failure policy: 2 — screening cannot read the published L1 release without httpfs.
      - name: Provision DuckDB httpfs extension
        id: duckdb-httpfs
        run: uv run python -m tools.diagnostics.provision_duckdb_httpfs

      # failure policy: 1 — the batch cannot compute without the canonical stores.
      - name: Pull stores
        id: pull
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          batch/scripts/r2_transfer.sh pull-machine
          batch/scripts/r2_transfer.sh pull-app

      # The market store arrives holding only what the lake does not own — the coverage
      # ledger and the operator-derived tables. Filling the rest from the current release
      # is what makes it the store every reader already expects. It fails closed on the
      # published row counts, so a fill that silently did nothing cannot reach screening
      # as an empty universe.
      # failure policy: 2 — incomplete hydration would make the screening output invalid.
      - name: Hydrate market store from the L1 release
        id: hydrate
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: batch/scripts/r2_transfer.sh hydrate-market

      # failure policy: 1 — a fatal batch has no publishable screening result.
      - name: Run daily batch
        id: batch
        shell: bash
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          # Public JPX regulation pages (not secrets). bootstrap-cache requires
          # all four sources named by universe.required_jpx_flags.
          JPX_SPECIAL_CAUTION_INDEX_URL: https://www.jpx.co.jp/markets/statistics-equities/margin/index.html
          JPX_REORGANIZATION_URL: https://www.jpx.co.jp/listing/market-alerts/supervision/
          JPX_TRADING_HALT_URL: https://www.jpx.co.jp/markets/equities/suspended/
          JPX_DELISTING_WARNING_URL: https://www.jpx.co.jp/listing/stocks/delisted/
          MANUAL_ASOF: ${{ steps.validate-input.outputs.asof }}
        run: |
          args=(--output-dir "$RUNNER_TEMP/serving" --notice-output "$RUNNER_TEMP/batch-notice.json")
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            args+=(--scheduled)
          elif [[ -n "$MANUAL_ASOF" ]]; then
            args+=(--asof "$MANUAL_ASOF")
          fi
          set +e
          uv run baibai-batch daily "${args[@]}"
          code=$?
          set -e
          # Finalize the outputs BEFORE any fatal exit so the notification step
          # can still see the batch exit code and the local export state.
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [[ -f "$RUNNER_TEMP/serving/views/meta.json" ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ $code -ne 0 && $code -ne 3 ]]; then
            exit "$code"
          fi

      # Optional source: failure leaves no partial snapshot and does not stop screening.
      # Run after daily so the exact-date J-Quants master (including IPOs) is available.
      - name: Refresh TradingView expectations
        id: tradingview
        if: steps.batch.outputs.published == 'true'
        continue-on-error: true
        env:
          TRADINGVIEW_OAUTH_STATE: ${{ secrets.TRADINGVIEW_OAUTH_STATE }}
          TRADINGVIEW_SECRET_WRITER_TOKEN: ${{ secrets.TRADINGVIEW_SECRET_WRITER_TOKEN }}
          MANUAL_ASOF: ${{ steps.validate-input.outputs.asof }}
        run: |
          args=()
          if [[ -n "$MANUAL_ASOF" ]]; then
            args+=(--asof "$MANUAL_ASOF")
          fi
          uv run baibai-engine tradingview refresh "${args[@]}"

      # Publish before the store push, never after. A store push whose publication then
      # failed would leave the cloud holding a store that claims today's coverage while
      # the rows behind it exist only locally — and coverage saying "already fetched" is
      # exactly what stops the next run from repairing it.
      # failure policy: 2 — a broken release would corrupt the next hydration input.
      - name: Publish the L1 release
        id: publish-lake
        if: steps.batch.outputs.published == 'true'
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail
          batch/scripts/r2_transfer.sh publish-lake \
            | tee "$RUNNER_TEMP/lake-publish-report.json"

      # The store push runs first and the views mirror only after it succeeded. The two
      # ran together while the views side — 54MB across 3,740 objects, request-bound —
      # was the longer of the two by a wide margin and the wall clock was what the
      # ordering was chosen on. What that traded away is the direction of the partial
      # state a failure leaves: a machine push that failed beside a views upload that
      # succeeded leaves `views/` describing a run no remote store holds, and it stands
      # until the next successful run replaces it. Serialised this way the surviving
      # mismatch is always the harmless one — views older than the store, never a store
      # older than the views.
      #
      # Only `views/` joins the store push. It is rewritten every business day, so a
      # run whose push fails leaves views the next run replaces. `history/` and
      # `meta.json` are published afterwards, once the store holding this run is
      # persisted, so no permanent record of an unpersisted run is ever written.
      # failure policy: 2 — views must never describe a run absent from the remote store.
      - name: Upload machine stores and serving views
        id: upload-stores
        if: steps.batch.outputs.published == 'true'
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Not a credential. Unset resolves to the script's default, so comparing
          # two in-flight counts on the real bucket is a repository variable rather
          # than a code change.
          R2_SERVING_UPLOAD_CONCURRENCY: ${{ vars.R2_SERVING_UPLOAD_CONCURRENCY }}
        run: |
          # Each side writes to its own log and both are printed once they are done,
          # so the store push's timing report stays readable next to the mirror's.
          machine_log="$RUNNER_TEMP/upload-machine.log"
          views_log="$RUNNER_TEMP/upload-views.log"
          machine_code=0
          batch/scripts/r2_transfer.sh push-machine >"$machine_log" 2>&1 || machine_code=$?
          views_code=0
          views_ran=0
          if [[ $machine_code -eq 0 ]]; then
            views_ran=1
            batch/scripts/r2_transfer.sh upload-serving-views "$RUNNER_TEMP/serving" \
              >"$views_log" 2>&1 || views_code=$?
          fi
          # A side that succeeded is folded away; a side that failed is printed
          # open, because a collapsed group is the first thing a reader opening a
          # red run has to fight past.
          print_log() {
            if [[ "$2" -eq 0 ]]; then
              echo "::group::$1"
              cat "$3"
              echo "::endgroup::"
            else
              echo "::error::$1 upload failed with exit $2"
              cat "$3"
            fi
          }
          print_log machine "$machine_code" "$machine_log"
          if [[ $views_ran -eq 1 ]]; then
            print_log views "$views_code" "$views_log"
          else
            echo "views upload not attempted: the store push failed first"
          fi
          # Written before the exit so the notification can tell which side failed;
          # a step killed by a timeout writes neither, which the notifier reads as
          # unknown rather than as "did not upload". `skipped` is written out rather
          # than left absent, so "the mirror never ran" and "the step never got to
          # say" stay distinguishable.
          if [[ $machine_code -eq 0 ]]; then
            echo "machine=success" >> "$GITHUB_OUTPUT"
          else
            echo "machine=failure" >> "$GITHUB_OUTPUT"
          fi
          if [[ $views_ran -eq 0 ]]; then
            echo "views=skipped" >> "$GITHUB_OUTPUT"
          elif [[ $views_code -eq 0 ]]; then
            echo "views=success" >> "$GITHUB_OUTPUT"
          else
            echo "views=failure" >> "$GITHUB_OUTPUT"
          fi
          # The transfer script distinguishes its exits (2 is a refused contract,
          # 126/127 a launch failure), so one of them is carried out rather than
          # flattened to 1.
          if [[ $machine_code -ne 0 ]]; then
            exit "$machine_code"
          fi
          if [[ $views_code -ne 0 ]]; then
            exit "$views_code"
          fi

      # failure policy: 2 — history must never record a run whose stores were not persisted.
      - name: Publish serving history and freshness
        id: publish-serving
        if: steps.upload-stores.outcome == 'success'
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: batch/scripts/r2_transfer.sh publish-serving-tail "$RUNNER_TEMP/serving"

      # `cancelled()` is a status-check function: it is only evaluated in an `if`
      # conditional, and interpolating it into a `run:` block makes the whole
      # workflow file invalid. Capture the state as a step output instead.
      - name: Record cancellation
        id: cancellation
        if: ${{ cancelled() }}
        run: echo "cancelled=true" >> "$GITHUB_OUTPUT"

      # Single notification point. Runs once for every terminal state after all
      # prior step outcomes are known. `always()` rather than `!cancelled()`:
      # GitHub reports a `timeout-minutes` expiry as a *cancellation*, and a hung
      # batch is exactly the silent failure this notification exists to catch —
      # `!cancelled()` would skip it. A manual cancel costs one extra
      # `[CANCELLED]` message, which is far cheaper than losing every timeout.
      # The webhook secret is scoped to this step only. A delivery failure never
      # fails the run: a red job means the day's artefacts were not published
      # (docs/architecture.md, Failure policy), and a broken webhook is not that.
      - name: "Notify Discord #batch-runs"
        id: notify
        if: ${{ always() }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONPATH: batch/src
        run: |
          python3 -m baibai_batch.observability.discord \
            --notice-path "$RUNNER_TEMP/batch-notice.json" \
            --batch-exit-code "${{ steps.batch.outputs.exit_code }}" \
            --tradingview-outcome "${{ steps.tradingview.outcome }}" \
            --smoke-outcome "${{ steps.smoke.outcome }}" \
            --setup-outcome "${{ steps.setup.outcome }}" \
            --sync-outcome "${{ steps.sync.outcome }}" \
            --pull-outcome "${{ steps.pull.outcome }}" \
            --hydrate-outcome "${{ steps.hydrate.outcome }}" \
            --publish-lake-outcome "${{ steps.publish-lake.outcome }}" \
            --upload-stores-outcome "${{ steps.upload-stores.outcome }}" \
            --publish-serving-outcome "${{ steps.publish-serving.outcome }}" \
            --cancelled "${{ steps.cancellation.outputs.cancelled || 'false' }}"
