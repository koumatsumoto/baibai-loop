name: cloud-finance-recovery
run-name: "Finance schema52 exact recovery"

on:
  workflow_dispatch:
    inputs:
      contract_sha256:
        description: "Reviewed finite private contract digest. Never rerun without reconciling the prior attempt."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: common-source-integration
  queue: max
  cancel-in-progress: false

jobs:
  recover:
    concurrency:
      group: cloud-publish
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate trusted one-shot dispatch without credentials
        env:
          CONTRACT_SHA256: ${{ inputs.contract_sha256 }}
          PYTHONPATH: jobs/src
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          python3 - <<'PY'
          import os, re
          value = os.environ["CONTRACT_SHA256"]
          if re.fullmatch(r"[0-9a-f]{64}", value) is None:
              raise SystemExit("invalid finite contract digest")
          PY
      - name: Prepare bounded disposable runner capacity without credentials
        run: python3 jobs/scripts/prepare_finance_recovery_runner.py
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Sync locked runtime
        run: uv sync --locked
      # The bounded SDK cleanup does not promise capacity. The driver checks the
      # actual complete budget before lease acquisition and each later phase.
      - name: Record actual scratch capacity without credentials
        run: df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Recover one fixed generation and verify durable publication
        env:
          CONTRACT_SHA256: ${{ inputs.contract_sha256 }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          umask 077
          code=0
          uv run python -m baibai_jobs.integration.finance_recovery \
            --contract-sha256 "$CONTRACT_SHA256" --directory "$RUNNER_TEMP/finance-recovery" \
            > "$RUNNER_TEMP/finance-recovery-private.log" 2>&1 || code=$?
          printf 'finance_recovery_exit_code=%s\n' "$code"
          if [ "$code" -ne 0 ]; then
            if [ -f "$RUNNER_TEMP/finance-recovery/stopped.json" ]; then
              cat "$RUNNER_TEMP/finance-recovery/stopped.json"
            fi
            printf '%s\n' 'Reconcile this exact server run, private durable receipts, pointer, pair and lease. Do not rerun.'
          fi
          exit "$code"
