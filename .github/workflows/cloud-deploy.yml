name: cloud-deploy

# App/worker code changes on main auto-deploy. Editing this workflow does not
# self-deploy (that is a pipeline-config change); use workflow_dispatch to run it,
# which is also how the first deploy is triggered after CLOUDFLARE_API_TOKEN is set.
on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "cloud/worker/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # wrangler reads these from the environment; no OAuth login is needed in CI.
      # `wrangler deploy` updates the Worker script and static assets only — it does
      # not touch Worker secrets, so VIEW_PASSWORD persists across deploys.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            cloud/worker/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Deploy Worker and UI assets
        working-directory: cloud/worker
        run: |
          npm ci
          npm run deploy
