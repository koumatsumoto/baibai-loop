name: cloud-economic-source

on:
  workflow_call:
    inputs:
      group:
        required: true
        type: string
      source_id:
        type: string
        default: ''
      asof:
        required: true
        type: string

permissions:
  contents: read

# A second run of the same provider must compare against the preceding publication.
concurrency:
  group: economic-source-${{ inputs.group }}
  queue: max
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: source-acquire-${{ inputs.group }}
      queue: max
      cancel-in-progress: false
    outputs:
      handoff: ${{ steps.stage.outputs.handoff }}
      report: ${{ steps.acquire.outputs.report }}
    steps:
      - name: Reserve time for private receipt export and staging
        run: echo "BAIBAI_ACQUISITION_DEADLINE=$(( $(date +%s) + 45 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # FRB H.15 is the only current provider with a browser fallback.
      - name: Resolve Playwright version
        id: playwright-version
        if: ${{ inputs.group == 'frb_h15' }}
        run: |
          version=$(uv run python -c "import importlib.metadata as m; print(m.version('playwright'))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        if: ${{ inputs.group == 'frb_h15' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium
        if: ${{ inputs.group == 'frb_h15' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: uv run playwright install --with-deps chromium
      - name: Smoke-check isolated Chromium environment
        if: ${{ inputs.group == 'frb_h15' }}
        run: >-
          uv run python -c "from baibai_engine.data_collection.economic.providers.browser import
          BrowserFetcher; fetcher=BrowserFetcher();
          content=fetcher.fetch_html('data:text/html,<p>baibai-browser-smoke</p>');
          fetcher.close(); assert 'baibai-browser-smoke' in content"
      - name: Load only this provider group scoped input
        env:
          GROUP: ${{ inputs.group }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: uv run python -m baibai_jobs.jobs.economic input --group "$GROUP" --directory "$RUNNER_TEMP/source-input"
      - name: Acquire and export new receipts for this provider
        id: acquire
        env:
          GROUP: ${{ inputs.group }}
          SOURCE_ID: ${{ inputs.source_id }}
          ASOF: ${{ inputs.asof }}
          JQUANTS_API_KEY: ${{ inputs.group == 'jquants' && secrets.JQUANTS_API_KEY || '' }}
          ESTAT_APP_ID: ${{ inputs.group == 'estat' && secrets.ESTAT_APP_ID || '' }}
        run: uv run python -m baibai_jobs.jobs.economic acquire --group "$GROUP" --source-id "$SOURCE_ID" --asof "$ASOF" --directory "$RUNNER_TEMP/economic-handoff"
      - name: Save confirmed receipts in private R2 staging
        id: stage
        if: ${{ always() && steps.acquire.outputs.stage_ready == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          STAGE_ID: ${{ inputs.group }}-${{ inputs.asof }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: uv run python -m baibai_jobs.jobs.economic stage --stage-id "$STAGE_ID" --directory "$RUNNER_TEMP/economic-handoff"
      - name: Economic result for ${{ inputs.asof }}
        if: ${{ always() && steps.stage.outcome == 'success' }}
        run: echo 'Economic private receipts saved; canonical and serving integration are separate'

  notify:
    needs: acquire
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Notify the provider acquisition and publication outcomes
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONPATH: jobs/src
          SOURCE_GROUP: economic-${{ inputs.group }}
          ASOF: ${{ inputs.asof }}
          ACQUIRE_RESULT: ${{ needs.acquire.result }}
          STAGE_RESULT: ${{ needs.acquire.outputs.handoff != '' && 'success' || 'failure' }}
          ECONOMIC_REPORT_JSON: ${{ needs.acquire.outputs.report }}
        run: python3 -m baibai_jobs.observability.source_discord
