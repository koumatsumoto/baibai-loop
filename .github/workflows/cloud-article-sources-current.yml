name: cloud-article-sources

on:
  schedule:
    # Six slots/day; 13:13 UTC precedes the independent 13:43 daily integration.
    - cron: '13 1,5,9,13,17,21 * * *'
  workflow_dispatch:
    inputs:
      group:
        description: '取得group（scheduledは定期と同じTSR・日銀のみ。重複・cooldownは維持）'
        type: choice
        default: all
        options: [all, public, world, rakuten, scheduled]

permissions:
  contents: read

jobs:
  retirement:
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/cloud-writer-retirement.yml
    permissions:
      contents: read
      actions: read

  acquire:
    needs: retirement
    if: >-
      ${{ needs.retirement.result == 'success' && needs.retirement.outputs.attempt == github.run_attempt
      && (needs.retirement.outputs.requires_v2 == 'true' || needs.retirement.outputs.requires_v2 == 'false') }}
    env:
      UV_NO_DEV: "true"
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON((github.event_name == 'schedule' || inputs.group == 'scheduled') && '["scheduled"]' || '["public","world","rakuten"]') }}
    # Scheduled and manual public share one queue; manual Toushiru keeps its own.
    # No global provider barrier, lease acquisition, or model calculation here.
    concurrency:
      group: source-host-${{ (matrix.group == 'public' || matrix.group == 'scheduled') && 'article-public' || matrix.group }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select group before credentials
        id: scope
        env:
          REQUESTED_GROUP: ${{ inputs.group || 'all' }}
          GROUP: ${{ matrix.group }}
        run: |
          case "$REQUESTED_GROUP" in all|public|world|rakuten|scheduled) ;; *) exit 2 ;; esac
          if [ "$REQUESTED_GROUP" = all ] || [ "$REQUESTED_GROUP" = "$GROUP" ]; then
            echo 'selected=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.scope.outputs.selected == 'true'
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: steps.scope.outputs.selected == 'true'
        with:
          enable-cache: true
      - run: uv sync --locked
        if: steps.scope.outputs.selected == 'true'
      - name: Pin original slot and reserve private staging time
        id: clock
        if: steps.scope.outputs.selected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')"
          printf 'created_at=%s\n' "$created_at" >> "$GITHUB_OUTPUT"
          echo "BAIBAI_ACQUISITION_DEADLINE=$(( $(date +%s) + 15 * 60 ))" >> "$GITHUB_ENV"
      - name: Acquire due sources and save each partial privately
        if: steps.scope.outputs.selected == 'true'
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GROUP: ${{ matrix.group }}
          CREATED_AT: ${{ steps.clock.outputs.created_at }}
          IDENTITY: ${{ github.run_id }}-${{ github.run_attempt }}
          REQUIRES_V2: ${{ needs.retirement.outputs.requires_v2 }}
        run: |
          case "${REQUIRES_V2:-}" in
            true) uv run python -m baibai_jobs.publication.lease require-v2 || exit $? ;;
            false) ;;
            *) echo 'retirement v2 condition is not confirmed' >&2; exit 2 ;;
          esac
          args=(--group "$GROUP" --created-at "$CREATED_AT" --identity "$IDENTITY")
          uv run python -m baibai_jobs.acquisition.articles "${args[@]}" \
            --directory "$RUNNER_TEMP/article-handoffs"
