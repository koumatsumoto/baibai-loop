name: measure-materialize-1580

# Issue #1580の一時診断。主担当のreview後に手動起動し、計測判断後に撤去する。
on:
  workflow_dispatch:
    inputs:
      case:
        description: "Finite synthetic case (start with small-concentrated)"
        type: choice
        default: small-concentrated
        options:
          - small-concentrated
          - medium-concentrated
          - medium-dispersed
          - bounded-concentrated
          - bounded-dispersed
          - upper-concentrated
          - upper-dispersed

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Sync locked Python dependencies
        run: uv sync --locked --all-groups
      - name: Check diagnostic semantics and instrumentation
        run: uv run --no-sync pytest -n 0 tests/tools/test_measure_materialize.py
      - name: Generate isolated synthetic stores (separate process)
        env:
          UV_OFFLINE: "true"
          MEASUREMENT_CASE: ${{ inputs.case }}
        run: >-
          timeout --signal=TERM --kill-after=15s 240s
          uv run --no-sync python -m tools.diagnostics.measure_materialize fixture
          --case "$MEASUREMENT_CASE" --work-dir "$RUNNER_TEMP/materialize-1580"
      - name: Measure current export without source access
        env:
          UV_OFFLINE: "true"
          MEASUREMENT_CASE: ${{ inputs.case }}
        run: >-
          timeout --signal=TERM --kill-after=15s 720s
          uv run --no-sync python -m tools.diagnostics.measure_materialize measure
          --case "$MEASUREMENT_CASE" --work-dir "$RUNNER_TEMP/materialize-1580"
      - name: Preserve JSON evidence in logs and run summary
        if: ${{ always() }}
        run: |
          report="$RUNNER_TEMP/materialize-1580/profile.json"
          if test -f "$report"; then
            cat "$report"
            {
              echo '```json'
              cat "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
