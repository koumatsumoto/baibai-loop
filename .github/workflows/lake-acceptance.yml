name: lake-acceptance

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact 40-character commit SHA under acceptance"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lake-acceptance
  cancel-in-progress: false

jobs:
  actual-r2:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
         github.event.action == 'labeled' &&
         github.event.label.name == 'lake-acceptance-approved' &&
         github.actor == github.repository_owner &&
         github.event.pull_request.head.repo.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate exact head without credentials
        id: validate-input
        env:
          EXPECTED_DISPATCH_SHA: ${{ inputs.expected_sha }}
          EXPECTED_PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            EXPECTED_SHA="$EXPECTED_DISPATCH_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            EXPECTED_SHA="$EXPECTED_PR_SHA"
          else
            echo "lake acceptance does not support this event" >&2
            exit 2
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a full lowercase commit SHA" >&2
            exit 2
          fi
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            git checkout --detach "$EXPECTED_SHA"
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "expected_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run actual R2 CAS and rollback acceptance
        env:
          BAIBAI_R2_ACCEPTANCE: "1"
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_LAKE_ACCEPTANCE_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_LAKE_ACCEPTANCE_SECRET_ACCESS_KEY }}
          R2_LAKE_ACCEPTANCE_BUCKET: ${{ vars.R2_LAKE_ACCEPTANCE_BUCKET }}
          PYTHONPATH: engine/src:batch/src:web/backend/src
        run: uv run pytest -q -n 0 tests/integration/test_lake_r2_acceptance.py
