name: cloud-history-backfill

# Extends the canonical market store back over a named window. Manual only: the
# window is a decision about how far the evidence has to reach, and the pass costs
# hours, so it does not belong on the daily schedule.
#
# This is for history no machine holds yet. When a local store already covers the
# window, `r2_transfer.sh push-market` merges it into the cloud copy in minutes
# without calling the provider at all, and that is the path to take.
#
# Financial summaries are the slow part: 3.4 years took 2h32m of which 2h05m was
# theirs. The job ceiling is 5 hours, so a first pass over a decade has to be split
# into windows of three or four years. Coverage merges, so splitting changes nothing
# about the result.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date the window covers (YYYY-MM-DD)"
        required: true
        type: string
      end:
        description: "Last date the window covers (YYYY-MM-DD)"
        required: true
        type: string
      master_month_end_from:
        description: "Optional YYYY-MM-DD; also backfill month-end master snapshots from here"
        required: false
        type: string

permissions:
  contents: read

# Daily batch and materialize are the other cloud publishers. Sharing their group
# keeps the three from pushing over each other: R2 is last-write-wins, so concurrent
# passes could silently drop whichever writer finished first.
#
# The cost is that this pass holds the group for as long as it runs. `queue: max`
# preserves later daily/materialize/backfill writers in the shared FIFO queue while
# keeping exactly one running writer, so a long backfill cannot discard a queued run.
concurrency:
  group: cloud-publish
  queue: max
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # A decade of bars is roughly an hour of provider calls, and 429 backoff can
    # add to that. The ceiling leaves room for one bad stretch without expiring
    # the job, which GitHub reports as a cancellation with no cause attached.
    timeout-minutes: 300
    env:
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync Python environment
        run: uv sync --locked

      - name: Pull the market store
        run: tools/cloud/r2_transfer.sh pull-market

      # Writing to the store migrates it, so the rollback object has to be present
      # and verified first, exactly as the daily batch does before its own writes.
      - name: Preserve and verify market schema v13 rollback
        run: tools/cloud/r2_transfer.sh preserve-market-v13

      - name: Record the window the store already covers
        run: |
          sqlite3 "file:data/screening/market.sqlite?mode=ro" \
            "SELECT 'bars ' || MIN(traded_at) || '..' || MAX(traded_at) || ' (' || COUNT(*) || ')' \
             FROM jquants_daily_bars;
             SELECT 'fin  ' || MIN(disclosed_at) || '..' || MAX(disclosed_at) || ' (' || COUNT(*) || ')' \
             FROM jquants_fin_summaries;"

      - name: Backfill and publish committed progress
        run: |
          args=(--start "${{ inputs.start }}" --end "${{ inputs.end }}")
          if [[ -n "${{ inputs.master_month_end_from }}" ]]; then
            args+=(--master-month-end-from "${{ inputs.master_month_end_from }}")
          fi
          uv run python -m tools.cloud.history_backfill "${args[@]}"
