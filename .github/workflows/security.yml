name: security

# Dependency advisories are the one finding that appears without anything in the
# repository changing, so they get a clock of their own. Every gate that reacts to
# a change instead — Bandit, and the audits' own reaction to a lockfile edit — runs
# on the pull request that carries the change: Python
# checks in ci.yml. This workflow sweeps Python dependencies weekly.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --locked --all-groups

      # Pull requests are where a widened credential boundary is refused, and their
      # merge ref is main only until main moves under them. This asks the question
      # again of main itself, so a tree that runs with R2, provider, Discord and
      # notification credentials is never more than a week from having been checked.
      - name: Workflow trust boundary
        run: uv run python tools/quality/drift/check_workflow_trust.py

      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: |
          uv export \
            --format requirements.txt \
            --locked \
            --all-groups \
            --no-emit-project \
            --no-hashes \
            --output-file /tmp/baibai-loop-requirements.txt
          uv run pip-audit \
            -r /tmp/baibai-loop-requirements.txt

      - name: Build dependency audit
        if: ${{ !cancelled() }}
        run: |
          uv run python - <<'PY' > /tmp/baibai-loop-build-requirements.txt
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          for requirement in config["build-system"]["requires"]:
              print(requirement)
          PY
          uv run pip-audit \
            -r /tmp/baibai-loop-build-requirements.txt
