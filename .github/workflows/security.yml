name: security

# Dependency advisories are the one finding that appears without anything in the
# repository changing, so they get a clock of their own. Every gate that reacts to
# a change instead — Bandit, and the audits' own reaction to a lockfile edit — runs
# on the pull request that carries the change, in ci and web.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --frozen --all-groups

      # Pull requests are where a widened credential boundary is refused, and their
      # merge ref is main only until main moves under them. This asks the question
      # again of main itself, so a tree that runs with R2, provider, Discord and
      # Cloudflare credentials is never more than a week from having been checked.
      - name: Workflow trust boundary
        run: uv run python tools/quality/drift/check_workflow_trust.py

      - name: Dependency audit
        run: |
          uv export \
            --format requirements.txt \
            --locked \
            --all-groups \
            --no-emit-project \
            --no-hashes \
            --output-file /tmp/baibai-loop-requirements.txt
          uv run pip-audit \
            -r /tmp/baibai-loop-requirements.txt

      # This workflow reports rather than gates, so each ecosystem is asked even after
      # another one has already found something. An advisory hidden behind an earlier
      # failure would wait a week for the next sweep.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ !cancelled() }}
        with:
          node-version: 24

      - name: UI dependency audit
        if: ${{ !cancelled() }}
        working-directory: web/frontend
        run: npm audit --package-lock-only --audit-level=high

      - name: Worker dependency audit
        if: ${{ !cancelled() }}
        working-directory: web/edge
        run: npm audit --package-lock-only --audit-level=high
