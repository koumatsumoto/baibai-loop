name: security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --frozen --all-groups

      - name: Bandit
        run: >-
          uv run bandit -c pyproject.toml -q -r
          src/baibai_engine src/baibai_app
          tools/append_pmi_manifest.py tools/generate_brand_assets.py

      - name: Dependency audit
        # CVE-2026-3219: pip 26.0.1 treats archives that identify as both tar
        # and zip as zip during install. No fix version is published yet
        # (pip-audit reports `fix_versions: []`). The project uses uv with
        # locked deps so pip itself is never used at runtime; exposure to the
        # malicious-archive vector requires manually invoking pip on an
        # untrusted file. Re-evaluate when a pip fix lands by removing
        # --ignore-vuln. Tracking via pip-audit GHSA-58qw-9mgm-455v.
        run: |
          uv export \
            --format requirements.txt \
            --locked \
            --all-groups \
            --no-emit-project \
            --no-hashes \
            --output-file /tmp/baibai-loop-requirements.txt
          uv run pip-audit \
            -r /tmp/baibai-loop-requirements.txt
