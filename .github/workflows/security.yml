name: security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          # PR merge commits expose base/head as their two parents at this depth.
          # Multi-commit pushes that exceed it fail closed into running the audit.
          fetch-depth: 2

      - name: Detect Node audit scope
        id: node-audit-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
            HEAD_SHA="$CURRENT_SHA"
          fi

          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null ||
            ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            ui/package-lock.json cloud/worker/package-lock.json; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --frozen --all-groups

      - name: Bandit
        # Whole directories, not named files: a script added under tools/ is scanned from
        # its first commit instead of waiting for someone to remember this list.
        run: >-
          uv run bandit -c pyproject.toml -q -r
          src/baibai_engine src/baibai_app tools

      - name: Dependency audit
        # CVE-2026-3219: pip 26.0.1 treats archives that identify as both tar
        # and zip as zip during install. No fix version is published yet
        # (pip-audit reports `fix_versions: []`). The project uses uv with
        # locked deps so pip itself is never used at runtime; exposure to the
        # malicious-archive vector requires manually invoking pip on an
        # untrusted file. Re-evaluate when a pip fix lands by removing
        # --ignore-vuln. Tracking via pip-audit GHSA-58qw-9mgm-455v.
        run: |
          uv export \
            --format requirements.txt \
            --locked \
            --all-groups \
            --no-emit-project \
            --no-hashes \
            --output-file /tmp/baibai-loop-requirements.txt
          uv run pip-audit \
            -r /tmp/baibai-loop-requirements.txt

      # Keep Node audits after the Python scanners and use an explicit status
      # function so one ecosystem's finding does not hide the other reports.
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() && steps.node-audit-scope.outputs.run == 'true' }}
        with:
          node-version: 24

      - name: UI dependency audit
        if: ${{ !cancelled() && steps.node-audit-scope.outputs.run == 'true' }}
        working-directory: ui
        run: npm audit --package-lock-only --audit-level=high

      - name: Worker dependency audit
        if: ${{ !cancelled() && steps.node-audit-scope.outputs.run == 'true' }}
        working-directory: cloud/worker
        run: npm audit --package-lock-only --audit-level=high
