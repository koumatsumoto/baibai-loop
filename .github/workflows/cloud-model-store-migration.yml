name: cloud-model-store-migration

# One-time schema6 -> schema7 delivery. Remove after verified cutover.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-publish
  queue: max
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.repository == 'koumatsumoto/baibai-loop' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Sync Python environment
        run: uv sync --locked
      - name: Require current main
        run: |
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$current" && test "$current" = "$GITHUB_SHA"
      - name: Acquire publication lease
        id: lease-acquire
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if ! uv run python -m baibai_jobs.storage.publication_lease acquire --purpose operator --handle "$RUNNER_TEMP/publication-lease-handle.json" > "$RUNNER_TEMP/migration-acquire.log" 2>&1; then
            echo 'Migration lease acquisition failed; no store migration started.'
            exit 1
          fi
      - name: Migrate and read back model store
        id: migrate-readback
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PUBLICATION_LEASE_HANDLE: ${{ runner.temp }}/publication-lease-handle.json
        run: |
          # Capture raw errors privately; public logs contain only fixed phase labels.
          private_step() {
            local phase="$1"
            shift
            echo "Model store migration: $phase"
            if ! "$@" >> "$RUNNER_TEMP/model-store-migration.log" 2>&1; then
              echo "Model store migration stopped at $phase. Inspect remote state before retrying."
              return 1
            fi
          }
          private_step pull jobs/scripts/r2_transfer.sh pull-machine
          private_step source-schema6 uv run python -m baibai_jobs.storage.sqlite_snapshot check --path stores/screening/runs.sqlite --schema-version 6
          private_step backup uv run python -m baibai_jobs.storage.sqlite_snapshot create --source stores/screening/runs.sqlite --output "$RUNNER_TEMP/source-runs.sqlite"
          private_step migrate-copy uv run python -m tools.migrate_model_store --source "$RUNNER_TEMP/source-runs.sqlite" --output "$RUNNER_TEMP/migrated-runs.sqlite"
          private_step replace-local uv run python -m baibai_jobs.storage.sqlite_snapshot create --source "$RUNNER_TEMP/migrated-runs.sqlite" --output stores/screening/runs.sqlite
          private_step lease-before-push uv run python -c 'import os; from pathlib import Path; from baibai_jobs.storage.lake_publish import Boto3R2Store; from baibai_jobs.storage.publication_lease import _load_handle, verify_held; verify_held(Boto3R2Store(bucket=os.environ.get("R2_STORES_BUCKET") or "baibai-stores"), _load_handle(Path(os.environ["PUBLICATION_LEASE_HANDLE"])))'
          private_step conditional-push jobs/scripts/r2_transfer.sh push-runs
          private_step readback jobs/scripts/r2_transfer.sh pull-machine
          private_step verify-readback uv run python -m tools.migrate_model_store --verify-only --source "$RUNNER_TEMP/source-runs.sqlite" --output stores/screening/runs.sqlite
          echo 'Model store schema7 and exact legacy rows verified from remote readback.'
      - name: Release publication lease
        id: lease-release
        if: ${{ always() && steps.lease-acquire.outputs.acquired == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if ! uv run python -m baibai_jobs.storage.publication_lease release --handle "$RUNNER_TEMP/publication-lease-handle.json" > "$RUNNER_TEMP/migration-release.log" 2>&1; then
            echo 'Migration lease release failed; inspect the existing lease before any retry.'
            exit 1
          fi
