name: ci

# The merge ref this workflow checks is the tree that lands on main while the base
# holds still, so a second run after the merge would re-check bytes that already
# passed here. What that leaves uncovered is a base that moved between this run and
# the merge: the next pull request's own merge ref carries the result, and the common integration
# job reports whether main still imports and runs. Neither re-runs these gates, so
# a lint-, type- or test-only breakage on main waits for that next pull request.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Python gates share one dependency setup.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The notification script runs on the runner's system python3, before
      # setup-python and uv sync. This preserves failure reporting during setup
      # while enforcing its stdlib-only import contract before merge.
      - name: Import notification script on the system python3
        env:
          PYTHONPATH: jobs/src
        run: |
          python3 --version
          python3 -m py_compile jobs/src/baibai_jobs/observability/discord.py
          python3 -c "import baibai_jobs.observability.discord"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --locked --all-groups

      # One bounded diagnostic run only. This branch will be closed without merging.
      - name: Capture bounded Minkabu parity report
        if: ${{ github.head_ref == 'diagnostic/minkabu-parity-artifact' && github.run_attempt == 1 }}
        timeout-minutes: 3
        run: |
          cat > "$RUNNER_TEMP/minkabu_parity.py" <<'MINKABU_SCRIPT'
          """One-off PR experiment. Remove this file and the CI step before merging."""

          from __future__ import annotations

          import hashlib
          import json
          import os
          import platform
          import ssl
          import time
          from datetime import UTC, datetime
          from pathlib import Path
          from typing import Any

          import requests
          import urllib3

          from baibai_engine.data_collection.transport.identity import PUBLIC_RESEARCH_USER_AGENT

          ARTICLE_ACCEPT = "application/json, application/xml, text/html, application/pdf;q=0.9, */*;q=0.5"
          LIMIT = 2 * 1024 * 1024


          class ObservedSession(requests.Session):
              def send(self, request: requests.PreparedRequest, **kwargs: Any) -> requests.Response:
                  # No credentials are needed for this public experiment. Never log their values.
                  if any(
                      name.lower() in {"authorization", "proxy-authorization"} for name in request.headers
                  ):
                      raise ValueError("authenticated request is outside the experiment")
                  return super().send(request, **kwargs)


          def main() -> None:
              print(
                  json.dumps(
                      {
                          "runtime": {
                              "python": platform.python_version(),
                              "requests": requests.__version__,
                              "urllib3": urllib3.__version__,
                              "openssl": ssl.OPENSSL_VERSION,
                          },
                          "proxy_environment_present": {
                              name: bool(os.environ.get(name))
                              for name in (
                                  "HTTP_PROXY",
                                  "HTTPS_PROXY",
                                  "ALL_PROXY",
                                  "NO_PROXY",
                                  "http_proxy",
                                  "https_proxy",
                              )
                          },
                          "source_file_sha256": hashlib.sha256(Path(__file__).read_bytes()).hexdigest(),
                          "response_limit_bytes": LIMIT,
                      },
                      sort_keys=True,
                  )
              )
              with ObservedSession() as warm:
                  cases = [
                      ("news_index", "https://minkabu.jp/news", ARTICLE_ACCEPT, warm),
                      ("news_after_index", "https://minkabu.jp/news/4645703", ARTICLE_ACCEPT, warm),
                      ("news_fresh", "https://minkabu.jp/news/4645703", ARTICLE_ACCEPT, None),
                      ("news_html_accept", "https://minkabu.jp/news/4645703", "text/html", None),
                      ("stock_html_control", "https://minkabu.jp/stock/7203", "text/html", None),
                  ]
                  for index, (name, url, accept, reused) in enumerate(cases):
                      if index:
                          time.sleep(2)
                      session = reused or ObservedSession()
                      row = {
                          "case": name,
                          "url": url,
                          "session_reused": reused is not None,
                          "cookies_before": len(session.cookies),
                          "trust_env": session.trust_env,
                          "tls_verification": session.verify is True,
                          "requested_at": datetime.now(UTC).isoformat(),
                      }
                      try:
                          with session.get(
                              url,
                              headers={"User-Agent": PUBLIC_RESEARCH_USER_AGENT, "Accept": accept},
                              timeout=(10, 20),
                              stream=True,
                              allow_redirects=False,
                          ) as response:
                              row.update(
                                  status=response.status_code,
                                  received_at=datetime.now(UTC).isoformat(),
                                  http_version=response.raw.version,
                              )
                              row["prepared_headers"] = {
                                  key: response.request.headers.get(key)
                                  for key in ("User-Agent", "Accept", "Accept-Encoding", "Connection")
                              }
                              row["prepared_header_names"] = sorted(response.request.headers)
                              row["prepared_cookie_present"] = "Cookie" in response.request.headers
                              connection = getattr(response.raw, "connection", None)
                              sock = getattr(connection, "sock", None)
                              if sock is not None:
                                  row["tls_version"] = sock.version()
                                  cipher = sock.cipher()
                                  row["tls_cipher"] = cipher[0] if cipher else None
                                  row["tls_peer_sha256"] = hashlib.sha256(
                                      sock.getpeercert(binary_form=True) or b""
                                  ).hexdigest()
                              row["response_headers"] = {
                                  key: response.headers.get(key)
                                  for key in (
                                      "Server",
                                      "Via",
                                      "Content-Type",
                                      "Content-Encoding",
                                      "X-Cache",
                                      "X-Amz-Cf-Pop",
                                  )
                              }
                              row["redirect_present"] = bool(response.headers.get("Location"))
                              content = bytearray()
                              complete = True
                              for chunk in response.iter_content(65536):
                                  if len(content) + len(chunk) > LIMIT:
                                      complete = False
                                      break
                                  content.extend(chunk)
                              row.update(
                                  body_bytes=len(content),
                                  complete_body=complete,
                                  body_sha256=hashlib.sha256(content).hexdigest(),
                                  cloudfront_marker=b"cloudfront" in content.lower(),
                                  cookies_after=len(session.cookies),
                              )
                      except Exception as error:
                          row["error_type"] = type(error).__name__
                      finally:
                          if reused is None:
                              session.close()
                      print(json.dumps(row, sort_keys=True), flush=True)


          if __name__ == "__main__":
              main()
          MINKABU_SCRIPT
          timeout 150 uv run python "$RUNNER_TEMP/minkabu_parity.py" > "$RUNNER_TEMP/minkabu-parity.jsonl"

      - name: Retain sanitized parity report for authenticated readback
        if: ${{ !cancelled() && github.head_ref == 'diagnostic/minkabu-parity-artifact' && github.run_attempt == 1 }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minkabu-parity-${{ github.run_id }}
          path: ${{ runner.temp }}/minkabu-parity.jsonl
          retention-days: 1
          if-no-files-found: error

      - name: Check packaged calibration context
        run: |
          uv build --out-dir "$RUNNER_TEMP/baibai-dist"
          uv run python - <<'PY'
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          source = Path("engine/src/baibai_engine/machine_analysis/historical_evaluation/context/published/er-level-calibration-latest.yaml")
          packaged = "baibai_engine/machine_analysis/historical_evaluation/context/published/er-level-calibration-latest.yaml"
          dist = Path(os.environ["RUNNER_TEMP"]) / "baibai-dist"
          with zipfile.ZipFile(next(dist.glob("*.whl"))) as wheel:
              assert wheel.read(packaged) == source.read_bytes()
          with tarfile.open(next(dist.glob("*.tar.gz"))) as sdist:
              member = next(item for item in sdist.getmembers() if item.name.endswith("/" + source.as_posix()))
              with sdist.extractfile(member) as artifact:
                  assert artifact.read() == source.read_bytes()
          PY

      - name: Ruff format
        run: uv run ruff format --check --diff .

      - name: Ruff lint
        if: ${{ !cancelled() }}
        run: uv run ruff check --output-format github .

      - name: Type check
        if: ${{ !cancelled() }}
        run: uv run mypy

      - name: Import contracts
        if: ${{ !cancelled() }}
        run: uv run lint-imports

      - name: Drift gates
        if: ${{ !cancelled() }}
        # Every check under tools/quality/drift/ runs: a gate is wired in by living there, not by
        # being remembered here. They run as modules so a gate can import a sibling —
        # running the file directly puts only its own directory on the import path.
        run: |
          for gate in tools/quality/drift/check_*.py; do
            echo "== $gate"
            uv run python -m "tools.quality.drift.$(basename "$gate" .py)"
          done

      - name: Tests with coverage
        if: ${{ !cancelled() }}
        # Temporary SQLite stores use tmpfs to avoid disk fsync overhead.
        # Keep four workers for reproducible CI resource use; local runs may use auto.
        #
        # pytest-cov measures the xdist workers because it starts coverage inside each one;
        # `coverage run -m pytest` would only see the controller and report a near-empty run.
        env:
          TMPDIR: /dev/shm
        run: uv run pytest -n 4 --maxfail=0 --cov --cov-report=term-missing --durations=25 --durations-min=0.1

      # The scanners share this job to avoid a second billed runner, so they are asked
      # even after an earlier gate has failed. A red test would otherwise hide a CVE
      # until the next push, which a separate job never did.
      - name: Bandit
        if: ${{ !cancelled() }}
        # Whole directories, not named files: a script added under tools/ is scanned from
        # its first commit instead of waiting for someone to remember this list.
        run: >-
          uv run bandit -c pyproject.toml -q -r
          engine/src/baibai_engine web/backend/src/baibai_web jobs/src/baibai_jobs tools

      - name: Dependency audit
        if: ${{ !cancelled() }}
        # The audited surface is the lockfile exported to requirements, not the runner's
        # installed set, so a CVE in the environment's own tooling cannot fail a repository
        # whose dependencies are clean.
        run: |
          uv export \
            --format requirements.txt \
            --locked \
            --all-groups \
            --no-emit-project \
            --no-hashes \
            --output-file /tmp/baibai-loop-requirements.txt
          uv run pip-audit \
            --no-deps --disable-pip --strict \
            -r /tmp/baibai-loop-requirements.txt

      # A runtime/dev advisory must not hide findings in the isolated build environment.
      - name: Build dependency audit
        if: ${{ !cancelled() }}
        run: |
          uv run python - <<'PY' > /tmp/baibai-loop-build-requirements.txt
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          for requirement in config["build-system"]["requires"]:
              print(requirement)
          PY
          uv run pip-audit \
            -r /tmp/baibai-loop-build-requirements.txt
