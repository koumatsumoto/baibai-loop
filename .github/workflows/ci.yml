name: ci

# The merge ref this workflow checks is the tree that lands on main while the base
# holds still, so a second run after the merge would re-check bytes that already
# passed here. What that leaves uncovered is a base that moved between this run and
# the merge: the next pull request's own merge ref carries the result, and the daily
# batch reports whether main still imports and runs. Neither re-runs these gates, so
# a lint-, type- or test-only breakage on main waits for that next pull request.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every Python gate shares one job because Actions bills per job, rounded up to
  # the minute: a second runner costs a whole minute before it checks anything.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The notification script runs on the runner's system python3, before
      # setup-python and uv sync. This preserves failure reporting during setup
      # while enforcing its stdlib-only import contract before merge.
      - name: Import notification script on the system python3
        env:
          PYTHONPATH: batch/src
        run: |
          python3 --version
          python3 -m py_compile batch/src/baibai_batch/observability/discord.py
          python3 -c "import baibai_batch.observability.discord"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --frozen --all-groups

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Import contracts
        run: uv run lint-imports

      - name: Drift gates
        # Every check under tools/quality/drift/ runs: a gate is wired in by living there, not by
        # being remembered here. They run as modules so a gate can import a sibling —
        # running the file directly puts only its own directory on the import path.
        run: |
          for gate in tools/quality/drift/check_*.py; do
            echo "== $gate"
            uv run python -m "tools.quality.drift.$(basename "$gate" .py)"
          done

      - name: Tests with coverage
        # TMPDIR on tmpfs is what the suite's speed rests on: tests create thousands of
        # small SQLite stores under pytest's tmp root, and on the runner's disk every
        # commit waits on fsync. On tmpfs those waits vanish while fsync stays a working
        # no-op, so the durability probes in the suite still pass. Measured locally on 2
        # pinned cores: 91s wall (73s CPU) on disk vs 32s wall (63s CPU) on tmpfs, no-cov.
        # A full run writes ~211MB of tmp against the runner's ~3.4GB /dev/shm.
        #
        # With the I/O wait gone the suite is CPU-bound and -n 4 already keeps both
        # runner cores saturated (CPU/wall ≈ 2.0), so the worker count stays at 4.
        # Developer machines keep `auto` from `addopts`, where a wider box is worth using.
        #
        # pytest-cov measures the xdist workers because it starts coverage inside each one;
        # `coverage run -m pytest` would only see the controller and report a near-empty run.
        env:
          TMPDIR: /dev/shm
        run: uv run pytest -n 4 --cov --cov-report=term-missing

      # The scanners share this job to avoid a second billed runner, so they are asked
      # even after an earlier gate has failed. A red test would otherwise hide a CVE
      # until the next push, which a separate job never did.
      - name: Bandit
        if: ${{ !cancelled() }}
        # Whole directories, not named files: a script added under tools/ is scanned from
        # its first commit instead of waiting for someone to remember this list.
        run: >-
          uv run bandit -c pyproject.toml -q -r
          engine/src/baibai_engine web/backend/src/baibai_web batch/src/baibai_batch tools

      - name: Dependency audit
        if: ${{ !cancelled() }}
        # The audited surface is the lockfile exported to requirements, not the runner's
        # installed set, so a CVE in the environment's own tooling cannot fail a repository
        # whose dependencies are clean. `docs/reference/python-foundation.md` §8 holds the
        # reasoning for this export pipeline.
        run: |
          uv export \
            --format requirements.txt \
            --locked \
            --all-groups \
            --no-emit-project \
            --no-hashes \
            --output-file /tmp/baibai-loop-requirements.txt
          uv run pip-audit \
            -r /tmp/baibai-loop-requirements.txt
