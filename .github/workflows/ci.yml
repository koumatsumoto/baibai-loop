name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --frozen --all-groups

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Tests with coverage
        run: |
          uv run coverage run -m pytest
          uv run coverage report -m
          uv run coverage xml

      - name: Validate artefacts
        run: uv run baibai-loop-validate

      - name: Verify raw JSON cache size
        # Guard against committing a raw JSON file at or above GitHub's 50MB
        # warning threshold. The SQLite cross-check is skipped because
        # records/_data/cache/screening/market.sqlite is .gitignored.
        run: uv run python -m baibai_loop.screening.cli verify-raw-cache

      - name: Build package
        run: uv build
