name: ci

# The merge ref this workflow checks is the tree that lands on main while the base
# holds still, so a second run after the merge would re-check bytes that already
# passed here. What that leaves uncovered is a base that moved between this run and
# the merge: the next pull request's own merge ref carries the result, and the common integration
# job reports whether main still imports and runs. Neither re-runs these gates, so
# a lint-, type- or test-only breakage on main waits for that next pull request.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Python gates share one dependency setup.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The notification script runs on the runner's system python3, before
      # setup-python and uv sync. This preserves failure reporting during setup
      # while enforcing its stdlib-only import contract before merge.
      - name: Import notification script on the system python3
        env:
          PYTHONPATH: jobs/src
        run: |
          python3 --version
          python3 -m py_compile jobs/src/baibai_jobs/observability/discord.py
          python3 -c "import baibai_jobs.observability.discord"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --locked --all-groups

      - name: Check packaged calibration context
        run: |
          uv build --out-dir "$RUNNER_TEMP/baibai-dist"
          uv run python - <<'PY'
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          source = Path("engine/src/baibai_engine/machine_analysis/historical_evaluation/context/published/er-level-calibration-latest.yaml")
          packaged = "baibai_engine/machine_analysis/historical_evaluation/context/published/er-level-calibration-latest.yaml"
          dist = Path(os.environ["RUNNER_TEMP"]) / "baibai-dist"
          with zipfile.ZipFile(next(dist.glob("*.whl"))) as wheel:
              assert wheel.read(packaged) == source.read_bytes()
          with tarfile.open(next(dist.glob("*.tar.gz"))) as sdist:
              member = next(item for item in sdist.getmembers() if item.name.endswith("/" + source.as_posix()))
              with sdist.extractfile(member) as artifact:
                  assert artifact.read() == source.read_bytes()
          PY

      - name: Ruff format
        run: uv run ruff format --check --diff .

      - name: Ruff lint
        if: ${{ !cancelled() }}
        run: uv run ruff check --output-format github .

      - name: Type check
        if: ${{ !cancelled() }}
        run: uv run mypy

      - name: Import contracts
        if: ${{ !cancelled() }}
        run: uv run lint-imports

      - name: Drift gates
        if: ${{ !cancelled() }}
        # Every check under tools/quality/drift/ runs: a gate is wired in by living there, not by
        # being remembered here. They run as modules so a gate can import a sibling —
        # running the file directly puts only its own directory on the import path.
        run: |
          for gate in tools/quality/drift/check_*.py; do
            echo "== $gate"
            uv run python -m "tools.quality.drift.$(basename "$gate" .py)"
          done

      - name: Tests with coverage
        if: ${{ !cancelled() }}
        # Temporary SQLite stores use tmpfs to avoid disk fsync overhead.
        # Keep four workers for reproducible CI resource use; local runs may use auto.
        #
        # pytest-cov measures the xdist workers because it starts coverage inside each one;
        # `coverage run -m pytest` would only see the controller and report a near-empty run.
        env:
          TMPDIR: /dev/shm
        run: uv run pytest -n 4 --maxfail=0 --cov --cov-report=term-missing --durations=25 --durations-min=0.1 --junitxml="$RUNNER_TEMP/baibai-results.xml"

      - name: Temporary integrated failure locations
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PYRESULT'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "baibai-results.xml"
          if path.exists():
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  for result in (*case.findall("failure"), *case.findall("error")):
                      label = case.get("classname", "") + "." + case.get("name", "")
                      message = (label + ": " + result.get("message", ""))[:2500]
                      message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print("::error title=Integrated test failure::" + message)
          PYRESULT

      # The scanners share this job to avoid a second billed runner, so they are asked
      # even after an earlier gate has failed. A red test would otherwise hide a CVE
      # until the next push, which a separate job never did.
      - name: Bandit
        if: ${{ !cancelled() }}
        # Whole directories, not named files: a script added under tools/ is scanned from
        # its first commit instead of waiting for someone to remember this list.
        run: >-
          uv run bandit -c pyproject.toml -q -r
          engine/src/baibai_engine web/backend/src/baibai_web jobs/src/baibai_jobs tools

      - name: Dependency audit
        if: ${{ !cancelled() }}
        # The audited surface is the lockfile exported to requirements, not the runner's
        # installed set, so a CVE in the environment's own tooling cannot fail a repository
        # whose dependencies are clean.
        run: |
          uv export \
            --format requirements.txt \
            --locked \
            --all-groups \
            --no-emit-project \
            --no-hashes \
            --output-file /tmp/baibai-loop-requirements.txt
          uv run pip-audit \
            --no-deps --disable-pip --strict \
            -r /tmp/baibai-loop-requirements.txt

      # A runtime/dev advisory must not hide findings in the isolated build environment.
      - name: Build dependency audit
        if: ${{ !cancelled() }}
        run: |
          uv run python - <<'PY' > /tmp/baibai-loop-build-requirements.txt
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          for requirement in config["build-system"]["requires"]:
              print(requirement)
          PY
          uv run pip-audit \
            -r /tmp/baibai-loop-build-requirements.txt
