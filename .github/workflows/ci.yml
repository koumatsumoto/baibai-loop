name: ci

# The merge ref this workflow checks is the tree that lands on main, so a second
# run after the merge would re-check bytes that already passed here. main keeps
# its cover from the next pull request — every later merge ref contains it — and
# from the daily batch, which runs main and reports to Discord.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every Python gate shares one job because Actions bills per job, rounded up to
  # the minute: a second runner costs a whole minute before it checks anything.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The notification scripts run on the runner's system python3, before
      # setup-python and uv sync. This preserves failure reporting during setup
      # while enforcing their stdlib-only import contract before merge.
      - name: Import notification scripts on the system python3
        run: |
          python3 --version
          python3 -m py_compile tools/cloud/batch_summary.py tools/cloud/notify_discord.py
          python3 -c "import tools.cloud.batch_summary; import tools.cloud.notify_discord"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --frozen --all-groups

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Import contracts
        run: uv run lint-imports

      - name: Drift gates
        # Every check under tools/drift/ runs: a gate is wired in by living there, not by
        # being remembered here.
        run: |
          for gate in tools/drift/check_*.py; do
            echo "== $gate"
            uv run python "$gate"
          done

      - name: Tests with coverage
        # The suite spends most of its wall clock waiting on sqlite rather than on the CPU,
        # so workers pay off well past the core count. pytest-cov measures the xdist workers
        # because it starts coverage inside each one; `coverage run -m pytest` would only
        # see the controller process and report a near-empty run.
        run: uv run pytest -n auto --cov --cov-report=term-missing

      # TEMPORARY: measures the worker count this runner actually wants. Removed
      # before merge once the winning value is written into the step above.
      - name: Measure worker counts
        run: |
          echo "nproc=$(nproc) cpu_count=$(python3 -c 'import os; print(os.cpu_count(), os.process_cpu_count())')"
          for workers in 4 8 16; do
            start=$SECONDS
            uv run pytest -n "$workers" --cov --cov-report= -q > /dev/null
            echo "workers=$workers elapsed=$((SECONDS - start))s"
          done

      - name: Brand asset contract
        # tools/generate_brand_assets.py needs Pillow, which stays out of the lock so no daily
        # workflow installs a native image library and pip-audit never carries it. That leaves
        # its end-to-end test skipped in the run above, so it gets a step with Pillow as a
        # throwaway overlay: --with resolves into a temporary env and touches neither uv.lock
        # nor `uv export --all-groups`. The floor on the version stays in the script's PEP 723
        # block, the one place that has to agree with what the script uses.
        #
        # The tradeoff taken here is that this job installs one package from outside the locked
        # set. It holds `contents: read` and no secrets, and the alternative — locking a native
        # image library into every workflow's install and into the audit surface — costs more.
        #
        # The import runs first because `pytest.importorskip` is fail-open: without it, a run
        # where Pillow is missing or broken passes this step by skipping every test in the file.
        run: |
          uv run --with pillow python -c 'import PIL.Image'
          uv run --with pillow pytest -n 0 tests/test_brand_assets.py

      - name: Bandit
        # Whole directories, not named files: a script added under tools/ is scanned from
        # its first commit instead of waiting for someone to remember this list.
        run: >-
          uv run bandit -c pyproject.toml -q -r
          src/baibai_engine src/baibai_app tools

      - name: Dependency audit
        # The audited surface is the lockfile exported to requirements, not the runner's
        # installed set, so a CVE in the environment's own tooling cannot fail a repository
        # whose dependencies are clean. `docs/reference/python-foundation.md` §8 holds the
        # reasoning for this export pipeline.
        run: |
          uv export \
            --format requirements.txt \
            --locked \
            --all-groups \
            --no-emit-project \
            --no-hashes \
            --output-file /tmp/baibai-loop-requirements.txt
          uv run pip-audit \
            -r /tmp/baibai-loop-requirements.txt

      - name: Build package
        run: uv build --wheel
