name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --frozen --all-groups

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Import contracts
        run: uv run lint-imports

      - name: Drift gates
        # Every check under tools/drift/ runs: a gate is wired in by living there, not by
        # being remembered here.
        run: |
          for gate in tools/drift/check_*.py; do
            echo "== $gate"
            uv run python "$gate"
          done

      - name: Tests with coverage
        run: |
          uv run coverage run -m pytest
          uv run coverage report -m
          uv run coverage xml

      - name: Brand asset contract
        # tools/generate_brand_assets.py needs Pillow, which stays out of the lock so no daily
        # workflow installs a native image library and pip-audit never carries it. That leaves
        # its end-to-end test skipped in the run above, so it gets a step with Pillow as a
        # throwaway overlay: --with resolves into a temporary env and touches neither uv.lock
        # nor `uv export --all-groups`.
        run: uv run --with 'pillow>=12.0.0' pytest tests/test_brand_assets.py

      - name: Build package
        run: uv build --wheel

  # The notification scripts run on the runner's system python3, before
  # setup-python and uv sync — that is the only way a run that fails during setup
  # can still report itself. If a change breaks the stdlib-only contract, the
  # daily batch's own smoke step catches it, but by then the notifier is broken
  # too and the failure arrives silently. Check it before merge instead.
  notifier-stdlib-only:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Named files, unlike the gates above: the contract holds for the notification path
      # only, and the rest of tools/cloud/ is free to import the project's dependencies.
      # A third notification script has to be added here.
      - name: Import notification scripts on the system python3
        run: |
          python3 --version
          python3 -m py_compile tools/cloud/batch_summary.py tools/cloud/notify_discord.py
          python3 -c "import tools.cloud.batch_summary; import tools.cloud.notify_discord"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test

  cloud-worker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            cloud/worker/package-lock.json

      - name: Build UI assets
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Verify Worker
        working-directory: cloud/worker
        run: |
          npm ci
          npm run types:check
          npm run typecheck
          npm test
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-bundle"
