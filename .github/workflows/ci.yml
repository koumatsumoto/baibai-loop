name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --frozen --all-groups

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      # The operator tool that rewrites the PMI manifest sits outside the
      # packages, and it fetches the network and edits a canonical file.
      - name: Type check operator tools
        run: uv run mypy tools/append_pmi_manifest.py

      - name: Import contracts
        run: uv run lint-imports

      - name: Drift gates
        run: |
          uv run python tools/drift/check_markdown_links.py
          uv run python tools/drift/check_cli_doc.py
          uv run python tools/drift/check_legacy_semantics.py
          uv run python tools/drift/check_duplicate_constants.py
          uv run python tools/drift/check_skill_inventory.py

      - name: Tests with coverage
        run: |
          uv run coverage run -m pytest
          uv run coverage report -m
          uv run coverage xml

      - name: Build package
        run: uv build --wheel

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test

  cloud-worker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            cloud/worker/package-lock.json

      - name: Build UI assets
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Verify Worker
        working-directory: cloud/worker
        run: |
          npm ci
          npm run types:check
          npm run typecheck
          npm test
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-bundle"
