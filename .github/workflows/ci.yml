name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --frozen --all-groups

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Import contracts
        run: uv run lint-imports

      - name: Drift gates
        run: |
          uv run python tools/drift/check_markdown_links.py
          uv run python tools/drift/check_cli_doc.py
          uv run python tools/drift/check_legacy_semantics.py
          uv run python tools/drift/check_duplicate_constants.py
          uv run python tools/drift/check_clean_lineage.py
          uv run python tools/drift/check_skill_inventory.py

      - name: Block tracked raw screening cache
        run: |
          if git ls-files 'records/_data/raw/screening' 'records/_data/cache' | grep -q .; then
            echo 'screening cache must not be tracked under records/_data/raw/screening or records/_data/cache'
            git ls-files 'records/_data/raw/screening' 'records/_data/cache'
            exit 1
          fi

      - name: Tests with coverage
        run: |
          uv run coverage run -m pytest
          uv run coverage report -m
          uv run coverage xml

      - name: Validate artefacts
        run: uv run baibai-engine validate

      - name: Validate clean checkout lineage
        run: |
          checkout="$(mktemp -d)"
          git archive HEAD | tar -x -C "$checkout"
          (
            cd "$checkout"
            uv run --frozen baibai-engine validate
          )

      - name: Build package
        run: uv build --wheel

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run build
