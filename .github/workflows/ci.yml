name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Fetch base for migration audit
        if: github.event_name == 'pull_request'
        run: git fetch origin main:refs/remotes/origin/main --depth=1

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --frozen --all-groups

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Tests with coverage
        run: |
          uv run coverage run -m pytest
          uv run coverage report -m
          uv run coverage xml

      - name: Validate artefacts
        run: uv run baibai-loop-validate

      - name: Verify immutable snapshot append-only policy
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          snapshot_prefixes = (
              "records/01-policy/2026/",
              "records/_approval-rules/",
              "records/_calendars/",
              "records/_config/",
              "records/_external/",
              "records/_ledger/research-decisions/",
              "records/_market-data/",
              "records/_migrations/",
              "records/_playbooks/",
              "records/_portfolio-exposure/",
              "records/_universe-snapshots/",
          )
          mutable_names = {"_index.yaml", "README.md"}
          append_only_names = {"_changelog.jsonl"}
          append_only_prefixes = ("records/_ledger/research-decisions/",)
          migration_mode = os.environ.get("GITHUB_HEAD_REF") == "migration/domain-model-103"

          def git_show(ref: str, path: str) -> str:
              return subprocess.check_output(["git", "show", f"{ref}:{path}"], text=True)

          diff = subprocess.check_output(
              ["git", "diff", "--name-status", "origin/main...HEAD"],
              text=True,
          )
          blocked: list[str] = []
          for line in diff.splitlines():
              if not line:
                  continue
              parts = line.split("\t")
              status = parts[0]
              paths = parts[1:]
              for path in paths:
                  if not path.startswith(snapshot_prefixes):
                      continue
                  if migration_mode and not path.startswith("records/_external/"):
                      continue
                  name = path.rsplit("/", 1)[-1]
                  if name in mutable_names:
                      continue
                  is_append_only = name in append_only_names or path.startswith(append_only_prefixes)
                  if is_append_only:
                      if status.startswith(("D", "R")):
                          blocked.append(line)
                          continue
                      if status.startswith("M"):
                          base = git_show("origin/main", path)
                          head = git_show("HEAD", path)
                          if not head.startswith(base):
                              blocked.append(line)
                      continue
                  if status.startswith(("M", "D", "R")):
                      blocked.append(line)
          if blocked:
              print("Immutable snapshot files must be append-only:", file=sys.stderr)
              print("\n".join(blocked), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Anti-pattern precheck (AP-06 source_refs)
        # 既存 outlook に先行 AP-06 違反が残っているため、現時点では
        # warning-only として実行する。--strict は別 PR で outlook を
        # 整理した後に有効化する。
        run: uv run baibai-loop-precheck

      - name: Verify raw JSON cache size
        # Guard against committing a raw JSON file at or above GitHub's 50MB
        # warning threshold. The SQLite cross-check is skipped because
        # records/_data/cache/screening/market.sqlite is .gitignored.
        run: uv run python -m baibai_loop.screening.cli verify-raw-cache

      - name: Build package
        run: uv build --wheel
