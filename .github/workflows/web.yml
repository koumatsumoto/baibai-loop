name: web

# mainのWeb変更は検証後に自動配備する。配信データの形式が変わる間は、
# 一時的に表示が崩れてもよい。データ公開を待たず、旧形式との互換処理も入れない。
on:
  pull_request:
    branches: [main]
    paths:
      - web/frontend/**
      - web/edge/**
      - web/contracts/**
      - .github/workflows/web.yml
      - .node-version
  push:
    # GitHubのpath filterは大きな差分で起動を見送ることがあるため、mainは起動後に判定する。
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  WEB_INPUTS: >-
    web/frontend
    web/edge
    web/contracts
    .node-version
    .github/workflows/web.yml
  PRODUCTION: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    if: ${{ github.event_name == 'push' && !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.changes.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/workflows
      - name: Check for changes to Web inputs
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          read -r -a web_inputs <<< "$WEB_INPUTS"
          web=true
          if [[ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]] &&
            git fetch --no-tags --depth=1 --filter=blob:none origin "$BEFORE_SHA"; then
            if git diff --no-renames --quiet "$BEFORE_SHA" "$TARGET_SHA" -- "${web_inputs[@]}"; then
              web=false
            elif [[ $? -ne 1 ]]; then
              echo "::error::failed to compare Web inputs for this push"
              exit 1
            fi
          else
            echo "::notice::previous push revision unavailable; validating Web inputs"
          fi
          echo "web=$web" >> "$GITHUB_OUTPUT"

  quality:
    needs: scope
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.scope.result == 'success' && needs.scope.outputs.web == 'true') }}
    # 本番に配備し得るrunだけを直列化する。後から来た古いrunが待機中の新しいrunを消さない。
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && format('{0}-production-deploy', github.workflow) || format('{0}-quality-{1}', github.workflow, github.run_id) }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            web/frontend/package-lock.json
            web/edge/package-lock.json

      - name: Install UI dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Lint UI
        working-directory: web/frontend
        run: npm run lint

      - name: Build UI
        working-directory: web/frontend
        run: npm run build

      - name: Test UI
        working-directory: web/frontend
        run: npm test

      - name: Install Worker dependencies
        working-directory: web/edge
        run: npm ci

      - name: Check Worker generated types
        working-directory: web/edge
        run: npm run types:check

      - name: Typecheck Worker
        working-directory: web/edge
        run: npm run typecheck

      - name: Test Worker
        working-directory: web/edge
        run: npm test

      - name: Dry-run Worker deploy
        working-directory: web/edge
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-bundle"

      # 待機中にmainのbuild入力が変わったrunは配備しない。
      # 表示コードだけでなくNode版とbuild/deploy手順も比較する。
      - name: Verify current production target
        id: deploy-target
        if: ${{ env.PRODUCTION == 'true' }}
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          read -r -a web_inputs <<< "$WEB_INPUTS"
          git fetch --no-tags --depth=1 --filter=blob:none origin refs/heads/main
          current_sha="$(git rev-parse FETCH_HEAD)"
          current=false
          if git diff --no-renames --quiet "$TARGET_SHA" "$current_sha" -- "${web_inputs[@]}"; then
            current=true
          else
            diff_status=$?
            if [[ $diff_status -eq 1 ]]; then
              echo "::notice::stale web target skipped: $TARGET_SHA (main: $current_sha)"
            else
              echo "::error::failed to compare production target with main"
              exit 1
            fi
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker and UI assets
        if: ${{ success() && env.PRODUCTION == 'true' && steps.deploy-target.outputs.current == 'true' }}
        working-directory: web/edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
        run: npx wrangler deploy
