name: web

# The path filter is the deploy scope. GitHub diffs the pull request three-dot or
# the push range itself, so a run existing at all already means the web tree moved,
# and no job has to re-derive that from git. The filter is exact here because it
# only goes silent on diffs past 3,000 files, which a tree this size cannot reach
# — tests/batch/test_cloud_workflow_contracts.py holds that budget.
#
# This file is filtered on pull requests so its own edits are gated, and left out
# of the push filter so that editing CI never publishes production.
on:
  pull_request:
    branches: [main]
    paths:
      - web/frontend/**
      - web/edge/**
      - .github/workflows/web.yml
  push:
    branches: [main]
    paths:
      - web/frontend/**
      - web/edge/**
  workflow_dispatch:

permissions:
  contents: read

# Pull requests supersede themselves. Runs that can reach the deploy step queue
# behind one another, and runs that cannot are kept out of that queue entirely:
# a group holds one pending run, so a branch dispatch sharing it would evict a
# real deploy that is waiting its turn.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || github.ref == 'refs/heads/main' && format('{0}-production-deploy', github.workflow) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/frontend/package-lock.json
            web/edge/package-lock.json

      - name: Install UI dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Lint UI
        working-directory: web/frontend
        run: npm run lint

      - name: Build UI
        working-directory: web/frontend
        run: npm run build

      - name: Test UI
        working-directory: web/frontend
        run: npm test

      - name: Install Worker dependencies
        working-directory: web/edge
        run: npm ci

      - name: Check Worker generated types
        working-directory: web/edge
        run: npm run types:check

      - name: Typecheck Worker
        working-directory: web/edge
        run: npm run typecheck

      - name: Test Worker
        working-directory: web/edge
        run: npm test

      - name: Dry-run Worker deploy
        working-directory: web/edge
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-bundle"

      # A queued run can hold a web tree that main has already moved past. Publishing it
      # would roll production backwards, so the run compares its own tree against main
      # and steps aside rather than deploying.
      #
      # The event test is an allowlist rather than "not a pull request": `github.ref` is
      # the default branch for schedule, workflow_run and repository_dispatch too, so a
      # trigger added later must be named here before it can reach production.
      - name: Verify current production target
        id: deploy-target
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin main
          current_sha="$(git rev-parse FETCH_HEAD)"
          current=false
          if git diff --quiet "$TARGET_SHA" "$current_sha" -- web/frontend web/edge; then
            current=true
          else
            diff_status=$?
            if [[ $diff_status -eq 1 ]]; then
              echo "::notice::stale web target skipped: $TARGET_SHA (main: $current_sha)"
            else
              echo "::error::failed to compare production target with main"
              exit 1
            fi
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker and UI assets
        if: ${{ success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.deploy-target.outputs.current == 'true' }}
        working-directory: web/edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
        run: npx wrangler deploy
