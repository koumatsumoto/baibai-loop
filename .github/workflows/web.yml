name: web

# The path filter is the deploy scope. GitHub diffs the pull request three-dot or
# the push range itself, so a run existing at all already means the web tree moved,
# and no job has to re-derive that from git. The filter is exact here because it
# only goes silent on diffs past 3,000 files, which a tree this size cannot reach
# — tests/test_cloud_workflow_contracts.py holds that budget.
on:
  pull_request:
    branches: [main]
    paths:
      - ui/**
      - cloud/worker/**
      - .github/workflows/web.yml
  push:
    branches: [main]
    paths:
      - ui/**
      - cloud/worker/**
      - .github/workflows/web.yml
  workflow_dispatch:

permissions:
  contents: read

# Pull requests supersede themselves; anything that can reach the deploy step
# queues behind the run in front of it instead of racing it.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-production-deploy', github.workflow) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            cloud/worker/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      # Both lockfiles live under the filtered paths, so every edit to one arrives
      # here. `--package-lock-only` audits the resolved tree without a second install.
      - name: UI dependency audit
        working-directory: ui
        run: npm audit --package-lock-only --audit-level=high

      - name: Lint UI
        working-directory: ui
        run: npm run lint

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Test UI
        working-directory: ui
        run: npm test

      - name: Install Worker dependencies
        working-directory: cloud/worker
        run: npm ci

      - name: Worker dependency audit
        working-directory: cloud/worker
        run: npm audit --package-lock-only --audit-level=high

      - name: Check Worker generated types
        working-directory: cloud/worker
        run: npm run types:check

      - name: Typecheck Worker
        working-directory: cloud/worker
        run: npm run typecheck

      - name: Test Worker
        working-directory: cloud/worker
        run: npm test

      - name: Dry-run Worker deploy
        working-directory: cloud/worker
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-bundle"

      # A queued run can hold a web tree that main has already moved past. Publishing it
      # would roll production backwards, so the run compares its own tree against main
      # and steps aside rather than deploying.
      - name: Verify current production target
        id: deploy-target
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin main
          current_sha="$(git rev-parse FETCH_HEAD)"
          current=false
          if git diff --quiet "$TARGET_SHA" "$current_sha" -- ui cloud/worker; then
            current=true
          else
            diff_status=$?
            if [[ $diff_status -eq 1 ]]; then
              echo "::notice::stale web target skipped: $TARGET_SHA (main: $current_sha)"
            else
              echo "::error::failed to compare production target with main"
              exit 1
            fi
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker and UI assets
        if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.deploy-target.outputs.current == 'true' }}
        working-directory: cloud/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
        run: npx wrangler deploy
