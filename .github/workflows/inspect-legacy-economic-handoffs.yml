name: inspect-legacy-economic-handoffs

# One-time, read-only preparation. No schedule, source acquisition or publication.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspect-legacy-economic-handoffs
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Inspect fixed originals and prepare local recovery copies only
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >-
          uv run python -m tools.diagnostics.inspect_legacy_economic_handoffs
          --directory "$RUNNER_TEMP/legacy-economic-inspection"
      # No artifact upload: original bytes and the unpublished candidate stay on
      # this temporary runner. stdout contains only the allowlisted summary.
