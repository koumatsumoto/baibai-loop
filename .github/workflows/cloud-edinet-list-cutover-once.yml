name: cloud-edinet-list-cutover-once

# 本人承認済みの一覧native有限移行。既存原本と定期writer/共通flagsは変更しない。
on:
  push:
    branches: [codex/issue1820-edinet-list-cutover-once]
    paths: [.github/workflows/cloud-edinet-list-cutover-once.yml]

permissions:
  contents: read

concurrency:
  group: cloud-publish
  queue: max
  cancel-in-progress: false

jobs:
  cutover:
    if: >-
      ${{ github.repository == 'koumatsumoto/baibai-loop' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/codex/issue1820-edinet-list-cutover-once' &&
          github.run_attempt == 1 &&
          github.event.head_commit.message == 'ops: run one-off EDINET list cutover 2026-11-05' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: source-acquire-edinet
      queue: max
      cancel-in-progress: false
    env:
      BAIBAI_FINANCIAL_NATIVE: 'false'
      BAIBAI_PRICE_NATIVE: 'false'
      BAIBAI_MASTER_NATIVE: 'false'
      BAIBAI_CALENDAR_NATIVE: 'false'
      BAIBAI_EDINET_LIST_NATIVE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Require the reviewed merged code as this run's exact base
        env:
          EXPECTED_CODE_SHA: ef643ae3d8e274a64a19a5b671c34dc2d5abfe78
        run: test "$(git rev-parse HEAD^)" = "$EXPECTED_CODE_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Migrate fixed EDINET originals and verify cold reconstruction
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          uv run python - <<'PYCODE'
          """EDINET一覧を固定旧release/stageから独立headへ一回移す。既存原本と正本は削除しない。"""

          from __future__ import annotations

          import base64
          import contextlib
          import hashlib
          import json
          import os
          import shutil
          import sqlite3
          import sys
          import traceback
          from datetime import UTC, datetime
          from pathlib import Path

          from baibai_engine.data_collection.providers.edinet.facts_scope import read_scope
          from baibai_engine.data_collection.providers.edinet.list_native import (
              HEAD_KEY,
              PREFIX,
              EdinetListL1,
          )
          from baibai_engine.storage.json import write_json_atomic
          from baibai_engine.storage.objects.r2 import Boto3R2Store, LakePublishError
          from baibai_engine.storage.snapshots.objects import open_lake
          from baibai_engine.storage.snapshots.reader import iter_partition_rows, resolve_release
          from baibai_engine.storage.snapshots.sources import sha256_file
          from baibai_engine.storage.sqlite.source_cache.schema import (
              open_connection,
              validate_current_schema,
          )
          from baibai_jobs.acquisition.receipts import available_handoffs
          from baibai_jobs.integration.edinet_list_native import materialize_lists
          from baibai_jobs.integration.sources import canonical_generations
          from baibai_jobs.maintenance import edinet_list_cutover as cutover
          from baibai_jobs.maintenance.economic_cutover import _read
          from baibai_jobs.publication import lease

          PINNED_KEYS = (
              "market.sqlite",
              "runs.sqlite",
              "indicators.sqlite",
              "machine-manifest.json",
              "lake/pointers/market/current.json",
          )
          DATASETS = (cutover.EDINET_LIST_RESPONSES, cutover.EDINET_DOCUMENT_LISTS, cutover.EDINET_DOCUMENTS)


          class NativeWrites:
              """本操作の書込先は独立一覧head/bodyだけ。既存正本・stage・releaseは読取専用。"""

              def __init__(self, store, guard):
                  self.store, self.guard = store, guard

              def head(self, key):
                  return self.store.head(key)

              def get_bytes(self, key):
                  return self.store.get_bytes(key)

              def put_file(self, key, path, **kwargs):
                  if not (key == HEAD_KEY or key.startswith(PREFIX + "objects/")):
                      raise ValueError("write outside independent EDINET list scope")
                  if key != HEAD_KEY and not kwargs.get("if_none_match"):
                      raise ValueError("native originals must be create-only")
                  # Immutable copies do not adopt a new source generation; check all peers at head CAS.
                  self.guard(key == HEAD_KEY)
                  return self.store.put_file(key, path, **kwargs)


          def preserve(store, directory, prefix, path, guard):
              """小さい固定plan/結果のみ私有保全。原本は既存不変release/stageをそのまま保持する。"""
              digest = sha256_file(path)
              key = prefix + path.name + "-" + digest
              if store.head(key) is None:
                  guard()
                  with path.open("rb") as stream:
                      md5 = hashlib.file_digest(stream, lambda: hashlib.md5(usedforsecurity=False)).digest()
                  with contextlib.suppress(LakePublishError):
                      store.put_file(
                          key,
                          path,
                          sha256=digest,
                          content_md5=base64.b64encode(md5).decode(),
                          content_type="application/octet-stream",
                          if_none_match=True,
                      )
              check = directory / "private-readback"
              _read(store, key, check)
              if sha256_file(check) != digest:
                  raise ValueError("private plan readback differs")
              check.unlink()
              return key


          def compare_projection(session, directory, fixed):
              """旧投影を持つ作業copyとcold copyを同じ固定原本から再生成し一致を確認する。"""
              warm, cold = directory / "warm.sqlite", directory / "cold.sqlite"
              shutil.copyfile(directory / "market50.sqlite", warm)
              with contextlib.closing(open_connection(warm)) as conn, conn:
                  scope = read_scope(conn)
                  for dataset in DATASETS:
                      paths = sorted((directory / "plan").glob(dataset.name + "-*.parquet"))
                      columns = ",".join(column.name for column in dataset.columns)
                      placeholders = ",".join("?" for _ in dataset.columns)
                      conflict = "IGNORE" if dataset == cutover.EDINET_LIST_RESPONSES else "REPLACE"
                      for batch in iter_partition_rows(session, dataset=dataset, paths=paths, columns=None):
                          conn.executemany(
                              f"INSERT OR {conflict} INTO {dataset.sqlite_table} ({columns}) "
                              f"VALUES ({placeholders})",
                              batch,
                          )
              warm_report = materialize_lists(fixed, warm)
              cold_report = materialize_lists(fixed, cold)
              if warm_report != cold_report:
                  raise ValueError("cold and warm native reconstruction differ")
              with (
                  contextlib.closing(sqlite3.connect(warm)) as w,
                  contextlib.closing(sqlite3.connect(cold)) as c,
              ):
                  for table in ("edinet_list_responses", "edinet_document_lists", "edinet_documents"):
                      query = f"SELECT * FROM {table} ORDER BY 1,2"
                      if w.execute(query).fetchall() != c.execute(query).fetchall():
                          raise ValueError("cold and warm EDINET rows differ")
                  query = (
                      "SELECT * FROM source_coverage WHERE source='edinet_documents' ORDER BY coverage_key"
                  )
                  if w.execute(query).fetchall() != c.execute(query).fetchall():
                      raise ValueError("cold and warm EDINET coverage differ")
                  if read_scope(w) != scope:
                      raise ValueError("list reconstruction changed facts acquisition scope")
              return {
                  **cold_report,
                  "cold_warm_equal": True,
                  "facts_scope_unchanged": True,
                  "legacy_projection_evidence_verified": True,
              }


          def execute(store, directory, prefix, *, prepare=cutover.prepare_migration, emit=lambda **_: None):
              directory.mkdir(parents=True, exist_ok=False)
              # This is intentionally before even acquiring a publication lease.
              downloaded = _read(store, "market.sqlite", directory / "market50.sqlite")
              with contextlib.closing(
                  sqlite3.connect((directory / "market50.sqlite").as_uri() + "?mode=ro", uri=True)
              ) as conn:
                  validate_current_schema(conn)
              generations = canonical_generations(store)
              base = {key: store.head(key) for key in PINNED_KEYS}
              if any(value is None for value in base.values()):
                  raise ValueError("required canonical metadata is missing")
              if base["market.sqlite"].etag != downloaded.etag or canonical_generations(store) != generations:
                  raise ValueError("canonical generation changed while pinning migration inputs")
              if any(
                  os.environ.get("BAIBAI_" + name + "_NATIVE", "false") != "false"
                  for name in ("FINANCIAL", "PRICE", "MASTER", "CALENDAR", "EDINET_LIST")
              ):
                  raise ValueError("finite migration must precede the shared native-mode switch")
              handle, _ = lease.acquire(store, "operator")
              report = {"migration_completed": False, "lease_released": False}
              phase = "prepare"
              expected_handoffs = None

              def private_guard():
                  lease.verify_held(store, handle)

              def guard(check_peers=True):
                  lease.verify_held(store, handle)
                  if check_peers and any(
                      (current := store.head(key)) is None or current.etag != meta.etag
                      for key, meta in base.items()
                  ):
                      raise ValueError("canonical state changed during EDINET migration")
                  if check_peers and expected_handoffs is not None:
                      current_handoffs = [
                          entry
                          for source in cutover.SOURCES
                          for entry in available_handoffs(store, source=source, include_integrated=True)
                      ]
                      if current_handoffs != expected_handoffs:
                          raise ValueError("EDINET handoffs changed after the fixed migration boundary")

              def save(name, value):
                  path = directory / name
                  write_json_atomic(path, value)
                  return preserve(store, directory, prefix, path, private_guard)

              try:
                  guard()
                  boundary = datetime.now(UTC)
                  save(
                      "state.json",
                      {
                          "format": "edinet-list-cutover-once-v1",
                          "known_at": boundary.isoformat(),
                          "generations": generations,
                          "base_etags": {k: v.etag for k, v in base.items()},
                      },
                  )
                  with open_lake(mirror=directory / "mirror", bucket="baibai-stores") as (session, cache):
                      release = resolve_release(
                          cache.source,
                          generations["lake_release_id"],
                          manifest_sha256=generations["lake_manifest_sha256"],
                      )
                      plan = prepare(
                          session,
                          release=release,
                          cache=cache,
                          store=store,
                          known_at=boundary,
                          directory=directory / "plan",
                      )
                      expected_handoffs = plan["handoffs"]
                      for name in ("plan.json", "plan.sha256"):
                          preserve(store, directory, prefix, directory / "plan" / name, private_guard)
                      if plan["blocked"] or plan["missing_raw_days"]:
                          report.update(
                              failed_phase=phase,
                              reason="retained_originals_need_resolution",
                              missing_raw_days_present=bool(plan["missing_raw_days"]),
                              blocked_evidence_present=bool(plan["blocked"]),
                          )
                          return report
                      emit(
                          phase=phase, legacy_projection_evidence_verified=True, fixed_originals_complete=True
                      )
                      guard()
                      phase = "apply"
                      native = NativeWrites(store, guard)
                      result = cutover.apply_migration(
                          EdinetListL1(native, directory / "native"), directory=directory / "plan"
                      )
                      save("applied.json", result)
                      emit(phase=phase, independent_originals_published=True)
                      phase = "verify_compare"
                      fresh = EdinetListL1(native, directory / "fresh")
                      cutover.verify_migration(fresh, directory=directory / "plan")
                      fixed = fresh.freeze()
                      comparison = compare_projection(session, directory, fixed)
                      save("comparison.json", comparison)
                      guard()
                      report.update(
                          migration_completed=True,
                          native_readback_verified=True,
                          cold_warm_equal=True,
                          legacy_projection_evidence_verified=True,
                          facts_scope_unchanged=True,
                          canonical_unchanged=True,
                          legacy_release_stage_preserved=True,
                          projection_failures_present=bool(comparison["failed_days"]),
                          shared_flags_unchanged=True,
                      )
                      save("completed.json", report)
              except Exception as error:
                  report.update(failed_phase=phase, error_type=type(error).__name__)
                  error_path = directory / "error-private.txt"
                  error_path.write_text(traceback.format_exc())
                  with contextlib.suppress(Exception):
                      preserve(store, directory, prefix, error_path, private_guard)
              finally:
                  try:
                      lease.release(store, handle)
                      report["lease_released"] = True
                  except Exception as error:
                      report["lease_release_error_type"] = type(error).__name__
              return report


          def main():
              run_id = os.environ.get("GITHUB_RUN_ID", "")
              if not run_id.isdigit() or os.environ.get("GITHUB_RUN_ATTEMPT") != "1":
                  print(json.dumps({"refused": True, "reason": "only_first_authorized_run_attempt"}))
                  return 1
              public = sys.stdout

              def emit(**value):
                  print(json.dumps(value, sort_keys=True), file=public, flush=True)

              store = Boto3R2Store(bucket="baibai-stores")
              try:
                  with (
                      Path("/tmp/edinet-cutover-private.log").open("w") as private,
                      contextlib.redirect_stdout(private),
                      contextlib.redirect_stderr(private),
                  ):
                      report = execute(
                          store,
                          Path("/tmp/baibai-edinet-list-cutover"),
                          f"coordination/cutovers/edinet-list-native/{run_id}/",
                          emit=emit,
                      )
              except Exception as error:
                  report = {"migration_completed": False, "error_type": type(error).__name__}
              finally:
                  store.close()
              emit(**report)
              return 0 if report.get("migration_completed") and report.get("lease_released") else 1


          if __name__ == "__main__":
              raise SystemExit(main())
          PYCODE
