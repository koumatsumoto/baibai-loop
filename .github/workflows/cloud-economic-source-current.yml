name: cloud-economic-source

on:
  workflow_call:
    inputs:
      group:
        required: true
        type: string
      source_id:
        type: string
        default: ''
      asof:
        required: true
        type: string
      current_only_now:
        type: boolean
        default: false
      retirement_attempt:
        type: string
        required: true
      requires_v2:
        type: string
        required: true

permissions:
  contents: read

# A second run of the same provider must compare against the preceding publication.
concurrency:
  group: economic-source-${{ inputs.group }}
  queue: max
  cancel-in-progress: false

jobs:
  acquire:
    if: >-
      ${{ github.workflow_ref == format('{0}/.github/workflows/cloud-economic-sources-current.yml@refs/heads/main', github.repository)
      && inputs.retirement_attempt == github.run_attempt
      && (inputs.requires_v2 == 'true' || inputs.requires_v2 == 'false') }}
    env:
      UV_NO_DEV: "true"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: source-acquire-${{ inputs.group }}
      queue: max
      cancel-in-progress: false
    outputs:
      handoff: ${{ steps.stage.outputs.handoff }}
      expected_unavailable: ${{ steps.acquire.outputs.expected_unavailable }}
    steps:
      - name: Reserve time for private receipt export and staging
        run: echo "BAIBAI_ACQUISITION_DEADLINE=$(( $(date +%s) + 45 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Load only this provider group scoped input
        env:
          GROUP: ${{ inputs.group }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: uv run python -m baibai_jobs.integration.economic_handoff input --group "$GROUP" --directory "$RUNNER_TEMP/source-input"
      - name: Acquire and export new receipts for this provider
        id: acquire
        env:
          GROUP: ${{ inputs.group }}
          SOURCE_ID: ${{ inputs.source_id }}
          ASOF: ${{ inputs.asof }}
          CURRENT_ONLY_NOW: ${{ inputs.current_only_now }}
          JQUANTS_API_KEY: ${{ inputs.group == 'jquants' && secrets.JQUANTS_API_KEY || '' }}
          ESTAT_APP_ID: ${{ inputs.group == 'estat' && secrets.ESTAT_APP_ID || '' }}
        run: |
          args=(--group "$GROUP" --source-id "$SOURCE_ID" --asof "$ASOF" --directory "$RUNNER_TEMP/economic-handoff")
          if [ "$CURRENT_ONLY_NOW" = true ]; then args+=(--current-only-now); fi
          uv run python -m baibai_jobs.integration.economic_handoff acquire "${args[@]}"
      - name: Save confirmed receipts in private R2 staging
        id: stage
        if: ${{ always() && steps.acquire.outputs.stage_ready == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GROUP: ${{ inputs.group }}
          SOURCE_ID: ${{ inputs.source_id }}
          STAGE_ID: ${{ inputs.group }}-${{ inputs.asof }}-${{ github.run_id }}-${{ github.run_attempt }}
          REQUIRES_V2: ${{ inputs.requires_v2 }}
        run: |
          case "${REQUIRES_V2:-}" in
            true) uv run python -m baibai_jobs.publication.lease require-v2 || exit $? ;;
            false) ;;
            *) echo 'retirement v2 condition is not confirmed' >&2; exit 2 ;;
          esac
          if [ "$GROUP" = fred_csv ]; then
            uv run python -m baibai_jobs.integration.economic_handoff stage-fred --group "$GROUP" --source-id "$SOURCE_ID" --stage-id "$STAGE_ID" --directory "$RUNNER_TEMP/economic-handoff"
          else
            uv run python -m baibai_jobs.integration.economic_handoff stage --stage-id "$STAGE_ID" --directory "$RUNNER_TEMP/economic-handoff"
          fi
      - name: Economic result for ${{ inputs.asof }}
        if: ${{ always() && steps.stage.outcome == 'success' }}
        run: echo 'Economic private receipts saved; canonical and serving integration are separate'

  notify:
    needs: acquire
    # Quiet PMI still fails acquisition and keeps its receipts; a successful stage needs no second log.
    if: >-
      ${{ always() && github.workflow_ref == format('{0}/.github/workflows/cloud-economic-sources-current.yml@refs/heads/main', github.repository)
      && inputs.retirement_attempt == github.run_attempt
      && (inputs.requires_v2 == 'true' || inputs.requires_v2 == 'false') && needs.acquire.result != 'skipped'
      && (github.event_name != 'schedule' || needs.acquire.outputs.handoff == ''
      || (needs.acquire.result != 'success' &&
      !(needs.acquire.result == 'failure' && needs.acquire.outputs.expected_unavailable == 'true'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Notify the provider acquisition and publication outcomes
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONPATH: jobs/src
          SOURCE_GROUP: economic-${{ inputs.group }}
          ASOF: ${{ inputs.asof }}
          ACQUIRE_RESULT: ${{ needs.acquire.result }}
          EXPECTED_UNAVAILABLE: ${{ needs.acquire.outputs.expected_unavailable }}
          STAGE_RESULT: ${{ needs.acquire.outputs.handoff != '' && 'success' || 'failure' }}
        run: python3 -m baibai_jobs.observability.source_discord
