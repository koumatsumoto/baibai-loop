name: cloud-native-publication-once

# One native publication after both finite migrations. Never a recurring batch.
on:
  push:
    branches: [codex/issue1820-native-publication-once]
    paths: [.github/workflows/cloud-native-publication-once.yml]

permissions:
  contents: read

concurrency:
  group: cloud-publish
  queue: max
  cancel-in-progress: false

jobs:
  cutover:
    if: >-
      ${{ github.repository == 'koumatsumoto/baibai-loop' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/codex/issue1820-native-publication-once' &&
          github.run_attempt == 1 &&
          github.event.head_commit.message == 'ops: publish native models once after migration 2026-11-05' }}
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Require the reviewed merged code as the exact base
        env:
          EXPECTED_CODE_SHA: 20f0ecb5d18c45de558c37359b568f0a14174917
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_CODE_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Publish fixed native models and verify cold canonical readback
        env:
          BAIBAI_FINANCIAL_NATIVE: "true"
          BAIBAI_PRICE_NATIVE: "true"
          BAIBAI_MASTER_NATIVE: "true"
          BAIBAI_CALENDAR_NATIVE: "true"
          BAIBAI_EDINET_LIST_NATIVE: "true"
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          uv run python - <<'PY'
          """有限移行後の初回native公開。正規モデルownerとCAS読戻しだけを一回実行する。"""
          
          from __future__ import annotations
          
          import base64
          import calendar
          import contextlib
          import hashlib
          import json
          import os
          import shutil
          import sqlite3
          import sys
          import tempfile
          import traceback
          from datetime import UTC, date, datetime
          from pathlib import Path
          
          from baibai_engine.data_collection.providers.edinet.list_native import (
              HEAD_KEY as EDINET_HEAD,
          )
          from baibai_engine.data_collection.providers.edinet.list_native import EdinetListL1
          from baibai_engine.data_collection.providers.jquants.calendar_native import (
              HEAD_KEY as CALENDAR_HEAD,
          )
          from baibai_engine.data_collection.providers.jquants.financial_native import (
              HEAD_KEY as FINANCIAL_HEAD,
          )
          from baibai_engine.data_collection.providers.jquants.master_native import (
              HEAD_KEY as MASTER_HEAD,
          )
          from baibai_engine.data_collection.providers.jquants.price_native import (
              HEAD_KEY as PRICE_HEAD,
          )
          from baibai_engine.machine_analysis.screening.policies.economic_paths import (
              EconomicPathPolicy,
          )
          from baibai_engine.storage.json import write_json_atomic
          from baibai_engine.storage.objects.r2 import Boto3R2Store, LakePublishError
          from baibai_engine.storage.snapshots.models import canonical_lake_model_bytes
          from baibai_engine.storage.snapshots.release import LakeReleasePointer
          from baibai_engine.storage.snapshots.sources import sha256_file
          from baibai_engine.storage.sqlite.snapshot import create_snapshot
          from baibai_engine.storage.sqlite.source_cache.lake_origin import read_lake_store_origin
          from baibai_engine.storage.sqlite.source_cache.schema import validate_current_schema
          from baibai_jobs.acquisition.article_planning import (
              ARTICLE_SOURCES,
              load_planning,
              publish_planning_input,
          )
          from baibai_jobs.acquisition.economic_staging import stage_prefix
          from baibai_jobs.acquisition.external_assessments.staging import read_private
          from baibai_jobs.acquisition.inputs import SOURCE_INPUT_GROUPS
          from baibai_jobs.acquisition.receipts import available_handoffs, seal_integrated
          from baibai_jobs.acquisition.source_inputs import (
              GuardedInputStore,
              load_input,
              publish_inputs,
          )
          from baibai_jobs.integration.edinet_list_native import materialize_lists
          from baibai_jobs.integration.sources import canonical_generations
          from baibai_jobs.maintenance.economic_cutover import _publish_exact, _read
          from baibai_jobs.publication import lease, snapshot_cli
          from baibai_jobs.publication.policy import release_policy_for_profile
          
          POINTER = "lake/pointers/market/current.json"
          MANIFEST = "machine-manifest.json"
          KEYS = ("market.sqlite", "runs.sqlite")
          HEADS = (CALENDAR_HEAD, FINANCIAL_HEAD, MASTER_HEAD, PRICE_HEAD, EDINET_HEAD)
          FLAGS = ("FINANCIAL", "PRICE", "MASTER", "CALENDAR", "EDINET_LIST")
          INPUT_PREFIXES = tuple(
              "fixed-inputs/jquants-" + source + "/v1/"
              for source in ("financial", "price", "master", "market-calendar")
          )
          
          
          def schema(path):
              with contextlib.closing(
                  sqlite3.connect(path.resolve().as_uri() + "?mode=ro", uri=True)
              ) as conn:
                  return conn.execute("PRAGMA user_version").fetchone()[0]
          
          
          class Checkpoints:
              """作業SQLiteはbackup snapshotで固定し、原本/再開材料はcreate-onlyで読戻す。"""
          
              def __init__(self, store, directory, prefix, handle):
                  self.store, self.directory, self.prefix, self.handle = (
                      store,
                      directory,
                      prefix,
                      handle,
                  )
                  self.files = {}
                  self.sequence = 0
                  self.verified = set()
          
              def preserve(self, path):
                  digest = sha256_file(path)
                  key = self.prefix + "objects/" + digest
                  if key not in self.verified:
                      remote = self.store.head(key)
                      if remote is None:
                          lease.verify_held(self.store, self.handle)
                          with path.open("rb") as stream:
                              checksum = hashlib.file_digest(
                                  stream, lambda: hashlib.md5(usedforsecurity=False)
                              ).digest()
                          with contextlib.suppress(LakePublishError):
                              self.store.put_file(
                                  key,
                                  path,
                                  sha256=digest,
                                  content_md5=base64.b64encode(checksum).decode(),
                                  content_type="application/octet-stream",
                                  if_none_match=True,
                              )
                      readback = self.directory / "private-readback"
                      _read(self.store, key, readback)
                      if sha256_file(readback) != digest:
                          raise ValueError("private checkpoint readback differs")
                      readback.unlink()
                      self.verified.add(key)
                  return {"key": key, "sha256": digest}
          
              def save(self, phase, *, files=(), databases=()):
                  for path in files:
                      self.files[str(path.resolve())] = self.preserve(path)
                  scratch = self.directory / "checkpoint.sqlite"
                  for path in databases:
                      scratch.unlink(missing_ok=True)
                      create_snapshot(path, scratch)
                      self.files[str(path.resolve())] = self.preserve(scratch)
                  scratch.unlink(missing_ok=True)
                  index = self.directory / "checkpoint-index.json"
                  write_json_atomic(
                      index,
                      {
                          "format": "native-publication-private-checkpoint-v1",
                          "phase": phase,
                          "files": self.files,
                      },
                  )
                  content = self.preserve(index)
                  # A small stable sequence index makes the latest complete checkpoint discoverable.
                  key = self.prefix + f"checkpoints/{self.sequence:04d}-" + content["sha256"] + ".json"
                  with index.open("rb") as stream:
                      checksum = hashlib.file_digest(
                          stream, lambda: hashlib.md5(usedforsecurity=False)
                      ).digest()
                  lease.verify_held(self.store, self.handle)
                  with contextlib.suppress(LakePublishError):
                      self.store.put_file(
                          key,
                          index,
                          sha256=content["sha256"],
                          content_md5=base64.b64encode(checksum).decode(),
                          content_type="application/json",
                          if_none_match=True,
                      )
                  readback = self.directory / "checkpoint-readback.json"
                  _read(self.store, key, readback)
                  if sha256_file(readback) != content["sha256"]:
                      raise ValueError("checkpoint index readback differs")
                  readback.unlink()
                  self.sequence += 1
          
          
          def source_asof(runs, pointer):
              with contextlib.closing(
                  sqlite3.connect(runs.resolve().as_uri() + "?mode=ro", uri=True)
              ) as conn:
                  row = conn.execute(
                      "SELECT header FROM model_generation WHERE generation_id=?",
                      ("models-" + pointer.release_id,),
                  ).fetchone()
              if row is None:
                  raise ValueError("current release has no saved model date")
              saved = json.loads(row[0])
              source = saved["inputs"]["market"]
              if source["reference"] != pointer.release_id or source["sha256"] != pointer.manifest_sha256:
                  raise ValueError("current model input differs from current release")
              return date.fromisoformat(saved["as_of"])
          
          
          def generate(directory, store, handle, asof, before_publication):
              from baibai_jobs.integration import models
          
              # Private one-off instrumentation; no replacement of model, policy or publication logic.
              original = models.publish_prepared_market_lake
          
              def checkpointed(prepared, **kwargs):
                  before_publication(prepared)
                  return original(prepared, **kwargs)
          
              models.publish_prepared_market_lake = checkpointed
              try:
                  return models.integrate_models(
                      store=store,
                      market=directory / "market.sqlite",
                      economic=directory / "originals" / "indicators.sqlite",
                      runs=directory / "runs.sqlite",
                      mirror=directory / "mirror",
                      as_of=asof,
                      lease_handle=handle,
                      growth_start=None,
                      policy=EconomicPathPolicy(candidate_limit=36),
                  )
              finally:
                  models.publish_prepared_market_lake = original
          
          
          def reissue_inputs(store, directory, identity, asof, guard):
              generations = canonical_generations(store)
              guarded = GuardedInputStore(store, guard)
              for group in SOURCE_INPUT_GROUPS:
                  if group == "edinet-list":
                      continue
                  result = publish_inputs(
                      guarded,
                      market=directory / "market.sqlite",
                      economic=directory / "unused-economic",
                      identity=identity,
                      asof=asof,
                      generations=generations,
                      only_group=group,
                  )
                  if result["failed"] or result["updated"] != [group]:
                      raise ValueError("market input publication failed")
                  target = directory / "input-readback" / group
                  target.mkdir(parents=True)
                  database = target / "verified.sqlite"
                  report = load_input(store, group, database, target / "handoff")
                  with contextlib.closing(
                      sqlite3.connect(database.resolve().as_uri() + "?mode=ro", uri=True)
                  ) as conn:
                      validate_current_schema(conn)
                  if report["canonical_generations"] != generations:
                      raise ValueError("market input canonical binding differs")
              for source in ARTICLE_SOURCES:
                  publish_planning_input(guarded, source, generations)
                  load_planning(store, source)
              guard()
              return generations
          
          
          class PublicationStore:
              """原本headを書き換えず、固定入力とlakeだけを条件付きで公開する。"""
          
              def __init__(self, store, guard, before_pointer):
                  self.store, self.guard, self.before_pointer = store, guard, before_pointer
          
              def head(self, key):
                  return self.store.head(key)
          
              def get_bytes(self, key):
                  return self.store.get_bytes(key)
          
              def download_file(self, key, path, **kwargs):
                  return self.store.download_file(key, path, **kwargs)
          
              def put_file(self, key, path, **kwargs):
                  if not key.startswith(("lake/", *INPUT_PREFIXES)):
                      raise ValueError("write outside native fixed inputs and lake")
                  if key == POINTER:
                      if not kwargs.get("if_match"):
                          raise ValueError("current pointer requires CAS")
                      self.before_pointer(path)
                  elif not kwargs.get("if_none_match"):
                      raise ValueError("native inputs and lake bodies are immutable")
                  self.guard()
                  return self.store.put_file(key, path, **kwargs)
          
          
          def snapshot_action(action, directory, path, pointer):
              if snapshot_cli.main(
                  [
                      action,
                      "--mirror",
                      str(directory / "mirror"),
                      "--store",
                      str(path),
                      "--bucket",
                      "baibai-stores",
                      "--release",
                      pointer.release_id,
                      "--manifest-sha256",
                      pointer.manifest_sha256,
                  ]
              ):
                  raise ValueError("fixed release snapshot operation failed")
          
          
          def hydrate(directory, pointer):
              shutil.copyfile(directory / "originals" / "market.sqlite", directory / "market.sqlite")
              snapshot_action("hydrate", directory, directory / "market.sqlite", pointer)
          
          
          def project_edinet(store, directory):
              fixed = EdinetListL1(store, directory / "edinet-native").freeze()
              report = materialize_lists(fixed, directory / "market.sqlite")
              if report["exit_code"]:
                  raise ValueError("native EDINET materialization retains unresolved failures")
          
          
          def verify_model_inputs(path, pointer, asof):
              if source_asof(path, pointer) != asof:
                  raise ValueError("model date changed during native activation")
              with contextlib.closing(
                  sqlite3.connect(path.resolve().as_uri() + "?mode=ro", uri=True)
              ) as conn:
                  saved = json.loads(
                      conn.execute(
                          "SELECT header FROM model_generation WHERE generation_id=?",
                          ("models-" + pointer.release_id,),
                      ).fetchone()[0]
                  )
              for name in ("financial", "price", "master", "calendar"):
                  item = saved["inputs"].get(name)
                  if (
                      not isinstance(item, dict)
                      or item.get("kind") != "native_l1"
                      or not item.get("descriptor")
                  ):
                      raise ValueError("model input is not fixed native L1")
          
          
          def freeze(directory, pointer):
              output = directory / "uploads"
              output.mkdir()
              for key in KEYS:
                  create_snapshot(directory / key, output / key)
              snapshot_action("dehydrate", directory, output / "market.sqlite", pointer)
              return {key: output / key for key in KEYS}
          
          
          def cold_readback(store, directory, pointer, asof):
              # The new canonical bytes and private upload candidates are already read back.
              # Replace this disposable warm copy with the cold reader's result instead of
              # holding two hydrated market databases and two object mirrors on the runner.
              (directory / "market.sqlite").unlink()
              shutil.rmtree(directory / "mirror")
              (directory / "originals" / "indicators.sqlite").unlink()
              cold = directory / "cold"
              cold.mkdir()
              _read(store, "market.sqlite", cold / "market.sqlite")
              _read(store, "runs.sqlite", cold / "runs.sqlite")
              verify_model_inputs(cold / "runs.sqlite", pointer, asof)
              snapshot_action("hydrate", cold, cold / "market.sqlite", pointer)
              origin = read_lake_store_origin(cold / "market.sqlite")
              if origin is None or (origin.release_id, origin.release_manifest_sha256) != (
                  pointer.release_id,
                  pointer.manifest_sha256,
              ):
                  raise ValueError("cold hydration differs from published model input")
              (cold / "market.sqlite").replace(directory / "market.sqlite")
          
          
          def assess_manifests(manifest, dataset_manifests, policy):
              """日別writerは非空の1日を1objectにする。週末も数える保守的上限。"""
              price = dataset_manifests["jquants.daily_bars"]
              if price.contract_version != 2 or price.partition_by != ("year", "month"):
                  raise ValueError("price contract differs from the reviewed month/v2 writer")
              manifests = dataset_manifests.values()
              current_objects = sum(item.totals.objects for item in manifests)
              graph_bytes = len(canonical_lake_model_bytes(manifest)) + sum(
                  len(canonical_lake_model_bytes(item)) for item in dataset_manifests.values()
              )
              upper_days = sum(
                  min(
                      calendar.monthrange(part.values["year"], part.values["month"])[1],
                      sum(item.rows for item in part.objects),
                  )
                  for part in price.partitions
              )
              other_objects = current_objects - price.totals.objects
              minimum = other_objects + sum(
                  any(item.rows > 0 for item in part.objects) for part in price.partitions
              )
              maximum = other_objects + upper_days
              within = maximum <= policy.max_objects
              exceeded = minimum > policy.max_objects
              return {
                  "inspection_completed": True,
                  "price_native_lineage": bool(price.partitions)
                  and all(
                      bool(part.sources)
                      and all(
                          source.kind == "native_l1" and source.namespace == "jquants-price"
                          for source in part.sources
                      )
                      for part in price.partitions
                  ),
                  "object_budget_proven_within_limit": within,
                  "object_budget_proven_exceeded": exceeded,
                  "exact_date_count_needed": not within and (not exceeded),
                  "object_upper_uses_less_than_three_quarters": 4 * maximum < 3 * policy.max_objects,
                  "current_manifest_within_limit": graph_bytes <= policy.max_manifest_bytes,
                  "current_manifest_uses_less_than_one_quarter": 4 * graph_bytes < policy.max_manifest_bytes,
                  "post_split_manifest_bytes_measured": False,
                  "parquet_or_sqlite_read": False,
                  "remote_writes_performed": False,
              }
          
          
          def inspect_budget(prepared):
              return assess_manifests(
                  prepared.release,
                  {name: build.manifest for name, build in prepared.export.datasets.items()},
                  release_policy_for_profile("production"),
              )
          
          
          def sqlite_header_schema(store, key, etag):
              response = store._client().get_object(
                  Bucket=store.bucket, Key=key, Range="bytes=0-99", IfMatch=etag
              )
              with contextlib.closing(response["Body"]) as body:
                  header = body.read(101)
              if (
                  not response.get("ContentRange", "").startswith("bytes 0-99/")
                  or len(header) != 100
                  or header[:16] != b"SQLite format 3\x00"
              ):
                  raise ValueError("source stage header is not a bounded SQLite header")
              after = store.head(key)
              if after is None or after.etag != etag:
                  raise ValueError("source stage changed during schema inspection")
              return int.from_bytes(header[60:64], "big")
          
          
          def pin_old_stages(store, schema_reader=sqlite_header_schema):
              result = []
              for entry in available_handoffs(store, market=True):
                  if entry.get("invalid"):
                      raise ValueError("invalid old stage requires separate inspection")
                  prefix = stage_prefix(str(entry["stage_id"]), market=True)
                  saved = read_private(store, prefix + "/handoff.json")
                  if saved is None or hashlib.sha256(saved.payload).hexdigest() != entry["manifest_sha256"]:
                      raise ValueError("stage differs from fixed handoff")
                  manifest = json.loads(saved.payload)
                  digest = manifest["receipt_sha256"]
                  if (
                      not isinstance(digest, str)
                      or len(digest) != 64
                      or any(ch not in "0123456789abcdef" for ch in digest)
                  ):
                      raise ValueError("stage receipt digest is invalid")
                  key = prefix + "/receipts-" + digest + ".sqlite"
                  remote = store.head(key)
                  if (
                      manifest["receipt_key"] != key
                      or remote is None
                      or remote.metadata.get("sha256") != digest
                      or remote.size != manifest["receipt_bytes"]
                  ):
                      raise ValueError("stage original differs from its manifest")
                  if schema_reader(store, key, remote.etag) == 49:
                      result.append(entry)
              return result
          
          
          def retire_old_stages(store, entries, generations, guard):
              for entry in entries:
                  prefix = stage_prefix(str(entry["stage_id"]), market=True)
          
                  def before_put(prefix=prefix, entry=entry):
                      guard()
                      saved = read_private(store, prefix + "/handoff.json")
                      if (
                          saved is None
                          or hashlib.sha256(saved.payload).hexdigest() != entry["manifest_sha256"]
                      ):
                          raise ValueError("fixed old stage changed before recovery marking")
          
                  before_put()
                  terminal = read_private(store, prefix + "/integrated.json")
                  if terminal is not None:
                      raise ValueError("fixed old stage already changed integration state")
                  seal_integrated(
                      GuardedInputStore(store, before_put), entry, generations=generations, recovery=True
                  )
                  terminal = read_private(store, prefix + "/integrated.json")
                  value = json.loads(terminal.payload) if terminal else {}
                  if (
                      value.get("status") != "needs_explicit_recovery"
                      or value.get("manifest_sha256") != entry["manifest_sha256"]
                      or value.get("canonical_generations") != generations
                  ):
                      raise ValueError("old stage recovery marker failed readback")
              guard()
          
          
          def execute(
              store,
              directory,
              prefix,
              *,
              identity,
              emit=lambda **_: None,
              hydrate_fn=hydrate,
              project=project_edinet,
              integrate=generate,
              freeze_fn=freeze,
              cold=cold_readback,
              inputs=reissue_inputs,
              model_check=verify_model_inputs,
              budget=inspect_budget,
              old_stages=pin_old_stages,
              retire=retire_old_stages,
          ):
              if any(os.environ.get("BAIBAI_" + flag + "_NATIVE") != "true" for flag in FLAGS):
                  raise ValueError("first publication requires all five native modes explicitly enabled")
              directory.mkdir(parents=True, exist_ok=False)
              handle, _ = lease.acquire(store, "operator")
              handle_path = directory / "lease.json"
              checkpoint = Checkpoints(store, directory, prefix, handle)
              state_path = directory / "state.json"
              phase = "pin_base"
              report = {"publication_completed": False, "lease_released": False}
              state = {}
              try:
                  lease._save_handle(handle_path, handle)
                  originals = directory / "originals"
                  originals.mkdir()
                  tracked = (*KEYS, "indicators.sqlite", MANIFEST, POINTER, *HEADS)
                  paths = {}
                  base = {}
                  for index, key in enumerate(tracked):
                      path = originals / (key if "/" not in key else f"fixed-{index}.json")
                      remote = _read(store, key, path)
                      base[key] = {"etag": remote.etag, "sha256": sha256_file(path)}
                      paths[key] = path
                  manifest = json.loads(paths[MANIFEST].read_bytes())
                  if manifest.get("schema_version") != 1 or manifest.get("keys") != {
                      key: base[key]["etag"] for key in KEYS
                  }:
                      raise ValueError("requires completed market50 machine bundle")
                  if schema(paths["market.sqlite"]) != 50 or schema(paths["indicators.sqlite"]) != 13:
                      raise ValueError("requires completed schema cutovers")
                  pointer = LakeReleasePointer.model_validate_json(paths[POINTER].read_bytes())
                  asof = source_asof(paths["runs.sqlite"], pointer)
                  state = {
                      "base": base,
                      "asof": asof.isoformat(),
                      "base_pointer": pointer.model_dump(mode="json"),
                  }
                  write_json_atomic(state_path, state)
          
                  def base_guard():
                      lease.verify_held(store, handle)
                      for key, expected in base.items():
                          current = store.head(key)
                          if current is None or current.etag != expected["etag"]:
                              raise ValueError("fixed production base changed")
          
                  base_guard()
                  state["old_stages"] = old_stages(store)
                  write_json_atomic(state_path, state)
                  phase = "preserve_originals"
                  checkpoint.save(phase, files=(*paths.values(), state_path))
                  phase = "hydrate"
                  # Drop only verified local copies during the large hydrate, then restore exact bytes.
                  for key in ("indicators.sqlite", "runs.sqlite"):
                      paths[key].unlink()
                  hydrate_fn(directory, pointer)
                  for key in ("indicators.sqlite", "runs.sqlite"):
                      retained = checkpoint.files[str(paths[key].resolve())]
                      _read(store, retained["key"], paths[key])
                      if sha256_file(paths[key]) != retained["sha256"]:
                          raise ValueError("restored original differs from its preserved bytes")
                  origin = read_lake_store_origin(directory / "market.sqlite")
                  if origin is None or (origin.release_id, origin.release_manifest_sha256) != (
                      pointer.release_id,
                      pointer.manifest_sha256,
                  ):
                      raise ValueError("hydrated market differs from pinned current")
                  paths["runs.sqlite"].replace(directory / "runs.sqlite")
                  phase = "materialize_edinet"
                  project(store, directory)
                  base_guard()
                  emit(phase=phase, native_edinet_materialized=True)
          
                  def before_publication(prepared):
                      budget_report = budget(prepared)
                      if any(type(value) is not bool for value in budget_report.values()):
                          raise ValueError("public price budget report must contain only booleans")
                      state["price_budget"] = budget_report
                      emit(phase="price_budget", **budget_report)
                      state["target"] = {
                          "release_id": prepared.release.release_id,
                          "manifest_sha256": prepared.release_sha256,
                      }
                      write_json_atomic(state_path, state)
                      checkpoint.save(
                          "before_lake_publication",
                          files=(
                              state_path,
                              prepared.release_manifest_path,
                          ),
                          databases=(directory / "runs.sqlite",),
                      )
                      base_guard()
          
                  def before_pointer(path):
                      target = LakeReleasePointer.model_validate_json(path.read_bytes())
                      if (target.release_id, target.manifest_sha256) != (
                          state["target"]["release_id"],
                          state["target"]["manifest_sha256"],
                      ):
                          raise ValueError("pointer differs from prepared model release")
                      model_check(directory / "runs.sqlite", target, asof)
                      candidate = directory / "pointer-candidate.json"
                      shutil.copyfile(path, candidate)
                      checkpoint.save("before_pointer_put", files=(candidate, state_path))
                      base_guard()
          
                  phase = "generate_and_publish"
                  result = integrate(
                      directory,
                      PublicationStore(store, base_guard, before_pointer),
                      handle_path,
                      asof,
                      before_publication,
                  )
                  if not result["models_ready"]:
                      raise ValueError("native model generation incomplete")
                  published_pointer = directory / "published-pointer.json"
                  pointer_head = _read(store, POINTER, published_pointer)
                  pointer = LakeReleasePointer.model_validate_json(published_pointer.read_bytes())
                  if (pointer.release_id, pointer.manifest_sha256) != (
                      state["target"]["release_id"],
                      state["target"]["manifest_sha256"],
                  ):
                      raise ValueError("published pointer differs from prepared release")
                  model_check(directory / "runs.sqlite", pointer, asof)
                  published = {POINTER: pointer_head.etag}
                  checkpoint.save(
                      "lake_published",
                      files=(state_path,),
                  )
                  emit(phase=phase, native_models_and_fixed_release_published=True)
          
                  def guard():
                      lease.verify_held(store, handle)
                      for key, expected in base.items():
                          current = store.head(key)
                          if current is None or current.etag != published.get(key, expected["etag"]):
                              raise ValueError("production generation changed during activation")
          
                  phase = "freeze_uploads"
                  candidates = freeze_fn(directory, pointer)
                  state["candidates"] = {
                      key: {"path": str(path), "sha256": sha256_file(path)}
                      for key, path in candidates.items()
                  }
                  write_json_atomic(state_path, state)
                  checkpoint.save("before_machine_put", files=(state_path, *candidates.values()))
                  phase = "publish_machine"
                  for key, candidate in candidates.items():
                      if sha256_file(candidate) != state["candidates"][key]["sha256"]:
                          raise ValueError("frozen canonical candidate changed")
                      guard()
                      published[key] = _publish_exact(
                          store,
                          key,
                          candidate,
                          base_etag=base[key]["etag"],
                          base_sha256=base[key]["sha256"],
                          readback=directory / ("readback-" + key),
                          content_type="application/vnd.sqlite3",
                          before_put=guard,
                      )
                  manifest_path = directory / "machine-manifest-candidate.json"
                  write_json_atomic(
                      manifest_path,
                      {
                          "schema_version": 1,
                          "written_at_utc": datetime.now(UTC).strftime("%Y-%m-%dT%H:%M:%SZ"),
                          "keys": {key: published[key] for key in KEYS},
                      },
                  )
                  checkpoint.save("before_manifest_put", files=(state_path, manifest_path))
                  guard()
                  published[MANIFEST] = _publish_exact(
                      store,
                      MANIFEST,
                      manifest_path,
                      base_etag=base[MANIFEST]["etag"],
                      base_sha256=base[MANIFEST]["sha256"],
                      readback=directory / "manifest-readback.json",
                      content_type="application/json",
                      before_put=guard,
                  )
                  guard()
                  expected_generations = {
                      "lake_release_id": pointer.release_id,
                      "lake_manifest_sha256": pointer.manifest_sha256,
                  }
                  if canonical_generations(store) != expected_generations:
                      raise ValueError("canonical bundle differs from the new release")
                  phase = "cold_readback"
                  cold(store, directory, pointer, asof)
                  guard()
                  emit(phase=phase, canonical_bytes_and_cold_hydration_verified=True)
                  phase = "reissue_inputs"
                  inputs(store, directory, identity, asof, guard)
                  guard()
                  phase = "retire_old_stages"
                  retire(store, state["old_stages"], expected_generations, guard)
                  guard()
                  state["completed"] = {"generations": expected_generations, "etags": published}
                  write_json_atomic(state_path, state)
                  checkpoint.save("completed", files=(state_path,))
                  report.update(
                      publication_completed=True,
                      five_native_modes=True,
                      all_market_inputs_verified=True,
                      canonical_bytes_readback_verified=True,
                      cold_hydration_verified=True,
                      native_originals_unchanged=True,
                      economic_unchanged=True,
                      old_originals_retained=True,
                      fixed_old_stages_recovery_marked=True,
                      original_model_date_retained=True,
                  )
              except Exception as error:
                  report.update(failed_phase=phase, error_type=type(error).__name__)
                  error_path = directory / "error-private.txt"
                  error_path.write_text(traceback.format_exc())
                  with contextlib.suppress(Exception):
                      checkpoint.save(
                          "failed_" + phase,
                          files=tuple(path for path in (state_path, error_path) if path.exists()),
                      )
              finally:
                  try:
                      lease.release(store, handle)
                      report["lease_released"] = True
                  except Exception as error:
                      report["lease_release_error_type"] = type(error).__name__
              return report
          
          
          def main():
              run_id = os.environ.get("GITHUB_RUN_ID", "")
              if not run_id.isdigit() or os.environ.get("GITHUB_RUN_ATTEMPT") != "1":
                  print(json.dumps({"refused": True}))
                  return 1
              public = sys.stdout
          
              def emit(**value):
                  print(json.dumps(value, sort_keys=True), file=public, flush=True)
          
              directory = Path(tempfile.mkdtemp(prefix="native-publication-"))
              try:
                  with (
                      (directory / "private.log").open("w") as private,
                      contextlib.redirect_stdout(private),
                      contextlib.redirect_stderr(private),
                      contextlib.closing(Boto3R2Store(bucket="baibai-stores")) as store,
                  ):
                      report = execute(
                          store,
                          directory / "publication",
                          f"coordination/cutovers/native-publication/{run_id}/",
                          identity="native-" + run_id,
                          emit=emit,
                      )
              except Exception as error:
                  report = {"publication_completed": False, "error_type": type(error).__name__}
              emit(**report)
              return 0 if report.get("publication_completed") and report.get("lease_released") else 1
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          PY
