name: Research missing financial coverage (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check provider financial document availability
        env:
          JQUANTS_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          python - <<'PYCODE'
          import os,json,urllib.request,urllib.parse,urllib.error,time
          codes = ['619A', '621A', '622A', '625A', '627A', '634A', '641A', '646A', '648A', '652A', '653A', '656A', '436A', '590A', '640A', '642A']
          for code in codes:
              p={'code':code};count=0;dates=[];pages=0
              try:
                  while True:
                      req=urllib.request.Request('https://api.jquants.com/v2/fins/summary?'+urllib.parse.urlencode(p),headers={'x-api-key':os.environ['JQUANTS_KEY'],'Accept':'application/json'})
                      with urllib.request.urlopen(req,timeout=25) as response:
                          raw=response.read(4000001)
                          if len(raw)>4000000:raise ValueError('body limit')
                          data=json.loads(raw)
                      rows=data.get('data',[]);count+=len(rows);dates.extend(str(r.get('DiscDate')) for r in rows if r.get('DiscDate'));pages+=1
                      cursor=data.get('pagination_key')
                      if not cursor:break
                      if pages>=4:raise ValueError('page limit')
                      p['pagination_key']=cursor
                  print('SUMMARY='+json.dumps({'code':code,'rows':count,'first':min(dates,default=None),'last':max(dates,default=None),'pages':pages}),flush=True)
              except urllib.error.HTTPError as e:
                  print('SUMMARY='+json.dumps({'code':code,'http_error':e.code}),flush=True)
                  if e.code in (401,403,429):break
              time.sleep(1)
          PYCODE
