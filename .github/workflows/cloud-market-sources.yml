name: Read-only valuation research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check five provider values without persisting production data
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.error, urllib.parse, urllib.request
          key = os.environ.get("JQUANTS_API_KEY")
          if not key:
              raise SystemExit("JQUANTS_API_KEY unavailable")
          for code in ("130A", "135A", "2437", "5838", "2784"):
              url = "https://api.jquants.com/v2/equities/valuation?" + urllib.parse.urlencode({"code": code, "date": "2026-11-04"})
              req = urllib.request.Request(url, headers={"x-api-key": key, "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      body = response.read(2_000_001)
                      if len(body) > 2_000_000:
                          print(json.dumps({"code": code, "status": "body_limit"}))
                          continue
                      payload = json.loads(body)
                      rows = payload.get("data", [])
                      print(json.dumps({"code": code, "http": response.status, "rows": len(rows), "values": [{"date": row.get("Date"), "code": row.get("Code"), "market_cap_million_yen": row.get("MktCap")} for row in rows], "has_next_page": bool(payload.get("pagination_key")), "body_sha256": hashlib.sha256(body).hexdigest()}))
              except urllib.error.HTTPError as error:
                  print(json.dumps({"code": code, "http": error.code}))
              except (urllib.error.URLError, TimeoutError, ValueError, json.JSONDecodeError) as error:
                  print(json.dumps({"code": code, "error": type(error).__name__}))
          PY
