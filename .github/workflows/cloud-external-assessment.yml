name: cloud-external-assessment
run-name: "external assessment ${{ inputs.source || 'all' }}"

on:
  schedule:
    - cron: "13 10 * * *" # 19:13 JST, including rest days
  workflow_dispatch:
    inputs:
      source:
        description: "Independent acquisition source; all selects the four exact source plans"
        type: choice
        default: all
        options: [all, monex, rakuten, kabumap, minkabu]
      batch_id:
        description: "Manual label, or exact existing scheduled source plan ID"
        required: true
        type: string
      master_asof:
        description: "Exact already-saved J-Quants master date YYYY-MM-DD"
        required: true
        type: string
      operation:
        description: "Collect ready sources, or explicitly close one stopped source with confirmed observations"
        type: choice
        default: collect_and_publish
        options: [collect_and_publish, publish_confirmed_partial]

permissions:
  contents: read

# Partial closure owns the same source group as acquisition until its terminal
# is sealed. Ordinary runs use distinct groups; their acquisition jobs own it.
concurrency:
  group: ${{ inputs.operation == 'publish_confirmed_partial' && format('external-assessment-acquire-{0}', inputs.source) || format('external-assessment-run-{0}', github.run_id) }}
  queue: max
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      source_runs: ${{ steps.plan.outputs.source_runs }}
      eligible: ${{ steps.plan.outputs.eligible }}
      observation_date: ${{ steps.plan.outputs.observation_date }}
      master_asof: ${{ steps.plan.outputs.master_asof }}
      operation: ${{ inputs.operation || 'collect_and_publish' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Pin the original scheduled run clock
        id: clock
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')"
          printf 'created_at=%s\n' "$created_at" >> "$GITHUB_OUTPUT"
      - name: Freeze the exact source identities before credentials
        id: plan
        env:
          SOURCE: ${{ inputs.source || 'all' }}
          BATCH_ID: ${{ inputs.batch_id }}
          MASTER_ASOF: ${{ inputs.master_asof }}
          RUN_CREATED_AT: ${{ steps.clock.outputs.created_at }}
          OPERATION: ${{ inputs.operation || 'collect_and_publish' }}
        run: |
          args=(--source "$SOURCE")
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            args+=(--run-created-at "$RUN_CREATED_AT")
          else
            args+=(--batch-id "$BATCH_ID" --master-asof "$MASTER_ASOF")
          fi
          if [ "$OPERATION" = publish_confirmed_partial ]; then args+=(--confirmed-partial); fi
          uv run python -m baibai_batch.jobs.external_assessment_sources prepare "${args[@]}"

  acquire:
    needs: plan
    if: ${{ needs.plan.outputs.eligible == 'true' && needs.plan.outputs.operation == 'collect_and_publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.source_runs) }}
    concurrency:
      group: external-assessment-acquire-${{ matrix.source }}
      queue: max
      cancel-in-progress: false
    env:
      SOURCE: ${{ matrix.source }}
      SOURCE_RUN_ID: ${{ matrix.run_id }}
      MASTER_ASOF: ${{ needs.plan.outputs.master_asof }}
      OBSERVATION_DATE: ${{ needs.plan.outputs.observation_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Provision DuckDB httpfs extension
        run: uv run python -m tools.diagnostics.provision_duckdb_httpfs
      - name: Freeze and acquire one source with bounded cohort checkpoints
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          args=(--source "$SOURCE" --run-id "$SOURCE_RUN_ID" --directory "$RUNNER_TEMP/source-plan")
          if [ -n "$OBSERVATION_DATE" ]; then args+=(--observation-date "$OBSERVATION_DATE");
          else args+=(--master-asof "$MASTER_ASOF"); fi
          timeout --signal=TERM --kill-after=30s 270m uv run python -m baibai_batch.jobs.external_assessment_sources acquire "${args[@]}"

  publish:
    needs: [plan, acquire]
    outputs:
      notification_attempted: ${{ steps.notice.outputs.attempted }}
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.eligible == 'true' }}
    runs-on: ubuntu-latest
    # The existing publication lease expires after 120 minutes.
    timeout-minutes: 110
    concurrency:
      group: cloud-publish
      queue: max
      cancel-in-progress: false
    env:
      SOURCE_RUNS: ${{ needs.plan.outputs.source_runs }}
      MASTER_ASOF: ${{ needs.plan.outputs.master_asof }}
      EXTERNAL_ASSESSMENT_OPERATION: ${{ needs.plan.outputs.operation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Inspect exact source handoffs before leasing or hydration
        id: ready
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          args=(--selection-json "$SOURCE_RUNS" --report-output "$RUNNER_TEMP/source-publication.json")
          if [ -n "$MASTER_ASOF" ]; then args+=(--master-asof "$MASTER_ASOF"); fi
          if [ "$EXTERNAL_ASSESSMENT_OPERATION" = publish_confirmed_partial ]; then args+=(--confirmed-partial); fi
          uv run python -m baibai_batch.jobs.external_assessment_sources inspect "${args[@]}"
      - name: Provision DuckDB httpfs extension
        if: ${{ steps.ready.outputs.ready == 'true' }}
        run: uv run python -m tools.diagnostics.provision_duckdb_httpfs
      - name: Acquire the existing publication lease
        id: lease-acquire
        if: ${{ steps.ready.outputs.ready == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: uv run python -m baibai_batch.storage.publication_lease acquire --purpose operator --handle "$RUNNER_TEMP/external-assessment-publication-lease.json"
      - name: Pull and hydrate the latest canonical release
        if: ${{ steps.ready.outputs.ready == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          batch/scripts/r2_transfer.sh pull-market
          batch/scripts/r2_transfer.sh hydrate-market
      - name: Import confirmed receipts and publish with remote readback
        id: publish
        if: ${{ steps.ready.outputs.ready == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          args=(--selection-json "$SOURCE_RUNS" --directory "$RUNNER_TEMP/external-assessment-readback" --lease-handle "$RUNNER_TEMP/external-assessment-publication-lease.json" --report-output "$RUNNER_TEMP/source-publication.json")
          if [ -n "$MASTER_ASOF" ]; then args+=(--master-asof "$MASTER_ASOF"); fi
          if [ "$EXTERNAL_ASSESSMENT_OPERATION" = publish_confirmed_partial ]; then args+=(--confirmed-partial); fi
          uv run python -m baibai_batch.jobs.external_assessment_sources publish "${args[@]}"
      - name: Release publication lease
        id: lease-release
        if: ${{ always() && steps.lease-acquire.outputs.acquired == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: uv run python -m baibai_batch.storage.publication_lease release --handle "$RUNNER_TEMP/external-assessment-publication-lease.json"
      - name: Record cancellation for notification
        id: cancellation
        if: ${{ cancelled() }}
        run: printf 'cancelled=true\n' >> "$GITHUB_OUTPUT"
      - name: Notify the measured per-source publication results
        id: notice
        if: ${{ always() }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONPATH: batch/src
        run: python3 -m baibai_batch.observability.external_assessment_discord --sources-report "$RUNNER_TEMP/source-publication.json" --plan-result success --publish-result "${{ steps.publish.outcome }}" --lease-release-outcome "${{ steps.lease-release.outcome }}" --cancelled "${{ steps.cancellation.outputs.cancelled || 'false' }}"

  notify:
    needs: [plan, acquire, publish]
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.plan.outputs.eligible != 'false' && needs.publish.outputs.notification_attempted != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record cancellation for notification
        id: cancellation
        if: ${{ cancelled() }}
        run: printf 'cancelled=true\n' >> "$GITHUB_OUTPUT"
      - name: Notify missing source publication results
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONPATH: batch/src
        run: python3 -m baibai_batch.observability.external_assessment_discord --plan-result "${{ needs.plan.result }}" --acquire-result "${{ needs.acquire.result }}" --publish-result "${{ needs.publish.result }}" --cancelled "${{ steps.cancellation.outputs.cancelled || 'false' }}"
