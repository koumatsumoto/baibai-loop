name: cloud-native-reader-acceptance-once

# One authorized read-only production acceptance. Never resumes scheduled writers.
on:
  push:
    branches: [codex/issue1820-native-reader-acceptance-once]
    paths: [.github/workflows/cloud-native-reader-acceptance-once.yml]

permissions:
  contents: read

concurrency:
  group: cloud-publish
  queue: max
  cancel-in-progress: false

jobs:
  acceptance:
    if: >-
      ${{ github.repository == 'koumatsumoto/baibai-loop' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/codex/issue1820-native-reader-acceptance-once' &&
          github.run_attempt == 1 &&
          github.event.head_commit.message == 'ops: read-only native reader acceptance 2026-11-05' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BAIBAI_FINANCIAL_NATIVE: 'true'
      BAIBAI_PRICE_NATIVE: 'true'
      BAIBAI_MASTER_NATIVE: 'true'
      BAIBAI_CALENDAR_NATIVE: 'true'
      BAIBAI_EDINET_LIST_NATIVE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Require exact reviewed production code
        env:
          EXPECTED_CODE_SHA: a31661beee188bdcff447419b40fe3a66e809386
        run: test "$(git rev-parse HEAD^)" = "$EXPECTED_CODE_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Read-only schema, native originals, and fixed release query acceptance
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          uv run python - <<'PYCODE'
          """One-shot read-only acceptance for the published native production generation.
          
          The public result contains states and booleans only. Raw objects, release identities,
          object inventories, exception messages, and credentials are never printed or uploaded.
          """
          
          from __future__ import annotations
          
          import contextlib
          import hashlib
          import json
          import os
          import re
          import struct
          import sys
          from datetime import UTC, date, datetime
          from pathlib import Path
          from threading import Lock
          
          from baibai_engine.data_collection.providers.edinet.list_native import EdinetListL1
          from baibai_engine.data_collection.providers.jquants.calendar_native import (
              CalendarL1,
              read_calendar_attempts,
          )
          from baibai_engine.data_collection.providers.jquants.financial_native import FinancialL1
          from baibai_engine.data_collection.providers.jquants.master_native import (
              MasterL1,
              read_master_requests,
          )
          from baibai_engine.data_collection.providers.jquants.price_native import (
              PriceL1,
              read_price_requests,
          )
          from baibai_engine.data_collection.providers.jquants.snapshot_contracts import (
              JQUANTS_SOURCE_PAGES,
          )
          from baibai_engine.machine_analysis.generation import (
              calendar_inputs,
              master_inputs,
              price_inputs,
          )
          from baibai_engine.storage.objects.r2 import Boto3R2Store
          from baibai_engine.storage.snapshots.duck import lake_session
          from baibai_engine.storage.snapshots.keys import validate_lake_object_key
          from baibai_engine.storage.snapshots.objects import LakeObjectCache
          from baibai_engine.storage.snapshots.reader import (
              accepted_dataset,
              partition_period,
              resolve_current_release,
              resolve_release,
              verify_object,
          )
          from baibai_engine.storage.snapshots.release import LakeReleasePointer
          from baibai_jobs.publication.datasets import LAKE_DATASETS
          from baibai_jobs.publication.policy import release_policy_for_profile
          
          POINTER = "lake/pointers/market/current.json"
          MANIFEST = "machine-manifest.json"
          SCHEMAS = {"market.sqlite": 50, "indicators.sqlite": 13, "runs.sqlite": 8}
          NATIVE = (
              ("financial", FinancialL1, "l1/jquants/financial-summaries/v1/head.json"),
              ("price", PriceL1, "l1/jquants/daily-bars/v1/head.json"),
              ("master", MasterL1, "l1/jquants/master/v1/head.json"),
              ("calendar", CalendarL1, "l1/jquants/market-calendar/v1/head.json"),
          )
          EDINET_HEAD = "l1/edinet/lists/v1/head.json"
          QUERY_DATASETS = (
              "jquants.daily_bars",
              "jquants.master_snapshots",
              "jquants.market_calendar",
              "edinet.document_lists",
              "edinet.documents",
          )
          NATIVE_DERIVED = frozenset(QUERY_DATASETS[:3])
          PER_OBJECT_LIMIT = 256 * 1024 * 1024
          TOTAL_READ_LIMIT = 1024 * 1024 * 1024
          QUERY_OBJECT_LIMIT = 32 * 1024 * 1024
          ALLOWED_PREFIXES = ("lake/", "l1/jquants/", "l1/edinet/lists/v1/", "fixed-inputs/")
          MIGRATION_PREFIX = "coordination/cutovers/jquants-native/42050462740/"
          CHECKPOINT_PREFIX = MIGRATION_PREFIX + "checkpoints/"
          CHECKPOINT_LIMIT = 64
          CHECKPOINT_BYTES_LIMIT = 1024 * 1024
          
          
          class AcceptanceFailure(RuntimeError):
              """Only static diagnostic codes may be published."""
          
          
          def require(condition, code):
              if not condition:
                  raise AcceptanceFailure(code)
          
          
          class ReadOnlyStore:
              """Do not expose any mutation/list API to the production reader owners."""
          
              def __init__(self, store):
                  self.store = store
                  self.total_read = 0
                  self._read_budget_lock = Lock()
          
              @staticmethod
              def allowed(key):
                  migration_object = re.fullmatch(
                      re.escape(MIGRATION_PREFIX)
                      + r"(?:checkpoints/[0-9a-f]{64}\.json|objects/[0-9a-f]{64})",
                      key,
                  )
                  require(
                      key in {MANIFEST, *SCHEMAS}
                      or key.startswith(ALLOWED_PREFIXES)
                      or migration_object is not None,
                      "read_outside_acceptance_scope",
                  )
                  require(".." not in key.split("/"), "invalid_object_path")
          
              def head(self, key):
                  self.allowed(key)
                  return self.store.head(key)
          
              def get_bytes(self, key):
                  self.allowed(key)
                  require(key not in SCHEMAS, "canonical_body_download_disallowed")
                  before = self.head(key)
                  require(before is not None, "required_object_missing")
                  require(before.size <= PER_OBJECT_LIMIT, "object_read_budget_exceeded")
                  # Native EDINET readers may fetch unique bodies concurrently.
                  with self._read_budget_lock:
                      require(
                          self.total_read + before.size <= TOTAL_READ_LIMIT,
                          "total_read_budget_exceeded",
                      )
                      self.total_read += before.size
                  response = self.store._client(before.size).get_object(
                      Bucket=self.store.bucket, Key=key, IfMatch=before.etag
                  )
                  body = response["Body"]
                  try:
                      payload = body.read(before.size + 1)
                  finally:
                      body.close()
                  require(len(payload) == before.size, "read_size_mismatch")
                  require(self.head(key) == before, "object_changed_during_read")
                  return payload
          
              def read_bytes(self, key):
                  validate_lake_object_key(key)
                  return self.get_bytes(key)
          
              def download_file(self, key, path, *, expect_bytes=None, max_bytes=None):
                  payload = self.get_bytes(key)
                  require(
                      expect_bytes is None or len(payload) == expect_bytes,
                      "download_size_mismatch",
                  )
                  require(
                      max_bytes is None or len(payload) <= max_bytes, "download_limit_exceeded"
                  )
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(payload)
          
              def put_file(self, *args, **kwargs):
                  raise AcceptanceFailure("read_only_write_attempt")
          
              def iter_objects(self, *args, **kwargs):
                  raise AcceptanceFailure("read_only_listing_attempt")
          
              def migration_checkpoints(self):
                  # Only this completed migration's content-addressed discovery records.
                  # No general LIST API is exposed to native or lake readers.
                  response = self.store._client().list_objects_v2(
                      Bucket=self.store.bucket, Prefix=CHECKPOINT_PREFIX, MaxKeys=CHECKPOINT_LIMIT
                  )
                  require(
                      not response.get("IsTruncated"), "migration_checkpoint_listing_truncated"
                  )
                  entries = response.get("Contents", [])
                  require(
                      0 < len(entries) <= CHECKPOINT_LIMIT,
                      "migration_checkpoints_missing_or_excessive",
                  )
                  keys = []
                  for item in entries:
                      key = item["Key"]
                      require(
                          re.fullmatch(re.escape(CHECKPOINT_PREFIX) + r"[0-9a-f]{64}\.json", key)
                          is not None,
                          "migration_checkpoint_key_invalid",
                      )
                      require(
                          item["Size"] <= CHECKPOINT_BYTES_LIMIT, "migration_checkpoint_too_large"
                      )
                      keys.append(key)
                  return tuple(keys)
          
              def sqlite_header(self, key, expected):
                  require(key in SCHEMAS, "header_target_not_canonical")
                  response = self.store._client().get_object(
                      Bucket=self.store.bucket, Key=key, Range="bytes=0-99", IfMatch=expected.etag
                  )
                  body = response["Body"]
                  try:
                      payload = body.read(101)
                  finally:
                      body.close()
                  require(len(payload) == 100, "sqlite_header_range_invalid")
                  require(payload.startswith(b"SQLite format 3\0"), "sqlite_header_invalid")
                  require(self.head(key) == expected, "canonical_changed_during_header_read")
                  return struct.unpack(">I", payload[60:64])[0]
          
          
          def fixed_bundle(store):
              originals = {key: store.head(key) for key in (*SCHEMAS, MANIFEST, POINTER)}
              require(
                  all(item is not None for item in originals.values()), "canonical_object_missing"
              )
              for key, expected in SCHEMAS.items():
                  require(
                      store.sqlite_header(key, originals[key]) == expected,
                      "canonical_schema_mismatch",
                  )
              manifest = json.loads(store.get_bytes(MANIFEST))
              require(manifest.get("schema_version") == 1, "machine_manifest_schema_mismatch")
              require(
                  set(manifest.get("keys", {})) == {"market.sqlite", "runs.sqlite"},
                  "machine_manifest_not_two_key",
              )
              require(
                  all(manifest["keys"][key] == originals[key].etag for key in manifest["keys"]),
                  "machine_manifest_generation_mismatch",
              )
              return originals
          
          
          def verify_migration_partition_boundary(store):
              """Prove the legacy migration did not hide future receipt-month partitions.
          
              Inspect the migration's own immutable context and metadata, never current.
              No original body or Parquet object is needed for this bounded check.
              """
              contexts = set()
              complete = False
              for key in store.migration_checkpoints():
                  payload = store.get_bytes(key)
                  require(
                      hashlib.sha256(payload).hexdigest() == key.rsplit("/", 1)[-1][:-5],
                      "migration_checkpoint_digest_mismatch",
                  )
                  checkpoint = json.loads(payload)
                  context = checkpoint["files"]["context"]
                  digest = context["sha256"]
                  require(
                      isinstance(digest, str)
                      and re.fullmatch("[0-9a-f]{64}", digest) is not None,
                      "migration_context_identity_invalid",
                  )
                  require(
                      context["key"] == MIGRATION_PREFIX + "objects/" + digest,
                      "migration_context_outside_run",
                  )
                  contexts.add((context["key"], digest))
                  if checkpoint["phase"] == "complete":
                      require(
                          checkpoint["report"].get("migration_completed") is True,
                          "migration_checkpoint_not_completed",
                      )
                      complete = True
              require(complete, "migration_complete_checkpoint_missing")
              require(len(contexts) == 1, "migration_contexts_disagree")
              key, digest = next(iter(contexts))
              before = store.head(key)
              require(before is not None, "migration_context_missing")
              require(before.size <= CHECKPOINT_BYTES_LIMIT, "migration_context_too_large")
              payload = store.get_bytes(key)
              require(
                  hashlib.sha256(payload).hexdigest() == digest,
                  "migration_context_digest_mismatch",
              )
              context = json.loads(payload)
              known_at = datetime.fromisoformat(context["known_at"])
              require(known_at.utcoffset() is not None, "migration_boundary_timezone_missing")
              cutoff = known_at.astimezone(UTC)
              pointer = LakeReleasePointer.model_validate(context["release"])
              fixed = resolve_release(
                  store, pointer.release_id, manifest_sha256=pointer.manifest_sha256
              )
              accepted_dataset(fixed, JQUANTS_SOURCE_PAGES)
              manifest = fixed.dataset_manifest(JQUANTS_SOURCE_PAGES.name)
              require(
                  tuple(manifest.partition_by) == ("year", "month"),
                  "migration_partition_layout_invalid",
              )
              require(
                  all(
                      partition_period(part, tuple(manifest.partition_by))
                      <= (cutoff.year, cutoff.month)
                      for part in manifest.partitions
                  ),
                  "migration_has_future_receipt_month",
              )
          
          
          def read_native_samples(store, directory, emit=None):
              heads = {}
              for name, owner, key in NATIVE:
                  if emit is not None:
                      emit({"phase": "native_" + name, "read_started": True})
                  before = store.head(key)
                  require(before is not None, "native_head_missing")
                  fixed = owner(store, directory / name).fixed()
                  value = fixed.value()
                  scopes = value["days" if name == "calendar" else "scopes"]
                  adopted = [day for day, scope in scopes.items() if scope.get("adopted")]
                  require(bool(adopted), "native_head_has_no_adopted_scope")
                  healthy = [
                      day
                      for day in adopted
                      if not scopes[day].get("failure") and not scopes[day].get("held")
                  ]
                  day = max(healthy or adopted)
                  selected = scopes[day]["adopted"]
                  requests = tuple(fixed.requests(store, days=(date.fromisoformat(day),)))
                  require(
                      any(item.request_id == selected for item in requests),
                      "native_selected_receipt_missing",
                  )
                  require(store.head(key) == before, "native_head_changed_during_read")
                  heads[key] = before
              if emit is not None:
                  emit({"phase": "native_edinet", "read_started": True})
              before = store.head(EDINET_HEAD)
              require(before is not None, "edinet_head_missing")
              fixed_lists = EdinetListL1(store, directory / "edinet").freeze()
              receipts = fixed_lists.value()["receipts"]
              require(bool(receipts), "edinet_head_has_no_receipts")
              day = max(item["doc_date"] for item in receipts)
              selected = tuple(fixed_lists.iter_receipts((date.fromisoformat(day),)))
              require(bool(selected), "edinet_selected_receipt_missing")
              # The reader verifies exact gzip bytes, receipt ID, date and UTC clock.
              require(store.head(EDINET_HEAD) == before, "edinet_head_changed_during_read")
              heads[EDINET_HEAD] = before
              return heads
          
          
          def read_fixed_selection_sample(store, source, day):
              """Follow the queried L2's own immutable root/month/receipt chain, not current head."""
              readers = {
                  "jquants-price": (
                      price_inputs.INPUT_FORMAT,
                      price_inputs.read_price_input,
                      read_price_requests,
                  ),
                  "jquants-master": (
                      master_inputs.INPUT_FORMAT,
                      master_inputs.read_master_input,
                      read_master_requests,
                  ),
                  "jquants-market-calendar": (
                      calendar_inputs.INPUT_FORMAT,
                      calendar_inputs.read_calendar_input,
                      None,
                  ),
              }
              require(source.namespace in readers, "unrecognized_native_selection_namespace")
              input_format, metadata_reader, raw_reader = readers[source.namespace]
              selected = metadata_reader(
                  store, {"format": input_format, "selection_sha256": source.sha256}, days=(day,)
              )
              scope = selected["scopes"].get(day.isoformat(), {})
              adopted = scope.get("adopted")
              require(bool(adopted), "published_l2_day_has_no_selected_original")
              if raw_reader is None:
                  requests = tuple(
                      read_calendar_attempts(
                          store, receipts=selected["receipts"], identities={adopted}
                      )
                  )
              else:
                  requests = tuple(
                      raw_reader(
                          store,
                          scopes=selected["scopes"],
                          receipts=selected["receipts"],
                          days=(day,),
                      )
                  )
              require(
                  any(item.request_id == adopted for item in requests),
                  "fixed_selection_original_missing",
              )
          
          
          def query_fixed_release(
              store,
              directory,
              *,
              catalog=LAKE_DATASETS,
              policy=None,
              targets=QUERY_DATASETS,
              require_native=True,
          ):
              # Resolve once. Neither describe/contract validation nor query may resolve again.
              release = resolve_current_release(
                  store,
                  catalog=catalog,
                  policy=policy or release_policy_for_profile("production"),
              )
              for name in release.dataset_names():
                  require(name in catalog, "release_dataset_outside_catalog")
                  accepted_dataset(release, catalog[name])
              if require_native:
                  require(
                      "jquants.fin_summaries" not in release.dataset_names(),
                      "legacy_financial_l2_still_published",
                  )
                  require(
                      "edinet.list_responses" not in release.dataset_names(),
                      "legacy_edinet_raw_still_published",
                  )
              cache = LakeObjectCache(root=directory / "lake", source=store)
              verified_selections = set()
              with lake_session() as session:
                  session.connection.execute("SET memory_limit='512MB'")
                  session.connection.execute("SET threads=2")
                  for name in targets:
                      dataset = accepted_dataset(release, catalog[name])
                      manifest = release.dataset_manifest(name)
                      choices = [
                          (part, obj)
                          for part in manifest.partitions
                          for obj in part.objects
                          if obj.rows > 0 and obj.bytes <= QUERY_OBJECT_LIMIT
                      ]
                      require(bool(choices), "no_bounded_query_object")
                      # Prefer recent data, then the smallest exact object in that partition.
                      period = max(
                          partition_period(part, tuple(manifest.partition_by))
                          for part, _ in choices
                      )
                      part, obj = min(
                          (
                              (part, obj)
                              for part, obj in choices
                              if partition_period(part, tuple(manifest.partition_by)) == period
                          ),
                          key=lambda pair: pair[1].bytes,
                      )
                      native_sources = [
                          source for source in part.sources if source.kind == "native_l1"
                      ]
                      if require_native and name in NATIVE_DERIVED:
                          require(len(native_sources) == 1, "native_l2_selection_missing")
                      for source in native_sources:
                          if source.key not in verified_selections:
                              payload = store.get_bytes(source.key)
                              require(
                                  hashlib.sha256(payload).hexdigest() == source.sha256,
                                  "native_selection_digest_mismatch",
                              )
                              verified_selections.add(source.key)
                      path = cache.materialize(obj)
                      source_kind = (
                          "l1_derived"
                          if any(
                              source.kind in {"l1_dataset", "native_l1"}
                              for source in part.sources
                          )
                          else "legacy_sqlite_import"
                      )
                      verify_object(path, dataset, obj, source_kind=source_kind)
                      # Decode actual primary-key columns, rather than a metadata-only COUNT/EXISTS.
                      # The single private result is discarded and never emitted.
                      names = tuple(dict.fromkeys((*dataset.primary_key, dataset.date_column)))
                      require(all(name.isidentifier() for name in names), "invalid_query_column")
                      columns = ", ".join('"' + name + '"' for name in names)
                      result = session.connection.execute(
                          f"SELECT {columns} FROM read_parquet($files, union_by_name=false) LIMIT 1",
                          {"files": [str(path)]},
                      ).fetchone()
                      require(result is not None, "bounded_query_returned_no_rows")
                      if native_sources:
                          sampled_day = date.fromisoformat(
                              str(result[names.index(dataset.date_column)])
                          )
                          for source in native_sources:
                              read_fixed_selection_sample(store, source, sampled_day)
              return release
          
          
          def execute(store, directory, emit):
              directory.mkdir(parents=True, exist_ok=True)
              phase = "canonical"
              try:
                  base = fixed_bundle(store)
                  emit(
                      {
                          "phase": phase,
                          "schema50_market": True,
                          "schema13_economic": True,
                          "machine_manifest_matches": True,
                      }
                  )
                  phase = "migration_boundary"
                  verify_migration_partition_boundary(store)
                  emit({"phase": phase, "fixed_migration_future_months_absent": True})
                  phase = "native_originals"
                  native_heads = read_native_samples(store, directory, emit)
                  emit(
                      {
                          "phase": phase,
                          "all_native_heads_readable": True,
                          "selected_originals_readback_verified": True,
                      }
                  )
                  phase = "fixed_release_query"
                  release = query_fixed_release(store, directory)
                  phase = "stability"
                  require(
                      all(
                          store.head(key) == remote
                          for key, remote in {**base, **native_heads}.items()
                      ),
                      "production_generation_changed_during_acceptance",
                  )
                  current = json.loads(store.get_bytes(POINTER))
                  require(
                      current["release_id"] == release.release_id
                      and current["manifest_sha256"] == release.manifest_sha256,
                      "fixed_release_no_longer_current",
                  )
                  result = {
                      "phase": "completed",
                      "acceptance_completed": True,
                      "fixed_release_contracts_verified": True,
                      "bounded_l2_queries_verified": True,
                      "native_selection_roots_verified": True,
                      "fixed_selection_originals_verified": True,
                      "fixed_migration_future_months_absent": True,
                      "production_generation_unchanged": True,
                      "remote_writes": False,
                      "connector_transport_verified": False,
                  }
                  emit(result)
                  return result
              except Exception as error:
                  emit(
                      {
                          "phase": phase,
                          "acceptance_completed": False,
                          "error_code": str(error)
                          if isinstance(error, AcceptanceFailure)
                          else "reader_error",
                          "error_type": type(error).__name__,
                      }
                  )
                  raise
          
          
          def main():
              output = sys.stdout
              failure_reported = False
          
              def emit(value):
                  nonlocal failure_reported
                  failure_reported = (
                      failure_reported or value.get("acceptance_completed") is False
                  )
                  print(json.dumps(value, sort_keys=True), file=output, flush=True)
          
              directory = Path(os.environ.get("RUNNER_TEMP", "/tmp")) / "native-reader-acceptance"
              directory.mkdir(parents=True, exist_ok=True)
              try:
                  with (
                      (directory / "private.log").open("w") as private,
                      contextlib.redirect_stdout(private),
                      contextlib.redirect_stderr(private),
                      contextlib.closing(Boto3R2Store(bucket="baibai-stores")) as real,
                  ):
                      execute(ReadOnlyStore(real), directory, emit)
              except Exception as error:  # noqa: BLE001 -- never print provider exception text.
                  if not failure_reported:
                      emit(
                          {
                              "phase": "initialization",
                              "acceptance_completed": False,
                              "error_code": "reader_initialization_failed",
                              "error_type": type(error).__name__,
                          }
                      )
                  return 1
              return 0
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          PYCODE
