  "baibai_engine.data_collection.tradingview.authorize",
  "baibai_engine.position.cli",
  "baibai_engine.investment_judgment.trade_proposal_service",
  "baibai_engine.investment_judgment.stock_assessment_evaluation_cli",
  "baibai_engine.investment_judgment.workspace_cli",
  "baibai_engine.machine_analysis.screening.cli",
]

[[tool.importlinter.contracts]]
name = "enterprise valuation is pure"
type = "forbidden"
source_modules = [
