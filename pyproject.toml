  "baibai_engine.position", "baibai_engine.tasks", "baibai_engine.read_api",
  "baibai_engine.storage.application.write", "baibai_engine.market_context.reading.cli",
  "baibai_engine.market_context.indicator_service", "baibai_engine.market_context.indicators.providers",
]

[[tool.importlinter.contracts]]
name = "economic observations do not depend on reading computation"
type = "forbidden"
source_modules = ["baibai_engine.market_context.indicators"]
forbidden_modules = [
