[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baibai-loop"
version = "0.1.0"
description = "Automation utilities for the Baibai-Loop Japanese equity trading workflow."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "jquants-api-client>=2.3.0",
  "openpyxl>=3.1.0",
  "pandas>=2.3.0",
  "pydantic>=2.13.4",
  "pyarrow>=25.0.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.0",
  "requests>=2.34.2",
  "xlrd>=2.0.0",
  "jsonschema>=4.21.0",
]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.scripts]
baibai-loop-screening = "baibai_loop.screening.cli:main"
baibai-loop-validation = "baibai_loop.validation.cli:main"
baibai-loop-position = "baibai_loop.position.cli:main"
baibai-loop-macro = "baibai_loop.macro.indicators.cli:main"
baibai-loop-decision = "baibai_loop.thesis.decision_cli:main"

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "typing" },
  { include-group = "quality" },
  { include-group = "security" },
]
test = [
  "coverage[toml]>=7.15.0",
  "hypothesis>=6.156.1",
  "pytest>=9.1.1",
  "pytest-mock>=3.15.0",
]
typing = [
  "mypy>=2.1.0",
  "pandas-stubs>=3.0.3.260530",
  "types-jsonschema>=4.26.0.20260518",
  "types-pyyaml>=6.0.12.20260518",
  "types-requests>=2.33.0.20260518",
]
quality = [
  "import-linter>=2.13",
  "mutmut>=3.6.0",
  "pre-commit>=4.3.0",
  "ruff>=0.15.20",
]
security = [
  "bandit[toml]>=1.9.4",
  "pip-audit>=2.10.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/baibai_loop"]

[tool.hatch.build.targets.wheel.force-include]
"src/baibai_loop/py.typed" = "baibai_loop/py.typed"
"src/baibai_loop/macro/indicators/schema.sql" = "baibai_loop/macro/indicators/schema.sql"
"src/baibai_loop/macro/indicators/series.yaml" = "baibai_loop/macro/indicators/series.yaml"
"src/baibai_loop/macro/indicators/providers/manual_data.yaml" = "baibai_loop/macro/indicators/providers/manual_data.yaml"

[tool.ruff]
# Runtime is Python 3.14, but Ruff's 3.14 formatter rewrites
# `except (A, B):` into the legal-but-ambiguous `except A, B:` form.
# Keep Ruff syntax targeting at 3.13 so multi-exception handlers stay
# parenthesized and reviewer-visible.
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "B",
  "SIM",
  "C4",
  "DTZ",
  "ISC",
  "RET",
  "RUF",
  "PTH",
  "ANN",
  "PIE",
  "PT",
]
ignore = [
  "ANN401",
  "ISC001",
  "RUF001",
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "C408", "E402", "E501", "PT009", "PT027", "RUF012"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
disallow_any_unimported = true
no_implicit_optional = true
packages = ["baibai_loop"]
plugins = ["pydantic.mypy"]
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = [
  "jquantsapi.*",
  "openpyxl.*",
  "xlrd.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--maxfail=1",
]
xfail_strict = true
markers = [
  "integration: touches external services or local integration boundaries",
  "property: property-based tests",
  "slow: long-running tests",
]

[tool.coverage.run]
branch = true
source = ["src/baibai_loop"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.mutmut]
paths_to_mutate = ["src/baibai_loop"]
tests_dir = "tests"
runner = "python -m pytest -q -m 'not slow and not integration'"

# Import-direction contracts. These encode the subsystem dependency DAG
# (macro / screening / position / thesis / shared / validation) so a relabel that
# silently reintroduces a cross-subsystem edge fails CI rather than passing
# every other gate. Contracts are tightened as the reorg lands; this baseline
# captures the invariants that already hold and must keep holding.
[tool.importlinter]
root_package = "baibai_loop"

[[tool.importlinter.contracts]]
name = "macro layer stays independent of screening/position/validation"
type = "forbidden"
source_modules = ["baibai_loop.macro"]
forbidden_modules = [
  "baibai_loop.screening",
  "baibai_loop.position",
  "baibai_loop.validation",
]

[[tool.importlinter.contracts]]
name = "shared primitives are an import sink"
type = "forbidden"
source_modules = ["baibai_loop.foundation"]
forbidden_modules = [
  "baibai_loop.screening",
  "baibai_loop.macro",
  "baibai_loop.position",
  "baibai_loop.market",
  "baibai_loop.validation",
]

[[tool.importlinter.contracts]]
name = "market data layer only depends on foundation"
type = "forbidden"
source_modules = ["baibai_loop.market"]
forbidden_modules = [
  "baibai_loop.screening",
  "baibai_loop.macro",
  "baibai_loop.position",
  "baibai_loop.validation",
]

[[tool.importlinter.contracts]]
name = "position does not import screening (cycle prevention)"
type = "forbidden"
source_modules = ["baibai_loop.position"]
forbidden_modules = ["baibai_loop.screening"]

[[tool.importlinter.contracts]]
name = "screening does not import position (one-way market<-{screening,position})"
type = "forbidden"
source_modules = ["baibai_loop.screening"]
forbidden_modules = ["baibai_loop.position"]
# ticker_profile reads the canonical ledger to surface current portfolio-
# concentration facts in the candidate packet. This single lookup edge does not
# form a package cycle; price/calendar data both subsystems share flow through market.
ignore_imports = [
  "baibai_loop.screening.ticker_profile -> baibai_loop.position.ledger",
]

[[tool.importlinter.contracts]]
name = "thesis is the top-level domain engine (lower layers do not import it)"
type = "forbidden"
# Thesis composes decision packets with portfolio state.  Forbid reverse edges
# to keep the DAG acyclic; validation is intentionally excluded because it
# drives domain validation through the public entry surfaces.
source_modules = [
  "baibai_loop.foundation",
  "baibai_loop.market",
  "baibai_loop.macro",
  "baibai_loop.screening",
  "baibai_loop.position",
]
forbidden_modules = ["baibai_loop.thesis"]

[[tool.importlinter.contracts]]
name = "thesis only composes foundation and position domains"
type = "forbidden"
# Current thesis behavior is decision composition plus portfolio-aware execution
# and holding-review construction.  It has no direct macro, market, screening,
# or validation dependency; keep that surface narrow.
source_modules = ["baibai_loop.thesis"]
forbidden_modules = [
  "baibai_loop.macro",
  "baibai_loop.market",
  "baibai_loop.screening",
  "baibai_loop.validation",
]

[[tool.importlinter.contracts]]
name = "validation imports domain contexts only through their entry surface"
type = "forbidden"
# validation is the records public-language checker: it walks records, owns
# ValidationFinding + the _schemas shape checks + cross-record referential
# checks, and calls each domain context's validation entry (position via
# decision_register / policy, thesis via validation.cli). Its own modules must
# not reach into the macro / market / screening peers; those are consumed only
# transitively through thesis/position, so only direct edges are forbidden.
source_modules = ["baibai_loop.validation"]
forbidden_modules = [
  "baibai_loop.macro",
  "baibai_loop.market",
  "baibai_loop.screening",
]
allow_indirect_imports = true
