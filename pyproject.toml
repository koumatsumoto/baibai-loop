forbidden_modules = [
  "baibai_engine.external_assessment.store",
  "baibai_engine.external_assessment.acquisition",
  "baibai_engine.storage",
  "baibai_engine.market.providers",
  "baibai_engine.external_assessment.tradingview.client",
  "baibai_engine.external_assessment.tradingview.collector",
  "baibai_engine.external_assessment.tradingview.auth",
]

[[tool.importlinter.contracts]]
name = "external assessment read facade cannot acquire or write"
type = "forbidden"
source_modules = ["baibai_engine.read_api.external_assessment"]
forbidden_modules = [
  "baibai_engine.external_assessment.acquisition.sources",
  "baibai_engine.external_assessment.acquisition.collection",
  "baibai_engine.external_assessment.store",
  "baibai_engine.external_assessment.acquisition.cli",
]

[[tool.importlinter.contracts]]
name = "external acquisition does not enter investment decisions"
type = "forbidden"
source_modules = ["baibai_engine.screening", "baibai_engine.position", "baibai_engine.research"]
forbidden_modules = [
  "baibai_engine.external_assessment.acquisition.sources",
  "baibai_engine.external_assessment.acquisition.collection",
  "baibai_engine.external_assessment.store",
  "baibai_engine.external_assessment.acquisition.cli",
]

[[tool.importlinter.contracts]]
name = "valuation depends only on its inputs and foundation"
type = "forbidden"
source_modules = ["baibai_engine.valuation"]
forbidden_modules = [
  "baibai_engine.screening", "baibai_engine.research", "baibai_engine.read_api",
  "baibai_engine.market_context",
  "baibai_engine.external_assessment",
  "baibai_engine.market.providers", "baibai_engine.market.store", "baibai_engine.market.edinet_metrics", "baibai_engine.market.edinet_facts", "baibai_engine.position",
  "baibai_engine.storage", "baibai_engine.tasks",
]

[[tool.importlinter.contracts]]
