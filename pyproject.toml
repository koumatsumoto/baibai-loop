[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baibai-loop"
version = "0.1.0"
description = "Automation utilities for the Baibai-Loop Japanese equity trading workflow."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "jquants-api-client>=2.3.0",
  "openpyxl>=3.1.0",
  "pandas>=2.3.0",
  "playwright>=1.61.0",
  "pydantic>=2.13.4",
  "pyarrow>=25.0.0",
  "pypdf>=6.14.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.0",
  "requests>=2.34.2",
  "xlrd>=2.0.0",
  "fastapi>=0.140.0",
  "uvicorn>=0.51.0",
]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.scripts]
baibai-engine = "baibai_engine.cli:main"
baibai-app = "baibai_app.cli:main"

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "typing" },
  { include-group = "quality" },
  { include-group = "security" },
]
test = [
  "coverage[toml]>=7.15.2",
  "httpx2>=2.9.1",
  "hypothesis>=6.161.5",
  "pytest>=9.1.1",
  "pytest-mock>=3.15.0",
]
typing = [
  "mypy>=2.3.0",
  "pandas-stubs>=3.0.3.260530",
  "types-pyyaml>=6.0.12.20260724",
  "types-requests>=2.33.0.20260712",
]
quality = [
  "import-linter>=2.13",
  "mutmut>=3.6.0",
  "pre-commit>=4.6.1",
  "ruff>=0.16.0",
]
security = [
  "bandit[toml]>=1.9.4",
  "pip-audit>=2.10.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/baibai_engine", "src/baibai_app"]

[tool.hatch.build.targets.wheel.force-include]
"src/baibai_engine/py.typed" = "baibai_engine/py.typed"
"src/baibai_engine/macro/indicators/schema.sql" = "baibai_engine/macro/indicators/schema.sql"
"src/baibai_engine/macro/indicators/registry/us.yaml" = "baibai_engine/macro/indicators/registry/us.yaml"
"src/baibai_engine/macro/indicators/registry/japan.yaml" = "baibai_engine/macro/indicators/registry/japan.yaml"
"src/baibai_engine/macro/indicators/registry/global.yaml" = "baibai_engine/macro/indicators/registry/global.yaml"
"src/baibai_engine/macro/indicators/registry/derived.yaml" = "baibai_engine/macro/indicators/registry/derived.yaml"
"src/baibai_engine/macro/indicators/providers/pmi_release_urls.yaml" = "baibai_engine/macro/indicators/providers/pmi_release_urls.yaml"

[tool.uv]
required-version = "==0.12.1"

# Constrain the sdist to the buildable source packages (plus the metadata
# hatchling always adds: pyproject.toml, README.md, PKG-INFO). Without this the
# sdist walks the whole tree and, when uv's build copy loses VCS-ignore
# detection, sweeps in the gitignored operational data/ store (SQLite market
# history), inflating the archive by hundreds of MB.
[tool.hatch.build.targets.sdist]
only-include = ["src/baibai_engine", "src/baibai_app"]

[tool.ruff]
# Runtime is Python 3.14, but Ruff's 3.14 formatter rewrites
# `except (A, B):` into the legal-but-ambiguous `except A, B:` form.
# Keep Ruff syntax targeting at 3.13 so multi-exception handlers stay
# parenthesized and reviewer-visible.
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "B",
  "SIM",
  "C4",
  "DTZ",
  "ISC",
  "RET",
  "RUF",
  "PTH",
  "ANN",
  "PIE",
  "PT",
]
ignore = [
  "ANN401",
  "ISC001",
  "RUF001",
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "C408", "E402", "E501", "PT009", "PT027", "RUF012"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
disallow_any_unimported = true
no_implicit_optional = true
packages = ["baibai_engine", "baibai_app", "tools"]
plugins = ["pydantic.mypy"]
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
# generate_brand_assets.py declares Pillow in PEP 723 inline metadata and runs under
# `uv run --script`, so the native image library stays out of the shared lock and out of
# every workflow's install. It is therefore the one file whose imports this run cannot
# resolve; everything else added under tools/ is checked without touching this list. A
# second entry belongs here only for the same reason — a file whose dependencies this
# environment deliberately does not have. Anything else is a type error to fix.
exclude = ["^tools/generate_brand_assets\\.py$"]

[[tool.mypy.overrides]]
module = [
  "jquantsapi.*",
  "openpyxl.*",
  "xlrd.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--maxfail=1",
]
xfail_strict = true
markers = [
  "property: property-based tests",
  "slow: long-running tests",
]

[tool.coverage.run]
branch = true
source = ["src/baibai_engine", "src/baibai_app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.bandit]
# Bandit excludes any path that *contains* one of these strings, so a bare "tests" would also
# drop tools/latests/ or a file named foo_tests.py without a word about it. The slashes keep
# the match to a directory of that name, which is the only thing meant to be skipped.
exclude_dirs = ["/tests/", "/.venv/"]
skips = ["B101"]

[tool.mutmut]
paths_to_mutate = ["src/baibai_engine", "src/baibai_app"]
tests_dir = "tests"
runner = "python -m pytest -q -m 'not slow'"

# Import-direction contracts encode the subsystem dependency DAG
# (macro / screening / position / research / shared) so a structural edit that
# reintroduces a cross-subsystem edge fails CI rather than passing every other gate.
[tool.importlinter]
root_packages = ["baibai_engine", "baibai_app"]

[[tool.importlinter.contracts]]
name = "macro layer stays independent of screening/position"
type = "forbidden"
source_modules = ["baibai_engine.macro"]
forbidden_modules = [
  "baibai_engine.screening",
  "baibai_engine.position",
]

[[tool.importlinter.contracts]]
name = "shared primitives are an import sink"
type = "forbidden"
source_modules = ["baibai_engine.foundation"]
forbidden_modules = [
  "baibai_engine.screening",
  "baibai_engine.macro",
  "baibai_engine.position",
  "baibai_engine.market",
  "baibai_engine.appdb",
  "baibai_engine.read_api",
  "baibai_engine.research",
]

[[tool.importlinter.contracts]]
name = "application database infrastructure only depends on foundation"
type = "forbidden"
source_modules = ["baibai_engine.appdb"]
forbidden_modules = [
  "baibai_engine.market",
  "baibai_engine.macro",
  "baibai_engine.screening",
  "baibai_engine.position",
  "baibai_engine.research",
  "baibai_engine.read_api",
]

[[tool.importlinter.contracts]]
name = "tasks only depends on application database and foundation"
type = "forbidden"
source_modules = ["baibai_engine.tasks"]
forbidden_modules = [
  "baibai_engine.market",
  "baibai_engine.macro",
  "baibai_engine.screening",
  "baibai_engine.position",
  "baibai_engine.research",
  "baibai_engine.read_api",
]

[[tool.importlinter.contracts]]
name = "market data layer only depends on foundation"
type = "forbidden"
source_modules = ["baibai_engine.market"]
forbidden_modules = [
  "baibai_engine.screening",
  "baibai_engine.macro",
  "baibai_engine.position",
]

[[tool.importlinter.contracts]]
name = "position does not import screening (cycle prevention)"
type = "forbidden"
source_modules = ["baibai_engine.position"]
forbidden_modules = ["baibai_engine.screening"]

[[tool.importlinter.contracts]]
name = "screening does not import position (one-way market<-{screening,position})"
type = "forbidden"
source_modules = ["baibai_engine.screening"]
forbidden_modules = ["baibai_engine.position"]
# ticker_profile reads position only through the query-only read_api facade.
# Direct screening -> position imports remain forbidden.
ignore_imports = [
  "baibai_engine.screening.ticker_profile -> baibai_engine.read_api.position",
]

[[tool.importlinter.contracts]]
name = "research is the top-level domain engine (lower layers do not import it)"
type = "forbidden"
# Research composes decision packets with portfolio state. Forbid reverse edges
# to keep the DAG acyclic.
source_modules = [
  "baibai_engine.foundation",
  "baibai_engine.market",
  "baibai_engine.macro",
  "baibai_engine.screening",
  "baibai_engine.position",
]
forbidden_modules = ["baibai_engine.research"]
ignore_imports = [
  # The public CLI is the repository composition boundary for building a
  # holding review from research and position artifacts. Position domain modules
  # remain independent of research.
  "baibai_engine.position.cli -> baibai_engine.research.holding_review_builder",
  "baibai_engine.position.cli -> baibai_engine.research.store",
  "baibai_engine.position.cli -> baibai_engine.proposals.store",
  "baibai_engine.position.result_service -> baibai_engine.proposals.store",
]

[[tool.importlinter.contracts]]
name = "research only composes foundation and position domains"
type = "forbidden"
# Current research behavior is decision composition plus portfolio-aware execution
# and holding-review construction.  It has no direct macro, market, screening,
# dependency; keep that surface narrow.
source_modules = ["baibai_engine.research"]
forbidden_modules = [
  "baibai_engine.macro",
  "baibai_engine.market",
  "baibai_engine.screening",
  "baibai_engine.tasks",
]

[[tool.importlinter.contracts]]
name = "app is never imported by the engine"
type = "forbidden"
# app composes domain read APIs into local UI read models. Reverse imports
# would make UI iteration ripple into domain packages and obstruct a storage swap.
source_modules = [
  "baibai_engine.foundation",
  "baibai_engine.market",
  "baibai_engine.macro",
  "baibai_engine.screening",
  "baibai_engine.position",
  "baibai_engine.research",
]
forbidden_modules = ["baibai_app"]

[[tool.importlinter.contracts]]
name = "app imports the engine only through read_api"
type = "forbidden"
source_modules = ["baibai_app"]
forbidden_modules = [
  "baibai_engine.appdb",
  "baibai_engine.foundation",
  "baibai_engine.macro",
  "baibai_engine.market",
  "baibai_engine.position",
  "baibai_engine.research",
  "baibai_engine.screening",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "read_api cannot reach writer migration provider or CLI modules"
type = "forbidden"
source_modules = ["baibai_engine.read_api"]
forbidden_modules = [
  "baibai_engine.appdb.write",
  "baibai_engine.appdb.migrations",
  "baibai_engine.cli",
  "baibai_engine.macro.indicators.providers",
  "baibai_engine.position.cli",
  "baibai_engine.research.decision_cli",
  "baibai_engine.research.opportunity_cli",
  "baibai_engine.screening.cli",
]
