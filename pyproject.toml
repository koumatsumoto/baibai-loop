[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "baibai-loop"
version = "0.1.0"
description = "AI-assisted, human-adjudicated Japanese equity decision foundation."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "jquants-api-client>=2.4.0",
  "mcp>=2.2,<3",
  "httpx2>=2.10.0",
  "openpyxl>=3.1.0",
  "pandas>=2.3.0",
  "playwright>=1.62.0",
  "pydantic>=2.13.4",
  "pyarrow>=25.0.1",
  # CVE-2026-84309/84310/84311 は 6.16.1 で解消される。floor は最も遅い修正版。
  "pypdf[crypto]>=6.16.1",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.0",
  "requests>=2.34.2",
  "urllib3>=2.0",
  "xlrd>=2.0.0",
  "fastapi>=0.141.1",
  "uvicorn>=0.51.0",
  "duckdb>=1.5.5",
  "boto3>=1.43.78",
]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.scripts]
baibai-engine = "baibai_engine.cli:main"
baibai-web = "baibai_web.cli:main"
baibai-jobs = "baibai_jobs.cli:main"

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "typing" },
  { include-group = "quality" },
  { include-group = "security" },
]
test = [
  "coverage[toml]>=7.15.4",
  "httpx2>=2.10.0",
  "hypothesis>=6.165.6",
  "pytest>=9.1.1",
  "pytest-cov>=7.0.0",
  "pytest-mock>=3.15.0",
  "pytest-xdist>=3.8.0",
]
typing = [
  "boto3-stubs[s3]>=1.43.78",
  "mypy>=2.3.0",
  "pandas-stubs>=3.0.5.260730",
  "types-pyyaml>=6.0.12.20260724",
]
quality = [
  "import-linter>=2.13",
  "pre-commit>=4.6.2",
  "ruff>=0.16.3",
]
security = [
  "bandit[toml]>=1.9.4",
  "pip-audit>=2.10.1",
]

[tool.hatch.build.targets.wheel]
packages = [
  "engine/src/baibai_engine",
  "web/backend/src/baibai_web",
  "jobs/src/baibai_jobs",
]

[tool.hatch.build.targets.wheel.force-include]
"engine/src/baibai_engine/machine_analysis/company_valuation/calibration/published/er-level-calibration-latest.yaml" = "baibai_engine/machine_analysis/company_valuation/calibration/published/er-level-calibration-latest.yaml"
"engine/src/baibai_engine/data_collection/economic/sources.yaml" = "baibai_engine/data_collection/economic/sources.yaml"
"engine/src/baibai_engine/py.typed" = "baibai_engine/py.typed"
"engine/src/baibai_engine/data_collection/economic/store.sql" = "baibai_engine/data_collection/economic/store.sql"
"engine/src/baibai_engine/machine_analysis/market_context/indicators/registry/us.yaml" = "baibai_engine/machine_analysis/market_context/indicators/registry/us.yaml"
"engine/src/baibai_engine/machine_analysis/market_context/indicators/registry/japan.yaml" = "baibai_engine/machine_analysis/market_context/indicators/registry/japan.yaml"
"engine/src/baibai_engine/machine_analysis/market_context/indicators/registry/global.yaml" = "baibai_engine/machine_analysis/market_context/indicators/registry/global.yaml"
"engine/src/baibai_engine/machine_analysis/market_context/indicators/registry/derived.yaml" = "baibai_engine/machine_analysis/market_context/indicators/registry/derived.yaml"
"engine/src/baibai_engine/data_collection/economic/providers/pmi_release_urls.yaml" = "baibai_engine/data_collection/economic/providers/pmi_release_urls.yaml"
"web/backend/src/baibai_web/py.typed" = "baibai_web/py.typed"
"jobs/src/baibai_jobs/py.typed" = "baibai_jobs/py.typed"

[tool.uv]
required-version = "==0.12.17"

# Constrain the sdist to the buildable source packages (plus the metadata
# hatchling always adds: pyproject.toml, README.md, PKG-INFO). Without this the
# sdist walks the whole tree and, when uv's build copy loses VCS-ignore
# detection, sweeps in the gitignored operational stores/ directory (SQLite market
# history), inflating the archive by hundreds of MB.
[tool.hatch.build.targets.sdist]
only-include = [
  "engine/src/baibai_engine",
  "web/backend/src/baibai_web",
  "jobs/src/baibai_jobs",
]

[tool.ruff]
# Runtime is Python 3.14, but Ruff's 3.14 formatter rewrites
# `except (A, B):` into the legal-but-ambiguous `except A, B:` form.
# Keep Ruff syntax targeting at 3.13 so multi-exception handlers stay
# parenthesized and reviewer-visible.
target-version = "py313"
line-length = 100
src = ["engine/src", "web/backend/src", "jobs/src", "tools", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "B",
  "SIM",
  "C4",
  "DTZ",
  "ISC",
  "RET",
  "RUF",
  "PTH",
  "ANN",
  "PIE",
  "PT",
]
ignore = [
  "ANN401",
  "ISC001",
  "RUF001",
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "C408", "E402", "E501", "PT009", "PT027", "RUF012"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
disallow_any_unimported = true
no_implicit_optional = true
packages = ["baibai_engine", "baibai_web", "baibai_jobs", "tools"]
plugins = ["pydantic.mypy"]
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = [
  "jquantsapi.*",
  "openpyxl.*",
  "xlrd.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--maxfail=1",
  # With TMPDIR on tmpfs the suite is CPU-bound, so a developer machine runs it
  # several times faster spread across its cores. `-n 0` restores a single process
  # for the runs that need one: `-s`, `--pdb`, and live progress output.
  "-n",
  "auto",
]
xfail_strict = true
markers = [
  "property: property-based tests",
  "slow: long-running tests",
]

[tool.coverage.run]
branch = true
source = [
  "engine/src/baibai_engine",
  "web/backend/src/baibai_web",
  "jobs/src/baibai_jobs",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.bandit]
# Bandit excludes any path that *contains* one of these strings, so a bare "tests" would also
# drop tools/latests/ or a file named foo_tests.py without a word about it. The slashes keep
# the match to a directory of that name, which is the only thing meant to be skipped.
exclude_dirs = ["/tests/", "/.venv/"]
skips = ["B101"]

# Import-direction contracts encode the subsystem dependency DAG
# (five analysis domains / Screening / Position / Research / shared) so a structural edit that
# reintroduces a cross-subsystem edge fails CI rather than passing every other gate.
[tool.importlinter]
root_packages = ["baibai_engine", "baibai_web", "baibai_jobs", "tools"]

[[tool.importlinter.contracts]]
name = "shared primitives are an import sink"
type = "forbidden"
source_modules = ["baibai_engine.foundation"]
forbidden_modules = [
  "baibai_engine.machine_analysis.screening",
  "baibai_engine.machine_analysis.company_valuation",
  "baibai_engine.machine_analysis.market_context", "baibai_engine.machine_analysis.technical_analysis", "baibai_engine.machine_analysis.company_growth",
  "baibai_engine.machine_analysis.external_assessment",

  "baibai_engine.position",
  "baibai_engine.market",
  "baibai_engine.storage",
  "baibai_engine.read_api",
  "baibai_engine.investment_judgment",
  "baibai_engine.data_collection",
]

[[tool.importlinter.contracts]]
name = "application database infrastructure only depends on foundation"
type = "forbidden"
source_modules = ["baibai_engine.storage.application"]
forbidden_modules = [
  "baibai_engine.market",

  "baibai_engine.machine_analysis.screening",
  "baibai_engine.machine_analysis.company_valuation",
  "baibai_engine.machine_analysis.market_context", "baibai_engine.machine_analysis.technical_analysis", "baibai_engine.machine_analysis.company_growth",
  "baibai_engine.machine_analysis.external_assessment",
  "baibai_engine.position",
  "baibai_engine.investment_judgment",
  "baibai_engine.read_api",
]

[[tool.importlinter.contracts]]
name = "tasks only depends on application database and foundation"
type = "forbidden"
source_modules = ["baibai_engine.tasks"]
forbidden_modules = [
  "baibai_engine.market",

  "baibai_engine.machine_analysis.screening",
  "baibai_engine.machine_analysis.company_valuation",
  "baibai_engine.machine_analysis.market_context", "baibai_engine.machine_analysis.technical_analysis", "baibai_engine.machine_analysis.company_growth",
  "baibai_engine.machine_analysis.external_assessment",
  "baibai_engine.position",
  "baibai_engine.investment_judgment",
  "baibai_engine.read_api",
]

[[tool.importlinter.contracts]]
name = "market disclosures depend on storage and pure observation contracts"
type = "forbidden"
source_modules = ["baibai_engine.market"]
forbidden_modules = [
  "baibai_engine.machine_analysis.screening",
  "baibai_engine.machine_analysis.company_valuation",
  "baibai_engine.machine_analysis.market_context", "baibai_engine.machine_analysis.technical_analysis", "baibai_engine.machine_analysis.company_growth",
  "baibai_engine.data_collection.external_assessment",
  "baibai_engine.machine_analysis.external_assessment.store",
  "baibai_engine.machine_analysis.external_assessment.analysis",
  "baibai_engine.machine_analysis.external_assessment.reader",
  "baibai_engine.machine_analysis.external_assessment.query",
  "baibai_engine.data_collection.tradingview.collector",
  "baibai_engine.data_collection.tradingview.client",
  "baibai_engine.data_collection.tradingview.cli",

  "baibai_engine.position",
]

[[tool.importlinter.contracts]]
name = "position does not import screening (cycle prevention)"
type = "forbidden"
source_modules = ["baibai_engine.position"]
forbidden_modules = ["baibai_engine.machine_analysis.screening"]

[[tool.importlinter.contracts]]
name = "screening does not import position (one-way market<-{screening,position})"
type = "forbidden"
source_modules = ["baibai_engine.machine_analysis.screening"]
forbidden_modules = ["baibai_engine.position"]
# Only the public CLI composes the cross-domain ticker profile.
# Direct screening -> position imports remain forbidden.
ignore_imports = [
  "baibai_engine.machine_analysis.screening.cli.query -> baibai_engine.read_api.ticker_profile",
]

[[tool.importlinter.contracts]]
name = "investment judgment is the top-level domain engine (lower layers do not import it)"
type = "forbidden"
# Research composes decision packets with portfolio state. Forbid reverse edges
# to keep the DAG acyclic.
source_modules = [
  "baibai_engine.foundation",
  "baibai_engine.market",

  "baibai_engine.machine_analysis.screening",
  "baibai_engine.machine_analysis.company_valuation",
  "baibai_engine.machine_analysis.market_context", "baibai_engine.machine_analysis.technical_analysis", "baibai_engine.machine_analysis.company_growth",
  "baibai_engine.machine_analysis.external_assessment",
  "baibai_engine.position",
]
forbidden_modules = ["baibai_engine.investment_judgment"]

[[tool.importlinter.contracts]]
name = "investment judgment composes explicit domain reads and portfolio judgments"
type = "forbidden"
# Research composes the five analysis domains through saved query boundaries; no acquisition.
source_modules = ["baibai_engine.investment_judgment"]
forbidden_modules = [

  "baibai_engine.market",
  "baibai_engine.machine_analysis.screening",
  "baibai_engine.tasks",
]

allow_indirect_imports = true
ignore_imports = [
  "baibai_engine.investment_judgment.selection_query -> baibai_engine.machine_analysis.screening.run_store",
  "baibai_engine.investment_judgment.selection_query -> baibai_engine.machine_analysis.screening.run_store.read",
  "baibai_engine.investment_judgment.selection_query -> baibai_engine.machine_analysis.screening.discovery.projection",
  # Pure cash-equity cutoff only; research still cannot import market acquisition.
  "baibai_engine.investment_judgment.stock_assessment -> baibai_engine.market.sessions",
  "baibai_engine.investment_judgment.trade_proposal_service -> baibai_engine.market.sessions",
  "baibai_engine.investment_judgment.trade_proposal_conditions -> baibai_engine.market.universe",
  # Read the common master input; acquisition remains outside Research.
  "baibai_engine.investment_judgment.trade_proposal_inputs -> baibai_engine.market.jquants_reader",
]

[[tool.importlinter.contracts]]
name = "web imports the engine only through read_api"
type = "forbidden"
source_modules = ["baibai_web"]
forbidden_modules = [
  "baibai_engine.storage",
  "baibai_engine.job_api",
  "baibai_engine.cli",
  "baibai_engine.foundation",

  "baibai_engine.market",
  "baibai_engine.position",
  "baibai_engine.investment_judgment",
  "baibai_engine.machine_analysis.screening",
  "baibai_engine.machine_analysis.company_valuation",
  "baibai_engine.machine_analysis.market_context", "baibai_engine.machine_analysis.technical_analysis", "baibai_engine.machine_analysis.company_growth",
  "baibai_engine.machine_analysis.external_assessment",
  "baibai_engine.tasks",
  "baibai_engine.data_collection",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "engine does not depend on delivery or developer systems"
type = "forbidden"
source_modules = ["baibai_engine"]
forbidden_modules = ["baibai_web", "baibai_jobs", "tools"]

[[tool.importlinter.contracts]]
name = "web does not depend on jobs or developer tools"
