[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baibai-loop"
version = "0.1.0"
description = "AI-assisted, human-adjudicated Japanese equity decision foundation."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "jquants-api-client>=2.4.0",
  "openpyxl>=3.1.0",
  "pandas>=2.3.0",
  "playwright>=1.62.0",
  "pydantic>=2.13.4",
  "pyarrow>=25.0.1",
  # CVE-2026-84309/84310/84311 は 6.16.1 で解消される。floor は最も遅い修正版。
  "pypdf[crypto]>=6.16.1",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.0",
  "requests>=2.34.2",
  "xlrd>=2.0.0",
  "fastapi>=0.141.1",
  "uvicorn>=0.51.0",
  "duckdb>=1.5.5",
  "boto3>=1.43.78",
]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.scripts]
baibai-engine = "baibai_engine.cli:main"
baibai-web = "baibai_web.cli:main"
baibai-batch = "baibai_batch.cli:main"

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "typing" },
  { include-group = "quality" },
  { include-group = "security" },
]
test = [
  "coverage[toml]>=7.15.4",
  "httpx2>=2.10.0",
  "hypothesis>=6.165.6",
  "pytest>=9.1.1",
  "pytest-cov>=7.0.0",
  "pytest-mock>=3.15.0",
  "pytest-xdist>=3.8.0",
]
typing = [
  "boto3-stubs[s3]>=1.43.78",
  "mypy>=2.3.0",
  "pandas-stubs>=3.0.5.260730",
  "types-pyyaml>=6.0.12.20260724",
  "types-requests>=2.33.0.20260712",
]
quality = [
  "import-linter>=2.13",
  "pre-commit>=4.6.2",
  "ruff>=0.16.3",
]
security = [
  "bandit[toml]>=1.9.4",
  "pip-audit>=2.10.1",
]

[tool.hatch.build.targets.wheel]
packages = [
  "engine/src/baibai_engine",
  "web/backend/src/baibai_web",
  "batch/src/baibai_batch",
]

[tool.hatch.build.targets.wheel.force-include]
"engine/src/baibai_engine/py.typed" = "baibai_engine/py.typed"
"engine/src/baibai_engine/macro/indicators/schema.sql" = "baibai_engine/macro/indicators/schema.sql"
"engine/src/baibai_engine/macro/indicators/registry/us.yaml" = "baibai_engine/macro/indicators/registry/us.yaml"
"engine/src/baibai_engine/macro/indicators/registry/japan.yaml" = "baibai_engine/macro/indicators/registry/japan.yaml"
"engine/src/baibai_engine/macro/indicators/registry/global.yaml" = "baibai_engine/macro/indicators/registry/global.yaml"
"engine/src/baibai_engine/macro/indicators/registry/derived.yaml" = "baibai_engine/macro/indicators/registry/derived.yaml"
"engine/src/baibai_engine/macro/indicators/providers/pmi_release_urls.yaml" = "baibai_engine/macro/indicators/providers/pmi_release_urls.yaml"
"web/backend/src/baibai_web/py.typed" = "baibai_web/py.typed"
"batch/src/baibai_batch/py.typed" = "baibai_batch/py.typed"

[tool.uv]
required-version = "==0.12.1"

# Constrain the sdist to the buildable source packages (plus the metadata
# hatchling always adds: pyproject.toml, README.md, PKG-INFO). Without this the
# sdist walks the whole tree and, when uv's build copy loses VCS-ignore
# detection, sweeps in the gitignored operational data/ store (SQLite market
# history), inflating the archive by hundreds of MB.
[tool.hatch.build.targets.sdist]
only-include = [
  "engine/src/baibai_engine",
  "web/backend/src/baibai_web",
  "batch/src/baibai_batch",
]

[tool.ruff]
# Runtime is Python 3.14, but Ruff's 3.14 formatter rewrites
# `except (A, B):` into the legal-but-ambiguous `except A, B:` form.
# Keep Ruff syntax targeting at 3.13 so multi-exception handlers stay
# parenthesized and reviewer-visible.
target-version = "py313"
line-length = 100
src = ["engine/src", "web/backend/src", "batch/src", "tools", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "B",
  "SIM",
  "C4",
  "DTZ",
  "ISC",
  "RET",
  "RUF",
  "PTH",
  "ANN",
  "PIE",
  "PT",
]
ignore = [
  "ANN401",
  "ISC001",
  "RUF001",
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "C408", "E402", "E501", "PT009", "PT027", "RUF012"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
disallow_any_unimported = true
no_implicit_optional = true
packages = ["baibai_engine", "baibai_web", "baibai_batch", "tools"]
plugins = ["pydantic.mypy"]
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = [
  "jquantsapi.*",
  "openpyxl.*",
  "xlrd.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--maxfail=1",
  # With TMPDIR on tmpfs the suite is CPU-bound, so a developer machine runs it
  # several times faster spread across its cores. `-n 0` restores a single process
  # for the runs that need one: `-s`, `--pdb`, and live progress output.
  "-n",
  "auto",
]
xfail_strict = true
markers = [
  "property: property-based tests",
  "slow: long-running tests",
]

[tool.coverage.run]
branch = true
source = [
  "engine/src/baibai_engine",
  "web/backend/src/baibai_web",
  "batch/src/baibai_batch",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.bandit]
# Bandit excludes any path that *contains* one of these strings, so a bare "tests" would also
# drop tools/latests/ or a file named foo_tests.py without a word about it. The slashes keep
# the match to a directory of that name, which is the only thing meant to be skipped.
exclude_dirs = ["/tests/", "/.venv/"]
skips = ["B101"]

# Import-direction contracts encode the subsystem dependency DAG
# (macro / screening / position / research / shared) so a structural edit that
# reintroduces a cross-subsystem edge fails CI rather than passing every other gate.
[tool.importlinter]
root_packages = ["baibai_engine", "baibai_web", "baibai_batch", "tools"]

[[tool.importlinter.contracts]]
name = "macro layer stays independent of screening/position"
type = "forbidden"
source_modules = ["baibai_engine.macro"]
forbidden_modules = [
  "baibai_engine.screening",
  "baibai_engine.position",
]

[[tool.importlinter.contracts]]
name = "shared primitives are an import sink"
type = "forbidden"
source_modules = ["baibai_engine.foundation"]
forbidden_modules = [
  "baibai_engine.screening",
  "baibai_engine.macro",
  "baibai_engine.position",
  "baibai_engine.market",
  "baibai_engine.appdb",
  "baibai_engine.read_api",
  "baibai_engine.research",
]

[[tool.importlinter.contracts]]
name = "application database infrastructure only depends on foundation"
type = "forbidden"
source_modules = ["baibai_engine.appdb"]
forbidden_modules = [
  "baibai_engine.market",
  "baibai_engine.macro",
  "baibai_engine.screening",
  "baibai_engine.position",
  "baibai_engine.research",
  "baibai_engine.read_api",
]

[[tool.importlinter.contracts]]
name = "tasks only depends on application database and foundation"
type = "forbidden"
source_modules = ["baibai_engine.tasks"]
forbidden_modules = [
  "baibai_engine.market",
  "baibai_engine.macro",
  "baibai_engine.screening",
  "baibai_engine.position",
  "baibai_engine.research",
  "baibai_engine.read_api",
]

[[tool.importlinter.contracts]]
name = "market data layer only depends on foundation"
type = "forbidden"
source_modules = ["baibai_engine.market"]
forbidden_modules = [
  "baibai_engine.screening",
  "baibai_engine.macro",
  "baibai_engine.position",
]

[[tool.importlinter.contracts]]
name = "position does not import screening (cycle prevention)"
type = "forbidden"
source_modules = ["baibai_engine.position"]
forbidden_modules = ["baibai_engine.screening"]

[[tool.importlinter.contracts]]
name = "screening does not import position (one-way market<-{screening,position})"
type = "forbidden"
source_modules = ["baibai_engine.screening"]
forbidden_modules = ["baibai_engine.position"]
# ticker_profile reads position only through the query-only read_api facade.
# Direct screening -> position imports remain forbidden.
ignore_imports = [
  "baibai_engine.screening.ticker_profile -> baibai_engine.read_api.position",
]

[[tool.importlinter.contracts]]
name = "research is the top-level domain engine (lower layers do not import it)"
type = "forbidden"
# Research composes decision packets with portfolio state. Forbid reverse edges
# to keep the DAG acyclic.
source_modules = [
  "baibai_engine.foundation",
  "baibai_engine.market",
  "baibai_engine.macro",
  "baibai_engine.screening",
  "baibai_engine.position",
]
forbidden_modules = ["baibai_engine.research"]
ignore_imports = [
  # The public CLI is the repository composition boundary for building a
  # Position Review from research and position artifacts. Position domain modules
  # remain independent of research.
  "baibai_engine.position.cli -> baibai_engine.research.capital_allocation_service",
  "baibai_engine.position.cli -> baibai_engine.research.position_review_builder",
  "baibai_engine.position.cli -> baibai_engine.research.store",
  "baibai_engine.position.broker_fact_service -> baibai_engine.research.capital_allocation_service",
]

[[tool.importlinter.contracts]]
name = "research only composes foundation and position domains"
type = "forbidden"
# Current research behavior is decision composition plus portfolio-aware execution
# and Position Review construction. It has no direct macro, market, screening,
# dependency; keep that surface narrow.
source_modules = ["baibai_engine.research"]
forbidden_modules = [
  "baibai_engine.macro",
  "baibai_engine.market",
  "baibai_engine.screening",
  "baibai_engine.tasks",
]

[[tool.importlinter.contracts]]
name = "web is never imported by the engine"
type = "forbidden"
# app composes domain read APIs into local UI read models. Reverse imports
# would make UI iteration ripple into domain packages and obstruct a storage swap.
source_modules = [
  "baibai_engine.foundation",
  "baibai_engine.market",
  "baibai_engine.macro",
  "baibai_engine.screening",
  "baibai_engine.position",
  "baibai_engine.research",
]
forbidden_modules = ["baibai_web"]

[[tool.importlinter.contracts]]
name = "web imports the engine only through read_api"
type = "forbidden"
source_modules = ["baibai_web"]
forbidden_modules = [
  "baibai_engine.appdb",
  "baibai_engine.batch_api",
  "baibai_engine.cli",
  "baibai_engine.foundation",
  "baibai_engine.macro",
  "baibai_engine.market",
  "baibai_engine.position",
  "baibai_engine.research",
  "baibai_engine.screening",
  "baibai_engine.tasks",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "engine does not depend on delivery or developer systems"
type = "forbidden"
source_modules = ["baibai_engine"]
forbidden_modules = ["baibai_web", "baibai_batch", "tools"]

[[tool.importlinter.contracts]]
name = "web does not depend on batch or developer tools"
type = "forbidden"
source_modules = ["baibai_web"]
forbidden_modules = ["baibai_batch", "tools"]

[[tool.importlinter.contracts]]
name = "batch uses only explicit engine orchestration boundaries"
type = "forbidden"
source_modules = ["baibai_batch"]
forbidden_modules = [
  "baibai_engine.appdb",
  "baibai_engine.foundation",
  "baibai_engine.macro",
  "baibai_engine.market",
  "baibai_engine.operation",
  "baibai_engine.position",
  "baibai_engine.research",
  "baibai_engine.screening",
  "baibai_engine.tasks",
  "baibai_web",
  "tools",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "read_api cannot reach writer or CLI modules"
type = "forbidden"
source_modules = ["baibai_engine.read_api"]
forbidden_modules = [
  "baibai_engine.appdb.write",
  "baibai_engine.cli",
  "baibai_engine.macro.indicators.providers",
  "baibai_engine.position.cli",
  "baibai_engine.research.thesis_evaluation_cli",
  "baibai_engine.research.workspace_cli",
  "baibai_engine.screening.cli",
]
