  "baibai_engine.data_collection.providers.jquants.http",
  "baibai_engine.data_collection.providers.edinet.http",
  "baibai_engine.data_collection.providers.jpx.http",
  "baibai_engine.data_collection.providers.tradingview.client",
]

[[tool.importlinter.contracts]]
