[[tool.importlinter.contracts]]
name = "investment judgment is the top-level domain engine (lower layers do not import it)"
type = "forbidden"
# Research composes decision packets with portfolio state. Forbid reverse edges
# to keep the DAG acyclic.
source_modules = [
  "baibai_engine.primitives",
  "baibai_engine.machine_analysis.observations",

  "baibai_engine.machine_analysis.screening",
  "baibai_engine.machine_analysis.models.company_financials",
  "baibai_engine.machine_analysis.models.market_context", "baibai_engine.machine_analysis.models.technical_analysis", "baibai_engine.machine_analysis.models.company_growth",
  "baibai_engine.machine_analysis.models.external_assessment",
  "baibai_engine.portfolio",
]
forbidden_modules = ["baibai_engine.investment_judgment"]

[[tool.importlinter.contracts]]
name = "investment judgment composes explicit domain reads and portfolio judgments"
type = "forbidden"
# Judgment consumes saved model generations and candidate results, not acquisition.
source_modules = ["baibai_engine.investment_judgment"]
forbidden_modules = [

  "baibai_engine.machine_analysis.screening",
  "baibai_engine.tasks",
]

allow_indirect_imports = true
ignore_imports = [
  # New saved policy results and pure view contracts; not the writer.
  "baibai_engine.investment_judgment.workflow.selection -> baibai_engine.machine_analysis.screening.contracts",
  "baibai_engine.investment_judgment.workflow.selection_query -> baibai_engine.machine_analysis.screening.selection_query",
  "baibai_engine.investment_judgment.workflow.selection_query -> baibai_engine.machine_analysis.screening.policies.two_views",
  "baibai_engine.investment_judgment.workflow.operation.service -> baibai_engine.machine_analysis.screening.selection_query",
  "baibai_engine.investment_judgment.workflow.workspace.selected_prepare -> baibai_engine.machine_analysis.screening.selection_query",
]

[[tool.importlinter.contracts]]
name = "engine does not depend on delivery or developer systems"
type = "forbidden"
source_modules = ["baibai_engine"]
forbidden_modules = ["baibai_web", "baibai_jobs", "tools"]

[[tool.importlinter.contracts]]
name = "jobs compose owners without depending on judgment or engine command dispatch"
type = "forbidden"
source_modules = ["baibai_jobs"]
